<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2b3e">
<title>سجل — نظام إدارة المدرسة الثانوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2b3e;          /* حبر السجلات المدرسية */
  --ink-2:#1c4a63;
  --paper:#eef1ec;        /* ورق الكشوف */
  --panel:#ffffff;
  --line:#d5dbd4;
  --line-2:#e8ece7;
  --seal:#0f6b52;         /* ختم المدرسة */
  --gold:#b07d1f;
  --danger:#a5322a;
  --warn:#c07414;
  --muted:#5d6b72;
  --shadow:0 1px 2px rgba(13,43,62,.06),0 8px 24px -12px rgba(13,43,62,.18);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Readex Pro","Cairo",Tahoma,"Segoe UI",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{font-family:"Cairo","Readex Pro",Tahoma,sans-serif;margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ink-2)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#c6cec5;border-radius:8px}

/* ====== الهيكل ====== */
.app{display:none}
.app.on{display:block}
header.top{
  position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 12px rgba(13,43,62,.25)
}
header.top .brand{display:flex;align-items:center;gap:9px;min-width:0}
.seal{
  width:32px;height:32px;flex:0 0 32px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(160deg,var(--seal),#0a4d3b);color:#fff;font-weight:800;font-size:15px;
  font-family:"Cairo",sans-serif;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)
}
header.top h1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:11px;opacity:.72;font-weight:400;display:block;line-height:1.3}
header.top .spacer{flex:1}
.iconbtn{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.1);font-size:16px
}
.iconbtn:active{background:rgba(255,255,255,.22)}

.wrap{max-width:1180px;margin:0 auto;padding:14px 12px 92px}
@media(min-width:900px){
  .wrap{display:grid;grid-template-columns:216px 1fr;gap:18px;padding:18px 18px 40px;align-items:start}
}

/* ====== التنقل ====== */
nav.side{display:none}
@media(min-width:900px){
  nav.side{display:block;position:sticky;top:74px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--shadow)}
  nav.side button{
    display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;
    font-size:14px;color:var(--muted);text-align:right;font-weight:500
  }
  nav.side button.on{background:var(--ink);color:#fff;font-weight:600}
  nav.side button:not(.on):hover{background:var(--line-2);color:var(--ink)}
  nav.side .ico{font-size:15px;width:20px;text-align:center}
  nav.bottom{display:none}
}
nav.bottom{
  position:fixed;bottom:0;right:0;left:0;z-index:45;background:var(--panel);
  border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 18px rgba(13,43,62,.08);overflow-x:auto
}
nav.bottom button{
  flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:9px;font-size:10.5px;color:var(--muted);font-weight:500
}
nav.bottom button .ico{font-size:17px;line-height:1.1}
nav.bottom button.on{color:var(--ink);background:var(--line-2);font-weight:700}

/* ====== البطاقات ====== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card>.hd{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>.hd h3{font-size:15px;flex:1;min-width:120px}
.card>.bd{padding:12px 14px}
.card>.bd.flush{padding:0}

.pagehd{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:2px 2px 12px}
.pagehd h2{font-size:20px}
.pagehd p{margin:0;font-size:12.5px;color:var(--muted)}
.pagehd .spacer{flex:1}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--gold);text-transform:uppercase;font-family:"Cairo",sans-serif}

/* ====== الأزرار ====== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:9px;
  background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;border:1px solid var(--ink);
  transition:transform .06s
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.seal{background:var(--seal);border-color:var(--seal)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ====== الحقول ====== */
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(28,74,99,.13);background:#fff}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* ====== الجداول ====== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:100%}
table.tbl th{
  background:#f4f6f3;font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0
}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#fafbf9}
table.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rownum{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* ====== الشارات ====== */
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--line-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:#e2f0e9;color:#146a4e}
.tag.bad{background:#f8e5e3;color:var(--danger)}
.tag.warn{background:#fbeedb;color:#8a5410}
.tag.info{background:#e3ecf2;color:var(--ink-2)}
.tag.gold{background:#f7eeda;color:var(--gold)}

/* ====== الإحصائيات ====== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--muted);font-weight:600}
.stat .v{font-size:25px;font-weight:800;font-family:"Cairo",sans-serif;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .n{font-size:11px;color:var(--muted)}
.stat.acc{border-right:3px solid var(--seal)}
.stat.acc-b{border-right:3px solid var(--danger)}
.stat.acc-g{border-right:3px solid var(--gold)}

/* ====== القوائم ====== */
.list-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line-2);width:100%;text-align:right}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:#fafbf9}
.list-item .av{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  background:var(--line-2);color:var(--ink);font-weight:700;font-size:14px;font-family:"Cairo",sans-serif
}
.list-item .tx{flex:1;min-width:0}
.list-item .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .tx small{color:var(--muted);font-size:11.5px}
.chev{color:#b9c2b8;font-size:15px}

.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty .big{font-size:32px;opacity:.35;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.empty p{margin:0 0 12px;font-size:12.5px}

/* ====== أزرار الحضور ====== */
.att-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.att-row .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-row .no{color:var(--muted);font-size:11.5px;width:26px;flex:0 0 26px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:3px;flex:0 0 auto}
.seg button{
  width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fbfcfa;
  font-size:12px;font-weight:700;color:var(--muted)
}
.seg button.on[data-v=P]{background:var(--seal);border-color:var(--seal);color:#fff}
.seg button.on[data-v=A]{background:var(--danger);border-color:var(--danger);color:#fff}
.seg button.on[data-v=E]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button.on[data-v=L]{background:var(--ink-2);border-color:var(--ink-2);color:#fff}

/* ====== شبكة الدرجات ====== */
.mk{width:56px;padding:5px 6px;text-align:center;font-variant-numeric:tabular-nums;border-radius:7px}
.mk.g{width:38px;padding:5px 2px;font-size:12.5px}
.mk.over{border-color:var(--danger);background:#fdf2f1}

/* ====== الجدول الدراسي ====== */
.sched{width:100%;border-collapse:separate;border-spacing:3px;font-size:11.5px}
.sched th{background:#f4f6f3;padding:6px 4px;border-radius:7px;font-size:11px;color:var(--muted);font-weight:700}
.sched td{background:#fbfcfa;border:1px solid var(--line-2);border-radius:8px;padding:5px 4px;text-align:center;vertical-align:middle;min-width:76px;height:50px}
.sched td.has{background:#eaf2ee;border-color:#c9ded4}
.sched td b{display:block;font-size:11.5px;font-weight:700}
.sched td small{color:var(--muted);font-size:10px}
.sched td.free{color:#c2cac1}

/* ====== النوافذ ====== */
.ov{position:fixed;inset:0;background:rgba(13,43,62,.55);z-index:90;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.modal{
  background:var(--panel);width:100%;max-width:620px;max-height:92vh;overflow:auto;
  border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(13,43,62,.3);animation:up .18s ease
}
@media(min-width:700px){.modal{border-radius:16px;animation:pop .16s ease}}
@keyframes up{from{transform:translateY(22px);opacity:.6}}
@keyframes pop{from{transform:scale(.97);opacity:.6}}
.modal.wide{max-width:960px}
.pinmsg{font-size:11.5px;font-weight:600;margin-top:4px;min-height:15px}
.syncpill{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
  background:var(--line-2);color:var(--muted)
}
.syncpill.ok{background:#e2f0e9;color:#146a4e}
.syncpill.push,.syncpill.conn{background:#e3ecf2;color:var(--ink-2)}
.syncpill.err{background:#f8e5e3;color:var(--danger)}
.credit{
  margin:26px 2px 6px;padding:13px 14px;border-top:1px solid var(--line);
  text-align:center;font-size:12px;color:var(--muted);line-height:2
}
.credit a{color:var(--ink-2);font-weight:600;text-decoration:none;word-break:break-all}
.credit div:last-child{font-weight:600;color:var(--ink)}
.modal .mh{position:sticky;top:0;background:var(--panel);padding:13px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;z-index:2}
.modal .mh h3{flex:1;font-size:16px}
.modal .mh .x{width:32px;height:32px;border-radius:8px;background:var(--line-2);font-size:18px;color:var(--muted);display:grid;place-items:center}
.modal .mb{padding:14px 15px}
.modal .mf{position:sticky;bottom:0;background:var(--panel);padding:11px 15px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;gap:8px}
.modal .mf .btn{flex:1}

/* ====== التنبيهات ====== */
#toast{
  position:fixed;bottom:84px;right:50%;transform:translateX(50%) translateY(14px);z-index:99;
  background:var(--ink);color:#fff;padding:10px 17px;border-radius:10px;font-size:13.5px;font-weight:500;
  box-shadow:0 8px 26px rgba(13,43,62,.35);opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center
}
#toast.on{opacity:1;transform:translateX(50%) translateY(0)}

.note{padding:10px 12px;border-radius:9px;font-size:12.5px;background:#eaf1f5;border:1px solid #cfe0e9;color:var(--ink-2);margin-bottom:11px}
.note.warn{background:#fdf3e3;border-color:#f0dcb8;color:#7d4d0d}
.note.bad{background:#fbeceb;border-color:#f0cdca;color:var(--danger)}
.note b{font-weight:700}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chips button{
  flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap
}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ====== شاشة الدخول ====== */
#login{min-height:100vh;display:grid;place-items:center;padding:22px 16px;
  background:
    radial-gradient(1000px 460px at 80% -8%,#17415a 0%,transparent 62%),
    linear-gradient(168deg,var(--ink) 0%,#081c29 100%)}
#login.off{display:none}
.lbox{width:100%;max-width:392px}
.lhead{text-align:center;margin-bottom:20px;color:#fff}
.lhead .seal{width:56px;height:56px;flex:0 0 56px;margin:0 auto 12px;font-size:24px;border-radius:15px}
.lhead h1{font-size:25px;letter-spacing:-.02em}
.lhead p{margin:5px 0 0;font-size:12.5px;opacity:.66;line-height:1.6}
.lcard{background:var(--panel);border-radius:16px;padding:16px;box-shadow:0 22px 60px -18px rgba(0,0,0,.55)}
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;width:100%;text-align:right;background:#fbfcfa}
.who:hover{border-color:var(--ink-2);background:#fff}
.who.on{border-color:var(--ink);background:#f2f5f8;box-shadow:inset 0 0 0 1px var(--ink)}
.who .av{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:700;font-size:14px;font-family:"Cairo",sans-serif}
.who .tx{flex:1;min-width:0}
.who .tx b{display:block;font-size:14px;font-weight:600}
.who .tx small{color:var(--muted);font-size:11.5px}
.lfoot{text-align:center;margin-top:15px;font-size:11.5px;color:rgba(255,255,255,.5);line-height:1.8}

/* ====== الطباعة ====== */
@media print{
  header.top,nav.side,nav.bottom,.noprint,#toast{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{display:block;padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;margin-bottom:8px}
  table.tbl th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-hd{display:block!important;text-align:center;margin-bottom:12px;border-bottom:2px solid #000;padding-bottom:8px}
  .pinmsg{font-size:11.5px;font-weight:600;margin-top:4px;min-height:15px}
.syncpill{
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
  background:var(--line-2);color:var(--muted)
}
.syncpill.ok{background:#e2f0e9;color:#146a4e}
.syncpill.push,.syncpill.conn{background:#e3ecf2;color:var(--ink-2)}
.syncpill.err{background:#f8e5e3;color:var(--danger)}
.credit{display:block!important;border-top:1px solid #999;margin-top:10px;font-size:10px}
  @page{margin:12mm}
}
.print-hd{display:none}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="lhead">
      <div class="seal">س</div>
      <h1>سجـل</h1>
      <p>نظام إدارة المدرسة الثانوية<br><span id="loginYear"></span></p>
    </div>
    <div class="lcard" id="loginCard"></div>
    <div class="lfoot">مبني على آخر قرارات وزارة التربية والتعليم<br>للثانوية العامة ونظام البكالوريا المصرية
      <div style="margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.14)">
        للتواصل : <a href="mailto:farhatzayed2018@gmail.com" style="color:rgba(255,255,255,.8)">farhatzayed2018@gmail.com</a><br>
        <b style="color:rgba(255,255,255,.75);font-weight:600">برمجه / فرحات زايد — إهداء لمنظومه التعليم الثانوي</b>
      </div></div>
  </div>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="seal">س</div>
      <div style="min-width:0">
        <h1 id="hdSchool">المدرسة</h1>
        <span class="sub" id="hdUser"></span>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnPrint" title="طباعة الشاشة">⎙</button>
    <button class="iconbtn" id="btnOut" title="تسجيل الخروج">⏻</button>
  </header>
  <div class="wrap">
    <nav class="side" id="navSide"></nav>
    <main id="view"></main>
  </div>
  <nav class="bottom" id="navBottom"></nav>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   سجـل — نظام إدارة المدرسة الثانوية (جمهورية مصر العربية)
   مبني على قرارات وزارة التربية والتعليم:
   • توزيع درجات الفصل الدراسي للأول والثاني الثانوي:
     30% امتحان نهاية الفصل + 15% شهر أول + 15% شهر ثانٍ
     + 10% سلوك ومواظبة + 15% كشكول الحصة والواجب + 15% تقييم أسبوعي
   • التقييمات الأسبوعية 12 تقييمًا، يُرصد (غ) للغائب ولا يوضع صفر
   • نظام البكالوريا المصرية بأربعة مسارات
   ============================================================ */

/* ---------- ثوابت المنظومة التعليمية ---------- */
var LEVELS = [
  {id:1, name:"الصف الأول الثانوي",  short:"١ ث"},
  {id:2, name:"الصف الثاني الثانوي", short:"٢ ث"},
  {id:3, name:"الصف الثالث الثانوي", short:"٣ ث"}
];

var SYSTEMS = [
  {id:"gen", name:"الثانوية العامة"},
  {id:"bac", name:"البكالوريا المصرية"}
];

/* مسارات البكالوريا الأربعة */
var TRACKS_BAC = [

function load(){
  var s = rawGet();
  if(!s){ DB = seed(); save(); return; }
  try{
    var d = JSON.parse(s);
    DB = Object.assign(blankDB(), d);
    DB.meta = Object.assign(blankDB().meta, d.meta||{});
    DB.weights = Object.assign(blankDB().weights, d.weights||{});
    DB.absRules = Object.assign(blankDB().absRules, d.absRules||{});
    DB.bac = Object.assign(blankDB().bac, d.bac||{});
    DB.control = Object.assign(blankDB().control, d.control||{});
    ["users","teachers","classes","subjects","students","assign","schedule","behavior","notices","staff","leaves"].forEach(function(k){
      if(!Array.isArray(DB[k])) DB[k]=[];
    });
    if(!DB.attend||typeof DB.attend!=="object") DB.attend={};
    if(!DB.marks ||typeof DB.marks !=="object") DB.marks={};
    if(!DB.staffAtt||typeof DB.staffAtt!=="object") DB.staffAtt={};
    if(!DB.subs   ||typeof DB.subs   !=="object") DB.subs={};
  }catch(e){ DB = seed(); }

var _n = 0;
function uid(p){ _n++; return (p||"x") + Date.now().toString(36) + _n.toString(36); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function num(v, d){ var x = parseFloat(v); return isFinite(x) ? x : (d===undefined?0:d); }
function today(){
  var d=new Date(), m=d.getMonth()+1, y=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y;
}
function fmtDate(s){
  if(!s) return "—";
  var p = String(s).split("-");
  if(p.length!==3) return s;
  return p[2]+"/"+p[1]+"/"+p[0];
}
function dayOfWeek(s){
  var d = new Date(s+"T00:00:00");
  var js = d.getDay();               /* 0=الأحد */
  return js===6?0:js+1;              /* 0=السبت ... 5=الخميس */
}
function initials(name){
  var p = String(name||"").trim().split(/\s+/);
  return ((p[0]||"").charAt(0) + (p[1]||"").charAt(0)) || "؟";
}
function byId(arr, id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function sortAr(a,b){ return String(a).localeCompare(String(b),"ar"); }
function pct(a,b){ return b>0 ? Math.round(a/b*1000)/10 : 0; }

function toast(msg){

  t.textContent = msg; t.classList.add("on");

/* ---------- حساب الدرجات وفق قرار الوزارة ---------- */
/* التقييم الأسبوعي: متوسط التقييمات المرصودة (غ = غياب، لا تُحتسب كصفر
   لكنها تُخصم من العدد المطلوب حسب تعليمات الوزارة → نحسبها على 12 تقييمًا) */
function weeklyScore(m){
  var sum=0, done=0;
  for(var i=0;i<WEEKLY_COUNT;i++){
    var v = m.w[i];
    if(v==="غ" || v==="g"){ done++; continue; }        /* غائب: تُحسب صفرًا في المتوسط */
    if(v===null || v===undefined || v==="") continue;
    sum += num(v); done++;
  }
  if(done===0) return null;
  return sum / (WEEKLY_COUNT * 20) * 100;   /* كل تقييم من 20 → النسبة المئوية */
}
/* نسبة الحضور للطالب في الفصل الحالي */
function attendStats(studentId, classId){
  var tot=0, abs=0, exc=0, late=0;
  for(var k in DB.attend){
    if(k.indexOf(classId+"|")!==0) continue;
    var rec = DB.attend[k];
    if(!rec || !(studentId in rec)) continue;
    tot++;
    var v = rec[studentId];
    if(v==="A") abs++; else if(v==="E") exc++; else if(v==="L") late++;
  }
  return { days:tot, abs:abs, exc:exc, late:late, present:tot-abs-exc,
           rate: tot? Math.round((tot-abs)/tot*1000)/10 : 100 };
}
/* درجة المواظبة تلقائيًا من الحضور (10% حسب القرار) */
function autoBehavior(studentId, classId, maxBeh){
  var st = attendStats(studentId, classId);
  if(st.days===0) return null;
  var lost = st.abs * (maxBeh / Math.max(DB.absRules.danger,1));
  var v = maxBeh - lost - (st.late*0.25);
  return Math.max(0, Math.round(v*4)/4);
}
/* ---- البكالوريا المصرية: الصفان الثاني والثالث سنتا شهادة ----
   قرار الوزارة: مفيش أعمال سنة في البكالوريا. التقييمات الأسبوعية
   والاختبارات الشهرية شرط دخول (٥٠٪) مش درجات تُضاف للمجموع،
   والمجموع تراكمي على العامين من ٦٠٠ درجة. */
function isBacCert(c){ return !!c && c.system==="bac" && Number(c.level)>=2; }
function classOfSubject(subjectId){ var s=subjById(subjectId); return s? classById(s.classId) : null; }

/* نسبة «سكور» شرط دخول الامتحان */
function bacScore(m){
  var b = DB.bac, parts = [];
  if(m.m1!==null && m.m1!==undefined && m.m1!=="") parts.push(num(m.m1)/Math.max(num(b.m1Max,50),1)*100);
  if(m.m2!==null && m.m2!==undefined && m.m2!=="") parts.push(num(m.m2)/Math.max(num(b.m2Max,50),1)*100);
  var ws = weeklyScore(m);
  if(ws!==null) parts.push(ws);
  if(!parts.length) return null;
  var sum = 0; parts.forEach(function(x){ sum += x; });
  return Math.round(sum/parts.length*10)/10;
}
function bacStatus(m){
  var p = bacScore(m);
  if(p===null) return {t:"لم يُرصد", c:"", ok:null, pct:null};
  var need = num(DB.bac.passPct,50);
  return p>=need ? {t:"مسموح بدخول الامتحان", c:"ok", ok:true, pct:p}
                 : {t:"أقل من "+need+"٪ — غير مسموح", c:"bad", ok:false, pct:p};
}
/* المجموع التراكمي: أعلى محاولة في كل مادة (النظام بيتيح التحسين) */
function bacCumulative(sid){
  var best = {};
  for(var k in DB.marks){
    if(k.indexOf(sid+"|")!==0) continue;
    var suid = k.split("|")[1];
    var su = subjById(suid); if(!su || !su.counted) continue;
    var c = classById(su.classId); if(!isBacCert(c)) continue;
    var m = DB.marks[k];
    if(m.fin===null || m.fin===undefined || m.fin==="") continue;
    var v = num(m.fin);
    if(!best[suid] || v > best[suid].v) best[suid] = {v:v, max:num(su.max,100), lvl:Number(c.level)};
  }
  var got=0, of=0, y2=0, y3=0, n=0;
  for(var x in best){
    got += best[x].v; of += best[x].max; n++;
    if(best[x].lvl===2) y2 += best[x].v; else y3 += best[x].v;
  }
  var st = studentById(sid);
  var prev = st ? num(st.bacPrev, 0) : 0;
  return { subjects:n, inSystem:Math.round(got*100)/100, ofSystem:of,
           y2:Math.round(y2*100)/100, y3:Math.round(y3*100)/100, prev:prev,
           total:Math.round((got+prev)*100)/100, target:num(DB.bac.target,600) };
}

/* الدرجة النهائية للمادة في الفصل الدراسي */
function termTotal(studentId, subjectId, term){
  var m = getMark(studentId, subjectId, term), w = DB.weights;
  var s = subjById(subjectId), max = s? num(s.max,100) : 100;
  var c = s ? classById(s.classId) : null;

  /* البكالوريا: امتحان نهاية العام هو الدرجة الوحيدة الداخلة للمجموع */
  if(isBacCert(c)){
    if(m.fin===null || m.fin===undefined || m.fin==="") return null;
    var f = Math.round(num(m.fin)*100)/100;
    return { got:f, of:max, max:max, final:f, bac:true };
  }

  var parts = [
    [m.fin,  w.fin ], [m.m1, w.m1], [m.m2, w.m2],
    [m.beh,  w.beh ], [m.note, w.note]
  ];
  var got=0, of=0, any=false;
  for(var i=0;i<parts.length;i++){
    var v = parts[i][0], wt = parts[i][1];
    of += wt;
    if(v!==null && v!==undefined && v!==""){ got += num(v); any=true; }
  }
  var ws = weeklyScore(m);
  of += w.weekly;
  if(ws!==null){ got += ws * w.weekly/100; any=true; }
  if(!any) return null;
  return { got: Math.round(got*100)/100, of: of, max: max,
           final: Math.round(got/100*max*100)/100 };
}
function gradeLabel(p){
  if(p>=85) return {t:"ممتاز", c:"ok"};
  if(p>=75) return {t:"جيد جدًا", c:"ok"};
  if(p>=65) return {t:"جيد", c:"info"};
  if(p>=50) return {t:"مقبول", c:"warn"};
  return {t:"ضعيف", c:"bad"};
}
/* حالة الغياب مقارنة بلائحة الإنذارات */
function absState(absDays){
  var r = DB.absRules;
  if(absDays >= r.danger) return {t:"خطر الحرمان", c:"bad", lvl:3};
  if(absDays >= r.warn2)  return {t:"إنذار ثانٍ", c:"bad", lvl:2};
  if(absDays >= r.warn1)  return {t:"إنذار أول", c:"warn", lvl:1};
  return {t:"منتظم", c:"ok", lvl:0};
}

  if(UI.pick){
    h += '<div style="margin-top:12px"><label class="f"><span>الرقم السري</span>'+
      '<input type="password" id="pin" inputmode="numeric" placeholder="••••" autocomplete="off"></label>'+
      '<button class="btn block" data-lact="go">دخول</button></div>';
  }
  box.innerHTML = h;
  var p = document.getElementById("pin");
  if(p){ p.focus(); p.onkeydown = function(e){ if(e.key==="Enter") doLogin(); }; }
}
function doLogin(){
  var u = byId(DB.users, UI.pick);
  if(!u) return;
  var v = (document.getElementById("pin")||{}).value || "";
  if(String(u.pin||"") !== String(v)){ toast("الرقم السري غير صحيح"); return; }
  UI.user = u;
  UI.tab = NAV[u.role][0][0];
  UI.sub = null;
  document.getElementById("login").classList.add("off");
  document.getElementById("app").classList.add("on");
  document.getElementById("hdSchool").textContent = DB.meta.school;
  document.getElementById("hdUser").textContent = u.name + " · " + (ROLES[u.role]?ROLES[u.role].name:"");
  render();
}
function logout(){
  UI.user=null; UI.pick=null; UI.sub=null;
  document.getElementById("app").classList.remove("on");
  document.getElementById("login").classList.remove("off");
  renderLogin();
}

/* ---------- التنقل ---------- */
function renderNav(){
  var items = NAV[UI.user.role] || [];
  var s="", b="";
  items.forEach(function(it){
    var on = UI.tab===it[0] ? " on" : "";
    s += '<button class="'+on.trim()+'" data-act="tab" data-tab="'+it[0]+'"><span class="ico">'+it[2]+'</span>'+esc(it[1])+'</button>';
    b += '<button class="'+on.trim()+'" data-act="tab" data-tab="'+it[0]+'"><span class="ico">'+it[2]+'</span>'+esc(it[1])+'</button>';
  });
  document.getElementById("navSide").innerHTML = s;
  document.getElementById("navBottom").innerHTML = b;
}

/* ---------- الموجّه ---------- */
function render(){
  if(!UI.user) return;
  renderNav();
  var v = document.getElementById("view"), h="";
  switch(UI.tab){
    case "dash":       h = viewDash(); break;
    case "control":    h = (UI.sub&&UI.sub.student) ? ctStudentSheet(UI.sub.student) : viewControl(); break;
    case "staff":      h = (UI.sub&&UI.sub.one) ? viewStaffOne(UI.sub.one) : viewStaff(); break;
    case "staffAtt":   h = viewStaffAtt(); break;
    case "subs":       h = viewSubs(); break;
    case "leaves":     h = viewLeaves(); break;
    case "staffStats": h = viewStaffStats(); break;
    case "students":   h = UI.sub&&UI.sub.student ? viewStudent(UI.sub.student) : viewStudents(); break;
    case "classes":    h = UI.sub&&UI.sub.cls ? viewClass(UI.sub.cls) : viewClasses(); break;
    case "teachers":   h = UI.sub&&UI.sub.teacher ? viewTeacher(UI.sub.teacher) : viewTeachers(); break;
    case "assign":     h = viewAssign(); break;
    case "schedule":   h = viewSchedule(); break;
    case "absence":    h = viewAbsence(); break;
    case "reports":    h = viewReports(); break;
    case "settings":   h = viewSettings(); break;
    case "myclasses":  h = UI.sub&&UI.sub.a ? viewTeachClass(UI.sub.a) : viewMyClasses(); break;
    case "myschedule": h = viewMySchedule(); break;
    case "mystudents": h = viewMyStudents(); break;
    case "mygrades":   h = viewMyGrades(); break;
    case "myattend":   h = viewMyAttend(); break;
    case "mysched":    h = viewStudentSched(); break;
    default:           h = '<div class="empty"><b>الشاشة دي لسه فاضية</b></div>';
  }
  v.innerHTML = h;
  window.scrollTo(0,0);
}
function go(tab, sub){ UI.tab=tab; UI.sub=sub||null; render(); }
function back(){ UI.sub=null; render(); }

function viewStudents(){

      impBtn("students",{},"استيراد من إكسيل")+
      '<button class="btn ghost sm noprint" data-act="impTpl" data-tg="students" style="margin-right:6px">نموذج جاهز</button>':''));

      '<label class="f"><span>الصف</span><select id="flvl">'+optLevels(f.lvl)+'</select></label>'+

    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة الكشف</button></div>'+
    '<div class="bd flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>م</th><th>الاسم</th><th>الفصل</th><th>الصف / النظام</th><th>رقم الجلوس</th><th>الغياب</th><th>الحالة</th>'+
    '</tr></thead><tbody>';

    h += '<tr><td colspan="7"><div class="empty"><div class="big">👤</div><b>مفيش طلاب مطابقين</b>'+
      '<p>'+(DB.students.length?'جرّب تغيّر الفلاتر.':'ابدأ بإضافة الفصول ثم الطلاب.')+'</p></div></td></tr>';
  }

      '<td>'+esc(c?c.name:"— غير مسكّن —")+'</td>'+
      '<td><small>'+(c?esc(levelName(c.level))+' · '+esc(systemName(c.system)):"—")+'</small></td>'+
      '<td class="num">'+esc(s.seat||"—")+'</td>'+
      '<td class="num">'+st.abs+(st.exc?' <small style="color:var(--muted)">(+'+st.exc+' بعذر)</small>':'')+'</td>'+

function optLevels(sel){
  var h = '<option value="">كل الصفوف</option>';

  return h;
}
function optClasses(sel, lvl){
  var h = '<option value="">كل الفصول</option>';

    .sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); })
    .forEach(function(c){ h += '<option value="'+c.id+'"'+(sel===c.id?" selected":"")+'>'+esc(c.name)+'</option>'; });
  return h;
}

function classAttendRate(cid){
  var tot=0, pres=0;
  for(var k in DB.attend){
    if(k.indexOf(cid+"|")!==0) continue;
    var r = DB.attend[k];
    for(var s in r){ tot++; if(r[s]!=="A") pres++; }
  }
  return tot? Math.round(pres/tot*1000)/10 : 100;
}

function schedCell(classId, day, period){
  for(var i=0;i<DB.schedule.length;i++){
    var s = DB.schedule[i];
    if(s.classId===classId && s.day===day && s.period===period) return s;
  }
  return null;
}
function teacherBusy(teacherId, day, period, ignoreId){
  for(var i=0;i<DB.schedule.length;i++){
    var s = DB.schedule[i];
    if(s.id===ignoreId) continue;
    if(s.teacherId===teacherId && s.day===day && s.period===period) return s;
  }
  return null;
}

  var c1 = rows.filter(function(r){ return r.a.lvl===1; }).length;

    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة الكشف</button></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>م</th><th>الاسم</th><th>الفصل</th><th>أيام مرصودة</th><th>غياب</th><th>بعذر</th><th>تأخير</th><th>نسبة الحضور</th><th>الحالة</th></tr></thead><tbody>';
  if(!shown.length) h += '<tr><td colspan="9"><div class="empty"><b>'+(only?"مفيش طالب عليه إنذار":"مفيش بيانات غياب")+'</b><p>'+(only?"الحمد لله، كل الطلاب تحت حد الإنذار.":"المعلمون بيسجّلوا الغياب من شاشة فصولهم.")+'</p></div></td></tr>';
  shown.forEach(function(r,i){
    h += '<tr data-act="openStudent" data-id="'+r.s.id+'" style="cursor:pointer"><td class="rownum">'+(i+1)+'</td>'+
      '<td><b style="font-weight:600">'+esc(r.s.name)+'</b></td><td>'+esc(className(r.s.classId))+'</td>'+
      '<td class="num">'+r.st.days+'</td><td class="num"><b>'+r.st.abs+'</b></td><td class="num">'+r.st.exc+'</td>'+
      '<td class="num">'+r.st.late+'</td><td class="num">'+r.st.rate+'%</td>'+
      '<td><span class="tag '+r.a.c+'">'+r.a.t+'</span></td></tr>';
  });
  h += '</tbody></table></div></div></div>';

function schoolAttendRate(){
  var tot=0, pres=0;

}

function viewDash(){

  studs.forEach(function(s){
    var a = absState(attendStats(s.id,s.classId).abs);
    if(a.lvl>=3) danger++; else if(a.lvl>=1) warn++;
  });
  var h = pageHd("لوحة المدير", DB.meta.school+" — "+DB.meta.year+" — الفصل الدراسي "+(DB.meta.term===1?"الأول":"الثاني"));
  h += '<div class="stats" style="margin-bottom:12px">'+
    stat("الطلاب", studs.length, "مقيَّد","acc")+

    stat("المعلمون", DB.teachers.length, DB.assign.length+" تكليف","")+
    stat("نسبة الحضور", schoolAttendRate()+"%", "من بداية العام", schoolAttendRate()>=90?"acc":"acc-g")+
    stat("إنذارات غياب", warn, "طالب", warn?"acc-g":"")+
    stat("خطر الحرمان", danger, "طالب", danger?"acc-b":"")+

  h += '<div class="card"><div class="hd"><h3>توزيع الطلاب على الأنظمة</h3></div><div class="bd">'+
    bar("الثانوية العامة", gen, studs.length, "var(--ink-2)")+
    bar("البكالوريا المصرية", bac, studs.length, "var(--seal)")+
    '</div></div>';

  /* أداء الفصول */
  var rows = DB.classes.map(function(c){
    return {c:c, n:studsCount(c.id), rate:classAttendRate(c.id), avg:classAvg(c.id)};
  }).sort(function(a,b){ return b.rate-a.rate; });
  h += '<div class="card"><div class="hd"><h3>مؤشرات الفصول</h3>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة</button></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الفصل</th><th>الصف</th><th>النظام</th><th>الطلاب</th><th>نسبة الحضور</th><th>متوسط الدرجات</th></tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="6"><div class="empty"><b>مفيش فصول</b></div></td></tr>';
  rows.forEach(function(r){
    h += '<tr><td><b style="font-weight:600">'+esc(r.c.name)+'</b></td><td><small>'+esc(levelName(r.c.level))+'</small></td>'+
      '<td><small>'+esc(systemName(r.c.system))+'</small></td><td class="num">'+r.n+'</td>'+
      '<td class="num">'+r.rate+'%</td><td class="num">'+(r.avg===null?"—":r.avg+"%")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}
function studsCount(cid){ return studentsOf(cid).length; }
function classAvg(cid){
  var subs = DB.subjects.filter(function(s){ return s.classId===cid && s.counted; });
  var studs = studentsOf(cid), sum=0, n=0;
  studs.forEach(function(st){
    subs.forEach(function(su){
      var t = termTotal(st.id, su.id, DB.meta.term);
      if(t){ sum += t.got/(t.of||100)*100; n++; }
    });
  });
  return n? Math.round(sum/n*10)/10 : null;
}
function bar(label, v, total, color){
  var p = total? Math.round(v/total*100) : 0;
  return '<div style="margin-bottom:11px"><div style="display:flex;font-size:12.5px;margin-bottom:4px">'+
    '<span style="flex:1;font-weight:600">'+esc(label)+'</span><span style="color:var(--muted)">'+v+' طالب · '+p+'%</span></div>'+
    '<div style="height:9px;background:var(--line-2);border-radius:99px;overflow:hidden">'+
    '<div style="height:100%;width:'+p+'%;background:'+color+';border-radius:99px"></div></div></div>';
}

function myTeacherId(){ return UI.user.teacherId || null; }

function viewMyClasses(){
  var tid = myTeacherId();
  var a = tid ? assignsOfTeacher(tid) : [];

  if(!a.length){
    return h+'<div class="card"><div class="bd"><div class="empty"><div class="big">▦</div><b>مفيش فصول مسندة لك</b>'+
      '<p>وكيل شئون الطلاب هو اللي بيسند الفصول والمواد. كلّمه يضيف تكليفاتك وهتظهر هنا فورًا.</p></div></div></div>';
  }
  h += '<div class="card"><div class="bd flush">';
  a.forEach(function(x){
    var c = classById(x.classId);
    if(!c) return;
    var n = studentsOf(c.id).length;
    var k = attKey(c.id, today());
    var done = DB.attend[k] ? Object.keys(DB.attend[k]).length : 0;
    h += '<button class="list-item" data-act="openTeachClass" data-id="'+x.id+'">'+
      '<span class="av">'+esc(c.name.replace(/[^\u0621-\u064A0-9]/g,"").slice(0,2)||"ف")+'</span>'+
      '<span class="tx"><b>'+esc(c.name)+' — '+esc(subjName(x.subjectId))+'</b>'+
      '<small>'+esc(levelName(c.level))+' · '+n+' طالب · '+
      (done? '<span style="color:var(--seal)">غياب النهارده مسجّل ✓</span>' : '<span style="color:var(--danger)">غياب النهارده لسه</span>')+'</small></span>'+
      '<span class="chev">‹</span></button>';
  });
  h += '</div></div>';
  return h;
}

function viewTeachClass(assignId){
  var a = byId(DB.assign, assignId);
  if(!a) return '<div class="empty"><b>التكليف مش موجود</b></div>';
  var c = classById(a.classId), su = subjById(a.subjectId);
  if(!c || !su) return '<div class="empty"><b>الفصل أو المادة اتحذفت</b></div>';
  var tab = (UI.sub && UI.sub.t) || "att";

  var h = backBtn("فصولي");
  h += '<div class="card"><div class="hd"><div style="flex:1"><span class="eyebrow">'+esc(levelName(c.level))+' · '+esc(systemName(c.system))+'</span>'+
    '<h3 style="font-size:18px">'+esc(c.name)+' — '+esc(su.name)+'</h3>'+
    '<small style="color:var(--muted)">'+studentsOf(c.id).length+' طالب · النهاية العظمى '+su.max+' · الفصل الدراسي '+(DB.meta.term===1?"الأول":"الثاني")+'</small></div></div></div>';

  h += '<div class="chips noprint">'+
    tabBtn("att","تسجيل الغياب",tab)+tabBtn("marks","أعمال السنة",tab)+
    tabBtn("weekly","التقييم الأسبوعي",tab)+tabBtn("beh","السلوك",tab)+tabBtn("rep","كشف الفصل",tab)+'</div>';

  if(tab==="att")    h += tabAttendance(a, c);
  if(tab==="marks")  h += tabMarks(a, c, su);
  if(tab==="weekly") h += tabWeekly(a, c, su);
  if(tab==="beh")    h += tabBehavior(a, c);
  if(tab==="rep")    h += tabClassReport(a, c, su);
  return h;

function tabAttendance(a, c){
  var date = (UI.sub && UI.sub.date) || today();
  var k = attKey(c.id, date);
  var rec = DB.attend[k] || {};
  var studs = studentsOf(c.id);
  var dw = dayOfWeek(date);
  var h = '';
  h += '<div class="card noprint"><div class="bd">'+
    '<div class="grid2"><label class="f"><span>تاريخ اليوم</span><input type="date" id="attDate" value="'+esc(date)+'"></label>'+
    '<div style="align-self:end;padding-bottom:10px"><div style="font-size:12px;color:var(--muted)">اليوم</div>'+
    '<div style="font-weight:700">'+esc(dw>=0&&dw<6?DAYS[dw]:"الجمعة")+'</div></div></div>'+
    '<div style="display:flex;gap:7px;flex-wrap:wrap">'+
    '<button class="btn ghost sm" data-act="attAll" data-v="P">تحديد الكل حاضر</button>'+
    '<button class="btn ghost sm" data-act="attAll" data-v="A">تحديد الكل غائب</button>'+
    '<button class="btn ghost sm" data-act="attClear" style="color:var(--danger)">مسح اليوم</button>'+
    impBtn("attendance",{classId:c.id},"استيراد غياب من إكسيل")+'</div></div></div>';

  if(!studs.length) return h+'<div class="card"><div class="bd"><div class="empty"><b>الفصل فاضي</b><p>الوكيل لسه ما سكّنش طلاب على الفصل ده.</p></div></div></div>';

  var cP=0,cA=0,cE=0,cL=0;
  studs.forEach(function(s){ var v=rec[s.id]; if(v==="A")cA++;else if(v==="E")cE++;else if(v==="L")cL++;else if(v==="P")cP++; });
  h += '<div class="stats" style="margin-bottom:11px">'+
    stat("حاضر",cP,"طالب","acc")+stat("غائب",cA,"بدون عذر",cA?"acc-b":"")+
    stat("بعذر",cE,"طالب","")+stat("متأخر",cL,"طالب","")+'</div>';

  h += '<div class="card"><div class="hd"><h3>كشف الحضور — '+esc(fmtDate(date))+'</h3>'+
    '<small style="color:var(--muted)">ح = حاضر · غ = غائب · ع = بعذر · ت = متأخر</small></div><div class="bd flush">';
  function segBtn(sid,val,label,cur){
    return '<button class="'+(cur===val?"on":"")+'" data-v="'+val+'" data-act="attSet" data-sid="'+sid+'">'+label+'</button>';
  }
  studs.forEach(function(s,i){
    var v = rec[s.id];
    h += '<div class="att-row"><span class="no">'+(i+1)+'</span><span class="nm">'+esc(s.name)+'</span>'+
      '<span class="seg">'+
      segBtn(s.id,"P","ح",v)+segBtn(s.id,"A","غ",v)+segBtn(s.id,"E","ع",v)+segBtn(s.id,"L","ت",v)+
      '</span></div>';
  });
  h += '</div></div>';
  h += '<div class="note noprint">الحفظ بيتم تلقائي مع كل ضغطة. الطالب اللي مش متحدد بيتحسب مش مرصود.</div>';
  return h;
}

    '<th>كشكول<br><small>/'+w.note+'</small></th><th>سلوك<br><small>/'+w.beh+'</small></th>'+
    '<th>أسبوعي<br><small>/'+w.weekly+'</small></th><th>نهاية الفصل<br><small>/'+w.fin+'</small></th>'+
    '<th>المجموع<br><small>/'+su.max+'</small></th></tr></thead><tbody>';

/* --- رصد درجات البكالوريا: سكور شرط الدخول + امتحان نهاية العام --- */
function tabMarksBac(a, c, su){
  var studs = studentsOf(c.id), b = DB.bac;
  var h = '<div class="note noprint"><b>نظام البكالوريا المصرية:</b> مفيش أعمال سنة في الصفين الثاني والثالث. '+
    'الاختبارات الشهرية والتقييمات الأسبوعية <b>شرط لدخول امتحان نهاية العام</b> — لازم الطالب يجيب '+b.passPct+
    '٪ منها — ومش بتتضاف للمجموع. الدرجة الوحيدة اللي بتدخل المجموع التراكمي هي <b>امتحان نهاية العام</b> من '+su.max+'.</div>';

  var allowed=0, denied=0, done=0;
  studs.forEach(function(s){
    var st = bacStatus(getMark(s.id, su.id, DB.meta.term));
    if(st.ok===true) allowed++; else if(st.ok===false) denied++;
    var t = termTotal(s.id, su.id, DB.meta.term); if(t) done++;
  });
  h += '<div class="stats" style="margin-bottom:11px">'+
    stat("مسموح لهم", allowed, "بدخول الامتحان","acc")+
    stat("دون الحد", denied, "أقل من "+b.passPct+"٪", denied?"acc-b":"")+
    stat("رُصد لهم الامتحان", done, "من "+studs.length,"")+
    stat("حد الدخول", b.passPct+"%", "من التقييمات","acc-g")+'</div>';

  h += '<div class="card"><div class="hd"><h3>رصد '+esc(su.name)+'</h3>'+
    impBtn("marks",{classId:c.id,subjectId:su.id},"استيراد درجات")+
    '<button class="btn ghost sm noprint" data-act="print" style="margin-right:6px">⎙</button></div>'+
    '<div class="bd flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>م</th><th>الاسم</th><th>شهر ١<br><small>/'+b.m1Max+'</small></th><th>شهر ٢<br><small>/'+b.m2Max+'</small></th>'+
    '<th>أسبوعي</th><th>سكور الدخول</th><th>الحالة</th>'+
    '<th>امتحان نهاية العام<br><small>/'+su.max+'</small></th></tr></thead><tbody>';
  if(!studs.length) h += '<tr><td colspan="8"><div class="empty"><b>الفصل فاضي</b></div></td></tr>';
  studs.forEach(function(s,i){
    var m = getMark(s.id, su.id, DB.meta.term);
    var ws = weeklyScore(m), st = bacStatus(m);
    h += '<tr><td class="rownum">'+(i+1)+'</td><td style="min-width:130px"><b style="font-weight:600">'+esc(s.name)+'</b></td>'+
      mkCell(s.id,su.id,"m1",m.m1,b.m1Max)+mkCell(s.id,su.id,"m2",m.m2,b.m2Max)+
      '<td class="num" style="color:var(--muted)">'+(ws===null?"—":Math.round(ws)+"%")+'</td>'+
      '<td class="num"><b>'+(st.pct===null?"—":st.pct+"%")+'</b></td>'+
      '<td>'+(st.ok===null?'—':'<span class="tag '+st.c+'">'+(st.ok?"مسموح":"غير مسموح")+'</span>')+'</td>'+
      mkCell(s.id,su.id,"fin",m.fin,su.max)+'</tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}
function mkCell(sid, suid, f, v, max){
  var over = (v!==null && v!==undefined && v!=="" && num(v)>max);
  return '<td><input class="mk'+(over?" over":"")+'" type="number" step="0.25" min="0" max="'+max+'" value="'+
    (v===null||v===undefined?"":esc(v))+'" data-act="mkSet" data-sid="'+sid+'" data-suid="'+suid+'" data-f="'+f+'"></td>';
}

  });

}

/* --- تبويب كشف الفصل --- */
function tabClassReport(a, c, su){
  var studs = studentsOf(c.id);
  var rows = studs.map(function(s){
    var t = termTotal(s.id, su.id, DB.meta.term);
    var st = attendStats(s.id, c.id);
    return {s:s, t:t, p: t? t.got/(t.of||100)*100 : null, st:st};
  }).sort(function(x,y){ return (y.p===null?-1:y.p) - (x.p===null?-1:x.p); });
  var withP = rows.filter(function(r){ return r.p!==null; });
  var avg = withP.length ? Math.round(withP.reduce(function(a,r){return a+r.p;},0)/withP.length*10)/10 : null;
  var weak = withP.filter(function(r){ return r.p<50; });

  var h = printHd("كشف درجات "+c.name+" — "+su.name);
  if(isBacCert(c)) h += '<div class="note noprint">الترتيب محسوب على درجة امتحان نهاية العام — هي الدرجة الوحيدة الداخلة لمجموع البكالوريا.</div>';
  h += '<div class="stats" style="margin-bottom:11px">'+
    stat("متوسط الفصل", avg===null?"—":avg+"%", "في "+su.name, "acc")+
    stat("عدد المرصود لهم", withP.length, "من "+studs.length,"")+
    stat("أقل من ٥٠٪", weak.length, "طالب", weak.length?"acc-b":"")+
    stat("نسبة حضور الفصل", classAttendRate(c.id)+"%","","acc-g")+'</div>';
  h += '<div class="card"><div class="hd"><h3>الترتيب حسب الدرجة</h3>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة</button></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الترتيب</th><th>الاسم</th><th>المجموع</th><th>النسبة</th><th>التقدير</th><th>الغياب</th></tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="6"><div class="empty"><b>الفصل فاضي</b></div></td></tr>';
  rows.forEach(function(r,i){
    var g = r.p===null? null : gradeLabel(r.p);
    h += '<tr><td class="rownum">'+(i+1)+'</td><td><b style="font-weight:600">'+esc(r.s.name)+'</b></td>'+
      '<td class="num">'+(r.t? r.t.final+" / "+r.t.max : "—")+'</td>'+
      '<td class="num">'+(r.p===null?"—":Math.round(r.p*10)/10+"%")+'</td>'+
      '<td>'+(g?'<span class="tag '+g.c+'">'+g.t+'</span>':'—')+'</td>'+
      '<td class="num">'+r.st.abs+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}

function doImport(){
  var cid = val("i_cls");
  var txt = val("i_txt");
  var lines = txt.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(!lines.length){ toast("مفيش أسماء"); return; }
  var n=0;
  lines.forEach(function(L){
    var parts = L.split(/[,،\t]/);
    var name = (parts[0]||"").trim();
    if(!name) return;
    var seat = (parts[1]||"").trim();
    DB.students.push({id:uid("s"), name:name, classId:cid, seat:seat, status:"active", joined:today()});
    n++;
  });
  save(); closeModal(); render(); toast("اتضاف "+n+" طالب");
}

function autoSubjects(cid){
  var c = classById(cid);
  if(!c) return;
  var plan = planFor(c.level, c.system, c.track);
  if(!plan.length){ toast("مفيش خطة مواد للتخصص ده — ضيف المواد يدويًا"); return; }
  var added=0;
  plan.forEach(function(p){
    var exists = DB.subjects.some(function(s){ return s.classId===cid && s.name===p[0]; });
    if(exists) return;
    DB.subjects.push({id:uid("sb"), classId:cid, name:p[0], max:p[1], counted:!!p[2]});
    added++;
  });
  save(); render(); toast(added? "اتضاف "+added+" مادة" : "المواد موجودة بالفعل");
}

function fillSchedTeacher(sel){

    return '<option value="'+t.id+'"'+(sel===t.id?" selected":"")+'>'+esc(t.name)+'</option>';
  }).join("");

function checkBusy(){
  var el = document.getElementById("h_warn");
  if(!el) return;
  var tid = val("h_t"), day = Number(MODAL.dataset.day), p = Number(MODAL.dataset.p);
  var cur = schedCell(MODAL.dataset.cid, day, p);

  el.innerHTML = b
    ? '<div class="note bad"><b>تعارض:</b> المعلم عنده حصة في نفس الوقت مع '+esc(className(b.classId))+' — '+esc(subjName(b.subjectId))+'.</div>'

function saveSched(){
  var cid = MODAL.dataset.cid, day = Number(MODAL.dataset.day), p = Number(MODAL.dataset.p);
  var sid = val("h_s"), tid = val("h_t");
  var cur = schedCell(cid, day, p);

    cur.subjectId = sid; cur.teacherId = tid;

    '</div>'+mFoot("استعادة","doRestore"));
}
function doRestore(){
  var t = val("rs");
  if(!restoreFromText(t)) return;
  closeModal();
}
function restoreFromText(text){
  var s = String(text||"").replace(/^\uFEFF/,"").trim();
  if(!s){ toast("مفيش نص"); return false; }
  var d;
  try{ d = JSON.parse(s); }
  catch(e){
    var m = s.match(/\{[\s\S]*\}/);
    try{ d = JSON.parse(m? m[0] : ""); }
    catch(e2){ toast("النص مش نسخة صالحة"); return false; }
  }
  if(!d || !Array.isArray(d.students) || !Array.isArray(d.users)){ toast("النسخة ناقصة — مفيهاش طلاب أو حسابات"); return false; }
  DB = Object.assign(blankDB(), d);
  saveNow();
  toast("اتسترجع "+DB.students.length+" طالب و "+DB.classes.length+" فصل");
  logout();
  return true;
}
function restoreFile(){
  var inp = document.createElement("input");
  inp.type="file"; inp.accept=".json,.txt,application/json,text/plain";
  inp.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    var r = new FileReader();
    r.onerror = function(){ toast("مقدرتش أقرأ الملف — جرّب اللصق"); inp.remove(); };
    r.onload = function(){ if(restoreFromText(r.result)) closeModal(); inp.remove(); };
    r.readAsText(f,"utf-8");
  });
  inp.click();
}
function wipe(){
  openModal(mHead("مسح كل البيانات")+

/* ---------- ربط الأحداث ---------- */
function hookClicks(root){
  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var fn = ACTS[el.dataset.act];
    if(!fn) return;
    e.preventDefault();
    fn(el, e);
  });
}
function hookInputs(root){
  root.addEventListener("input", function(e){
    var el = e.target;
    var act = el.dataset && el.dataset.act;
    if(act==="mkSet"){
      var m = getMark(el.dataset.sid, el.dataset.suid, DB.meta.term);
      var v = el.value.trim();
      m[el.dataset.f] = v===""? null : num(v);
      var mx = num(el.getAttribute("max"),100);
      el.classList.toggle("over", v!=="" && num(v)>mx);
      save(); refreshTotals(el);
    }
    if(el.id==="fq"){
      UI.filters.q = el.value;
      clearTimeout(hookInputs._t);
      hookInputs._t = setTimeout(function(){
        var pos = el.selectionStart;
        render();
        var n = document.getElementById("fq");
        if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
      }, 280);
    }
    if(act==="s2Set"){
      var ms = getMark(el.dataset.sid, el.dataset.suid, Number(el.dataset.term));
      var sv = el.value.trim();
      ms.s2 = sv==="" ? null : num(sv);
      save();
      clearTimeout(hookInputs._s2);
      hookInputs._s2 = setTimeout(function(){ render(); }, 900);
    }
    if(act==="wkSet"){
      var mm = getMark(el.dataset.sid, el.dataset.suid, DB.meta.term);
      var vv = el.value.trim();
      if(vv==="غ"||vv==="غ ") mm.w[Number(el.dataset.i)] = "غ";
      else if(vv==="") mm.w[Number(el.dataset.i)] = null;
      else mm.w[Number(el.dataset.i)] = num(vv);
      save(); refreshWeekly(el);
    }
  });
  root.addEventListener("change", function(e){
    var id = e.target.id;
    if(id==="fq" || id==="flvl" || id==="fcls"){
      UI.filters.q = val("fq"); UI.filters.lvl = val("flvl"); UI.filters.cls = val("fcls");
      if(id==="flvl") UI.filters.cls = "";
      render();
      var f = document.getElementById(id==="fq"?"fq":id);
      if(f && id==="fq"){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); }
    }
    if(id==="attDate"){ UI.sub.date = e.target.value; render(); }
    if(id==="ctLvl" || id==="ctCls" || id==="ctScope"){
      UI.filters.ctLvl = val("ctLvl");
      UI.filters.ctCls = val("ctCls");
      UI.filters.ctScope = val("ctScope");
      if(id==="ctLvl") UI.filters.ctCls = "";
      render();
    }
  });
}
function refreshTotals(el){
  var row = el.closest("tr"); if(!row) return;
  var t = termTotal(el.dataset.sid, el.dataset.suid, DB.meta.term);
  var last = row.lastElementChild;
  if(last) last.innerHTML = "<b>"+(t? t.final : "—")+"</b>";
}
function refreshWeekly(el){
  var row = el.closest("tr"); if(!row) return;
  var m = getMark(el.dataset.sid, el.dataset.suid, DB.meta.term);
  var ws = weeklyScore(m);
  var last = row.lastElementChild;
  if(last) last.innerHTML = "<b>"+(ws===null?"—":Math.round(ws)+"%")+"</b>";
}

var XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
var xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = XLSX_URL;
    s.onload = function(){ window.XLSX ? res(window.XLSX) : rej(new Error("no XLSX")); };
    s.onerror = function(){ rej(new Error("تعذّر تحميل قارئ إكسيل")); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

/* ---------- تطبيع النصوص العربية ---------- */
function toEnDigits(s){
  return String(s==null?"":s)
    .replace(/[\u0660-\u0669]/g, function(d){ return String(d.charCodeAt(0)-0x0660); })
    .replace(/[\u06F0-\u06F9]/g, function(d){ return String(d.charCodeAt(0)-0x06F0); })
    .replace(/\u066B/g, ".").replace(/\u066C/g, "");
}
function normAr(s){
  return toEnDigits(s)
    .replace(/[\u064B-\u0652\u0640]/g, "")      /* تشكيل وتطويل */
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^\u0621-\u064A0-9a-zA-Z]+/g, " ")
    .replace(/\s+/g, " ").trim().toLowerCase();
}
function cleanName(s){
  return toEnDigits(s).replace(/[\u0640]/g,"").replace(/\s+/g," ").trim();
}
function parseNum(v){
  var s = toEnDigits(v).replace(/[^\d.\-]/g,"");
  if(s==="" || s==="-" || s===".") return null;
  var n = parseFloat(s);
  return isFinite(n) ? n : null;
}
/* تشابه اسمين (لمطابقة كشوف الدرجات بأسماء مكتوبة بشكل مختلف) */
function similar(a,b){
  a = normAr(a); b = normAr(b);
  if(!a || !b) return 0;
  if(a===b) return 1;
  var A = a.split(" "), B = b.split(" ");
  var hit = 0;
  A.forEach(function(w){ if(w.length>1 && B.indexOf(w)>=0) hit++; });
  return hit / Math.max(A.length, B.length);
}

/* ---------- تفسير القيم الخاصة ---------- */
function parseLevel(v){
  var s = normAr(v);
  if(/(^|\D)3(\D|$)|ثالث|تالت/.test(s)) return 3;
  if(/(^|\D)2(\D|$)|ثاني|تاني/.test(s)) return 2;
  if(/(^|\D)1(\D|$)|اول|اولي/.test(s)) return 1;
  return null;
}
function parseSystem(v){
  var s = normAr(v);
  if(/بكالوريا|bac/.test(s)) return "bac";
  if(/عام|general|gen/.test(s)) return "gen";
  return null;
}
function parseTrack(v){
  var s = normAr(v);
  if(/طب|حياه|احياء|med/.test(s)) return "med";
  if(/هندس|حاسب|برمج|eng/.test(s)) return "eng";
  if(/اعمال|تجار|محاسب|bus/.test(s)) return "bus";
  if(/اداب|فنون|art/.test(s)) return "art";
  if(/علمي علوم|علوم/.test(s)) return "sci";
  if(/رياض/.test(s)) return "math";
  if(/ادبي/.test(s)) return "lit";
  return null;
}
function parseBool(v){
  var s = normAr(v);
  if(/نعم|داخل|yes|y|1|true|✓/.test(s)) return true;
  if(/لا|خارج|no|n|0|false/.test(s)) return false;
  return null;
}
function parseDay(v){
  var s = normAr(v);
  /* بتقبل الفصحى والعامية والأخطاء الشائعة: الاتنين، التلات، الاربع… */
  var pats = [/سبت|sat/, /احد|حد|sun/, /اثنين|اتنين|تنين|mon/, /ثلاثاء|ثلاثا|تلاتاء|تلات|ثلات|tue/,
              /اربعاء|اربعا|اربع|wed/, /خميس|thu/];
  for(var i=0;i<pats.length;i++) if(pats[i].test(s)) return i;
  var n = parseNum(v);
  if(n!==null && n>=1 && n<=6) return n-1;
  return null;
}
function parseAttV(v){
  var s = normAr(v);
  if(!s) return null;
  if(/^(غ|غائب|غياب|a|absent)$/.test(s)) return "A";
  if(/^(ع|عذر|بعذر|e|excused)$/.test(s)) return "E";
  if(/^(ت|تاخير|متاخر|l|late)$/.test(s)) return "L";
  if(/^(ح|حاضر|p|present|\.|x|✓|1)$/.test(s)) return "P";
  return null;
}

/* ---------- قراءة الملفات ---------- */
function detectDelim(text){
  var line = text.split(/\r?\n/).filter(function(l){ return l.trim(); })[0] || "";
  var best = ",", bestN = 0;
  [",",";","\t","|"].forEach(function(d){
    var n = line.split(d).length;
    if(n > bestN){ bestN = n; best = d; }
  });
  return bestN > 1 ? best : ",";
}
function parseCSV(text, delim){
  delim = delim || detectDelim(text);
  var rows = [], row = [], cell = "", q = false;
  text = String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell += ch;
    }else{
      if(ch === '"') q = true;
      else if(ch === delim){ row.push(cell); cell=""; }
      else if(ch === "\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell += ch;
    }
  }
  row.push(cell);
  if(row.length>1 || row[0]!=="") rows.push(row);
  return rows;
}
/* تنضيف الشبكة: شيل الصفوف والأعمدة الفاضية تمامًا */
function cleanGrid(rows){
  var g = rows.map(function(r){ return (r||[]).map(function(c){ return cleanName(c); }); });
  g = g.filter(function(r){ return r.some(function(c){ return c!==""; }); });
  if(!g.length) return [];
  var w = 0; g.forEach(function(r){ w = Math.max(w, r.length); });
  var keep = [];
  for(var c=0;c<w;c++){
    var any = g.some(function(r){ return (r[c]||"")!==""; });
    if(any) keep.push(c);
  }
  return g.map(function(r){ return keep.map(function(c){ return r[c]||""; }); });
}
/* تحديد صف العناوين: الصف اللي فيه أكتر تطابق مع الأسماء المعروفة */
function detectHeader(grid, schema){
  var best = -1, bestScore = 0;
  var lim = Math.min(grid.length, 15);
  for(var i=0;i<lim;i++){
    var score = 0;
    grid[i].forEach(function(cell){
      if(!cell) return;
      if(parseNum(cell)!==null && cell.length<4) return;    /* أرقام مش عناوين */
      var n = normAr(cell);
      schema.fields.forEach(function(f){
        f.al.forEach(function(a){
          var na = normAr(a);
          if(n===na || (na.length>3 && n.indexOf(na)>=0) || (n.length>3 && na.indexOf(n)>=0)) score++;
        });
      });
      if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(toEnDigits(cell))) score++;
    });
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return bestScore >= 1 ? best : -1;
}
function autoMap(header, schema){
  var map = [];
  var used = {};
  (header||[]).forEach(function(cell, idx){
    map[idx] = "";
    if(!cell) return;
    var n = normAr(cell), bestF = "", bestLen = 0;
    schema.fields.forEach(function(f){
      if(used[f.k] && !f.multi) return;
      f.al.forEach(function(a){
        var na = normAr(a);
        var hit = (n===na) || (na.length>2 && n.indexOf(na)>=0) || (n.length>2 && na.indexOf(n)>=0);
        if(hit && na.length > bestLen){ bestF = f.k; bestLen = na.length; }
      });
    });
    if(bestF){ map[idx] = bestF; used[bestF] = 1; }
  });
  return map;
}

function impFile(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".xlsx,.xls,.xlsm,.csv,.tsv,.txt";
  inp.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    var name = (f.name||"").toLowerCase();
    var isX = /\.(xlsx|xls|xlsm)$/.test(name);
    toast("بقرأ الملف…");
    if(isX){
      loadXLSX().then(function(X){
        var r = new FileReader();
        r.onload = function(){
          try{
            var wb = X.read(new Uint8Array(r.result), {type:"array"});
            var all = [];
            wb.SheetNames.forEach(function(sn){
              var rows = X.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, defval:""});
              if(rows.length > all.length) all = rows;
            });
            impLoaded(all);
          }catch(e){ toast("الملف مش مقروء — جرّب تحفظه CSV"); }
          inp.remove();
        };
        r.onerror = function(){ toast("مقدرتش أقرأ الملف"); inp.remove(); };
        r.readAsArrayBuffer(f);
      }).catch(function(){
        toast("محتاج إنترنت لقراءة إكسيل — احفظ الملف CSV أو الصق الجدول");
        inp.remove();
      });
    }else{
      var r2 = new FileReader();
      r2.onload = function(){ impLoaded(parseCSV(String(r2.result).replace(/^\uFEFF/,""))); inp.remove(); };
      r2.onerror = function(){ toast("مقدرتش أقرأ الملف"); inp.remove(); };
      r2.readAsText(f, "utf-8");
    }
  });
  inp.click();
}

function impRun(){
  var t = UI.imp.target, g = UI.imp.grid, hr = UI.imp.header, map = UI.imp.map;
  UI.imp.mode = val("impMode") || "add";
  var rows = g.slice(hr+1).filter(function(r){ return r.some(function(c){ return c!==""; }); });
  var recs = rows.map(function(r){
    var o = {__extra:[]};
    map.forEach(function(k, c){
      if(!k) return;
      var v = r[c]||"";
      if(k.indexOf("__")===0){ o.__extra.push({k:k, c:c, v:v}); return; }
      o[k] = o[k]!==undefined && k!=="name" ? o[k] : (o[k]!==undefined ? o[k]+" "+v : v);
    });
    /* دمج أعمدة الاسم المتعددة */
    var nameCols = [];
    map.forEach(function(k,c){ if(k==="name") nameCols.push(r[c]||""); });
    if(nameCols.length) o.name = cleanName(nameCols.join(" "));
    return o;
  });
  var res;
  try{
    switch(t){
      case "students":   res = impStudents(recs); break;
      case "teachers":   res = impTeachers(recs); break;
      case "classes":    res = impClasses(recs); break;
      case "subjects":   res = impSubjects(recs); break;
      case "marks":      res = impMarks(recs); break;
      case "weekly":     res = impWeekly(recs, g, hr, map); break;
      case "attendance": res = impAttendance(recs, g, hr, map); break;
      case "schedule":   res = impSchedule(recs); break;
      case "assign":     res = impAssign(recs); break;
      case "staffImp":   res = impStaff(recs); break;
      case "staffAttImp":res = impStaffAtt(recs, g, hr, map); break;
      default: res = {add:0, upd:0, skip:0, err:["نوع استيراد غير معروف"]};
    }
  }catch(e){ res = {add:0, upd:0, skip:0, err:["حصل خطأ أثناء القراءة: "+e.message]}; }
  saveNow();
  impResult(res);
}
function impResult(r){
  var h = '<div class="mb">';
  h += '<div class="stats">'+
    stat("اتضاف", r.add, "سطر", r.add?"acc":"")+
    stat("اتحدّث", r.upd, "سطر","")+
    stat("اتخطّى", r.skip, "مكرر أو ناقص", r.skip?"acc-g":"")+
    stat("مرفوض", (r.err||[]).length, "سطر", (r.err||[]).length?"acc-b":"")+'</div>';
  if(r.note) h += '<div class="note" style="margin-top:11px">'+r.note+'</div>';

    h += '<div class="note bad" style="margin-top:11px;max-height:180px;overflow:auto"><b>أسطر ما دخلتش:</b><br>'+
      r.err.slice(0,40).map(function(x){ return "• "+esc(x); }).join("<br>")+
      (r.err.length>40? "<br>… و"+(r.err.length-40)+" سطر تاني" : "")+'</div>';
  }
  h += '</div><div class="mf"><button class="btn" data-act="impDone">تمام</button></div>';
  MODAL.innerHTML = mHead("نتيجة الاستيراد") + h;
}

function findClassByName(name){
  if(!name) return null;
  var n = normAr(name);
  for(var i=0;i<DB.classes.length;i++) if(normAr(DB.classes[i].name)===n) return DB.classes[i];
  for(var j=0;j<DB.classes.length;j++) if(similar(DB.classes[j].name, name)>=0.75) return DB.classes[j];
  return null;
}
function findTeacherByName(name){
  if(!name) return null;
  var n = normAr(name);
  for(var i=0;i<DB.teachers.length;i++) if(normAr(DB.teachers[i].name)===n) return DB.teachers[i];
  var best=null, bs=0;
  DB.teachers.forEach(function(t){ var s=similar(t.name,name); if(s>bs){bs=s;best=t;} });
  return bs>=0.7 ? best : null;
}
function findSubjInClass(cid, name){
  if(!name) return null;
  var n = normAr(name);
  var subs = DB.subjects.filter(function(s){ return s.classId===cid; });
  for(var i=0;i<subs.length;i++) if(normAr(subs[i].name)===n) return subs[i];
  var best=null, bs=0;
  subs.forEach(function(s){ var x=similar(s.name,name); if(x>bs){bs=x;best=s;} });
  return bs>=0.7 ? best : null;
}
function findStudent(rec, classId){
  var pool = classId ? studentsOf(classId) : DB.students;
  if(rec.seat){
    var seat = toEnDigits(rec.seat).trim();
    for(var i=0;i<pool.length;i++) if(String(pool[i].seat||"").trim()===seat && seat!=="") return pool[i];
  }
  if(rec.name){
    var n = normAr(rec.name);
    for(var j=0;j<pool.length;j++) if(normAr(pool[j].name)===n) return pool[j];
    var best=null, bs=0;
    pool.forEach(function(s){ var x=similar(s.name, rec.name); if(x>bs){bs=x;best=s;} });
    if(bs>=0.7) return best;
  }
  return null;
}

function parseDateCell(v){
  var s = toEnDigits(v).trim();
  var m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(s);
  if(m) return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
  m = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec(s);
  if(m) return m[3]+"-"+pad2(m[2])+"-"+pad2(m[1]);
  m = /^(\d{1,2})[-\/](\d{1,2})$/.exec(s);
  if(m){
    var y = (DB.meta.year.match(/\d{4}/)||[new Date().getFullYear()])[0];
    return y+"-"+pad2(m[2])+"-"+pad2(m[1]);
  }
  return null;
}
function pad2(x){ x = String(x); return x.length<2 ? "0"+x : x; }

function parseFbConfig(text){
  var s = String(text||"").trim();
  if(!s) return null;
  /* الكود اللي فايربيز بيديه فيه سطور import فيها أقواس —
     فبندوّر على firebaseConfig نفسها ونعدّ الأقواس عشان نجيب الكائن الصح */
  var start = 0;
  var m = /firebaseConfig\s*=\s*/.exec(s);
  if(m) start = m.index + m[0].length;
  var i = s.indexOf("{", start);
  if(i<0) return null;
  var depth = 0, j = -1;
  for(var k=i;k<s.length;k++){
    if(s[k]==="{") depth++;
    else if(s[k]==="}"){ depth--; if(depth===0){ j=k; break; } }
  }
  if(j<0) return null;
  s = s.slice(i, j+1);
  try{ return JSON.parse(s); }catch(e){}
  try{ return JSON.parse(jsObjToJson(s)); }catch(e2){ return null; }
}
/* تحويل كائن جافاسكريبت لـJSON: بيشيل التعليقات ويقفل المفاتيح بعلامات
   ويمسح الفواصل الزيادة — من غير ما يلخبط النصوص اللي جواها // زي الروابط */
function jsObjToJson(src){
  var out = "", i = 0, n = src.length;
  while(i < n){
    var ch = src[i];
    if(ch === '"' || ch === "'"){
      var q = ch, buf = '"'; i++;
      while(i < n && src[i] !== q){
        if(src[i] === "\\"){ buf += src[i] + (src[i+1]||""); i += 2; continue; }
        buf += (src[i] === '"') ? '\\"' : src[i];
        i++;
      }
      i++; out += buf + '"'; continue;
    }
    if(ch === "/" && src[i+1] === "/"){ while(i < n && src[i] !== "\n") i++; continue; }
    if(ch === "/" && src[i+1] === "*"){ i += 2; while(i < n && !(src[i]==="*" && src[i+1]==="/")) i++; i += 2; continue; }
    out += ch; i++;
  }
  var strs = [];
  out = out.replace(/"(?:\\.|[^"\\])*"/g, function(m){ strs.push(m); return "\u0001"+(strs.length-1)+"\u0001"; });
  out = out.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":');
  out = out.replace(/,(\s*[}\]])/g, "$1");
  out = out.replace(/\u0001(\d+)\u0001/g, function(_, d){ return strs[Number(d)]; });
  return out;
}
function cfgValid(c){
  return !!(c && c.apiKey && c.projectId && (c.databaseURL || c.projectId));
}
function ensureDbUrl(c){
  if(!c.databaseURL) c.databaseURL = "https://"+c.projectId+"-default-rtdb.firebaseio.com";
  return c;
}

function loadScript(src){
  return new Promise(function(res, rej){
    var el = document.createElement("script");
    el.src = src; el.async = false;
    var done = false;
    var timer = setTimeout(function(){
      if(done) return;
      done = true; el.remove();
      rej(new Error("انتهت المهلة"));
    }, 12000);
    el.onload = function(){ if(done) return; done=true; clearTimeout(timer); res(); };
    el.onerror = function(){ if(done) return; done=true; clearTimeout(timer); el.remove(); rej(new Error("فشل التحميل")); };
    document.head.appendChild(el);
  });
}
function inFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
/* بيجرّب المصادر بالترتيب لحد ما واحد ينجح */
function loadFirebase(){
  if(window.firebase && window.firebase.database) return Promise.resolve();
  var hosts = FB_HOSTS.slice(), tried = [];
  function tryHost(){
    if(!hosts.length){
      var why = inFrame()
        ? "المكتبة مش راضية تتحمّل. غالبًا لأنك فاتح البرنامج جوه معاينة داخل صفحة تانية — نزّل الملف واشتغل عليه من المتصفح مباشرة."
        : "مقدرتش أحمّل مكتبة فايربيز من أي مصدر. اتأكد إن النت شغال، ولو في المدرسة فيه حجب جرّب من شبكة تانية أو من بيانات الموبايل.";
      return Promise.reject(new Error(why));
    }
    var base = hosts.shift();
    tried.push(base);
    return FB_FILES.reduce(function(p, f){
      return p.then(function(){ return loadScript(base + f); });
    }, Promise.resolve()).then(function(){
      if(!(window.firebase && window.firebase.database)) throw new Error("المكتبة اتحمّلت ناقصة");
      SYNC.src = base;
    }).catch(function(){
      return tryHost();
    });
  }
  return tryHost();
}

/* ---------- بصمة للمقارنة ---------- */
function snapshotOf(db){
  var s = {b:{}, g:{}};
  BULK.forEach(function(k){ s.b[k] = JSON.stringify(db[k]===undefined? null : db[k]); });
  GRAIN.forEach(function(k){
    s.g[k] = {};
    var o = db[k] || {};
    for(var x in o) s.g[k][x] = JSON.stringify(o[x]);
  });
  return s;
}
/* فايربيز مش بيقبل . # $ [ ] / في المفاتيح */
function fbKey(k){ return String(k).replace(/[.#$\[\]\/]/g, "~"); }
function unFbKey(k){ return String(k); }

/* ---------- الرفع ---------- */
function syncPush(){
  if(!SYNC.on || SYNC.applying) return;
  clearTimeout(SYNC.pushT);
  SYNC.pushT = setTimeout(doPush, 700);
}
function doPush(){
  if(!SYNC.on || !SYNC.ref) return;
  var now = snapshotOf(DB), up = {}, n = 0;
  BULK.forEach(function(k){
    if(!SYNC.sent || SYNC.sent.b[k] !== now.b[k]){
      up[k] = DB[k]===undefined ? null : DB[k];
      n++;
    }
  });
  GRAIN.forEach(function(k){
    var cur = now.g[k], old = (SYNC.sent && SYNC.sent.g[k]) || {};
    for(var x in cur){
      if(old[x] !== cur[x]){ up[k+"/"+fbKey(x)] = DB[k][x]; n++; }
    }
    for(var y in old){
      if(cur[y]===undefined){ up[k+"/"+fbKey(y)] = null; n++; }
    }
  });
  if(!n) return;
  up["_rev"] = { by: SYNC.dev, at: Date.now() };
  syncStatus("push");
  /* بنسجّل اللي بعتناه فورًا عشان تعديل تاني في نفس اللحظة ما يعيدش رفع الكل،
     ولو الكتابة فشلت بنرجّع البصمة عشان المحاولة الجاية تبعت الناقص */
  var prev = SYNC.sent;
  SYNC.sent = now;
  SYNC.ref.update(up).then(function(){
    syncStatus("ok");
  }).catch(function(e){
    SYNC.sent = prev;
    syncStatus("err", "مقدرش يكتب — راجع قواعد قاعدة البيانات");
  });
}

/* ---------- الاستقبال ---------- */
function onRemote(sn){
  var v = sn.val();
  if(!v) { doPush(); return; }                       /* السحابة فاضية: ارفع اللي عندك */
  if(v._rev && v._rev.by === SYNC.dev) return;       /* صدى تعديلاتنا */
  SYNC.applying = true;
  var changed = false;
  BULK.forEach(function(k){
    if(v[k]===undefined) return;
    var incoming = v[k];
    if(["users","teachers","classes","subjects","students","assign","schedule","behavior","staff","leaves"].indexOf(k)>=0){
      incoming = Array.isArray(incoming) ? incoming.filter(Boolean) : [];
    }
    if(JSON.stringify(DB[k]) !== JSON.stringify(incoming)){ DB[k] = incoming; changed = true; }
  });
  GRAIN.forEach(function(k){
    var inc = v[k] || {};
    var cur = DB[k] || {};
    for(var x in inc){
      if(JSON.stringify(cur[x]) !== JSON.stringify(inc[x])){ cur[x] = inc[x]; changed = true; }
    }
    for(var y in cur){
      if(inc[y]===undefined){ delete cur[y]; changed = true; }
    }
    DB[k] = cur;
  });
  SYNC.sent = snapshotOf(DB);
  SYNC.applying = false;
  if(changed){
    saveNow();
    SYNC.lastAt = Date.now();
    if(UI.user && !document.getElementById("ov").classList.contains("on")) render();
    syncStatus("ok");
  }
}

/* ============================================================
   كود الدعوة — ربط جهاز جديد بسطر واحد
   ============================================================ */
function b64e(str){
  try{ return window.btoa(unescape(encodeURIComponent(str))); }
  catch(e){ return null; }
}
function b64d(str){
  try{ return decodeURIComponent(escape(window.atob(str))); }
  catch(e){ return null; }
}
function inviteCode(){
  var c = syncCfgLoad();
  if(!c || !cfgValid(c.cfg) || !c.code) return null;
  var payload = b64e(JSON.stringify({v:1, code:c.code, cfg:c.cfg}));
  return payload ? "SEGEL-" + payload : null;
}
function applyInvite(text){
  var s = String(text||"").trim().replace(/\s+/g,"");
  var i = s.indexOf("SEGEL-");
  if(i>=0) s = s.slice(i+6);
  var json = b64d(s);
  if(!json){ toast("كود الدعوة مش مقروء — انسخه كامل تاني"); return false; }
  var o;
  try{ o = JSON.parse(json); }catch(e){ toast("كود الدعوة تالف"); return false; }
  if(!o || !o.code || !cfgValid(o.cfg)){ toast("كود الدعوة ناقص"); return false; }
  var c = syncCfgLoad() || {};
  c.code = o.code; c.cfg = ensureDbUrl(o.cfg); c.enabled = true; c.dev = c.dev || deviceId();
  if(!syncCfgSave(c)){ toast("المتصفح مانع الحفظ — جرّب متصفح تاني"); return false; }
  return true;
}

/* ============================================================
   الكنتـرول — رصد النتيجة والدور الثاني والإحصائيات والأوراق
   مبني على القرار الوزاري 234 لسنة 2025:
   • الدرجة النهائية = متوسط درجة الطالب × النهاية العظمى للمادة
   • شرط: ربع درجة ورقة الامتحان التحريري في كل فصل دراسي منفصل
   • الراسب يؤدي دور ثانٍ، واجتيازه شرط الانتقال للصف الأعلى
   ============================================================ */

function ctl(){
  if(!DB.control) DB.control = {};
  var d = { passPct:50, writtenMinPct:25, failLimit:3, seatStart:1001, roomSize:30, roomStart:1 };
  for(var k in d) if(DB.control[k]===undefined) DB.control[k] = d[k];
  return DB.control;
}
var SCOPES = [["t1","الفصل الدراسي الأول"],["t2","الفصل الدراسي الثاني"],["year","العام الدراسي كامل"]];
function scopeName(s){ for(var i=0;i<SCOPES.length;i++) if(SCOPES[i][0]===s) return SCOPES[i][1]; return "—"; }
function scopeTerms(s){ return s==="t1"?[1] : s==="t2"?[2] : [1,2]; }

/* ---------- نتيجة الطالب في مادة ---------- */
function subjResult(sid, su, scope){
  var c = classById(su.classId), C = ctl();
  var max = num(su.max,100);
  var passMark = max * C.passPct/100;
  var r = { max:max, passMark:Math.round(passMark*100)/100, terms:[], final:null,
            written:true, writtenNote:"", status:"none", s2:null, bac:false };

  /* البكالوريا: امتحان نهاية العام هو النتيجة، والسكور شرط الدخول */
  if(isBacCert(c)){
    r.bac = true;
    var m = getMark(sid, su.id, DB.meta.term);
    var bs = bacStatus(m);
    r.entry = bs;
    r.s2 = (m.s2===undefined || m.s2==="") ? null : num(m.s2);
    if(bs.ok===false && (m.fin===null||m.fin===undefined||m.fin==="")){
      r.status = "denied"; return r;
    }
    if(m.fin===null || m.fin===undefined || m.fin===""){ r.status="none"; return r; }
    r.final = Math.round(num(m.fin)*100)/100;
    var eff = r.s2!==null ? r.s2 : r.final;
    r.status = eff >= passMark ? "pass" : (r.s2!==null ? "fail" : "second");
    if(r.s2!==null) r.final = r.s2;
    return r;
  }

  var terms = scopeTerms(scope), sum = 0, n = 0;
  terms.forEach(function(t){
    var m = getMark(sid, su.id, t);
    var tt = termTotal(sid, su.id, t);
    var wMax = DB.weights.fin;
    var wMin = wMax * C.writtenMinPct/100;
    var hasW = !(m.fin===null || m.fin===undefined || m.fin==="");
    var info = { t:t, pct: tt? tt.got/(tt.of||100)*100 : null,
                 written: hasW? num(m.fin) : null, wMin:Math.round(wMin*100)/100,
                 wOk: hasW ? num(m.fin) >= wMin : null };
    r.terms.push(info);
    if(info.pct!==null){ sum += info.pct; n++; }
    if(info.wOk===false){ r.written = false; r.writtenNote = "الفصل "+(t===1?"الأول":"الثاني"); }
  });
  if(!n){ r.status="none"; return r; }
  var avg = sum/n;
  r.avgPct = Math.round(avg*10)/10;
  r.final = Math.round(avg/100*max*100)/100;

  var m2 = getMark(sid, su.id, terms[terms.length-1]);
  r.s2 = (m2.s2===undefined || m2.s2==="") ? null : num(m2.s2);

  var ok = r.final >= passMark && r.written;
  if(r.s2!==null){
    r.status = r.s2 >= passMark ? "pass" : "fail";
    r.final = r.s2;
  }else{
    r.status = ok ? "pass" : "second";
  }
  return r;
}

/* ---------- نتيجة الطالب كاملة ---------- */
function studentResult(sid, scope){
  var s = studentById(sid);
  if(!s) return null;
  var c = classById(s.classId);
  if(!c) return null;
  var subs = DB.subjects.filter(function(x){ return x.classId===c.id; });
  var rows = [], got=0, of=0, failed=[], failedOut=[], none=0;
  subs.forEach(function(su){
    var r = subjResult(sid, su, scope);
    rows.push({su:su, r:r});
    if(r.status==="none"){ none++; return; }
    if(su.counted && r.final!==null){ got += r.final; of += r.max; }
    if(r.status==="second" || r.status==="fail" || r.status==="denied"){
      (su.counted ? failed : failedOut).push(su.name);
    }
  });
  var allFail = failed.concat(failedOut);
  var st;
  if(none===subs.length) st = {t:"لم تُرصد", c:"", k:"none"};
  else if(!allFail.length) st = {t:"ناجح ومنقول", c:"ok", k:"pass"};
  else if(allFail.length >= ctl().failLimit) st = {t:"باقٍ للإعادة", c:"bad", k:"repeat"};
  else st = {t:"له دور ثانٍ في "+allFail.length+" مادة", c:"warn", k:"second"};

  var pct = of ? Math.round(got/of*1000)/10 : null;
  return { student:s, cls:c, rows:rows, got:Math.round(got*100)/100, of:of,
           pct:pct, grade: pct===null?null:gradeLabel(pct), failed:allFail, status:st };
}

/* ---------- نطاق العمل ---------- */
function ctlScope(){
  var f = UI.filters;
  if(!f.ctScope) f.ctScope = DB.meta.term===2 ? "year" : "t1";
  return f.ctScope;
}
function ctlClasses(){
  var f = UI.filters;
  return DB.classes.filter(function(c){
    if(f.ctLvl && String(c.level)!==String(f.ctLvl)) return false;
    if(f.ctCls && c.id!==f.ctCls) return false;
    return true;
  }).sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); });
}
function ctlStudents(){
  var cls = {}; ctlClasses().forEach(function(c){ cls[c.id]=1; });
  return DB.students.filter(function(s){ return cls[s.classId] && s.status!=="left"; })
    .sort(function(a,b){ return sortAr(a.name,b.name); });
}
