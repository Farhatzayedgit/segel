/* ---------- الإحصائيات ---------- */
function ctStats(){
  var studs = ctlStudents(), scope = ctlScope();
  var res = studs.map(function(s){ return studentResult(s.id, scope); }).filter(Boolean);
  var done = res.filter(function(r){ return r.status.k!=="none"; });

  /* إحصائية عامة */
  var pass = done.filter(function(r){ return r.status.k==="pass"; }).length;
  var h = '<div class="stats" style="margin-bottom:12px">'+
    stat("المقيّدون", res.length, "طالب","acc")+
    stat("المرصود لهم", done.length, "طالب","")+
    stat("نسبة النجاح", done.length? Math.round(pass/done.length*1000)/10+"%":"—", "من المرصود","acc")+
    stat("نسبة الدور الثاني", done.length? Math.round(done.filter(function(r){return r.status.k==="second";}).length/done.length*1000)/10+"%":"—","","acc-g")+
    '</div>';

  /* توزيع التقديرات */
  var G = [["ممتاز",0],["جيد جدًا",0],["جيد",0],["مقبول",0],["ضعيف",0]];
  done.forEach(function(r){
    if(r.pct===null) return;
    var g = gradeLabel(r.pct).t;
    for(var i=0;i<G.length;i++) if(G[i][0]===g) G[i][1]++;
  });
  h += printHd("إحصائية النتيجة — "+scopeName(scope));
  h += '<div class="card"><div class="hd"><h3>توزيع التقديرات</h3>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة</button></div><div class="bd">';
  var cols = ["var(--seal)","#2f8f6f","var(--ink-2)","var(--gold)","var(--danger)"];
  G.forEach(function(g,i){ h += bar(g[0], g[1], done.length, cols[i]); });
  h += '</div></div>';

  /* إحصائية المواد */
  var bySub = {};
  res.forEach(function(r){
    r.rows.forEach(function(row){
      if(row.r.status==="none") return;
      var k = row.su.name;
      if(!bySub[k]) bySub[k] = {n:0, pass:0, sum:0, hi:null, lo:null, max:row.su.max};
      var b = bySub[k];
      b.n++;
      if(row.r.status==="pass") b.pass++;
      if(row.r.final!==null){
        b.sum += row.r.final;
        b.hi = b.hi===null? row.r.final : Math.max(b.hi,row.r.final);
        b.lo = b.lo===null? row.r.final : Math.min(b.lo,row.r.final);
      }
    });
  });
  h += '<div class="card"><div class="hd"><h3>إحصائية المواد</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>المادة</th><th>عدد المرصود</th><th>ناجح</th><th>دور ثانٍ</th>'+
    '<th>نسبة النجاح</th><th>المتوسط</th><th>أعلى</th><th>أقل</th></tr></thead><tbody>';
  var keys = Object.keys(bySub).sort(sortAr);
  if(!keys.length) h += '<tr><td colspan="8"><div class="empty"><b>مفيش درجات مرصودة</b></div></td></tr>';
  keys.forEach(function(k){
    var b = bySub[k];
    h += '<tr><td><b style="font-weight:600">'+esc(k)+'</b></td><td class="num">'+b.n+'</td>'+
      '<td class="num">'+b.pass+'</td><td class="num">'+(b.n-b.pass)+'</td>'+
      '<td class="num">'+Math.round(b.pass/b.n*1000)/10+'%</td>'+
      '<td class="num">'+Math.round(b.sum/b.n*10)/10+' / '+b.max+'</td>'+
      '<td class="num">'+(b.hi===null?"—":b.hi)+'</td><td class="num">'+(b.lo===null?"—":b.lo)+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  /* إحصائية الفصول */
  var byCls = {};
  res.forEach(function(r){
    var k = r.cls.name;
    if(!byCls[k]) byCls[k] = {n:0, pass:0, sec:0, rep:0, sum:0, cnt:0};
    var b = byCls[k]; b.n++;
    if(r.status.k==="pass") b.pass++;
    if(r.status.k==="second") b.sec++;
    if(r.status.k==="repeat") b.rep++;
    if(r.pct!==null){ b.sum += r.pct; b.cnt++; }
  });
  h += '<div class="card"><div class="hd"><h3>إحصائية الفصول</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الفصل</th><th>الطلاب</th><th>ناجح</th><th>دور ثانٍ</th><th>باقٍ</th>'+
    '<th>نسبة النجاح</th><th>متوسط النسبة</th></tr></thead><tbody>';
  Object.keys(byCls).sort(sortAr).forEach(function(k){
    var b = byCls[k];
    h += '<tr><td><b style="font-weight:600">'+esc(k)+'</b></td><td class="num">'+b.n+'</td>'+
      '<td class="num">'+b.pass+'</td><td class="num">'+b.sec+'</td><td class="num">'+b.rep+'</td>'+
      '<td class="num">'+Math.round(b.pass/b.n*1000)/10+'%</td>'+
      '<td class="num">'+(b.cnt? Math.round(b.sum/b.cnt*10)/10+"%":"—")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}

function pRoster(){
  var cls = ctlClasses();
  if(!cls.length){ toast("اختار الفصل الأول"); return; }
  var h = "";
  cls.forEach(function(c){
    var subs = DB.subjects.filter(function(x){ return x.classId===c.id; });
    var studs = studentsOf(c.id);
    subs.forEach(function(su){
      var bac = isBacCert(c);
      var t = '<table class="tbl"><thead><tr><th>م</th><th>رقم الجلوس</th><th>الاسم</th>';
      if(bac) t += '<th>شهر ١</th><th>شهر ٢</th><th>أسبوعي</th><th>سكور</th><th>امتحان نهاية العام</th>';

      t += '</tr></thead><tbody>';

        var m = getMark(s.id, su.id, term);

        t += '<tr><td class="rownum">'+(i+1)+'</td><td class="num">'+esc(s.seat||"")+'</td><td>'+esc(s.name)+'</td>';
        if(bac) t += '<td class="num">'+dash(m.m1)+'</td><td class="num">'+dash(m.m2)+'</td>'+
          '<td class="num">'+(ws===null?"—":Math.round(ws)+"%")+'</td>'+
          '<td class="num">'+((bacStatus(m).pct===null)?"—":bacStatus(m).pct+"%")+'</td>'+
          '<td class="num">'+dash(m.fin)+'</td>';

          '<td class="num">'+dash(m.note)+'</td><td class="num">'+dash(m.beh)+'</td>'+

        '<span>المعلم: ................</span><span>الموجّه: ................</span>'+
        '<span>رئيس الكنترول: ................</span></div></div>';
    });
  });
  paper(h || '<div class="note">مفيش مواد في النطاق ده.</div>');
}

function pStatOfficial(){
  var res = ctResList();
  var byLvl = {};
  res.forEach(function(r){
    var k = levelName(r.cls.level);
    if(!byLvl[k]) byLvl[k] = {n:0, pass:0, sec:0, rep:0, none:0};
    var b = byLvl[k]; b.n++;
    if(r.status.k==="pass") b.pass++;
    else if(r.status.k==="second") b.sec++;
    else if(r.status.k==="repeat") b.rep++;
    else b.none++;
  });
  var t = '<table class="tbl"><thead><tr><th>الصف</th><th>المقيّدون</th><th>المرصود لهم</th>'+
    '<th>ناجح ومنقول</th><th>له دور ثانٍ</th><th>باقٍ للإعادة</th><th>نسبة النجاح</th></tr></thead><tbody>';
  Object.keys(byLvl).forEach(function(k){
    var b = byLvl[k], d = b.n-b.none;

function genSeats(){
  var C = ctl();
  C.seatStart = num(val("sq_start"), 1001);
  C.roomSize  = Math.max(1, num(val("sq_size"), 30));
  C.roomStart = num(val("sq_room"), 1);
  var studs = ctlStudents().slice().sort(function(a,b){
    var ca = classById(a.classId), cb = classById(b.classId);
    return (ca.level-cb.level) || sortAr(a.name,b.name);
  });
  if(!studs.length){ toast("مفيش طلاب في النطاق"); return; }
  var seat = C.seatStart, room = C.roomStart, inRoom = 0;
  studs.forEach(function(s){
    s.seat = String(seat++);
    if(inRoom >= C.roomSize){ room++; inRoom = 0; }
    s.room = String(room);
    inRoom++;
  });
  saveNow(); render();
  toast("اتولّد "+studs.length+" رقم جلوس على "+(room-C.roomStart+1)+" لجنة");
}
function clearSeats(){
  if(!confirm("مسح أرقام الجلوس واللجان لطلاب النطاق ده؟")) return;
  ctlStudents().forEach(function(s){ delete s.seat; delete s.room; });
  saveNow(); render(); toast("اتمسحت");
}

var JOBS = ["معلم","معلم أول","معلم خبير","كبير معلمين","أخصائي اجتماعي","أخصائي نفسي",
            "أمين مكتبة","أمين معمل","سكرتير","كاتب","عامل","حارس أمن","إداري"];
var LEAVE_TYPES = [
  {id:"casual",  name:"عارضة",        max:7},
  {id:"annual",  name:"اعتيادية",     max:30},
  {id:"sick",    name:"مرضية",        max:0},
  {id:"mission", name:"مأمورية",      max:0},
  {id:"birth",   name:"وضع / رعاية",  max:0},
  {id:"hajj",    name:"حج",           max:0},
  {id:"unpaid",  name:"بدون أجر",     max:0}
];
var STAFF_ATT = {P:"حاضر", A:"غائب", L:"متأخر", V:"إجازة", M:"مأمورية"};

function leaveName(id){ for(var i=0;i<LEAVE_TYPES.length;i++) if(LEAVE_TYPES[i].id===id) return LEAVE_TYPES[i].name; return id; }
function leaveMax(id){ for(var i=0;i<LEAVE_TYPES.length;i++) if(LEAVE_TYPES[i].id===id) return LEAVE_TYPES[i].max; return 0; }

function staffInit(){
  if(!Array.isArray(DB.staff)) DB.staff = [];
  if(!Array.isArray(DB.leaves)) DB.leaves = [];
  if(!DB.staffAtt || typeof DB.staffAtt!=="object") DB.staffAtt = {};
  if(!DB.subs || typeof DB.subs!=="object") DB.subs = {};
}
/* كل العاملين: المعلمون (من جدول المعلمين) + باقي الوظائف */
function staffAll(){
  staffInit();
  var out = DB.teachers.map(function(t){
    var ex = DB.staff.filter(function(x){ return x.teacherId===t.id; })[0] || {};
    return { id:"T"+t.id, kind:"teacher", teacherId:t.id, name:t.name,
             job: ex.job || "معلم", phone: t.phone||ex.phone||"", natId:ex.natId||"",
             hired: ex.hired||"", degree: ex.degree||"", note: ex.note||"" };
  });
  DB.staff.forEach(function(x){
    if(x.teacherId) return;
    out.push({ id:"S"+x.id, kind:"admin", staffId:x.id, name:x.name, job:x.job||"إداري",
               phone:x.phone||"", natId:x.natId||"", hired:x.hired||"", degree:x.degree||"", note:x.note||"" });
  });
  return out.sort(function(a,b){ return sortAr(a.name,b.name); });
}
function staffById(id){ var a = staffAll(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function staffRecord(sid){
  staffInit();
  if(sid.charAt(0)==="T"){
    var tid = sid.slice(1);
    var r = DB.staff.filter(function(x){ return x.teacherId===tid; })[0];
    if(!r){ r = {id:uid("sf"), teacherId:tid}; DB.staff.push(r); }
    return r;
  }
  var xid = sid.slice(1);
  var q = DB.staff.filter(function(x){ return x.id===xid; })[0];
  return q || null;
}

/* ---------- حضور العاملين ---------- */
function staffAttOf(date){ staffInit(); return DB.staffAtt[date] || {}; }
function staffAttStats(sid){
  staffInit();
  var d=0, a=0, l=0, v=0, m=0;
  for(var k in DB.staffAtt){
    var rec = DB.staffAtt[k];
    if(!rec || !(sid in rec)) continue;
    d++;
    var x = rec[sid];
    if(x==="A") a++; else if(x==="L") l++; else if(x==="V") v++; else if(x==="M") m++;
  }
  return { days:d, abs:a, late:l, leave:v, mission:m, present:d-a-v-m,
           rate: d? Math.round((d-a)/d*1000)/10 : 100 };
}
/* رصيد الإجازات */
function leaveBalance(sid, type){
  staffInit();
  var used = 0;
  DB.leaves.forEach(function(L){ if(L.staffId===sid && L.type===type) used += num(L.days,0); });
  var mx = leaveMax(type);
  return { used:used, max:mx, left: mx? Math.max(0, mx-used) : null };
}
function daysBetween(a,b){
  if(!a||!b) return 0;
  var d1 = new Date(a+"T00:00:00"), d2 = new Date(b+"T00:00:00");
  var n = Math.round((d2-d1)/86400000)+1;
  return n>0 ? n : 0;
}

/* ---------- النصاب والاحتياطي ---------- */
function teacherPeriods(tid){ return DB.schedule.filter(function(s){ return s.teacherId===tid; }); }
function periodsOn(tid, day){ return DB.schedule.filter(function(s){ return s.teacherId===tid && s.day===day; }); }
function freeTeachersAt(day, period, absentIds){
  return DB.teachers.filter(function(t){
    if(absentIds && absentIds.indexOf("T"+t.id)>=0) return false;
    return !teacherBusy(t.id, day, period, null);
  }).sort(function(a,b){ return teacherPeriods(a.id).length - teacherPeriods(b.id).length; });
}
function subKey(date, schedId){ return date+"|"+schedId; }

      return '<option value="'+t.id+'"'+(cur===t.id?" selected":"")+'>'+esc(t.name)+' ('+teacherPeriods(t.id).length+' حصة)</option>';
    }).join("");

      '<td><select data-act="subSet" data-date="'+date+'" data-sched="'+g.sched.id+'" '+
        'style="min-width:170px;padding:6px 8px;font-size:12.5px">'+opts+'</select>'+

  return h;
}

function impStaff(recs){
  staffInit();
  var r = {add:0, upd:0, skip:0, err:[]};
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    if(!name || name.length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم"); return; }
    var ex = null;
    staffAll().forEach(function(s){ if(!ex && normAr(s.name)===normAr(name)) ex = s; });
    if(ex && UI.imp.mode==="add"){ r.skip++; return; }
    var rec;
    if(ex && UI.imp.mode==="update"){ rec = staffRecord(ex.id); r.upd++; }
    else { rec = {id:uid("sf"), name:name}; DB.staff.push(rec); r.add++; }
    if(!rec.teacherId) rec.name = name;
    if(o.job) rec.job = cleanName(o.job);
    if(o.degree) rec.degree = cleanName(o.degree);
    if(o.natId) rec.natId = toEnDigits(o.natId).replace(/\D/g,"");
    if(o.phone) rec.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");
    if(o.hired){ var d = parseDateCell(o.hired); if(d) rec.hired = d; }
  });
  return r;
}
function impStaffAtt(recs, g, hr, map){
  staffInit();
  var r = {add:0, upd:0, skip:0, err:[]};
  var dcols = [];
  map.forEach(function(k,c){
    if(k!=="__d") return;
    var d = parseDateCell(hr>=0? g[hr][c] : "");
    if(d) dcols.push({c:c, d:d});
    else r.err.push("عمود مش تاريخ — اتتجاهل");
  });
  if(!dcols.length) return {add:0,upd:0,skip:0,err:["ما حددتش أعمدة تواريخ"]};
  var all = staffAll();
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    var s = null, best=0;
    all.forEach(function(x){
      if(normAr(x.name)===normAr(name)) s = x;
      else { var sim = similar(x.name,name); if(sim>best && sim>=0.7){ best=sim; if(!s) s=x; } }
    });
    if(!s){ r.err.push("سطر "+(i+1)+": ما لقيتش «"+name+"»"); return; }
    var any = false;
    (o.__extra||[]).forEach(function(x){
      if(x.k!=="__d") return;
      var col=null; dcols.forEach(function(dc){ if(dc.c===x.c) col=dc; });
      if(!col) return;
      var vv = normAr(x.v), v = null;
      if(/^(ح|حاضر|p)$/.test(vv)) v="P";
      else if(/^(غ|غائب|a)$/.test(vv)) v="A";
      else if(/^(ت|متاخر|l)$/.test(vv)) v="L";
      else if(/^(ج|اجازه|v)$/.test(vv)) v="V";
      else if(/^(م|ماموريه|مأموريه|m)$/.test(vv)) v="M";
      if(!v) return;
      if(!DB.staffAtt[col.d]) DB.staffAtt[col.d] = {};
      DB.staffAtt[col.d][s.id] = v; any = true;
    });
    if(any) r.add++; else r.skip++;
  });
  return r;
}

/* ============================================================
   الدخول بالرقم السري الشخصي
   شاشة واحدة: خانة رقم سري. الرقم نفسه هو الهوية.
   • كل موظف ليه رقم فريد — البرنامج بيمنع التكرار
   • بيمنع الأرقام الضعيفة (متتالية / مكررة / تواريخ ميلاد شائعة)
   • تأخير تصاعدي بعد المحاولات الغلط ضد التخمين
   ============================================================ */

var PIN_LEN = 6;

/* ---------- توليد وفحص الأرقام ---------- */
function allPins(){
  var m = {};
  DB.users.forEach(function(u){ if(u.pin) m[String(u.pin)] = u; });
  return m;
}
function pinOwner(pin, exceptUserId){
  var p = String(pin);
  for(var i=0;i<DB.users.length;i++){
    var u = DB.users[i];
    if(u.id===exceptUserId) continue;
    if(String(u.pin)===p) return u;
  }
  return null;
}
/* رقم ضعيف: متتالي، مكرر، أو من قائمة الأرقام الشائعة */
var WEAK_PINS = ["000000","111111","123456","654321","121212","112233","123123",
                 "999999","555555","666666","101010","202020","123321","696969",
                 "1234","0000","1111","2222","1122","4321"];
function pinWeak(pin){
  var p = toEnDigits(String(pin));
  if(WEAK_PINS.indexOf(p)>=0) return "رقم شائع وسهل التخمين";
  if(/^(\d)\1+$/.test(p)) return "كل الأرقام متشابهة";
  var up=true, down=true;
  for(var i=1;i<p.length;i++){
    if(Number(p[i]) !== Number(p[i-1])+1) up = false;
    if(Number(p[i]) !== Number(p[i-1])-1) down = false;
  }
  if(up || down) return "أرقام متتالية";
  if(/^(\d\d)\1+$/.test(p)) return "نمط مكرر";
  if(/^(19|20)\d\d$/.test(p) && p.length===4) return "سنة ميلادية سهلة التخمين";
  return null;
}
/* الفحص الكامل: بيرجع رسالة الخطأ أو null لو الرقم صالح */
function pinCheck(pin, exceptUserId){
  var p = toEnDigits(String(pin||"")).trim();
  if(!/^\d+$/.test(p)) return "الرقم السري لازم يكون أرقام بس";
  if(p.length < PIN_LEN) return "الرقم السري لازم "+PIN_LEN+" أرقام على الأقل";
  if(p.length > 12) return "الرقم طويل أوي — "+PIN_LEN+" لـ ١٢ رقم";
  var w = pinWeak(p);
  if(w) return "الرقم ده مايصلحش: "+w;
  var owner = pinOwner(p, exceptUserId);
  if(owner) return "الرقم ده مستخدم بالفعل لحساب تاني — اختار رقم غيره";
  return null;
}
function genPin(){
  for(var tries=0; tries<500; tries++){
    var p = "";
    for(var i=0;i<PIN_LEN;i++) p += Math.floor(Math.random()*10);
    if(p[0]==="0") continue;
    if(pinWeak(p)) continue;
    if(pinOwner(p, null)) continue;
    return p;
  }
  return String(Date.now()).slice(-PIN_LEN);
}
/* أرقام الحسابات القديمة القصيرة/المكررة محتاجة تغيير */
function weakUsers(){
  var seen = {}, dup = {};
  DB.users.forEach(function(u){
    var p = String(u.pin||"");
    if(seen[p]) dup[p] = 1;
    seen[p] = 1;
  });
  return DB.users.filter(function(u){
    var p = String(u.pin||"");
    return p.length < PIN_LEN || pinWeak(p) || dup[p];
  });
}

/* ---------- حماية من التخمين ---------- */
var TRY_KEY = "segel_tries_v1";
function tries(){
  try{
    var o = JSON.parse(window.localStorage.getItem(TRY_KEY) || "{}");
    return { n: num(o.n,0), at: num(o.at,0) };
  }catch(e){ return { n:0, at:0 }; }
}
function setTries(n){
  try{ window.localStorage.setItem(TRY_KEY, JSON.stringify({n:n, at:Date.now()})); }catch(e){}
}
/* التأخير بيزيد: 3 محاولات مجانية، بعدها 5ث، 15ث، 60ث، 5د */
function lockLeft(){
  var t = tries();
  if(t.n < 3) return 0;
  var waits = [5, 15, 60, 300];
  var w = waits[Math.min(t.n-3, waits.length-1)] * 1000;
  var left = t.at + w - Date.now();
  return left > 0 ? Math.ceil(left/1000) : 0;
}

/* ---------- شاشة الدخول الجديدة ---------- */
function renderLogin(){
  var el = document.getElementById("loginYear");
  if(el) el.textContent = DB.meta.school + " · " + DB.meta.year;
  var box = document.getElementById("loginCard");
  if(!box) return;

  var lock = lockLeft();
  var h = '<div style="font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:9px;text-align:center">'+
    'اكتب رقمك السري للدخول</div>'+
    '<input type="password" id="pin" inputmode="numeric" autocomplete="off" '+
      'placeholder="••••••" '+(lock?'disabled ':'')+
      'style="text-align:center;letter-spacing:.5em;font-size:20px;padding:13px 11px;font-family:Cairo,sans-serif">'+
    '<button class="btn block" data-lact="go" style="margin-top:10px"'+(lock?' disabled':'')+'>دخول</button>';

  if(lock){
    h += '<div class="note bad" id="lockNote" style="margin-top:11px;text-align:center">'+
      'محاولات كتير غلط. استنى <b id="lockSec">'+lock+'</b> ثانية.</div>';
  }else if(tries().n > 0){
    h += '<div class="note warn" style="margin-top:11px;text-align:center;font-size:12px">'+
      'الرقم غلط. لو نسيته، وكيل شئون العاملين يقدر يشوفه لك.</div>';
  }

  var c = syncCfgLoad();
  var linked = !!(c && c.enabled && c.code);
  h += '<div style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2);text-align:center">'+
    (linked
      ? '<div style="font-size:11.5px;color:var(--muted)">مربوط بمدرسة <b>'+esc(c.code)+'</b> · '+
        '<button data-lact="invp" style="color:var(--ink-2);font-weight:600;font-size:11.5px;text-decoration:underline">تغيير</button></div>'
      : '<button data-lact="invp" style="color:var(--ink-2);font-weight:600;font-size:13px">جهاز جديد؟ الصق كود الربط</button>')+
    '</div>';
  box.innerHTML = h;

  var p = document.getElementById("pin");
  if(p && !lock){
    p.focus();
    p.onkeydown = function(e){ if(e.key==="Enter") doLogin(); };
  }
  if(lock) startLockTimer();
}
function startLockTimer(){
  clearInterval(renderLogin._t);
  renderLogin._t = setInterval(function(){
    var left = lockLeft();
    var el = document.getElementById("lockSec");
    if(!el){ clearInterval(renderLogin._t); return; }
    if(left <= 0){ clearInterval(renderLogin._t); setTries(0); renderLogin(); return; }
    el.textContent = left;
  }, 1000);
}
function doLogin(){
  if(lockLeft() > 0) return;
  var el = document.getElementById("pin");
  var v = toEnDigits((el ? el.value : "")).trim();
  if(!v){ toast("اكتب رقمك السري"); return; }

  var u = null;
  for(var i=0;i<DB.users.length;i++){
    if(String(DB.users[i].pin) === v){ u = DB.users[i]; break; }
  }
  if(!u){
    setTries(tries().n + 1);
    if(el){ el.value = ""; }
    renderLogin();
    toast("الرقم السري غير صحيح");
    return;
  }
  setTries(0);
  UI.user = u;
  UI.tab = (NAV[u.role] && NAV[u.role][0][0]) || "settings";
  UI.sub = null;
  document.getElementById("login").classList.add("off");
  document.getElementById("app").classList.add("on");
  document.getElementById("hdSchool").textContent = DB.meta.school;
  document.getElementById("hdUser").textContent = u.name + " · " + (ROLES[u.role] ? ROLES[u.role].name : "");
  render();
}
function logout(){
  UI.user = null; UI.sub = null;
  document.getElementById("app").classList.remove("on");
  document.getElementById("login").classList.remove("off");
  renderLogin();
}

/* ============================================================
   إدارة الأرقام السرية داخل البرنامج
   ============================================================ */
/* حقل رقم سري بزر توليد وفحص فوري */
function pinField(id, value, exceptId){
  return '<label class="f"><span>الرقم السري ('+PIN_LEN+' أرقام على الأقل)</span>'+
    '<div style="display:flex;gap:7px">'+
    '<input type="text" id="'+id+'" inputmode="numeric" value="'+esc(value||"")+'" '+
      'data-act="pinLive" data-except="'+esc(exceptId||"")+'" data-msg="'+id+'_msg" '+
      'style="flex:1;letter-spacing:.15em;font-variant-numeric:tabular-nums">'+
    '<button class="btn ghost" data-act="pinGen" data-for="'+id+'" data-msg="'+id+'_msg">توليد</button>'+
    '</div><div id="'+id+'_msg" class="pinmsg"></div></label>';
}
function pinMsgHTML(err, pin){
  if(!pin) return '';
  if(err) return '<span style="color:var(--danger)">✕ '+esc(err)+'</span>';
  return '<span style="color:var(--seal)">✓ رقم صالح وغير مستخدم</span>';
}

/* ---------- بطاقة الأرقام في الإعدادات ---------- */
function pinsCard(){
  var weak = weakUsers();
  var h = '<div class="card"><div class="hd"><h3>الأرقام السرية والدخول</h3>'+
    '<span class="tag '+(weak.length?"bad":"ok")+'">'+(weak.length? weak.length+" يحتاج تغيير" : "كله سليم")+'</span></div><div class="bd">'+
    '<div class="note">الدخول بقى برقم سري واحد بس — من غير قايمة أسماء. الرقم نفسه هو اللي بيحدد صاحب الحساب، '+
    'عشان كده لازم كل واحد يكون له رقم مختلف تمامًا، و'+PIN_LEN+' أرقام على الأقل عشان محدش يخمّنه.</div>';

  if(weak.length){
    h += '<div class="note bad"><b>'+weak.length+' حساب أرقامه ضعيفة أو مكررة</b> — أي حد يقدر يخمّنها ويدخل مكانهم. '+
      'اضغط الزرار تحت وهيتولّد أرقام جديدة قوية للكل، وتطبعها وتوزعها.</div>'+
      '<button class="btn danger block" data-act="fixPins" style="margin-bottom:11px">توليد أرقام جديدة للحسابات الضعيفة ('+weak.length+')</button>';
  }
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn ghost" data-act="pinSheet">كشف الأرقام للطباعة</button>'+
    '<button class="btn ghost" data-act="pinSlips">قصاصات لكل موظف</button>'+
    '</div></div></div>';
  return h;
}
/* كشف الأرقام — يشوفه المدير ووكيل شئون العاملين بس */
function pinSheet(){
  var rows = DB.users.slice().sort(function(a,b){
    var o = {manager:0,deputy:1,admin:2,teacher:3,student:4};
    return (o[a.role]-o[b.role]) || sortAr(a.name,b.name);
  });
  var t = '<table class="tbl"><thead><tr><th>م</th><th>الاسم</th><th>الصفة</th>'+
    '<th>الرقم السري</th><th>الحالة</th><th>توقيع الاستلام</th></tr></thead><tbody>';
  rows.forEach(function(u,i){
    var err = pinCheck(u.pin, u.id);
    t += '<tr><td class="rownum">'+(i+1)+'</td><td><b style="font-weight:600">'+esc(u.name)+'</b></td>'+
      '<td>'+esc(ROLES[u.role]?ROLES[u.role].name:u.role)+'</td>'+
      '<td class="num" style="font-size:16px;letter-spacing:.12em"><b>'+esc(u.pin)+'</b></td>'+
      '<td>'+(err?'<span class="tag bad">ضعيف</span>':'<span class="tag ok">سليم</span>')+'</td>'+
      '<td style="min-width:110px"></td></tr>';
  });
  t += '</tbody></table>';
  paper(pWrap("كشف الأرقام السرية — سري", t)+
    '<div class="card"><div class="bd"><div class="note bad">الورقة دي سرية. سلّم كل واحد رقمه ووقّع، ومتسيبهاش في مكان مفتوح.</div></div></div>');
  UI.tab = "settings";
  render();
}
/* قصاصات منفصلة تقصها وتوزعها */
function pinSlips(){
  var h = '<div class="note noprint">اطبع الصفحة واقص كل قصاصة وسلّمها لصاحبها.</div><div style="margin-top:10px">';
  DB.users.forEach(function(u){
    h += '<div class="card" style="break-inside:avoid;margin-bottom:8px"><div class="bd" style="text-align:center">'+
      '<div style="font-size:11px;color:var(--muted)">'+esc(DB.meta.school)+'</div>'+
      '<div style="font-weight:700;font-size:15px;margin:3px 0">'+esc(u.name)+'</div>'+
      '<div style="font-size:12px;color:var(--muted)">'+esc(ROLES[u.role]?ROLES[u.role].name:u.role)+'</div>'+
      '<div style="margin:9px 0;padding:9px;background:var(--line-2);border-radius:9px">'+
        '<div style="font-size:11px;color:var(--muted)">الرقم السري</div>'+
        '<div style="font-size:26px;font-weight:800;letter-spacing:.2em;font-family:Cairo,sans-serif">'+esc(u.pin)+'</div>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--muted)">افتح لينك البرنامج واكتب الرقم ده — هيفتح حسابك على طول.<br>متديهوش لحد.</div>'+
      '</div></div>';
  });
  paper(h+'</div>');
  UI.tab = "settings";
  render();
}

Object.assign(ACTS, {
  pinGen: function(el){
    var f = document.getElementById(el.dataset.for);
    if(!f) return;
    f.value = genPin();
    var m = document.getElementById(el.dataset.msg);
    if(m) m.innerHTML = pinMsgHTML(null, f.value);
  },
  pinLive: function(){},
  fixPins: function(){
    var weak = weakUsers();
    if(!weak.length){ toast("مفيش أرقام ضعيفة"); return; }
    if(!confirm("هيتولّد رقم جديد لـ "+weak.length+" حساب. الأرقام القديمة مش هتشتغل تاني. متأكد؟")) return;
    weak.forEach(function(u){ u.pin = genPin(); });
    saveNow(); render();
    toast("اتولّدت "+weak.length+" أرقام — اطبع الكشف ووزّعه");
  },
  pinSheet: pinSheet,
  pinSlips: pinSlips
});

/* فحص فوري وأنت بتكتب */
document.addEventListener("input", function(e){
  var el = e.target;
  if(!el || !el.dataset || el.dataset.act!=="pinLive") return;
  var msg = document.getElementById(el.dataset.msg);
  if(!msg) return;
  var v = toEnDigits(el.value).trim();
  msg.innerHTML = pinMsgHTML(v? pinCheck(v, el.dataset.except||null) : null, v);
});

/* ---------- استبدال حقول الرقم القديمة ---------- */
var _modalTeacherBase = modalTeacher;
modalTeacher = function(id){
  _modalTeacherBase(id);
  var t = id ? teacherById(id) : null;
  var u = t ? userOfTeacher(t.id) : null;
  var old = document.getElementById("t_pin");
  if(!old) return;
  var wrap = old.closest("label");
  if(!wrap) return;
  var cur = u ? u.pin : genPin();
  wrap.outerHTML = pinField("t_pin", cur, u? u.id : "") +
    '<div class="note">الرقم ده هو اللي المعلم هيدخل بيه — مفيش قايمة أسماء، بيكتب رقمه وبس.</div>';
};
var _saveTeacherBase = saveTeacher;
saveTeacher = function(){
  var id = MODAL.dataset.tid;
  var t = id ? teacherById(id) : null;
  var u = t ? userOfTeacher(t.id) : null;
  var p = toEnDigits(val("t_pin")).trim();
  var err = pinCheck(p, u ? u.id : null);
  if(err){ toast(err); return; }
  _saveTeacherBase();
};
var _modalUserBase = modalUser;
modalUser = function(id){
  _modalUserBase(id);
  var old = document.getElementById("u_p");
  if(!old) return;
  var wrap = old.closest("label");
  if(!wrap) return;
  var u = id ? byId(DB.users, id) : null;
  wrap.outerHTML = pinField("u_p", u ? u.pin : genPin(), id||"");
};
var _saveUserBase = saveUser;
saveUser = function(){
  var id = MODAL.dataset.uid;
  var p = toEnDigits(val("u_p")).trim();
  var err = pinCheck(p, id || null);
  if(err){ toast(err); return; }
  _saveUserBase();
};

/* بطاقة الأرقام جوه الإعدادات */
var _settingsPinBase = viewSettings;
viewSettings = function(){
  var h = _settingsPinBase();
  var marker = '<div class="card"><div class="hd"><h3>حسابات الدخول</h3>';
  return h.indexOf(marker)>=0 ? h.replace(marker, pinsCard()+marker) : pinsCard()+h;
};
