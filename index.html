/* ============================================================
   ترقيم الصفحات — بدل ما نرسم ٥٠٠ صف مرة واحدة
   الطباعة والتصدير بيشتغلوا على الكشف كامل مش الصفحة الحالية.
   ============================================================ */
var PAGE_SIZE = 50;
function pageOf(key){ return num((UI.page||{})[key], 1) || 1; }
function setPage(key, n){ if(!UI.page) UI.page = {}; UI.page[key] = Math.max(1, n); }
function pageSlice(list, key){
  var total = list.length;
  var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  var p = Math.min(pageOf(key), pages);
  setPage(key, p);
  return { rows: list.slice((p-1)*PAGE_SIZE, p*PAGE_SIZE),
           page:p, pages:pages, total:total, from:(p-1)*PAGE_SIZE+1,
           to: Math.min(p*PAGE_SIZE, total) };
}
/* شريط التنقل بين الصفحات */
function pageBar(pg, key){
  if(pg.total <= PAGE_SIZE) return "";
  var btn = function(n, lbl, dis){
    return '<button class="btn ghost sm" data-act="goPage" data-k="'+esc(key)+'" data-p="'+n+'"'+
      (dis?" disabled":"")+'>'+lbl+'</button>';
  };
  var nums = "";
  var start = Math.max(1, pg.page-2), end = Math.min(pg.pages, start+4);
  start = Math.max(1, end-4);
  for(var i=start;i<=end;i++){
    nums += '<button class="btn '+(i===pg.page?"":"ghost")+' sm" data-act="goPage" '+
      'data-k="'+esc(key)+'" data-p="'+i+'" style="min-width:34px">'+i+'</button>';
  }
  return '<div class="noprint" style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line-2)">'+
    '<span style="font-size:12.5px;color:var(--muted)">عرض '+pg.from+'–'+pg.to+' من '+pg.total+'</span>'+
    '<span style="flex:1"></span>'+
    btn(1,"«",pg.page===1)+btn(pg.page-1,"‹",pg.page===1)+nums+
    btn(pg.page+1,"›",pg.page===pg.pages)+btn(pg.pages,"»",pg.page===pg.pages)+
    '</div>';
}
/* ============================================================
   لوحة الإشراف اليومي — أي فصل ما رصدش غيابه بعد ٥ دقايق من بداية
   الحصة بيبقى أحمر: دليل إن المعلم مش في الفصل.
   ============================================================ */
var LATE_MIN = 5;
function supervisionGrid(date){
  date = date || today();
  var di = new Date(date).getDay();
  var P = periodsCount();
  var classes = myClasses().sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); });
  var isToday = (date===today());
  var nm = nowMin();
  return classes.map(function(c){
    var cells = [];
    for(var p=1;p<=P;p++){
      var w = periodWindow(p);
      var slot = schedCell(c.id, di, p);
      var done = periodDone(c.id, date, p);
      var st = "none";                       /* مفيش حصة */
      if(slot){
        if(done) st = "ok";
        else if(!isToday) st = "miss";       /* يوم فات وما اترصدش */
        else if(w && nm >= w.fromMin + LATE_MIN) st = "late";   /* أحمر */
        else if(w && nm >= w.fromMin) st = "now";
        else st = "wait";
      }
      cells.push({ p:p, slot:slot, done:done, st:st, w:w });
    }
    return { cls:c, cells:cells };
  });
}
function viewSupervision(){
  var date = (UI.sub && UI.sub.date) || today();
  var grid = supervisionGrid(date);
  var P = periodsCount();
  var late = 0, ok = 0, tot = 0;
  grid.forEach(function(r){ r.cells.forEach(function(x){
    if(x.st==="none") return; tot++;
    if(x.st==="ok") ok++; else if(x.st==="late"||x.st==="miss") late++;
  }); });

  var h = pageHd("الإشراف اليومي", fmtDate(date)+" — متابعة رصد الغياب لكل فصل وحصة",
    '<input type="date" id="supDate" value="'+esc(date)+'" class="mk" style="width:auto;min-width:140px">'+
    '<button class="btn ghost noprint" data-act="print" style="margin-right:6px">⎙ طباعة</button>');

  h += '<div class="stats" style="margin-bottom:12px">'+
    stat("حصص اليوم", tot, "في القسم الحالي", "acc")+
    stat("اترصدت", ok, "الغياب مسجّل", "acc-g")+
    stat("متأخرة", late, late?"المعلم غالبًا مش موجود":"تمام", late?"acc-r":"acc-g")+
    stat("الحصة دلوقتي", currentPeriod()||"—", "حسب التوقيت", "")+
    '</div>';

  h += '<div class="note">🟩 اترصد · 🟥 عدّى '+LATE_MIN+' دقايق من بداية الحصة والغياب لسه ما اترصدش '+
    '(دليل إن المعلم مش في الفصل) · ⬜ لسه بدري · ▪ مفيش حصة.</div>';

  h += '<div class="card"><div class="hd"><h3>الفصول × الحصص</h3></div>'+
    '<div class="bd flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>الفصل</th>';
  for(var p=1;p<=P;p++){
    var w = periodWindow(p);
    h += '<th style="text-align:center">'+p+'<br><small style="font-weight:400">'+(w?esc(w.from):"")+'</small></th>';
  }
  h += '</tr></thead><tbody>';
  if(!grid.length) h += '<tr><td colspan="'+(P+1)+'"><div class="empty"><b>مفيش فصول</b></div></td></tr>';
  grid.forEach(function(r){
    h += '<tr><td><b style="font-weight:600">'+esc(r.cls.name)+'</b></td>';
    r.cells.forEach(function(x){
      var bg = x.st==="ok" ? "#e6f4ea" : (x.st==="late"||x.st==="miss" ? "#fdeaea" :
               (x.st==="now" ? "#fdf6ec" : (x.st==="none" ? "transparent" : "#f6f7f6")));
      var col = x.st==="ok" ? "var(--ok)" : ((x.st==="late"||x.st==="miss") ? "var(--danger)" : "var(--muted)");
      var mark = x.st==="none" ? "▪" : (x.st==="ok" ? "✓" : ((x.st==="late"||x.st==="miss") ? "✕" : "…"));
      var tip = x.slot ? (subjName(x.slot.subjectId)+(x.slot.teacherId?" — "+teacherName(x.slot.teacherId):"")) : "";
      h += '<td style="text-align:center;background:'+bg+';color:'+col+';font-weight:700" title="'+esc(tip)+'">'+
        mark+(x.slot&&x.slot.teacherId&&(x.st==="late"||x.st==="miss")
          ? '<br><small style="font-weight:400;font-size:10px">'+esc(teacherName(x.slot.teacherId))+'</small>' : '')+
        '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div></div></div>';

  /* قائمة الحصص المتأخرة بالتفصيل */
  var lateList = [];
  grid.forEach(function(r){ r.cells.forEach(function(x){
    if(x.st==="late"||x.st==="miss") lateList.push({ cls:r.cls, x:x });
  }); });
  if(lateList.length){
    h += '<div class="card"><div class="hd"><h3>حصص لم يُرصد غيابها ('+lateList.length+')</h3></div><div class="bd flush">';
    lateList.slice(0,40).forEach(function(o){

        '<span class="ico" style="color:var(--danger)">'+icon("absence",20)+'</span>'+
        '<span class="tx"><b>'+esc(o.cls.name)+' — الحصة '+o.x.p+'</b>'+
        '<small>'+esc(subjName(o.x.slot.subjectId))+
        (o.x.slot.teacherId? ' · '+esc(teacherName(o.x.slot.teacherId)) : ' · بدون معلم')+
        (o.x.w? ' · من '+esc(o.x.w.from) : '')+'</small></span></div>';
    });
    h += '</div></div>';
  }
  return h;
}
/* ============================================================
   كشوف الغياب المجمّعة — لكل حصة، مقسّمة بالفصول
   ============================================================ */
function absentSheet(period, date){
  date = date || today();
  var di = new Date(date).getDay();
  var classes = myClasses().sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); });
  var rows = [], n = 0;
  classes.forEach(function(c){
    var rec = DB.attend[attKey(c.id, date)] || {};
    var slot = schedCell(c.id, di, period);
    var abs = studentsOf(c.id).filter(function(s){
      if(rec[s.id]!=="A") return false;
      var e = absEntry(c.id, date, s.id);
      /* اللي اترصد في الحصة دي أو قبلها (لأنه بيفضل غايب) */
      return !e || num(e.p, 1) <= period;
    }).sort(function(a,b){ return sortAr(a.name,b.name); });
    if(!abs.length) return;
    abs.forEach(function(s){ n++; rows.push({ n:n, cls:c, s:s, slot:slot }); });
  });
  return rows;
}

/* ============================================================
   تخصيص الجداول — عناوين الأعمدة، إظهارها، ترتيبها، والطباعة
   بيتحفظ لكل جدول باسمه، وبيتزامن مع باقي الأجهزة.
   ============================================================ */
function tblInit(){ if(!DB.tables || typeof DB.tables!=="object") DB.tables = {}; return DB.tables; }
function tblCfg(id){
  tblInit();
  if(!DB.tables[id]) DB.tables[id] = { hide:{}, label:{}, order:[], dense:false };
  var c = DB.tables[id];
  if(!c.hide)  c.hide = {};
  if(!c.label) c.label = {};
  if(!Array.isArray(c.order)) c.order = [];
  return c;
}
/* اسم العمود بعد التعديل */
function colName(id, def){
  var c = tblCfg(id);
  return c.label[def.k] || def.label;
}
function colHidden(id, def){
  if(def.core) return false;                 /* أعمدة أساسية مبتتخفيش */
  return !!tblCfg(id).hide[def.k];
}
/* الأعمدة بترتيبها وبعد إخفاء المخفي */
function tblColumns(id, defs){
  var c = tblCfg(id);
  var byKey = {};
  defs.forEach(function(d){ byKey[d.k] = d; });
  var out = [];
  c.order.forEach(function(k){ if(byKey[k]){ out.push(byKey[k]); byKey[k] = null; } });
  defs.forEach(function(d){ if(byKey[d.k]) out.push(d); });
  return out.filter(function(d){ return !colHidden(id, d); });
}
/* بيقرا الاختيارات من النافذة قبل ما تتعاد رسمتها */
function tcKeep(id){
  var c = tblCfg(id);
  Array.prototype.slice.call(document.querySelectorAll(".tcShow")).forEach(function(b){
    if(b.disabled) return;
    if(b.checked) delete c.hide[b.dataset.k];
    else c.hide[b.dataset.k] = 1;
  });
  Array.prototype.slice.call(document.querySelectorAll(".tcName")).forEach(function(inp){
    var def = (UI.tcDefs||[]).filter(function(d){ return d.k===inp.dataset.k; })[0];
    var v = String(inp.value||"").trim();
    if(!v || (def && v===def.label)) delete c.label[inp.dataset.k];
    else c.label[inp.dataset.k] = v;
  });
}

      stat("المجموع التراكمي", cum.total, "من "+cum.target+" درجة", "acc")+

  var h = '<div class="card"><div class="hd"><h3>'+esc(title)+'</h3>'+
    '<span class="tag info">المجموع الكلي '+totalMax+'</span>'+

    (can?'<button class="btn ghost sm" data-act="curSubNew" data-k="'+esc(key)+'">+ مادة</button>'+
      '<button class="btn ghost sm" data-act="curReset" data-k="'+esc(key)+'" style="margin-right:5px">⟳ الخطة الرسمية</button>':'')+
    '</div><div class="bd flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>م</th><th>المادة</th><th>حصص أسبوعية</th><th>النهاية العظمى</th><th>المجموع</th><th>نسبة النجاح</th><th>النوع</th>'+
    (can?'<th class="noprint">ترتيب</th><th class="noprint"></th>':'')+

    h += '<tr><td colspan="'+(can?9:7)+'"><div class="empty"><b>مفيش مواد في الخطة دي</b>'+
      '<p>ضيف المواد يدويًا أو اضغط «الخطة الرسمية» عشان يجيب مواد الوزارة.</p></div></td></tr>';
  }
  subs.forEach(function(s,i){
    h += '<tr>'+
      '<td class="rownum">'+(i+1)+'</td>'+
      '<td><b style="font-weight:600">'+esc(s.name)+'</b></td>'+
      '<td class="num"><b>'+num(s.periods,4)+'</b></td>'+
      '<td class="num">'+num(s.max,100)+'</td>'+
      '<td>'+(s.counted?'<span class="tag ok">داخل المجموع</span>':'<span class="tag">خارج المجموع</span>')+'</td>'+
      '<td class="num">'+num(s.pass,50)+'%</td>'+
      '<td>'+(s.elective?'<span class="tag gold">مادة تخصص — يختار واحدة</span>':'<small style="color:var(--muted)">أساسية</small>')+'</td>'+
      (can?'<td class="noprint" style="white-space:nowrap">'+
        '<button class="btn ghost sm" data-act="curSubUp" data-k="'+esc(key)+'" data-i="'+i+'"'+(i===0?' disabled':'')+'>▲</button>'+

        '<button class="btn ghost sm" data-act="curSubDel" data-k="'+esc(key)+'" data-i="'+i+'" style="color:var(--danger);margin-right:4px">حذف</button></td>':'')+

function classAttendRate(cid){
  var tot=0, pres=0;
  for(var k in DB.attend){
    if(k.indexOf(cid+"|")!==0) continue;
    var r = DB.attend[k];
    for(var s in r){ tot++; if(r[s]!=="A") pres++; }
  }
  return tot? Math.round(pres/tot*1000)/10 : 100;
}

function homeFormSources(){
  formsInit();
  var out = [{ id:"track", title:"استمارة تحديد المسار", count:(DB.wishes||[]).length }];
  (DB.forms||[]).forEach(function(f){
    out.push({ id:f.id, title:f.title, count:formSubsOf(f.id).length });
  });
  return out.filter(function(o){ return o.count>0; });
}
/* بيرجّع صفوف موحّدة {name, natId, level, phone} من أي مصدر */
function homeSourceRows(sid){
  if(sid==="track"){
    wishesInit();
    return (DB.wishes||[]).map(function(w){
      return { name:w.name, natId:w.natId, level:2, edu:wishEdu(w), tag:eduName(wishEdu(w))+" · "+wishTrackName(w.track) };
    });
  }
  var f = formById(sid); if(!f) return [];
  return formSubsOf(sid).map(function(sub){
    var vals = sub.vals||{};
    var lvl = 0, phone = "";
    (f.fields||[]).forEach(function(fd){
      var v = vals[fd.id];
      if(!v) return;
      var lb = normAr(fd.label||"");
      if(!lvl && /صف|مستوى|سنه|سنة/.test(lb)) lvl = parseLevel(v)||0;
      if(!phone && /هاتف|تليفون|موبايل|رقم ولي/.test(lb)) phone = toEnDigits(String(v)).replace(/[^\d+]/g,"");
    });
    return { name:sub.name, natId:sub.natId, level:lvl, phone:phone, tag:fmtDate(sub.date) };
  });
}

function studentLevelOf(s){
  if(!s) return null;
  if(s.level>=1 && s.level<=3) return Number(s.level);
  var c = classById(s.classId);
  if(c && Number(c.level)) return Number(c.level);
  if(s.homeLevel>=1 && s.homeLevel<=3) return Number(s.homeLevel);
  if(s.bacTrack || s.fromWish) return 2;
  return null;
}
function setStudentLevel(s, lvl){
  lvl = num(lvl,0);
  if(lvl>=1 && lvl<=3){ s.level = lvl; if(isHomeStudent(s)) s.homeLevel = lvl; }
  return s;
}
/* لو الطالب اتسكّن على فصل، صفه بيتساوى مع صف الفصل تلقائيًا */
function assignStudentToClass(s, cid){
  var c = classById(cid);
  s.classId = c ? c.id : "";
  if(c && Number(c.level)) setStudentLevel(s, Number(c.level));
  return s;
}
function transferCandidates(cls){
  var L = Number(cls.level);
  return DB.students.filter(function(s){
    if(s.status==="left") return false;
    if(isHomeStudent(s)) return false;        /* المنازل مالهمش فصول */
    if(s.classId===cls.id) return false;      /* موجود بالفعل في نفس الفصل */
    var sl = studentLevelOf(s);
    return sl===null || sl===L;
  }).sort(function(a,b){ return sortAr(a.name,b.name); });
}

      (isDep?'<button class="btn" data-act="addTeacher">+ إضافة أول معلم</button>'+impBtn("teachers",{},"استيراد من إكسيل"):'')+'</div></div></div>';

  /* فلاتر المعلمين — نفس أسلوب الطلاب.
     الإداريون (مدير/وكيل) بيظهروا هنا بصفتهم، بس مش داخلين التوزيع. */
  var f = UI.filters;
  var pool = DB.teachers.filter(function(t){ return t.status!=="left"; });
  var subjCount = {};
  pool.forEach(function(t){ var k=(t.subject||"").trim(); if(k) subjCount[k]=(subjCount[k]||0)+1; });
  var list = pool.filter(function(t){
    if(f.tsub && String(t.subject||"").trim()!==f.tsub) return false;
    if(f.tq){

/* هل المعلم بيدرّس المادة دي؟ مقارنة مرنة بالاسم (تتجاهل «ال» والكلمات القصيرة) */
function normSubjWords(x){
  return normAr(x||"").split(/\s+/)
    .map(function(w){ return w.replace(/^ال/,""); })
    .filter(function(w){ return w.length>2; });
}
/* الحد الأدنى اللي يعتبر «المادة دي تخصصه» */
var SUBJ_MATCH_MIN = 1;
/* كلمات عامة مش بتحدّد تخصص لوحدها — «لغة» مش معناها إنجليزي وفرنساوي نفس الشيء */
var GENERIC_SUBJ_WORDS = ["لغه","ماده","مواد","علم","علوم","تربيه","دراسات","مستوي","متقدم","اساسي","عام","اولي","ثانيه","ثالثه"];
/* جدول تصنيف المواد — كل تصنيف واسمه ونمط التعرّف عليه */
var SUBJ_CANON = [
  ["en",   "لغة أجنبية أولى (إنجليزي)", /انجليزي|انجليزيه|english|اجنبيه الاولي|لغه اولي/],
  ["l2",   "لغة أجنبية ثانية",          /فرنسي|فرنسيه|الماني|المانيه|ايطالي|اسباني|صيني|ياباني|اجنبيه الثانيه|لغه ثانيه/],
  ["ar",   "لغة عربية",                 /عربي|عربيه/],
  ["rel",  "تربية دينية",               /دين|دينيه|اسلاميه|مسيحيه/],
  ["nat",  "تربية وطنية",               /وطنيه|وطني/],
  ["pe",   "تربية رياضية",              /تربيه رياضيه|رياضيه بدنيه|بدنيه/],
  ["mus",  "تربية موسيقية",             /موسيقيه|موسيقي/],
  ["art",  "تربية فنية",                /فنيه|رسم/],
  ["math", "رياضيات",                   /رياضيات|جبر|هندسه بحته|تفاضل/],
  ["phys", "فيزياء",                    /فيزياء/],
  ["chem", "كيمياء",                    /كيمياء/],
  ["bio",  "أحياء",                     /احياء|بيولوج/],
  ["sci",  "علوم",                      /علوم/],
  ["hist", "تاريخ",                     /تاريخ/],
  ["geo",  "جغرافيا",                   /جغرافيا/],
  ["phil", "فلسفة ومنطق",               /فلسفه|منطق/],
  ["psy",  "علم نفس واجتماع",           /علم نفس|اجتماع|نفسي/],
  ["cs",   "حاسب وبرمجة",               /برمجه|حاسب|كمبيوتر|ذكاء اصطناعي|تكنولوجيا|معلومات/],
  ["home", "اقتصاد منزلي",              /منزلي/],
  ["econ", "اقتصاد",                    /اقتصاد/],
  ["stat", "إحصاء",                     /احصاء/],
  ["acc",  "محاسبة",                    /محاسبه/],
  ["biz",  "إدارة أعمال",               /اداره اعمال|اداره|تجاره|تجــاره/],
  ["agri", "زراعة",                     /زراع/],
  ["media","صحافة وإعلام",              /صحافه|اعلام/],
  ["lib",  "مكتبات",                    /مكتبه/]
];
function canonName(code){
  for(var i=0;i<SUBJ_CANON.length;i++) if(SUBJ_CANON[i][0]===code) return SUBJ_CANON[i][1];
  return code;
}
/* تصنيف واحد لاسم مادة (المواد اسمها بيدل على تخصص واحد) */
function canonSubject(x){
  var set = canonSet(x);
  return set.length ? set[0] : "";
}
/* كل التصنيفات في نص واحد — تخصص المعلم ممكن يجمع أكتر من مادة
   زي «لغة عربية ودين» = عربي + تربية دينية */
/* تصنيفات بتلغي بعضها: «اقتصاد منزلي» مش «اقتصاد» */
var CANON_EXCLUDE = { home:["econ"], pe:["math"], psy:["sci"] };
function canonSet(x){
  var n = normAr(x||""), out = [];
  if(!n) return out;
  SUBJ_CANON.forEach(function(row){
    if(row[2].test(n) && out.indexOf(row[0])<0) out.push(row[0]);
  });
  out.slice().forEach(function(c){
    (CANON_EXCLUDE[c]||[]).forEach(function(drop){
      var i = out.indexOf(drop);
      if(i>=0) out.splice(i,1);
    });
  });
  return out;
}
/* المواد اللي المعلم يقدر يدرّسها = المستخرجة من تخصصه + اللي الوكيل ضافها له */
function teacherCanons(t){
  if(!t) return [];
  var out = canonSet(t.subject);
  (t.alsoTeach||[]).forEach(function(c){ if(out.indexOf(c)<0) out.push(c); });
  return out;
}
function normSubjWords(x){
  return normAr(x||"").split(/\s+/)
    .map(function(w){ return w.replace(/^ال/,""); })
    .filter(function(w){ return w.length>2 && GENERIC_SUBJ_WORDS.indexOf(w)<0; });
}
/* هل المعلم بيدرّس المادة دي؟ */
function teacherFitsSubject(t, subName){
  var ts = normAr(t && t.subject || ""), sn = normAr(subName||"");
  if(!sn) return 0;
  var cs = canonSubject(sn);
  var set = teacherCanons(t);
  /* التصنيف هو الحكم: لو المادة معروفة والمعلم عنده تصنيفات — لازم تكون فيهم */
  if(cs && set.length) return set.indexOf(cs)>=0 ? 4 : 0;
  if(!ts) return 0;
  if(ts===sn) return 4;
  if(ts.indexOf(sn)>=0 || sn.indexOf(ts)>=0) return 3;
  var a = normSubjWords(ts), b = normSubjWords(sn);
  var hits = 0;
  a.forEach(function(w){ if(b.indexOf(w)>=0) hits++; });
  return hits ? (hits>1 ? 2 : 1) : 0;
}

function viewAbsence(){
  var rows = [];

    var st = attendStats(s.id, s.classId);
    if(st.days===0 && st.abs===0) { rows.push({s:s, st:st, a:absState(0)}); return; }
    rows.push({s:s, st:st, a:absState(st.abs)});
  });
  rows.sort(function(x,y){ return y.st.abs - x.st.abs || sortAr(x.s.name,y.s.name); });
  var only = UI.filters.absOnly;
  var shown = only ? rows.filter(function(r){ return r.a.lvl>0; }) : rows;

  var c1 = rows.filter(function(r){ return r.a.lvl===1; }).length;
  var c2 = rows.filter(function(r){ return r.a.lvl===2; }).length;
  var c3 = rows.filter(function(r){ return r.a.lvl===3; }).length;

  var gAb = gate("classes","students");

    stat("إنذار أول", c1, "طالب", c1?"acc-g":"")+
    stat("إنذار ثانٍ", c2, "طالب", c2?"acc-b":"")+
    stat("خطر الحرمان", c3, "طالب", c3?"acc-b":"")+
    stat("نسبة حضور المدرسة", schoolAttendRate()+"%", "من بداية العام","acc")+

  h += '<div class="chips noprint">'+
    '<button class="'+(only?"":"on")+'" data-act="absAll">كل الطلاب</button>'+
    '<button class="'+(only?"on":"")+'" data-act="absWarn">اللي عليهم إنذارات فقط</button></div>';
  h += printHd("كشف متابعة الغياب والإنذارات");

    '<table class="tbl"><thead><tr><th>م</th><th>الاسم</th><th>الفصل</th><th>أيام مرصودة</th><th>غياب</th><th>بعذر</th><th>تأخير</th><th>نسبة الحضور</th><th>الحالة</th></tr></thead><tbody>';
  if(!shown.length) h += '<tr><td colspan="9"><div class="empty"><b>'+(only?"مفيش طالب عليه إنذار":"مفيش بيانات غياب")+'</b><p>'+(only?"الحمد لله، كل الطلاب تحت حد الإنذار.":"المعلمون بيسجّلوا الغياب من شاشة فصولهم.")+'</p></div></td></tr>';
  shown.forEach(function(r,i){
    h += '<tr data-act="openStudent" data-id="'+r.s.id+'" style="cursor:pointer"><td class="rownum">'+(i+1)+'</td>'+
      '<td><b style="font-weight:600">'+esc(r.s.name)+'</b></td><td>'+esc(className(r.s.classId))+'</td>'+
      '<td class="num">'+r.st.days+'</td><td class="num"><b>'+r.st.abs+'</b></td><td class="num">'+r.st.exc+'</td>'+
      '<td class="num">'+r.st.late+'</td><td class="num">'+r.st.rate+'%</td>'+
      '<td><span class="tag '+r.a.c+'">'+r.a.t+'</span></td></tr>';

function schoolAttendRate(){
  var tot=0, pres=0;
  for(var k in DB.attend){ var r=DB.attend[k]; for(var s in r){ tot++; if(r[s]!=="A") pres++; } }
  return tot? Math.round(pres/tot*1000)/10 : 100;
}

function viewDash(){

  });
  var h = pageHd("لوحة المدير", DB.meta.school+" — "+DB.meta.year+" — الفصل الدراسي "+(DB.meta.term===1?"الأول":"الثاني"));

    stat("إنذارات غياب", warn, "طالب", warn?"acc-g":"")+
    stat("خطر الحرمان", danger, "طالب", danger?"acc-b":"")+
  '</div>';

  /* توزيع الطلاب على الأنظمة */

  studs.forEach(function(s){ var c=classById(s.classId); if(!c) return; if(c.system==="bac") bac++; else gen++; });
  h += '<div class="card"><div class="hd"><h3>توزيع الطلاب على الأنظمة</h3></div><div class="bd">'+
    bar("الثانوية العامة", gen, studs.length, "var(--ink-2)")+
    bar("البكالوريا المصرية", bac, studs.length, "var(--seal)")+
    '</div></div>';

  /* أداء الفصول */
  var rows = myClasses().map(function(c){
    return {c:c, n:studsCount(c.id), rate:classAttendRate(c.id), avg:classAvg(c.id)};
  }).sort(function(a,b){ return b.rate-a.rate; });
  h += '<div class="card"><div class="hd"><h3>مؤشرات الفصول</h3>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة</button></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الفصل</th><th>الصف</th><th>النظام</th><th>الطلاب</th><th>نسبة الحضور</th><th>متوسط الدرجات</th></tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="6"><div class="empty"><b>مفيش فصول</b></div></td></tr>';
  rows.forEach(function(r){
    h += '<tr><td><b style="font-weight:600">'+esc(r.c.name)+'</b></td><td><small>'+esc(levelName(r.c.level))+'</small></td>'+
      '<td><small>'+esc(systemName(r.c.system))+'</small></td><td class="num">'+r.n+'</td>'+
      '<td class="num">'+r.rate+'%</td><td class="num">'+(r.avg===null?"—":r.avg+"%")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}
function studsCount(cid){ return studentsOf(cid).length; }
function classAvg(cid){
  var subs = DB.subjects.filter(function(s){ return s.classId===cid && s.counted; });
  var studs = studentsOf(cid), sum=0, n=0;
  studs.forEach(function(st){
    subs.forEach(function(su){
      var t = termTotal(st.id, su.id, DB.meta.term);
      if(t){ sum += t.got/(t.of||100)*100; n++; }
    });
  });
  return n? Math.round(sum/n*10)/10 : null;
}
function bar(label, v, total, color){
  var p = total? Math.round(v/total*100) : 0;
  return '<div style="margin-bottom:11px"><div style="display:flex;font-size:12.5px;margin-bottom:4px">'+
    '<span style="flex:1;font-weight:600">'+esc(label)+'</span><span style="color:var(--muted)">'+v+' طالب · '+p+'%</span></div>'+
    '<div style="height:9px;background:var(--line-2);border-radius:99px;overflow:hidden">'+
    '<div style="height:100%;width:'+p+'%;background:'+color+';border-radius:99px"></div></div></div>';
}

function tabMarksBac(a, c, su){
  var studs = studentsOf(c.id), b = DB.bac;

  h += '<div class="card"><div class="hd"><h3>رصد '+esc(su.name)+'</h3>'+

    h += '<tr><td class="rownum">'+(i+1)+'</td><td style="min-width:130px"><b style="font-weight:600">'+esc(s.name)+'</b></td>'+

function tabClassReport(a, c, su){
  var studs = studentsOf(c.id);
  var rows = studs.map(function(s){
    var t = termTotal(s.id, su.id, DB.meta.term);
    var st = attendStats(s.id, c.id);
    return {s:s, t:t, p: t? t.got/(t.of||100)*100 : null, st:st};
  }).sort(function(x,y){ return (y.p===null?-1:y.p) - (x.p===null?-1:x.p); });
  var withP = rows.filter(function(r){ return r.p!==null; });
  var avg = withP.length ? Math.round(withP.reduce(function(a,r){return a+r.p;},0)/withP.length*10)/10 : null;
  var weak = withP.filter(function(r){ return r.p<50; });

  var h = printHd("كشف درجات "+c.name+" — "+su.name);
  if(isBacCert(c)) h += '<div class="note noprint">الترتيب محسوب على درجة امتحان نهاية العام — هي الدرجة الوحيدة الداخلة لمجموع البكالوريا.</div>';
  h += '<div class="stats" style="margin-bottom:11px">'+
    stat("متوسط الفصل", avg===null?"—":avg+"%", "في "+su.name, "acc")+
    stat("عدد المرصود لهم", withP.length, "من "+studs.length,"")+
    stat("أقل من ٥٠٪", weak.length, "طالب", weak.length?"acc-b":"")+
    stat("نسبة حضور الفصل", classAttendRate(c.id)+"%","","acc-g")+'</div>';
  h += '<div class="card"><div class="hd"><h3>الترتيب حسب الدرجة</h3>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ طباعة</button></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الترتيب</th><th>الاسم</th><th>المجموع</th><th>النسبة</th><th>التقدير</th><th>الغياب</th></tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="6"><div class="empty"><b>الفصل فاضي</b></div></td></tr>';
  rows.forEach(function(r,i){
    var g = r.p===null? null : gradeLabel(r.p);
    h += '<tr><td class="rownum">'+(i+1)+'</td><td><b style="font-weight:600">'+esc(r.s.name)+'</b></td>'+
      '<td class="num">'+(r.t? r.t.final+" / "+r.t.max : "—")+'</td>'+
      '<td class="num">'+(r.p===null?"—":Math.round(r.p*10)/10+"%")+'</td>'+

      '<td class="num">'+r.st.abs+'</td></tr>';

  return h;

/* ============================================================
   بوابة ولي الأمر — معلومات اليوم + متابعة شاملة + رسائل
   ============================================================ */
function todayInfo(st){
  var date = today();
  var c = classById(st.classId);
  var out = { present:null, mark:"", lessons:[], msgs:[] };
  if(c){
    var rec = DB.attend[c.id+"|"+date];
    if(rec && rec[st.id]!==undefined){
      var v = rec[st.id];
      out.mark = v;
      out.present = (v!=="A");
    }
    /* حصص النهاردة وموضوعاتها */
    var di = new Date(date).getDay();
    lessonInit();
    DB.schedule.filter(function(x){ return x.classId===c.id && x.day===di; })
      .sort(function(a,b){ return a.period-b.period; })
      .forEach(function(x){
        var su = subjById(x.subjectId);
        if(!su) return;
        var L = DB.lessons[lessonKey(c.id, su.id, date)] || {};
        out.lessons.push({ p:x.period, su:su, t:x.teacherId?teacherName(x.teacherId):"",
                           topic:L.topic||"", hw:L.hw||"" });
      });
  }
  out.msgs = msgsOf(st.id,"out").filter(function(m){ return m.day===date; });
  return out;
}
function viewParent(){
  var sid = UI.user.studentId;
  var st = sid ? studentById(sid) : null;
  if(!st) return pageHd("ملف الطالب","")+
    '<div class="card"><div class="bd"><div class="empty"><b>مفيش طالب مربوط بالحساب</b></div></div></div>';
  var tab = UI.pvTab || "today";
  var c = classById(st.classId);
  var h = pageHd(st.name, (c?c.name+" · ":"")+(studentLevelOf(st)?levelName(studentLevelOf(st)):"")+
      (st.natId?" · "+st.natId:""),
    '<button class="btn ghost noprint" data-act="print">⎙ طباعة</button>');

  h += '<div class="chips noprint">'+
    '<button class="'+(tab==="today"?"on":"")+'" data-act="pvTab" data-t="today">معلومات اليوم</button>'+
    '<button class="'+(tab==="all"?"on":"")+'" data-act="pvTab" data-t="all">متابعة شاملة</button>'+
    '<button class="'+(tab==="msg"?"on":"")+'" data-act="pvTab" data-t="msg">الرسائل والأسئلة</button>'+

/* ---------- معلومات اليوم ---------- */
function parentToday(st){
  var i = todayInfo(st);
  var ds = dayStatus(today());
  var h = '';
  if(ds && ds.off){
    return '<div class="note warn"><b>'+esc(ds.why||"إجازة")+'</b> — مفيش دراسة النهاردة.</div>';
  }
  /* الحضور */
  var box = i.present===null
    ? '<div class="note">لسه الغياب مترصدش النهاردة.</div>'
    : (i.present
      ? '<div class="note ok"><b>ابنك حاضر النهاردة ✓</b>'+(i.mark==="L"?' — بس اتأخر عن الطابور':'')+'</div>'
      : '<div class="note bad"><b>ابنك غايب النهاردة</b> — لو فيه عذر كلّم المدرسة.</div>');
  h += box;

  /* رسائل النهاردة */
  if(i.msgs.length){
    h += '<div class="card"><div class="hd"><h3>رسائل النهاردة من المدرسة</h3></div><div class="bd flush">';
    i.msgs.forEach(function(m){
      h += '<div class="list-item"><span class="tx">'+
        '<b><span class="tag '+(MSG_KIND[m.kind]||{}).cls+'">'+esc((MSG_KIND[m.kind]||{name:""}).name)+'</span> '+
        esc(m.from)+'</b><small>'+esc(m.text)+'</small></span></div>';
    });
    h += '</div></div>';
  }

  /* حصص اليوم */
  h += '<div class="card"><div class="hd"><h3>حصص اليوم ('+i.lessons.length+')</h3></div><div class="bd flush">';
  if(!i.lessons.length) h += '<div class="empty"><b>مفيش حصص مسجّلة النهاردة</b></div>';
  i.lessons.forEach(function(L){
    h += '<div class="list-item"><span class="tag">'+L.p+'</span>'+
      '<span class="tx"><b>'+esc(L.su.name)+(L.t?' — '+esc(L.t):'')+'</b>'+
      '<small>'+(L.topic? esc(L.topic) : 'لسه مسجّلش الدرس')+
      (L.hw? ' · <b>واجب:</b> '+esc(L.hw) : '')+'</small></span></div>';
  });
  h += '</div></div>';
  return h;
}
/* ---------- المتابعة الشاملة ---------- */
function parentAll(st){
  var c = classById(st.classId);
  var att = attendStats(st.id, st.classId);
  var e = eligibilityOf(st.id, st.classId);
  var need = num(DB.bac.passPct,50);
  var beh = DB.behavior.filter(function(b){ return b.studentId===st.id; })
    .sort(function(a,b){ return (a.date<b.date)?1:-1; });
  var h = '';

  if(e.verdict==="bad"){
    h += '<div class="note bad"><b>تنبيه مهم:</b> فيه '+e.bad+' مادة نسبة ابنك فيها أقل من '+need+'٪ '+
      '— يعني <b>مش هيُسمح له بدخول امتحان نهاية العام</b> فيها. راجع المدرسة فورًا.</div>';
  }else if(e.verdict==="risk"){
    h += '<div class="note warn"><b>انتبه:</b> فيه مواد ابنك قريب فيها من الحد الأدنى ('+need+'٪).</div>';
  }
  if(att.abs >= num(DB.absRules.warn1,5)){
    h += '<div class="note warn"><b>الغياب وصل '+att.abs+' يوم.</b> '+
      'الغياب المتكرر بيأثر على درجة المواظبة وعلى حق دخول الامتحان.</div>';
  }

  h += '<div class="stats" style="margin-bottom:12px">'+
    stat("نسبة الحضور", att.days? att.rate+"٪" : "—", att.days+" يوم مرصود", att.rate<75?"acc-r":"acc-g")+
    stat("أيام الغياب", att.abs, "بدون عذر", att.abs?"acc-r":"")+
    stat("غياب بعذر", att.exc, "مقبول", "")+
    stat("تأخير", att.late, "عن الطابور", att.late?"":"")+
    '</div>';

  h += '<div class="stats" style="margin-bottom:12px">'+
    stat("مواد فوق الحد", e.ok, "من "+e.total, "acc-g")+
    stat("مواد تحت الحد", e.bad, e.bad?"خطر حرمان":"تمام", e.bad?"acc-r":"")+
    stat("ملاحظات السلوك", beh.length, beh.length?"محتاجة متابعة":"مفيش", beh.length?"acc-r":"acc-g")+
    stat("رسائل المدرسة", msgsOf(st.id,"out").length, "إجمالي", "")+
    '</div>';

  /* المواد */
  h += '<div class="card"><div class="hd"><h3>الموقف في كل مادة</h3></div>'+
    '<div class="bd flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>المادة</th><th>النسبة</th><th>الحالة</th></tr></thead><tbody>';
  if(!e.rows.length) h += '<tr><td colspan="3"><div class="empty"><b>مفيش مواد</b></div></td></tr>';
  e.rows.forEach(function(r){
    var lbl = r.state==="ok" ? '<span class="tag ok">مؤهل</span>'
            : r.state==="risk" ? '<span class="tag warn">على الحافة</span>'
            : r.state==="bad" ? '<span class="tag bad">تحت الحد</span>'
            : '<span class="tag">لم يُرصد</span>';
    h += '<tr><td><b style="font-weight:600">'+esc(r.su.name)+'</b></td>'+
      '<td class="num">'+(r.pct===null?"—":r.pct+"٪")+'</td><td>'+lbl+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  /* السلوك */
  h += '<div class="card"><div class="hd"><h3>ملاحظات السلوك ('+beh.length+')</h3></div><div class="bd flush">';
  if(!beh.length) h += '<div class="empty"><b>مفيش ملاحظات</b><p>سلوك ابنك مفيهوش أي ملاحظات مسجّلة.</p></div>';
  beh.slice(0,15).forEach(function(b){
    h += '<div class="list-item"><span class="tx"><b>'+esc(fmtDate(b.date||""))+'</b>'+
      '<small>'+esc(b.note||b.text||"—")+'</small></span></div>';
  });
  h += '</div></div>';

  /* آخر الدروس والواجبات */
  lessonInit();
  var recent = [];
  if(c){
    for(var k in DB.lessons){
      var parts = k.split("|");
      if(parts[0]!==c.id) continue;
      var L = DB.lessons[k];
      if(!L.topic && !L.hw) continue;
      recent.push({ date:parts[2], su:subjById(parts[1]), L:L });
    }
  }
  recent.sort(function(a,b){ return a.date<b.date?1:-1; });
  h += '<div class="card"><div class="hd"><h3>آخر الدروس والواجبات</h3></div><div class="bd flush">';
  if(!recent.length) h += '<div class="empty"><b>مفيش دروس مسجّلة لسه</b></div>';
  recent.slice(0,12).forEach(function(r){
    h += '<div class="list-item"><span class="tx">'+
      '<b>'+esc(r.su?r.su.name:"—")+' — '+esc(fmtDate(r.date))+'</b>'+
      '<small>'+esc(r.L.topic||"—")+(r.L.hw?' · واجب: '+esc(r.L.hw):'')+'</small></span></div>';
  });
  h += '</div></div>';

  h += '<div class="note noprint">البيانات دي للاطلاع فقط. لأي استفسار استخدم تبويب «الرسائل والأسئلة».</div>';
  return h;
}

function viewMyAttend(){
  var s = myStudent();
  if(!s) return '<div class="card"><div class="bd"><div class="empty"><b>الحساب مش مربوط بطالب</b></div></div></div>';
  var st = attendStats(s.id, s.classId), a = absState(st.abs);
  var h = pageHd("حضوري", esc(s.name)+" — "+esc(className(s.classId)));
  h += '<div class="stats" style="margin-bottom:12px">'+
    stat("أيام مرصودة", st.days, "يوم","acc")+stat("غياب بدون عذر", st.abs, a.t, a.lvl?"acc-b":"")+
    stat("غياب بعذر", st.exc, "يوم","")+stat("نسبة الحضور", st.rate+"%","","acc-g")+'</div>';
  if(a.lvl>0) h += '<div class="note '+(a.lvl>=2?"bad":"warn")+'"><b>'+a.t+'</b> — الغياب وصل '+st.abs+' يوم. حد الحرمان '+DB.absRules.danger+' يوم.</div>';
  var days = [];
  for(var k in DB.attend){
    if(k.indexOf(s.classId+"|")!==0) continue;
    var v = DB.attend[k][s.id];

    days.push({d:k.split("|")[1], v:v});

  days.sort(function(x,y){ return y.d<x.d?-1:1; });
  h += '<div class="card"><div class="hd"><h3>سجل الأيام</h3></div><div class="bd flush">';
  if(!days.length) h += '<div class="empty"><b>مفيش أيام مرصودة</b></div>';

  h += '</div></div>';

/* معاينة حية: تاريخ الميلاد + النوع + المحافظة + ولي الأمر */
function updateStudentDerived(){
  var box = document.getElementById("s_derived");
  if(!box) return;
  var nat = val("s_nat").trim();
  var info = parseNationalId(nat);
  var g = guardianFromName(val("s_name"));
  var parts = [];
  if(info){
    parts.push("تاريخ الميلاد: "+fmtDate(info.birth));
    parts.push("النوع: "+info.gender);
    parts.push("محافظة الميلاد: "+info.govName);
  }
  if(g) parts.push("ولي الأمر: "+g);
  if(nat && !info){
    box.className = "note warn";
    box.innerHTML = "الرقم القومي لسه مش ١٤ رقم صحيحة — لما يكتمل هحسب منه الميلاد والنوع والمحافظة.";
    return;
  }
  if(!parts.length){
    box.className = "note";
    box.innerHTML = "اكتب الرقم القومي والاسم، وتاريخ الميلاد والنوع والمحافظة وولي الأمر هيتحسبوا لوحدهم.";
    return;
  }
  box.className = "note";
  box.innerHTML = "<b>هيتحفظ تلقائيًا:</b><br>"+parts.map(esc).join(" · ");
}

function saveStudent(){
  var id = MODAL.dataset.sid;
  var name = val("s_name").trim();
  if(!name){ toast("اكتب اسم الطالب"); return; }
  var s = id? studentById(id) : null;
  if(!s){ s = {id:uid("s"), status:"active"}; DB.students.push(s); }
  s.name = name;
  var pickedCls = val("s_cls");
  if(pickedCls) assignStudentToClass(s, pickedCls);   /* التسكين بيساوي الصف مع صف الفصل */
  else s.classId = "";
  setStudentLevel(s, num(val("s_lvl"),0) || studentLevelOf(s) || 1);
  s.natId = toEnDigits(val("s_nat")).replace(/\D/g,"");
  s.guardian = val("s_g").trim();
  s.phone = val("s_ph").trim();
  s.religion = val("s_rel");
  s.prevClass = val("s_prev").trim();
  s.edu = val("s_edu") || "reg";
  s.sector = eduType(s.edu).sector;
  s.bacTrack = val("s_trk");
  s.bacSubject = s.bacTrack ? val("s_sub") : "";
  s.actId = val("s_act");
  s.vocId = val("s_voc");
  if(s.edu==="home"){ s.classId = ""; }
  s.joined = val("s_j");
  s.notes = val("s_notes").trim();
  xfCollect(s);
  var bp = val("s_bp").trim();
  if(bp==="") delete s.bacPrev; else s.bacPrev = num(bp,0);
  enrichStudent(s);   /* تاريخ الميلاد + النوع + المحافظة + ولي الأمر تلقائيًا */
  save(); closeModal(); render(); toast("اتحفظ");
}

function doImport(){
  var cid = val("i_cls");
  var txt = val("i_txt");
  var lines = txt.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(!lines.length){ toast("مفيش أسماء"); return; }
  var n=0;
  lines.forEach(function(L){
    var parts = L.split(/[,،\t]/);
    var name = (parts[0]||"").trim();
    if(!name) return;
    var seat = (parts[1]||"").trim();
    DB.students.push(stampSrc({id:uid("s"), name:name, classId:cid, seat:seat, status:"active", joined:today()}, "quick"));
    n++;
  });
  save(); closeModal(); render(); toast("اتضاف "+n+" طالب");
}

/* ---------- نافذة المعلم ---------- */
/* ============================================================
   الشخص الواحد = سجل واحد
   المدير والوكلاء ليهم سجل معلم (لأنهم على كادر المعلمين) وحساب دخول.
   الحساب بيتربط بالسجل، والسجل بيتعلّم عليه إنه «إداري لا يدرّس».
   ============================================================ */
function teacherOfUser(uid){
  var u = byId(DB.users, uid);
  return (u && u.teacherId) ? teacherById(u.teacherId) : null;
}
/* الوظيفة الإدارية للمعلم من حسابه (مدير / وكيل) */
function adminRoleOfTeacher(tid){
  if(!tid) return "";
  var u = DB.users.filter(function(x){ return x.teacherId===tid; })[0];
  if(!u) return "";
  if(u.role==="manager" || u.role==="deputy" || u.role==="admin" || u.role==="scheduler")
    return (ROLES[u.role]||{}).name || "";
  return "";
}
/* هل ده إداري مش بيدرّس؟ */
function isNonTeaching(t){ return !!(t && t.noTeach); }
/* المعلمون اللي فعلًا بيدرّسوا — الأساس لكل توزيع وجدول وعجز */
function teachingStaff(){
  return DB.teachers.filter(function(t){ return t.status!=="left" && !isNonTeaching(t); });
}
/* ربط حساب بسجل معلم */
function linkUserToTeacher(uid, tid, noTeach){
  var u = byId(DB.users, uid), t = teacherById(tid);
  if(!u || !t) return false;
  /* لو المعلم عنده حساب تلقائي تاني، نشيله عشان ما يتكررش */
  DB.users = DB.users.filter(function(x){
    return !(x.teacherId===tid && x.id!==uid && x.role==="teacher");
  });
  u.teacherId = tid;
  u.name = t.name;
  if(noTeach){
    t.noTeach = true;
    t.jobNow = adminRoleOfTeacher(tid) || t.jobNow;
  }
  return true;
}
/* حسابات إدارية مش مربوطة بسجل معلم، وليها مطابق بالاسم أو الرقم القومي */
/* هل الاسم القصير جزء من الاسم الكامل؟ («تهامي كرم» جوه «تهامى كرم عبد الجليل السيد»)
   الشرط: كل كلمات القصير موجودة في الكامل، وأول كلمة واحدة. */
function nameContains(full, short){
  var A = normAr(full||"").split(/\s+/).filter(Boolean);
  var B = normAr(short||"").split(/\s+/).filter(Boolean);
  if(A.length<2 || B.length<2) return false;
  if(A[0]!==B[0]) return false;                 /* الاسم الأول لازم يتطابق */
  for(var i=0;i<B.length;i++) if(A.indexOf(B[i])<0) return false;
  return true;
}
function accountMatches(){
  var out = [];
  DB.users.forEach(function(u){
    if(u.role!=="manager" && u.role!=="deputy" && u.role!=="admin") return;
    if(u.teacherId) return;
    var un = normAr(u.name||"");
    if(!un) return;
    var best = null, why = "";
    DB.teachers.forEach(function(t){
      if(best) return;
      if(u.natId && t.natId && u.natId===t.natId){ best = t; why = "نفس الرقم القومي"; return; }
      var tn = normAr(t.name||"");
      if(tn===un){ best = t; why = "نفس الاسم بالحرف"; return; }
      if(nameContains(t.name, u.name)){ best = t; why = "اسم الحساب مختصر من الاسم الكامل"; return; }
      if(similar(t.name, u.name) >= 0.6){ best = t; why = "اسم متطابق في أغلبه"; }
    });
    if(best) out.push({ user:u, teacher:best, why:why });
  });
  return out;
}

/* مواد الفصل المختار — مرتّبة: تخصص المعلم الأول */
function fillSlotSubjects(sel){
  var box = document.getElementById("slotBox");
  var el = document.getElementById("sl_s");
  var warn = document.getElementById("sl_warn");
  if(!el || !box) return;
  var tid = box.dataset.tid, day = num(box.dataset.day,0), per = num(box.dataset.per,1);
  var cid = val("sl_c");
  var t = teacherById(tid);
  if(!cid){ el.innerHTML = '<option value="">— اختر الفصل الأول —</option>'; if(warn) warn.innerHTML=""; return; }

  var subs = DB.subjects.filter(function(su){ return su.classId===cid; });
  var mine = [], near = [], other = [];
  subs.forEach(function(su){
    if(isActivitySubj(su)){ other.push(su); return; }
    var f = teacherFitsSubject(t, su.name);
    if(f >= SUBJ_MATCH_MIN) mine.push(su); else if(f>0) near.push(su); else other.push(su);
  });
  function opt(su){
    var a = DB.assign.filter(function(x){ return x.classId===cid && x.subjectId===su.id; })[0];
    var who = (a && a.teacherId && a.teacherId!==tid) ? " — مسندة لـ"+teacherName(a.teacherId) : "";
    return '<option value="'+su.id+'"'+(sel===su.id?" selected":"")+'>'+
      esc(su.name)+' ('+subjHours(su)+' حصص)'+esc(who)+'</option>';
  }
  var o = '<option value="">— اختر المادة —</option>';
  if(mine.length)  o += '<optgroup label="تخصصه">'+mine.map(opt).join("")+'</optgroup>';
  if(near.length)  o += '<optgroup label="تخصص قريب">'+near.map(opt).join("")+'</optgroup>';
  if(other.length) o += '<optgroup label="مواد أخرى">'+other.map(opt).join("")+'</optgroup>';
  el.innerHTML = o;

  /* تنبيهات */
  var msgs = [];
  var busy = DB.schedule.filter(function(x){
    return x.classId===cid && x.day===day && x.period===per && x.teacherId!==tid; })[0];
  if(busy) msgs.push('<div class="note warn"><b>الفصل مشغول في الحصة دي</b> — '+
    esc(subjName(busy.subjectId))+(busy.teacherId? ' مع '+esc(teacherName(busy.teacherId)) : '')+
    '. لو حفظت هتستبدلها.</div>');
  if(!mine.length) msgs.push('<div class="note">مفيش مادة في الفصل ده من تخصص المعلم '+
    '('+esc(t.subject||"غير محدد")+') — تقدر تختار من المواد التانية لو محتاج.</div>');
  var nis = nisabOf(tid), ld = plannedHours(tid,{});
  if(ld >= nis) msgs.push('<div class="note warn">المعلم وصل نصابه ('+ld+'/'+nis+') — الحصة دي هتزوّده.</div>');
  if(warn) warn.innerHTML = msgs.join("");
}
function saveTeacherSlot(){
  var box = document.getElementById("slotBox");
  if(!box) return;
  var tid = box.dataset.tid, day = num(box.dataset.day,0), per = num(box.dataset.per,1);
  var cid = val("sl_c"), sid = val("sl_s");
  if(!cid){ toast("اختار الفصل"); return; }
  if(!sid){ toast("اختار المادة"); return; }

  markUndo("تعديل حصة في جدول معلم");
  /* نشيل حصة المعلم القديمة في نفس الخانة */
  DB.schedule = DB.schedule.filter(function(x){
    return !(x.teacherId===tid && x.day===day && x.period===per && inSector(classById(x.classId)));
  });
  /* ونشيل أي حصة تانية في نفس خانة الفصل */
  DB.schedule = DB.schedule.filter(function(x){
    return !(x.classId===cid && x.day===day && x.period===per);
  });
  DB.schedule.push({ id:uid("h"), classId:cid, day:day, period:per, subjectId:sid, teacherId:tid });

  /* الربط: التكليف بيخلّي الفصل يظهر للمعلم ويقدر يرصد منه */
  syncAssignFromSchedule(cid, sid, tid);

  saveNow(); closeModal(); render();
  toastUndo("اتسجّلت الحصة — الفصل بقى في «فصولي» عند المعلم");
}

/* قائمة معلمي المادة: كل اللي مادة تدريسهم هي المادة دي — مش المسند بس */
function fillSchedTeacher(sel){
  var cid = MODAL.dataset.cid, sid = val("h_s");
  var el = document.getElementById("h_t");
  if(!el) return;
  var su = subjById(sid);
  var a = DB.assign.filter(function(x){ return x.classId===cid && x.subjectId===sid; })[0];
  if(!sel && a) sel = a.teacherId;

  var box = document.getElementById("h_actbox");
  var wrap = document.getElementById("h_twrap");
  if(box) box.innerHTML = "";
  if(wrap) wrap.style.display = "";

  if(!su){ el.innerHTML = '<option value="">— اختر المادة الأول —</option>'; checkBusy(); return; }

  /* حصة نشاط: الفصل بيتقسّم مجموعات، فمفيش معلم واحد */
  if(isActivitySubj(su)){
    var kind = subjKind(su);
    el.innerHTML = '<option value="">— مجموعات النشاط —</option>';
    if(wrap) wrap.style.display = "none";
    var groups = actsOf(kind).filter(function(a){ return a.on!==false; })
      .map(function(a){ return { a:a, n: studentsOfAct(a.id, kind).filter(function(st){ return st.classId===cid; }).length }; })
      .filter(function(g){ return g.n>0; });
    var noT = groups.filter(function(g){ return !g.a.teacherId; }).length;
    var html = '<div class="note '+(noT?"warn":"ok")+'" style="margin:0 0 9px">'+
      '<b>حصة نشاط — الفصل بيتقسّم '+groups.length+' مجموعة</b>'+
      '<div style="margin-top:5px;font-size:12.5px">';
    if(!groups.length){
      html += 'مفيش طلاب مختارين نشاط في الفصل ده. روح تبويب «الأنشطة» واعمل توزيع تلقائي.';
    }else{
      html += groups.map(function(g){
        return '• '+esc(g.a.name)+' — <b>'+g.n+'</b> طالب — '+
          (g.a.teacherId? esc(teacherName(g.a.teacherId)) : '<span style="color:var(--danger)">بدون معلم</span>');
      }).join("<br>");
      if(noT) html += '<div style="margin-top:6px">'+noT+' مجموعة من غير معلم — حدّدهم من تبويب «الأنشطة».</div>';
    }
    html += '</div></div>';
    if(box) box.innerHTML = html;
    checkBusy();
    return;
  }

  var pool = teachingStaff();
  var same = [], near = [], other = [];
  pool.forEach(function(t){
    var f = teacherFitsSubject(t, su.name);
    if(f >= SUBJ_MATCH_MIN) same.push(t);
    else if(f > 0) near.push(t);
    else other.push(t);
  });
  function opt(t){
    var n = nisabOf(t.id), l = loadNow(t.id);
    return '<option value="'+t.id+'"'+(sel===t.id?" selected":"")+'>'+
      esc(t.name)+' — '+esc(t.subject||"بدون تخصص")+' ('+l+'/'+n+')'+
      (t.hourly?' · بالأجر':'')+'</option>';
  }
  var h = '<option value="">— بدون معلم —</option>';
  if(same.length) h += '<optgroup label="معلمو '+esc(su.name)+'">'+same.map(opt).join("")+'</optgroup>';
  if(near.length) h += '<optgroup label="تخصص قريب">'+near.map(opt).join("")+'</optgroup>';
  if(other.length) h += '<optgroup label="تخصص مختلف — غير مفضّل">'+other.map(opt).join("")+'</optgroup>';
  el.innerHTML = h;
  checkBusy();
}
function checkBusy(){
  var el = document.getElementById("h_warn");
  if(!el) return;
  var tid = val("h_t"), day = Number(MODAL.dataset.day), p = Number(MODAL.dataset.p);
  var cur = schedCell(MODAL.dataset.cid, day, p);
  if(!tid){ el.innerHTML=""; return; }
  var b = teacherBusy(tid, day, p, cur? cur.id : null);
  el.innerHTML = b
    ? '<div class="note bad"><b>تعارض:</b> المعلم عنده حصة في نفس الوقت مع '+esc(className(b.classId))+' — '+esc(subjName(b.subjectId))+'.</div>'
    : '';
}
function saveSched(){
  var cid = MODAL.dataset.cid, day = Number(MODAL.dataset.day), p = Number(MODAL.dataset.p);
  var sid = val("h_s"), tid = val("h_t");
  var cur = schedCell(cid, day, p);
  if(!sid){
    if(cur) DB.schedule = DB.schedule.filter(function(x){ return x.id!==cur.id; });
  }else if(cur){
    cur.subjectId = sid; cur.teacherId = tid;
  }else{
    DB.schedule.push({id:uid("h"), classId:cid, day:day, period:p, subjectId:sid, teacherId:tid});
  }
  var msg = "اتحفظ";
  if(sid && tid) msg = syncAssignFromSchedule(cid, sid, tid) ? "اتحفظ · واتحدّث الإسناد وباقي حصص المادة" : "اتحفظ";
  saveNow(); closeModal(); render(); toast(msg);
}
/* الجدول والإسناد مربوطين: تغيير المعلم في أي مكان بيتطبق في التاني */
function syncAssignFromSchedule(cid, sid, tid){
  var a = DB.assign.filter(function(x){ return x.classId===cid && x.subjectId===sid; })[0];
  if(a && a.teacherId===tid) return false;
  DB.assign = DB.assign.filter(function(x){ return !(x.classId===cid && x.subjectId===sid); });
  DB.assign.push({ id:uid("as"), classId:cid, subjectId:sid, teacherId:tid });
  /* باقي حصص نفس المادة في نفس الفصل تتحوّل للمعلم الجديد */
  DB.schedule.forEach(function(x){
    if(x.classId===cid && x.subjectId===sid) x.teacherId = tid;
  });
  return true;
}

    '</div>'+mFoot("استعادة","doRestore"));
}
function doRestore(){
  var t = val("rs");
  if(!restoreFromText(t)) return;
  closeModal();
}
function restoreFromText(text){
  var s = String(text||"").replace(/^\uFEFF/,"").trim();
  if(!s){ toast("مفيش نص"); return false; }
  var d;
  try{ d = JSON.parse(s); }
  catch(e){
    var m = s.match(/\{[\s\S]*\}/);
    try{ d = JSON.parse(m? m[0] : ""); }
    catch(e2){ toast("النص مش نسخة صالحة"); return false; }
  }
  if(!d || !Array.isArray(d.students) || !Array.isArray(d.users)){ toast("النسخة ناقصة — مفيهاش طلاب أو حسابات"); return false; }
  DB = Object.assign(blankDB(), d);
  DB.meta = Object.assign(blankDB().meta, d.meta||{});
  fixRoles();
  migrateSectors();
  saveNow();
  toast("اتسترجع "+DB.students.length+" طالب و "+DB.classes.length+" فصل");
  logout();
  return true;
}
function restoreFile(){
  var inp = document.createElement("input");
  inp.type="file"; inp.accept=".json,.txt,application/json,text/plain";
  inp.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    var r = new FileReader();
    r.onerror = function(){ toast("مقدرتش أقرأ الملف — جرّب اللصق"); inp.remove(); };
    r.onload = function(){ if(restoreFromText(r.result)) closeModal(); inp.remove(); };
    r.readAsText(f,"utf-8");
  });
  inp.click();
}

function refreshAttStats(){
  var a = byId(DB.assign, UI.sub.a); if(!a) return;
  var k = attKey(a.classId, UI.sub.date || today());
  var rec = DB.attend[k] || {};
  var c = {P:0,A:0,E:0,L:0};
  studentsOf(a.classId).forEach(function(s){ if(rec[s.id]) c[rec[s.id]]++; });
  var boxes = document.querySelectorAll("#view .stats .stat .v");
  if(boxes.length>=4){
    boxes[0].textContent=c.P; boxes[1].textContent=c.A;
    boxes[2].textContent=c.E; boxes[3].textContent=c.L;
  }
}

/* ---------- ربط الأحداث ---------- */
function hookClicks(root){
  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var fn = ACTS[el.dataset.act];
    if(!fn) return;
    e.preventDefault();
    fn(el, e);
  });
}
function hookInputs(root){
  root.addEventListener("input", function(e){
    var el = e.target;
    var act = el.dataset && el.dataset.act;
    if(act==="mkSet"){
      var m = getMark(el.dataset.sid, el.dataset.suid, DB.meta.term);
      var v = el.value.trim();
      m[el.dataset.f] = v===""? null : num(v);
      var mx = num(el.getAttribute("max"),100);
      el.classList.toggle("over", v!=="" && num(v)>mx);
      save(); refreshTotals(el);
    }
    if(el.id==="tq"){
      UI.filters.tq = el.value; UI.page = {};
      clearTimeout(hookInputs._tt);
      hookInputs._tt = setTimeout(function(){
        var pos = el.selectionStart;
        render();
        var n = document.getElementById("tq");
        if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
      }, 260);
    }
    if(el.id==="fq"){
      UI.filters.q = el.value;
      clearTimeout(hookInputs._t);
      hookInputs._t = setTimeout(function(){
        var pos = el.selectionStart;
        render();
        var n = document.getElementById("fq");
        if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
      }, 280);
    }
    if(act==="s2Set"){
      var ms = getMark(el.dataset.sid, el.dataset.suid, Number(el.dataset.term));
      var sv = el.value.trim();
      ms.s2 = sv==="" ? null : num(sv);
      save();
      clearTimeout(hookInputs._s2);
      hookInputs._s2 = setTimeout(function(){ render(); }, 900);
    }
    if(act==="wkSet"){
      var mm = getMark(el.dataset.sid, el.dataset.suid, DB.meta.term);
      var vv = el.value.trim();
      if(vv==="غ"||vv==="غ ") mm.w[Number(el.dataset.i)] = "غ";
      else if(vv==="") mm.w[Number(el.dataset.i)] = null;
      else mm.w[Number(el.dataset.i)] = num(vv);
      save(); refreshWeekly(el);
    }
  });
  root.addEventListener("change", function(e){
    var id = e.target.id;
    /* الفلاتر المتتابعة: أي تغيير بيرجّع الأبعاد اللي تحته للكل */
    var dim = e.target.dataset && e.target.dataset.dim;
    if(dim){
      UI.filters[dim] = e.target.value;
      cascadeReset(UI.filters, dim);
      UI.page = {};                 /* فلتر جديد = نرجع لأول صفحة */
      render();
      return;
    }
    if(id==="fq"){
      UI.filters.q = val("fq"); UI.page = {};
      render();
      var fq = document.getElementById("fq");
      if(fq){ fq.focus(); fq.setSelectionRange(fq.value.length,fq.value.length); }
    }
    if(id==="selAllStu"){
      var on = e.target.checked;
      Array.prototype.slice.call(document.querySelectorAll(".stuck")).forEach(function(cb){ cb.checked = on; });
    }
    if(id==="selAllTch"){
      var onT = e.target.checked;
      Array.prototype.slice.call(document.querySelectorAll(".tchck")).forEach(function(cb){ cb.checked = onT; });
    }
    if(id==="tsub"){ UI.filters.tsub = e.target.value; UI.page = {}; render(); }
    if(id==="logq"){ UI.filters.logq = e.target.value; render(); }
    if(id==="lsDate"){ UI.sub = { date: e.target.value }; render(); }
    if(id==="supDate"){ UI.sub = UI.sub || {}; UI.sub.date = e.target.value; render(); }
    if(id==="trkLvl"){ DB.trackLevel = num(e.target.value,2); saveNow(); render(); toast("استمارة المسار بقت لطلاب "+levelName(DB.trackLevel)); }
    if(id==="attDate"){ UI.sub.date = e.target.value; render(); }
    if(id==="ctLvl" || id==="ctCls" || id==="ctScope"){
      UI.filters.ctLvl = val("ctLvl");
      UI.filters.ctCls = val("ctCls");
      UI.filters.ctScope = val("ctScope");
      if(id==="ctLvl") UI.filters.ctCls = "";
      render();
    }
  });
}
function refreshTotals(el){
  var row = el.closest("tr"); if(!row) return;
  var t = termTotal(el.dataset.sid, el.dataset.suid, DB.meta.term);
  var last = row.lastElementChild;
  if(last) last.innerHTML = "<b>"+(t? t.final : "—")+"</b>";
}
function refreshWeekly(el){
  var row = el.closest("tr"); if(!row) return;
  var m = getMark(el.dataset.sid, el.dataset.suid, DB.meta.term);
  var ws = weeklyScore(m);
  var last = row.lastElementChild;
  if(last) last.innerHTML = "<b>"+(ws===null?"—":Math.round(ws)+"%")+"</b>";
}

/* ============================================================
   محرّك الاستيراد الذكي — إكسيل / CSV / لصق
   بيقرأ الملف حتى لو الأعمدة مبعثرة أو فيه صفوف فاضية،
   بيتعرّف على العناوين بنفسه، وبيسيب لك تصحيح الربط قبل الإضافة.
   ============================================================ */

var PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
var PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var pdfLoading = null;
function loadPDFJS(){
  var lib = window.pdfjsLib || (window.pdfjsDistBuildPdf);
  if(lib) return Promise.resolve(lib);
  if(pdfLoading) return pdfLoading;
  pdfLoading = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = PDFJS_URL;
    s.onload = function(){
      var L = window.pdfjsLib;
      if(!L){ rej(new Error("no pdfjs")); return; }
      try{ L.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }catch(e){}
      res(L);
    };
    s.onerror = function(){ rej(new Error("تعذّر تحميل قارئ PDF")); };
    document.head.appendChild(s);
  });
  return pdfLoading;
}
/* بيحوّل صفحات الـPDF لصفوف/أعمدة: بيجمّع الكلام حسب السطر (y)، وبيحسب عتبة الفصل
   بين الأعمدة تلقائيًا من توزيع المسافات نفسه (فجوة الكلمات صغيرة، فجوة العمود كبيرة). */
function pdfLineParts(tc){
  var lines = {};
  tc.items.forEach(function(it){
    var t = String(it.str||"").trim();
    if(!t) return;
    var x = it.transform[4], y = Math.round(it.transform[5]);
    var key = null;
    for(var k in lines){ if(Math.abs(Number(k)-y)<=3){ key = k; break; } }  /* تسامح رأسي */
    if(key===null){ key = String(y); lines[key] = []; }
    lines[key].push({ x:x, w:Number(it.width)||0, t:t });
  });
  return Object.keys(lines).sort(function(a,b){ return Number(b)-Number(a); })
    .map(function(k){ return lines[k].sort(function(a,b){ return b.x-a.x; }); });  /* عربي: يمين ← شمال */
}
function pdfGapOf(prev, cur){ return prev.x - (cur.x + cur.w); }
/* مراسي الأعمدة: خانات العمود الواحد بتبدأ عند نفس الحافة تقريبًا في كل السطور.
   بنجمّع قيم x المتقاربة، ونقبل بس اللي متكرر في عدد كبير من السطور. */
function pdfColAnchors(allLines){
  var TOL = 3;                     /* أعمدة الجدول الحقيقية بتتطابق بدقة */
  var groups = [];
  allLines.forEach(function(parts, li){
    parts.forEach(function(p){
      var g = null;
      for(var i=0;i<groups.length;i++){ if(Math.abs(groups[i].x - p.x) <= TOL){ g = groups[i]; break; } }
      if(!g){ g = {x:p.x, n:0, lines:{}}; groups.push(g); }
      g.lines[li] = 1;
      g.n = Object.keys(g.lines).length;
    });
  });
  /* العمود الحقيقي بيظهر في أغلب السطور — التطابق العارض بين أجزاء الأسماء بيسقط هنا */
  var need = Math.max(2, Math.ceil(allLines.length*0.7));
  return groups.filter(function(g){ return g.n >= need; })
    .map(function(g){ return g.x; })
    .sort(function(a,b){ return b-a; });   /* يمين ← شمال */
}
/* أكبر قفزة في المسافات المرتّبة = الحد الفاصل بين فجوة الكلمة وفجوة العمود (بديل احتياطي) */
function pdfColThreshold(allLines){
  var gaps = [];
  allLines.forEach(function(parts){
    for(var i=1;i<parts.length;i++) gaps.push(pdfGapOf(parts[i-1], parts[i]));
  });
  gaps = gaps.filter(function(g){ return g>0; }).sort(function(a,b){ return a-b; });
  if(!gaps.length) return 14;
  var bestJump = 0, thr = 0;
  for(var i=0;i<gaps.length-1;i++){
    var jump = gaps[i+1]-gaps[i];
    if(gaps[i+1] >= 10 && jump > bestJump){ bestJump = jump; thr = (gaps[i]+gaps[i+1])/2; }
  }
  if(!thr || bestJump < 6) return Math.max(14, gaps[Math.floor(gaps.length*0.75)] || 14);
  return thr;
}
function pdfSplitLine(parts, anchors, thr){
  var cells = [], cur = parts[0].t;
  for(var i=1;i<parts.length;i++){
    var isNew;
    if(anchors && anchors.length>=2){
      isNew = anchors.some(function(a){ return Math.abs(parts[i].x - a) <= 4; });
    }else{
      isNew = pdfGapOf(parts[i-1], parts[i]) > thr;
    }
    if(isNew){ cells.push(cur); cur = parts[i].t; }
    else cur += " "+parts[i].t;   /* نفس الخانة: أجزاء الاسم بتتلم مع بعض */
  }
  cells.push(cur);
  return cells;
}
function pdfToGrid(buf){
  return loadPDFJS().then(function(L){
    return L.getDocument({data:buf}).promise;
  }).then(function(doc){
    var jobs = [];
    for(var p=1; p<=doc.numPages; p++) jobs.push(doc.getPage(p).then(function(pg){ return pg.getTextContent(); }));
    return Promise.all(jobs);
  }).then(function(pages){
    var allLines = [];
    pages.forEach(function(tc){ allLines = allLines.concat(pdfLineParts(tc)); });
    if(!allLines.length) return [];
    var anchors = pdfColAnchors(allLines);
    var thr = pdfColThreshold(allLines);
    var rows = [];
    allLines.forEach(function(parts){
      var cells = pdfSplitLine(parts, anchors, thr);
      if(cells.join("").trim()) rows.push(cells);
    });
    return rows;
  });
}
var XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
var xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = XLSX_URL;
    s.onload = function(){ window.XLSX ? res(window.XLSX) : rej(new Error("no XLSX")); };
    s.onerror = function(){ rej(new Error("تعذّر تحميل قارئ إكسيل")); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

/* ---------- تطبيع النصوص العربية ---------- */
function toEnDigits(s){
  return String(s==null?"":s)
    .replace(/[\u0660-\u0669]/g, function(d){ return String(d.charCodeAt(0)-0x0660); })
    .replace(/[\u06F0-\u06F9]/g, function(d){ return String(d.charCodeAt(0)-0x06F0); })
    .replace(/\u066B/g, ".").replace(/\u066C/g, "");
}
function normAr(s){
  return toEnDigits(s)
    .replace(/[\u064B-\u0652\u0640]/g, "")      /* تشكيل وتطويل */
    .replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^\u0621-\u064A0-9a-zA-Z]+/g, " ")
    .replace(/\s+/g, " ").trim().toLowerCase();
}
function cleanName(s){
  return toEnDigits(s).replace(/[\u0640]/g,"").replace(/\s+/g," ").trim();
}

/* ---------- استخراج البيانات من الرقم القومي المصري ----------
   بنية الرقم القومي (١٤ رقم):
   [0] القرن (٢=١٩٠٠، ٣=٢٠٠٠) · [1-2] السنة · [3-4] الشهر · [5-6] اليوم
   · [7-8] كود المحافظة · [9-12] المسلسل (الخانة ١٣ فردي=ذكر، زوجي=أنثى) · [13] التحقق */
var EG_GOV = {
  "01":"القاهرة","02":"الإسكندرية","03":"بورسعيد","04":"السويس",
  "11":"دمياط","12":"الدقهلية","13":"الشرقية","14":"القليوبية",
  "15":"كفر الشيخ","16":"الغربية","17":"المنوفية","18":"البحيرة",
  "19":"الإسماعيلية","21":"الجيزة","22":"بني سويف","23":"الفيوم",
  "24":"المنيا","25":"أسيوط","26":"سوهاج","27":"قنا","28":"أسوان",
  "29":"الأقصر","31":"البحر الأحمر","32":"الوادي الجديد","33":"مطروح",
  "34":"شمال سيناء","35":"جنوب سيناء","88":"خارج الجمهورية"
};
function parseNationalId(v){
  var n = toEnDigits(String(v||"")).replace(/\D/g,"");
  if(n.length !== 14) return null;
  if(n[0]!=="2" && n[0]!=="3") return null;
  var cen = n[0]==="2" ? 1900 : 2000;
  var yy = Number(n.slice(1,3)), mm = Number(n.slice(3,5)), dd = Number(n.slice(5,7));
  if(mm<1 || mm>12 || dd<1 || dd>31) return null;
  var gov = n.slice(7,9);
  var year = cen + yy;
  var birth = year + "-" + (mm<10?"0":"")+mm + "-" + (dd<10?"0":"")+dd;
  var genderDigit = Number(n[12]);
  return {
    birth: birth, birthYear: year,
    gender: (genderDigit % 2 === 0) ? "أنثى" : "ذكر",
    govCode: gov, govName: EG_GOV[gov] || "غير معروف"
  };
}
/* اسم ولي الأمر = اسم الطالب بعد أول كلمة (اسم الأب فما بعده) */
function guardianFromName(name){
  var p = cleanName(name).split(/\s+/).filter(Boolean);
  if(p.length < 2) return "";
  return p.slice(1).join(" ");
}
/* تعبئة البيانات المشتقّة تلقائيًا في سجل الطالب */
/* كل بيان ممكن يتعرف من الرقم القومي أو الاسم بيتسجّل تلقائيًا هنا */
function enrichStudent(s){
  if(!s) return s;
  var info = parseNationalId(s.natId);
  if(info){
    s.birth = info.birth;
    s.birthYear = info.birthYear;
    s.gender = info.gender;
    s.birthGov = info.govName;
    s.govCode = info.govCode;
    s.age = ageFrom(info.birth);
  }
  if(!s.guardian){ var g = guardianFromName(s.name); if(g) s.guardian = g; }
  if(!s.family){ var fam = familyFromName(s.name); if(fam) s.family = fam; }
  return s;
}
function ageFrom(birth){
  if(!birth) return null;
  var b = new Date(birth), t = new Date();
  if(isNaN(b.getTime())) return null;
  var a = t.getFullYear() - b.getFullYear();
  var m = t.getMonth() - b.getMonth();
  if(m<0 || (m===0 && t.getDate()<b.getDate())) a--;
  return a>=0 && a<120 ? a : null;
}
/* اسم العائلة = آخر كلمة في الاسم */
function familyFromName(name){
  var p = cleanName(name).split(/\s+/).filter(Boolean);
  return p.length>=2 ? p[p.length-1] : "";
}
/* إعادة استخراج البيانات لكل الطلاب دفعة واحدة */
function enrichAllStudents(){
  markUndo("استخراج البيانات للكل");
  var done=0, bad=0;
  DB.students.forEach(function(s){
    if(parseNationalId(s.natId)) done++; else bad++;
    enrichStudent(s);
  });
  saveNow(); render();
  toastUndo("اتّحدثت بيانات "+done+" طالب"+(bad? " · "+bad+" رقمه القومي ناقص أو غلط":""));
}
function parseNum(v){
  var s = toEnDigits(v).replace(/[^\d.\-]/g,"");
  if(s==="" || s==="-" || s===".") return null;
  var n = parseFloat(s);
  return isFinite(n) ? n : null;
}
/* تشابه اسمين (لمطابقة كشوف الدرجات بأسماء مكتوبة بشكل مختلف) */
function similar(a,b){
  a = normAr(a); b = normAr(b);
  if(!a || !b) return 0;
  if(a===b) return 1;
  var A = a.split(" "), B = b.split(" ");
  var hit = 0;
  A.forEach(function(w){ if(w.length>1 && B.indexOf(w)>=0) hit++; });
  return hit / Math.max(A.length, B.length);
}

/* ---------- تفسير القيم الخاصة ---------- */
function parseLevel(v){
  var s = normAr(v);
  if(/(^|\D)3(\D|$)|ثالث|تالت/.test(s)) return 3;
  if(/(^|\D)2(\D|$)|ثاني|تاني/.test(s)) return 2;
  if(/(^|\D)1(\D|$)|اول|اولي/.test(s)) return 1;
  return null;
}
function parseSystem(v){
  var s = normAr(v);
  if(/بكالوريا|bac/.test(s)) return "bac";
  if(/عام|general|gen/.test(s)) return "gen";
  return null;
}
function parseTrack(v){
  var s = normAr(v);
  if(/طب|حياه|احياء|med/.test(s)) return "med";
  if(/هندس|حاسب|برمج|eng/.test(s)) return "eng";
  if(/اعمال|تجار|محاسب|bus/.test(s)) return "bus";
  if(/اداب|فنون|art/.test(s)) return "art";
  if(/علمي علوم|علوم/.test(s)) return "sci";
  if(/رياض/.test(s)) return "math";
  if(/ادبي/.test(s)) return "lit";
  return null;
}
function parseBool(v){
  var s = normAr(v);
  if(/نعم|داخل|yes|y|1|true|✓/.test(s)) return true;
  if(/لا|خارج|no|n|0|false/.test(s)) return false;
  return null;
}
function parseDay(v){
  var s = normAr(v);
  /* بتقبل الفصحى والعامية والأخطاء الشائعة: الاتنين، التلات، الاربع… */
  var pats = [/سبت|sat/, /احد|حد|sun/, /اثنين|اتنين|تنين|mon/, /ثلاثاء|ثلاثا|تلاتاء|تلات|ثلات|tue/,
              /اربعاء|اربعا|اربع|wed/, /خميس|thu/];
  for(var i=0;i<pats.length;i++) if(pats[i].test(s)) return i;
  var n = parseNum(v);
  if(n!==null && n>=1 && n<=6) return n-1;
  return null;
}
function parseAttV(v){
  var s = normAr(v);
  if(!s) return null;
  if(/^(غ|غائب|غياب|a|absent)$/.test(s)) return "A";
  if(/^(ع|عذر|بعذر|e|excused)$/.test(s)) return "E";
  if(/^(ت|تاخير|متاخر|l|late)$/.test(s)) return "L";
  if(/^(ح|حاضر|p|present|\.|x|✓|1)$/.test(s)) return "P";
  return null;
}

/* ---------- قراءة الملفات ---------- */
function detectDelim(text){
  var line = text.split(/\r?\n/).filter(function(l){ return l.trim(); })[0] || "";
  var best = ",", bestN = 0;
  [",",";","\t","|"].forEach(function(d){
    var n = line.split(d).length;
    if(n > bestN){ bestN = n; best = d; }
  });
  return bestN > 1 ? best : ",";
}
function parseCSV(text, delim){
  delim = delim || detectDelim(text);
  var rows = [], row = [], cell = "", q = false;
  text = String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell += ch;
    }else{
      if(ch === '"') q = true;
      else if(ch === delim){ row.push(cell); cell=""; }
      else if(ch === "\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else cell += ch;
    }
  }
  row.push(cell);
  if(row.length>1 || row[0]!=="") rows.push(row);
  return rows;
}
/* تنضيف الشبكة: شيل الصفوف والأعمدة الفاضية تمامًا */
function cleanGrid(rows){
  var g = rows.map(function(r){ return (r||[]).map(function(c){ return cleanName(c); }); });
  g = g.filter(function(r){ return r.some(function(c){ return c!==""; }); });
  if(!g.length) return [];
  var w = 0; g.forEach(function(r){ w = Math.max(w, r.length); });
  var keep = [];
  for(var c=0;c<w;c++){
    var any = g.some(function(r){ return (r[c]||"")!==""; });
    if(any) keep.push(c);
  }
  return g.map(function(r){ return keep.map(function(c){ return r[c]||""; }); });
}
/* تحديد صف العناوين: الصف اللي فيه أكتر تطابق مع الأسماء المعروفة */
function detectHeader(grid, schema){
  var best = -1, bestScore = 0;
  var lim = Math.min(grid.length, 15);
  for(var i=0;i<lim;i++){
    var score = 0;
    grid[i].forEach(function(cell){
      if(!cell) return;
      if(parseNum(cell)!==null && cell.length<4) return;    /* أرقام مش عناوين */
      var n = normAr(cell);
      schema.fields.forEach(function(f){
        f.al.forEach(function(a){
          var na = normAr(a);
          if(n===na || (na.length>3 && n.indexOf(na)>=0) || (n.length>3 && na.indexOf(n)>=0)) score++;
        });
      });
      if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(toEnDigits(cell))) score++;
    });
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return bestScore >= 1 ? best : -1;
}
/* ربط أعمدة الملف بالحقول.
   الأولوية: تطابق تام > العنوان بيحتوي الاسم البديل > الاسم البديل بيحتوي العنوان.
   من غير الترتيب ده بيحصل تبادل بين الأعمدة المتشابهة
   (مثلاً «الدرجة المالية» تروح لـ«تاريخ الدرجة المالية» لأنه أطول). */
function aliasScore(n, na){
  if(!n || !na) return 0;
  if(n === na) return 10000 + na.length;                 /* تطابق تام */
  if(na.length > 2 && n.indexOf(na) >= 0) return 1000 + na.length;   /* العنوان أوسع */
  if(n.length  > 2 && na.indexOf(n)  >= 0) return 100 - (na.length - n.length); /* البديل أوسع — أضعف */
  return 0;
}
function autoMap(header, schema){
  var map = [], used = {};
  var cands = [];
  (header||[]).forEach(function(cell, idx){
    map[idx] = "";
    if(!cell) return;
    var n = normAr(cell);
    schema.fields.forEach(function(f){
      var best = 0;
      f.al.forEach(function(a){
        var sc = aliasScore(n, normAr(a));
        if(sc > best) best = sc;
      });
      if(best > 0) cands.push({ idx:idx, k:f.k, sc:best, multi:!!f.multi });
    });
  });
  /* الأقوى الأول: كده التطابق التام بياخد حقله قبل أي تطابق جزئي */
  cands.sort(function(a,b){ return b.sc - a.sc; });
  cands.forEach(function(c){
    if(map[c.idx]) return;                 /* العمود اتربط بالفعل */
    if(used[c.k] && !c.multi) return;      /* الحقل اتاخد بالفعل */
    map[c.idx] = c.k; used[c.k] = 1;
  });
  return map;
}

function impFile(){
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".xlsx,.xls,.xlsm,.csv,.tsv,.txt,.pdf";
  inp.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(inp);
  inp.addEventListener("change", function(){
    var f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    var name = (f.name||"").toLowerCase();
    var isX = /\.(xlsx|xls|xlsm)$/.test(name);
    var isPdf = /\.pdf$/.test(name) || f.type==="application/pdf";
    toast("بقرأ الملف…");
    if(isPdf){
      var rp = new FileReader();
      rp.onload = function(){
        pdfToGrid(new Uint8Array(rp.result)).then(function(rows){
          if(!rows.length){ toast("مفيش نص مقروء في الـPDF — لو صور ممسوحة، حوّله إكسيل الأول"); inp.remove(); return; }
          impLoaded(rows);
          toast("اتقرا الـPDF — راجع ربط الأعمدة كويس");
          inp.remove();
        }).catch(function(){
          toast("محتاج إنترنت لقراءة PDF أول مرة — أو استخدم إكسيل/CSV");
          inp.remove();
        });
      };
      rp.onerror = function(){ toast("مقدرتش أقرأ الملف"); inp.remove(); };
      rp.readAsArrayBuffer(f);
      return;
    }
    if(isX){
      loadXLSX().then(function(X){
        var r = new FileReader();
        r.onload = function(){
          try{
            var wb = X.read(new Uint8Array(r.result), {type:"array"});
            var all = [];
            wb.SheetNames.forEach(function(sn){
              var rows = X.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, defval:""});
              if(rows.length > all.length) all = rows;
            });
            impLoaded(all);
          }catch(e){ toast("الملف مش مقروء — جرّب تحفظه CSV"); }
          inp.remove();
        };
        r.onerror = function(){ toast("مقدرتش أقرأ الملف"); inp.remove(); };
        r.readAsArrayBuffer(f);
      }).catch(function(){
        toast("محتاج إنترنت لقراءة إكسيل — احفظ الملف CSV أو الصق الجدول");
        inp.remove();
      });
    }else{
      var r2 = new FileReader();
      r2.onload = function(){ impLoaded(parseCSV(String(r2.result).replace(/^\uFEFF/,""))); inp.remove(); };
      r2.onerror = function(){ toast("مقدرتش أقرأ الملف"); inp.remove(); };
      r2.readAsText(f, "utf-8");
    }
  });
  inp.click();
}
function impPasteGo(){
  var t = val("impPaste");
  if(!t.trim()){ toast("الصق الجدول الأول"); return; }
  impLoaded(parseCSV(t, t.indexOf("\t")>=0 ? "\t" : detectDelim(t)));
}
function impLoaded(rows){
  var g = cleanGrid(rows);
  if(!g.length){ toast("الملف فاضي أو مفيهوش بيانات"); return; }
  var sc = IMPORT_SCHEMAS[UI.imp.target];
  UI.imp.grid = g;
  UI.imp.header = detectHeader(g, sc);
  UI.imp.map = UI.imp.header >= 0 ? autoMap(g[UI.imp.header], sc) : [];
  if(UI.imp.header < 0){
    /* من غير عناوين: الأعمدة بالترتيب على الحقول الإجبارية */
    var need = sc.fields.filter(function(f){ return f.req; });
    g[0].forEach(function(_,i){ UI.imp.map[i] = need[i] ? need[i].k : ""; });
  }
  impRenderMap();
}

        : 'الأعمدة اللي على «يوم حضور» لازم عنوانها يكون تاريخ. اللي مش تاريخ هيتتجاهل.')+'</div>';

    '<option value="update"'+(UI.imp.mode==="update"?" selected":"")+'>تحديث البيانات الموجودة</option>'+
    '<option value="dup"'+(UI.imp.mode==="dup"?" selected":"")+'>إضافته تاني على أي حال</option>'+
    '</select></label>';
  h += '</div><div class="mf"><button class="btn ghost" data-act="close">إلغاء</button>'+
