/* ============================================================
   توليد جداول الحصص — مرتبط بالنصاب القانوني المصري
   ------------------------------------------------------------
   النصاب الأسبوعي للمرحلة الثانوية (قانون الكادر):
     معلم مساعد 18 · معلم 18 · معلم أول 17 · معلم أول (أ) 16
     معلم خبير 16 · كبير معلمين 14
   والمشرف على المادة يُخفَّض له حصتان.
   ============================================================ */

var NISAB_SEC = {
  "معلم مساعد":18, "معلم":18, "معلم أول":17, "معلم أول أ":16,
  "معلم خبير":16, "كبير معلمين":14
};
var NISAB_SUPERVISOR_CUT = 2;

function nisabOf(tid){
  var th = teacherById(tid);
  if(isNonTeaching(th)) return 0;          /* إداري لا يدرّس */
  /* مسؤول الجدول بيدرّس بس بنصاب مخفّض */
  var uu = DB.users.filter(function(x){ return x.teacherId===tid; })[0];
  if(uu && uu.role==="scheduler"){
    return Math.max(0, num(th && th.quotaCut, 0) || num(DB.meta.schedulerNisab, 8));
  }
  /* المعلم بالأجر نصابه = الحصص المتعاقد عليها */
  if(th && th.hourly) return Math.max(1, num(th.hourQuota, 10));
  var s = staffById("T"+tid);
  var job = s ? s.job : "معلم";
  var base = NISAB_SEC[job];
  if(base===undefined) base = NISAB_SEC["معلم"];
  var t = teacherById(tid);
  if(t && t.supervisor) base -= NISAB_SUPERVISOR_CUT;
  return Math.max(1, base);
}
function nisabJob(tid){
  var s = staffById("T"+tid);
  var job = (s && NISAB_SEC[s.job]!==undefined) ? s.job : "معلم";
  var t = teacherById(tid);
  return job + (t && t.supervisor ? " · مشرف مادة (−2)" : "");
}
/* حصص المعلم الحالية في الفترة الحالية */
function loadNow(tid){ return teacherPeriods(tid).length; }

/* ---------- حصص المادة الأسبوعية ---------- */
/* حصص المادة الأسبوعية. لو ناقصة بنجيبها من الهيكل الدراسي فورًا وبنثبّتها،
   عشان أي مادة تتعمل بأي طريقة (توليد / استيراد / إضافة يدوية) تبقى جاهزة للجدول. */
function subjHours(su){
  if(!su) return 0;
  var h = num(su.hours, 0);
  if(h > 0) return h;
  h = num(su.periods, 0);
  if(!h) h = curriculumHoursFor(su);
  if(!h) h = suggestHours(su);
  su.hours = h;
  if(!su.periods) su.periods = h;
  return h;
}
/* حصص المادة من خطة صفها في الهيكل الدراسي */
function curriculumHoursFor(su){
  var c = classById(su.classId);
  if(!c) return 0;
  var plan = curSubjects(curKey(c.level, c.system, c.track));
  for(var i=0;i<plan.length;i++){
    if(normAr(plan[i].name)===normAr(su.name)) return num(plan[i].periods,0);
  }
  return 0;
}
/* توزيع افتراضي مقترح لو الوكيل ما حددش */
function suggestHours(su){
  var n = normAr(su.name);
  if(/عربيه|عربي/.test(n)) return 6;
  if(/اجنبيه الاولي|انجليزي|لغه اجنبيه اولي/.test(n)) return 5;
  if(/رياضيات|فيزياء|كيمياء|احياء/.test(n)) return 4;
  if(/اجنبيه الثانيه|فرنساوي|الماني/.test(n)) return 3;
  if(/تاريخ|جغرافيا|فلسفه|علم نفس|اقتصاد|احصاء|برمجه|محاسبه|اداره/.test(n)) return 3;
  if(/دينيه|وطنيه|رياضيه|انشطه|مكتبه|حاسب/.test(n)) return 2;
  return su.counted ? 3 : 2;
}

/* ============================================================
   المولّد
   ============================================================ */
function genContext(){
  var classes = myClasses().slice().sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); });
  var days = schoolDayIdx();
  var P = periodsCount();
  var items = [];      /* كل حصة مطلوبة */
  var problems = [];
  var capacity = classes.length * days.length * P;
  var demand = 0;
  var perTeacher = {};

  classes.forEach(function(c){
    var subs = DB.subjects.filter(function(s){ return s.classId===c.id; });
    if(!subs.length) problems.push({t:"bad", m:"فصل «"+c.name+"» مفيهوش مواد"});
    var classHours = 0;
    subs.forEach(function(su){
      var h = subjHours(su);
      var a = DB.assign.filter(function(x){ return x.classId===c.id && x.subjectId===su.id; })[0];
      if(!h){ problems.push({t:"warn", m:"مادة «"+su.name+"» في «"+c.name+"» مفيش لها حصص أسبوعية"}); return; }
      if(!a){ problems.push({t:"bad", m:"مادة «"+su.name+"» في «"+c.name+"» مفيش لها معلم"}); return; }
      classHours += h;
      demand += h;
      perTeacher[a.teacherId] = (perTeacher[a.teacherId]||0) + h;
      for(var i=0;i<h;i++) items.push({ classId:c.id, subjectId:su.id, teacherId:a.teacherId });
    });
    var slots = days.length * P;
    if(classHours > slots)
      problems.push({t:"bad", m:"«"+c.name+"»: مطلوب "+classHours+" حصة والجدول بيسع "+slots+" بس"});
    else if(classHours && classHours < slots)
      problems.push({t:"warn", m:"«"+c.name+"»: "+(slots-classHours)+" خانة هتفضل فاضية"});
  });

  var over = [];
  for(var tid in perTeacher){
    var n = nisabOf(tid);
    if(perTeacher[tid] > n)
      over.push({tid:tid, need:perTeacher[tid], nisab:n});
  }
  return { classes:classes, days:days, P:P, items:items, problems:problems,
           capacity:capacity, demand:demand, perTeacher:perTeacher, over:over };
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
/* محاولة واحدة لبناء الجدول */
function buildOnce(ctx, respectNisab){
  var byClass = {};
  ctx.items.forEach(function(it){ (byClass[it.classId] = byClass[it.classId] || []).push(it); });
  for(var k in byClass) shuffle(byClass[k]);

  var placed = [];                 /* {classId, day, period, subjectId, teacherId} */
  var tBusy = {};                  /* teacherId|day|period */
  var tCount = {};                 /* عدد حصص المعلم */
  var dayHas = {};                 /* classId|day|subjectId */
  var tDay = {};                   /* teacherId|day → عدد */

  var order = shuffle(ctx.classes.slice());
  for(var p=1; p<=ctx.P; p++){
    for(var di=0; di<ctx.days.length; di++){
      var d = ctx.days[di];
      order.forEach(function(c){
        var pool = byClass[c.id];
        if(!pool || !pool.length) return;
        var pick = -1, fallback = -1;
        for(var i=0;i<pool.length;i++){
          var it = pool[i];
          if(tBusy[it.teacherId+"|"+d+"|"+p]) continue;
          if(respectNisab && (tCount[it.teacherId]||0) >= nisabOf(it.teacherId)) continue;
          if(fallback<0) fallback = i;
          if(dayHas[c.id+"|"+d+"|"+it.subjectId]) continue;      /* مادتين في يوم واحد */
          if((tDay[it.teacherId+"|"+d]||0) >= ctx.P-1) continue; /* توزيع عبء المعلم */
          pick = i; break;
        }
        if(pick<0) pick = fallback;
        if(pick<0) return;
        var ch = pool.splice(pick,1)[0];
        tBusy[ch.teacherId+"|"+d+"|"+p] = 1;
        tCount[ch.teacherId] = (tCount[ch.teacherId]||0)+1;
        tDay[ch.teacherId+"|"+d] = (tDay[ch.teacherId+"|"+d]||0)+1;
        dayHas[c.id+"|"+d+"|"+ch.subjectId] = 1;
        placed.push({ classId:c.id, day:d, period:p, subjectId:ch.subjectId, teacherId:ch.teacherId });
      });
    }
  }
  var left = 0;
  for(var kk in byClass) left += byClass[kk].length;
  return { placed:placed, left:left, tCount:tCount, remaining:byClass };
}
/* أفضل محاولة من عدة محاولات */
function generateSchedule(respectNisab, tries){
  var ctx = genContext();
  if(!ctx.items.length) return { ctx:ctx, best:null };
  var best = null;
  for(var i=0;i<(tries||40);i++){
    var r = buildOnce(ctx, respectNisab);
    if(!best || r.left < best.left) best = r;
    if(best.left===0) break;
  }
  return { ctx:ctx, best:best };
}

/* ============================================================
   توليد جدول فصل واحد — من غير ما يمس باقي الفصول
   ============================================================ */
function genOneClassSchedule(cid){
  var c = classById(cid);
  if(!c) return { err:"الفصل مش موجود" };
  var subs = DB.subjects.filter(function(su){ return su.classId===cid; });
  if(!subs.length) return { err:"الفصل مفيهوش مواد — اضغط «توليد المواد المقررة» الأول" };

  var days = schoolDayIdx(), P = periodsCount();
  /* الطلب: كل حصة مطلوبة ومعلمها */
  var items = [], noT = [];
  subs.forEach(function(su){
    if(isActivitySubj(su)) return;      /* حصص النشاط بتتحط موحّدة للصف كله */
    var hrs = subjHours(su);
    if(!hrs) return;
    var a = DB.assign.filter(function(x){ return x.classId===cid && x.subjectId===su.id; })[0];
    var tid = a ? a.teacherId : "";
    if(!tid){
      /* مفيش إسناد — ندوّر على معلم بتخصص المادة وعنده متاح */
      var best = null, bestFree = -1;
      teachingStaff().forEach(function(t){
        if(teacherFitsSubject(t, su.name) < SUBJ_MATCH_MIN) return;
        var n = nisabOf(t.id), used = plannedHours(t.id, {});
        if(used + hrs > n) return;
        var free = (n - used) / Math.max(1,n) - (t.hourly?0.5:0);
        if(free > bestFree){ bestFree = free; best = t; }
      });
      if(best){
        tid = best.id;
        DB.assign.push({ id:uid("as"), classId:cid, subjectId:su.id, teacherId:tid });
      }else{ noT.push(su.name); return; }
    }
    for(var i=0;i<hrs;i++) items.push({ subjectId:su.id, teacherId:tid, name:su.name });
  });
  if(!items.length) return { err: noT.length? "مفيش معلمين متاحين لمواد الفصل ده" : "مفيش حصص مطلوبة" };

  /* نمسح جدول الفصل ده بس */
  DB.schedule = DB.schedule.filter(function(x){ return x.classId!==cid; });

  var placed = 0, left = [];
  var dayHas = {};   /* منع تكرار نفس المادة مرتين في يوم */
  shuffle(items);
  /* الأكتر حصصًا الأول */
  items.forEach(function(it){
    var done = false;
    for(var pi=1; pi<=P && !done; pi++){
      for(var k=0; k<days.length && !done; k++){
        var d = days[(k + pi) % days.length];
        if(schedCell(cid, d, pi)) continue;
        if(it.teacherId && teacherBusy(it.teacherId, d, pi)) continue;
        if(dayHas[d+"|"+it.subjectId]) continue;
        DB.schedule.push({ id:uid("h"), classId:cid, day:d, period:pi,
                           subjectId:it.subjectId, teacherId:it.teacherId });
        dayHas[d+"|"+it.subjectId] = 1;
        placed++; done = true;
      }
    }
    /* لو مالقاش، نسمح بتكرار المادة في نفس اليوم */
    if(!done){
      for(var pj=1; pj<=P && !done; pj++){
        for(var m=0; m<days.length && !done; m++){
          var dd = days[m];
          if(schedCell(cid, dd, pj)) continue;
          if(it.teacherId && teacherBusy(it.teacherId, dd, pj)) continue;
          DB.schedule.push({ id:uid("h"), classId:cid, day:dd, period:pj,
                             subjectId:it.subjectId, teacherId:it.teacherId });
          placed++; done = true;
        }
      }
    }
    if(!done) left.push(it.name);
  });
  return { placed:placed, left:left, noTeacher:noT, cls:c };
}
function shortageReport(levels){
  var classes = myClasses().filter(function(c){
    return !levels || levels.indexOf(Number(c.level))>=0;
  });
  /* المطلوب لكل اسم مادة */
  var need = {};
  classes.forEach(function(c){
    DB.subjects.filter(function(su){ return su.classId===c.id; }).forEach(function(su){
      var hrs = subjHours(su);
      if(!hrs) return;
      var k = normAr(su.name);
      if(!need[k]) need[k] = { name:su.name, need:0, classes:0 };
      need[k].need += hrs;
      need[k].classes++;
    });
  });
  /* المتاح: مجموع أنصبة المعلمين اللي المادة دي تخصصهم */
  var pool = teachingStaff();
  var rows = [];
  for(var k in need){
    var o = need[k];
    var mine = pool.filter(function(t){ return teacherFitsSubject(t, o.name) >= SUBJ_MATCH_MIN; });
    var cap = 0, capH = 0, used = 0;
    mine.forEach(function(t){
      var n = nisabOf(t.id);
      if(t.hourly) capH += n; else cap += n;
      used += plannedHours(t.id, {});
    });
    var total = cap + capH;
    rows.push({
      name: o.name, need: o.need, classes: o.classes,
      teachers: mine.length,
      hourlyTeachers: mine.filter(function(t){ return t.hourly; }).length,
      capacity: total, capReg: cap, capHourly: capH,
      gap: Math.max(0, o.need - total),
      spare: Math.max(0, total - o.need),
      list: mine
    });
  }
  rows.sort(function(a,b){ return b.gap - a.gap || b.need - a.need; });
  return rows;
}

/* ============================================================
   الأنشطة التربوية والتربية المهنية
   المصدر: القرار الوزاري لنظام الدراسة والتقييم للصف الأول الثانوي.
   الطالب يختار نشاطًا تربويًا واحدًا (حصة أسبوعيًا، ١٠ درجات)
   ومادة تربية مهنية واحدة (حصة أسبوعيًا، ٢٠ درجة) — الاتنين خارج المجموع.
   الفصل الواحد طلابه بيتوزّعوا على أنشطة مختلفة، فكل نشاط بيبقى مجموعة لوحده.
   ============================================================ */
var ACTIVITY_LIST = [
  "التربية الفنية", "التربية الموسيقية", "الاقتصاد المنزلي",
  "الكشافة والمرشدات", "المسرح والتمثيل", "الصحافة والإذاعة",
  "خدمة المجتمع وتنمية البيئة", "النشاط العلمي والإبداعي", "المطالعة والمكتبات"
];
var VOC_LIST = [
  "تكنولوجيا الصناعة", "تكنولوجيا الزراعة", "تكنولوجيا إدارة الأعمال والمشروعات"
];
function actInit(){
  if(!Array.isArray(DB.activities) || !DB.activities.length){
    DB.activities = ACTIVITY_LIST.map(function(n){
      return { id:uid("ac"), name:n, kind:"activity", teacherId:"", cap:0, on:true };
    }).concat(VOC_LIST.map(function(n){
      return { id:uid("ac"), name:n, kind:"voc", teacherId:"", cap:0, on:true };
    }));
    return true;
  }
  return false;
}
function actsOf(kind){
  actInit();
  return DB.activities.filter(function(a){ return a.kind===kind; });
}
function actById(id){
  actInit();
  return DB.activities.filter(function(a){ return a.id===id; })[0] || null;
}
function actName(id){ var a = actById(id); return a ? a.name : "—"; }
/* طلاب النشاط — من الصفوف اللي فيها النشاط ده */
function studentsOfAct(actId, kind){
  var key = kind==="voc" ? "vocId" : "actId";
  return myStudents().filter(function(s){ return s[key]===actId; })
    .sort(function(a,b){ return sortAr(a.name,b.name); });
}
/* الصفوف اللي عندها حصة نشاط في خطتها */
function levelsWithActivity(kind){
  var out = {};
  myClasses().forEach(function(c){
    curSubjects(curKey(c.level, c.system, c.track)).forEach(function(su){
      if(su.kind===(kind==="voc"?"voc":"activity")) out[c.level] = 1;
    });
  });
  return Object.keys(out).map(Number);
}
/* الطلاب المطلوب منهم يختاروا */
function actEligible(kind){
  var lv = levelsWithActivity(kind);
  if(!lv.length) return [];
  return myStudents().filter(function(s){ return lv.indexOf(studentLevelOf(s))>=0; });
}
function actUnassigned(kind){
  var key = kind==="voc" ? "vocId" : "actId";
  return actEligible(kind).filter(function(s){ return !s[key] || !actById(s[key]); });
}
/* توزيع تلقائي عادل للطلاب اللي مختاروش */
function autoDistributeActs(kind){
  var key = kind==="voc" ? "vocId" : "actId";
  var open = actsOf(kind).filter(function(a){ return a.on!==false; });
  if(!open.length) return { err:"مفيش أنشطة مفعّلة" };
  var un = actUnassigned(kind);
  if(!un.length) return { err:"كل الطلاب مختارين بالفعل" };
  /* العدد الحالي لكل نشاط */
  var cnt = {};
  open.forEach(function(a){ cnt[a.id] = studentsOfAct(a.id, kind).length; });
  var n = 0;
  un.forEach(function(s){
    /* الأقل عددًا الأول، مع احترام السعة لو محددة */
    var best = null, bestN = Infinity;
    open.forEach(function(a){
      var cap = num(a.cap,0);
      if(cap && cnt[a.id] >= cap) return;
      if(cnt[a.id] < bestN){ bestN = cnt[a.id]; best = a; }
    });
    if(!best) return;
    s[key] = best.id; cnt[best.id]++; n++;
  });
  return { done:n, left: actUnassigned(kind).length };
}
/* حِمل معلمي الأنشطة: كل مجموعة = حصة أسبوعيًا */
function actGroupsCount(){
  var n = 0;

    actsOf(k).forEach(function(a){
      if(a.on===false) return;
      if(studentsOfAct(a.id, k).length) n++;
    });
  });
  return n;
}

/* ---------- شاشة التوليد ---------- */
/* ============================================================
   التوزيع التلقائي للتكليفات: مين يدرّس إيه لمين
   بيراعي تخصص المعلم ونصابه القانوني، والتوزيع العادل بينهم.
   ============================================================ */
/* الحصص المخطّطة للمعلم من التكليفات الحالية (مش من الجدول) */
function plannedHours(tid, skipClassIds){
  var skip = skipClassIds || {};
  var n = DB.assign.filter(function(a){ return a.teacherId===tid && !skip[a.classId]; })
    .reduce(function(sum, a){
      var su = subjById(a.subjectId);
      return sum + (su ? subjHours(su) : 0);
    }, 0);
  return n + activityHours(tid);
}
/* كل مجموعة نشاط عليها طلاب = حصة أسبوعية على معلمها */
function activityHours(tid){
  if(!tid) return 0;
  actInit();
  var n = 0;
  DB.activities.forEach(function(a){
    if(a.teacherId!==tid || a.on===false) return;
    if(studentsOfAct(a.id, a.kind).length) n++;
  });
  return n;
}
/* ============================================================
   حصص النشاط في الجدول
   الفصل الواحد طلابه بيتفرّقوا على مجموعات، فحصة النشاط بتتحط في
   نفس التوقيت لكل فصول الصف — كده المجموعات تتكوّن والمعلمين يتوزّعوا.
   ============================================================ */
function activitySubjectsOf(cid){
  return DB.subjects.filter(function(su){ return su.classId===cid && isActivitySubj(su); });
}
/* بيحط حصص النشاط لكل صف في خانة موحّدة */
function placeActivityPeriods(levels){
  var res = { placed:0, levels:[], skipped:[] };
  var days = schoolDayIdx(), P = periodsCount();
  var byLevel = {};
  myClasses().forEach(function(c){
    var L = Number(c.level);
    if(levels && levels.indexOf(L)<0) return;
    if(!activitySubjectsOf(c.id).length) return;
    if(!byLevel[L]) byLevel[L] = [];
    byLevel[L].push(c);
  });
  Object.keys(byLevel).forEach(function(L){
    var classes = byLevel[L];
    /* كل نوع نشاط ليه خانة موحّدة للصف كله */
    var kinds = {};
    classes.forEach(function(c){
      activitySubjectsOf(c.id).forEach(function(su){ kinds[su.name] = 1; });
    });
    Object.keys(kinds).forEach(function(sname){
      /* ندوّر على خانة فاضية في كل فصول الصف */
      var slot = null;
      for(var pi=P; pi>=1 && !slot; pi--){          /* آخر حصص اليوم أنسب للنشاط */
        for(var di=0; di<days.length && !slot; di++){
          var d = days[di];
          var free = classes.every(function(c){
            var cell = schedCell(c.id, d, pi);
            if(!cell) return true;
            var su0 = subjById(cell.subjectId);
            return su0 && normAr(su0.name)===normAr(sname);   /* موجودة بالفعل = تمام */
          });
          if(free) slot = { day:d, period:pi };
        }
      }
      if(!slot){ res.skipped.push(levelName(L)+" — "+sname); return; }
      classes.forEach(function(c){
        var su = activitySubjectsOf(c.id).filter(function(x){ return normAr(x.name)===normAr(sname); })[0];
        if(!su) return;
        /* نشيل أي نسخة قديمة من نفس النشاط في الفصل */
        DB.schedule = DB.schedule.filter(function(x){
          return !(x.classId===c.id && x.subjectId===su.id);
        });
        DB.schedule = DB.schedule.filter(function(x){
          return !(x.classId===c.id && x.day===slot.day && x.period===slot.period);
        });
        DB.schedule.push({ id:uid("h"), classId:c.id, day:slot.day, period:slot.period,
                           subjectId:su.id, teacherId:"", actKind:subjKind(su) });
        res.placed++;
      });
      res.levels.push(levelName(L)+" — "+sname+": "+DAYS[slot.day]+" الحصة "+slot.period);
    });
  });
  return res;
}
function autoAssignTeachers(levels, opt){
  opt = opt || {};
  var classes = myClasses().filter(function(c){ return levels.indexOf(Number(c.level))>=0; })
    .sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); });
  if(!classes.length) return { err:"مفيش فصول في الصفوف اللي اخترتها" };

  var scope = {}; classes.forEach(function(c){ scope[c.id]=1; });

  /* الطلب: (فصل × مادة) وحصصها — الأكبر الأول عشان يلاقي معلم فاضي */
  var demand = [], noSubs = [];
  classes.forEach(function(c){
    var subs = DB.subjects.filter(function(su){ return su.classId===c.id; });
    if(!subs.length){ noSubs.push(c); return; }
    subs.forEach(function(su){
      if(isActivitySubj(su)) return;    /* النشاط له معلمو مجموعات مش إسناد عادي */
      var hrs = subjHours(su);          /* بتظبط الحصص لوحدها لو ناقصة */
      if(hrs>0) demand.push({ cls:c, su:su, hrs:hrs });
    });
  });
  if(!demand.length){
    return { err: noSubs.length
      ? "الفصول دي مفيهاش مواد أصلًا — افتح كل فصل واضغط «توليد المواد المقررة»"
      : "مفيش مواد بحصص في الفصول دي" };
  }

  /* الحِمل المبدئي = تكليفات الفصول اللي برّه النطاق (مش هنلمسها) */
  var load = {};
  var pool = teachingStaff();
  pool.forEach(function(t){ load[t.id] = plannedHours(t.id, scope); });

  /* نمسح تكليفات الفصول اللي في النطاق بس */
  DB.assign = DB.assign.filter(function(a){ return !scope[a.classId]; });

  var res = { assigned:0, noTeacher:[], classes:classes.length, load:load };
  demand.sort(function(a,b){ return b.hrs - a.hrs; }).forEach(function(d){
    var best = null, bestScore = -1;
    pool.forEach(function(t){
      var fit = teacherFitsSubject(t, d.su.name);
      /* مادة التدريس شرط أساسي — مدرس فرنساوي مايدخلش إنجليزي */
      if(fit < SUBJ_MATCH_MIN) return;
      var n = nisabOf(t.id);
      var used = load[t.id] || 0;
      if(used + d.hrs > n) return;                 /* هيعدّي نصابه */
      var free = (n - used) / Math.max(1, n);      /* نسبة المتاح — للعدالة */
      var score = fit*1000 + free*100 - (t.hourly?500:0);  /* الأساسيين الأول، وبعدين بالأجر */
      if(score > bestScore){ bestScore = score; best = t; }
    });
    if(!best){ res.noTeacher.push(d); return; }
    load[best.id] = (load[best.id]||0) + d.hrs;
    DB.assign.push({ id:uid("as"), classId:d.cls.id, subjectId:d.su.id, teacherId:best.id });
    res.assigned++;
  });
  return res;
}

        un.slice(0,12).map(function(x){ return "• "+esc(x); }).join("<br>")+
        (un.length>12? "<br>… و"+(un.length-12)+" غيرها":"")+
        '<br><br>غالبًا السبب: معلم وصل نصابه، أو تعارض في المواعيد. جرّب توليد تاني أو قلّل حصص المادة.</div>';
    }

    /* معاينة الجدول */
    var byCls = {};
    res.placed.forEach(function(x){ (byCls[x.classId] = byCls[x.classId]||[]).push(x); });
    ctx.classes.forEach(function(c){
      h += '<div class="card"><div class="hd"><h3>'+esc(c.name)+'</h3>'+
        '<span class="tag">'+((byCls[c.id]||[]).length)+' حصة</span></div><div class="bd">'+
        '<div class="tbl-wrap"><table class="sched"><thead><tr><th>اليوم</th>';
      for(var p=1;p<=P;p++) h += '<th>'+p+'</th>';
      h += '</tr></thead><tbody>';
      ctx.days.forEach(function(d){
        h += '<tr><th style="min-width:52px">'+esc(DAYS[d])+'</th>';
        for(var p=1;p<=P;p++){
          var cell = null;
          (byCls[c.id]||[]).forEach(function(x){ if(x.day===d && x.period===p) cell = x; });
          if(cell) h += '<td class="has"><b>'+esc(subjName(cell.subjectId))+'</b><small>'+esc(teacherName(cell.teacherId))+'</small></td>';
          else h += '<td class="free">—</td>';
        }
        h += '</tr>';
      });
      h += '</tbody></table></div></div></div>';
    });
    h += '<div class="note warn">ده معاينة بس — لسه ما اتحفظش. اضغط <b>«اعتماد الجدول ده»</b> عشان يستبدل '+
      'جداول الفترة الحالية، وبعدها تقدر تعدّل أي خانة يدويًا من «جداول الفصول».</div>';
  }
  return h;
}

Object.assign(ACTS, {
  stTab: function(el){ UI.sub = {st: el.dataset.t}; render(); },
  dayPick: function(el){ UI.sub = Object.assign({}, UI.sub, {day: Number(el.dataset.d)}); render(); },
  autoHours: function(){
    var n = 0;
    myClasses().forEach(function(c){
      DB.subjects.filter(function(s){ return s.classId===c.id; }).forEach(function(su){
        if(!subjHours(su)){ su.hours = suggestHours(su); n++; }
      });
    });
    saveNow(); render();
    toast(n? "اتحط توزيع مبدئي لـ "+n+" مادة — راجعه وعدّله" : "كل المواد لها حصص بالفعل");
  },
  togSup: function(el){
    var t = teacherById(el.dataset.id);
    if(!t) return;
    t.supervisor = !t.supervisor;
    saveNow(); render();
    toast(t.supervisor? "اتعيّن مشرف مادة — نصابه قلّ حصتين" : "اتلغى الإشراف");
  },
  genRun: function(){
    var respect = val("gn_nisab") !== "0";
    var r = generateSchedule(respect, 40);
    if(!r.best){ toast("مفيش حصص مطلوبة — اضبط حصص المواد الأول"); return; }
    UI.gen = r.best;
    UI.gen.respect = respect;
    render();
    toast(r.best.left ? "اتوزّع "+r.best.placed.length+" حصة، وفاضل "+r.best.left
                      : "اتوزّعت كل الحصص ✓");
  },
  genClear: function(){ UI.gen = null; render(); },
  genApply: function(){
    if(!UI.gen){ toast("مفيش جدول مولّد"); return; }
    if(!confirm("هيستبدل جداول فترة "+sectorName(curSector())+" كلها بالجدول المولّد. متأكد؟")) return;
    var mine = myClassIds();
    DB.schedule = DB.schedule.filter(function(s){ return !mine[s.classId]; });
    UI.gen.placed.forEach(function(x){
      DB.schedule.push({ id:uid("h"), classId:x.classId, day:x.day, period:x.period,
                         subjectId:x.subjectId, teacherId:x.teacherId });
    });
    var n = UI.gen.placed.length;
    UI.gen = null;
    saveNow();
    UI.sub = {st:"classes"};
    render();
    toast("اتعتمد الجدول — "+n+" حصة");
  }
});

/* حفظ حصص المادة وأنت بتكتب */
document.addEventListener("input", function(e){
  var el = e.target;
  if(!el || !el.dataset) return;
  var act = el.dataset.act;
  if(act==="hrSet"){
    var su = subjById(el.dataset.id);
    if(!su) return;
    su.hours = Math.max(0, Math.min(12, num(el.value, 0)));
    su.periods = su.hours;
    save();
    return;
  }
  /* عدد حصص اليوم */
  if(el.classList && el.classList.contains("lsF")){
    var L = getLesson(el.dataset.c, el.dataset.s, el.dataset.d);
    L[el.dataset.f] = el.value;
    save();
    return;
  }
  if(act==="calSet"){
    var ck = el.dataset.k;
    if(ck){ calCfg()[ck] = el.value; save(); }
    return;
  }
  if(act==="cfgPeriods"){
    var n = Math.max(1, Math.min(12, num(el.value, 8)));
    curCfg().periods = n;
    saveNow(); render();
    return;
  }
});
/* اختيار المعلم لمادة، وأيام الأسبوع */
document.addEventListener("change", function(e){
  var el = e.target;
  if(!el || !el.dataset) return;
  if(el.dataset.act==="actSetTeacher"){
    var a = actById(el.dataset.id);
    if(a){ a.teacherId = el.value; saveNow(); render();
           toast(el.value? "اتسند لـ"+teacherName(el.value) : "اتشال المعلم"); }
    return;
  }
  if(el.dataset.act==="setAssign"){
    var cid = el.dataset.cid, sid = el.dataset.sid, tid = el.value;
    DB.assign = DB.assign.filter(function(a){ return !(a.classId===cid && a.subjectId===sid); });
    if(tid) DB.assign.push({ id:uid("as"), classId:cid, subjectId:sid, teacherId:tid });
    /* الجدول الحالي يتحدّث بالمعلم الجديد */
    DB.schedule.forEach(function(x){ if(x.classId===cid && x.subjectId===sid) x.teacherId = tid; });
    saveNow(); render();
    toast(tid? "اتسند لـ"+teacherName(tid) : "اتشال المعلم");
    return;
  }
  if(el.dataset.act==="cfgWeek"){
    DB.meta.weekMode = el.value==="exams" ? "exams" : "normal";
    saveNow(); render();
    toast("اتغيّرت أيام الأسبوع");
  }
});

/* معاينة حية للبيانات المشتقة في استمارة الطالب */
document.addEventListener("input", function(e){
  if(e.target && (e.target.id==="s_nat" || e.target.id==="s_name")) updateStudentDerived();
});
