function findClassByName(name){
  if(!name) return null;
  var n = normAr(name);
  for(var i=0;i<DB.classes.length;i++) if(normAr(DB.classes[i].name)===n) return DB.classes[i];
  for(var j=0;j<DB.classes.length;j++) if(similar(DB.classes[j].name, name)>=0.75) return DB.classes[j];
  return null;
}
function findTeacherByName(name){
  if(!name) return null;
  var n = normAr(name);
  for(var i=0;i<DB.teachers.length;i++) if(normAr(DB.teachers[i].name)===n) return DB.teachers[i];
  var best=null, bs=0;
  DB.teachers.forEach(function(t){ var s=similar(t.name,name); if(s>bs){bs=s;best=t;} });
  return bs>=0.7 ? best : null;
}
function findSubjInClass(cid, name){
  if(!name) return null;
  var n = normAr(name);
  var subs = DB.subjects.filter(function(s){ return s.classId===cid; });
  for(var i=0;i<subs.length;i++) if(normAr(subs[i].name)===n) return subs[i];
  var best=null, bs=0;
  subs.forEach(function(s){ var x=similar(s.name,name); if(x>bs){bs=x;best=s;} });
  return bs>=0.7 ? best : null;
}
function findStudent(rec, classId){
  var pool = classId ? studentsOf(classId) : DB.students;
  if(rec.seat){
    var seat = toEnDigits(rec.seat).trim();
    for(var i=0;i<pool.length;i++) if(String(pool[i].seat||"").trim()===seat && seat!=="") return pool[i];
  }
  if(rec.name){
    var n = normAr(rec.name);
    for(var j=0;j<pool.length;j++) if(normAr(pool[j].name)===n) return pool[j];
    var best=null, bs=0;
    pool.forEach(function(s){ var x=similar(s.name, rec.name); if(x>bs){bs=x;best=s;} });
    if(bs>=0.7) return best;
  }
  return null;
}

/* استيراد طلاب المنازل — الرقم القومي مفتاح منع التكرار */
function impHome(recs){
  var r = {add:0, upd:0, skip:0, err:[]};
  var byNat = {};
  DB.students.forEach(function(s){ if(s.natId) byNat[s.natId] = s; });
  recs.forEach(function(o, i){
    var name = cleanName(o.name||"");
    if(!name || normAr(name).length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم"); return; }
    var nat = toEnDigits(String(o.natId||"")).replace(/\D/g,"");
    if(nat.length!==14 || !parseNationalId(nat)){ r.err.push("سطر "+(i+1)+": الرقم القومي غير صحيح ("+name+")"); return; }
    var exist = byNat[nat];
    if(exist && UI.imp.mode==="add"){ r.skip++; return; }
    var s = (exist && UI.imp.mode==="update") ? exist : { id:uid("s"), status:"active", joined:today() };
    if(s===exist) r.upd++; else { DB.students.push(s); byNat[nat] = s; r.add++; }
    s.name = name; s.natId = nat;
    s.edu = "home"; s.classId = ""; s.sector = curSector();
    var lvl = parseLevel(o.level) || num(o.level,0);
    if(lvl>=1 && lvl<=3) s.homeLevel = lvl;
    else if(!s.homeLevel) s.homeLevel = 1;
    if(o.guardian) s.guardian = cleanName(o.guardian);
    if(o.phone) s.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");
    if(o.notes) s.notes = o.notes;
    enrichStudent(s);
  });
  return r;
}
function impStudents(recs){
  var r = {add:0, upd:0, skip:0, err:[]};
  var defCls = UI.imp.ctx.classId || "";
  var newCls = 0;
  recs.forEach(function(o, i){
    var name = cleanName(o.name||"");
    if(!name || name.length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم"); return; }
    if(normAr(name).length<2){ r.err.push("سطر "+(i+1)+": الاسم مش مفهوم"); return; }
    var cid = defCls;
    if(o.cls){
      var c = findClassByName(o.cls);
      if(!c){
        c = {id:uid("c"), name:cleanName(o.cls), level:parseLevel(o.level)||parseLevel(o.cls)||1,
             system:"gen", track:"none", room:""};
        if(c.level>1) c.track = parseTrack(o.cls) || "sci";
        DB.classes.push(c); newCls++;
      }
      cid = c.id;
    }
    var exist = null;
    DB.students.forEach(function(s){
      if(exist) return;
      if(normAr(s.name)===normAr(name) && (!cid || s.classId===cid)) exist = s;
    });
    if(exist && UI.imp.mode==="add"){ r.skip++; return; }
    var s = (exist && UI.imp.mode==="update") ? exist : {id:uid("s"), status:"active", joined:today()};
    if(s===exist) r.upd++; else { DB.students.push(s); r.add++; }
    s.name = name;
    if(cid) s.classId = cid;
    if(o.seat!==undefined && o.seat!=="") s.seat = toEnDigits(o.seat).trim();
    if(o.natId) s.natId = toEnDigits(o.natId).replace(/\D/g,"");
    if(o.guardian) s.guardian = cleanName(o.guardian);
    if(o.phone) s.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");
    if(o.religion){ var rel = normAr(o.religion); s.religion = /مسيح|قبط|c/.test(rel)?"مسيحي":"مسلم"; }
    if(o.notes) s.notes = o.notes;
  });
  if(newCls) r.note = "اتعمل <b>"+newCls+"</b> فصل جديد من أسماء الفصول اللي في الملف — راجعها من شاشة الفصول واظبط الصف والنظام.";
  return r;
}
function impTeachers(recs){
  var r = {add:0, upd:0, skip:0, err:[]};
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    if(!name || name.length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم معلم"); return; }

    if(o.subject) t.subject = cleanName(o.subject);
    if(o.phone) t.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");

    if(!u){ u = {id:uid("u"), role:"teacher", teacherId:t.id}; DB.users.push(u); }
    u.name = name;
    var wanted = o.pin ? normPin(o.pin) : "";
    if(wanted && !pinCheck(wanted, u.id)) u.pin = wanted;

  });

}
function impClasses(recs){
  var r = {add:0, upd:0, skip:0, err:[]};

    var name = cleanName(o.name||"");
    if(!name){ r.err.push("سطر "+(i+1)+": مفيش اسم فصل"); return; }

    DB.classes.forEach(function(c){ if(!ex && normAr(c.name)===normAr(name)) ex = c; });

    c.system = parseSystem(o.system) || c.system || "gen";

function impSubjects(recs){
  var r = {add:0, upd:0, skip:0, err:[]};
  var cid = UI.imp.ctx.classId;
  if(!cid){ return {add:0,upd:0,skip:0,err:["مفيش فصل محدد"]}; }
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    if(!name){ r.err.push("سطر "+(i+1)+": مفيش اسم مادة"); return; }
    var ex = DB.subjects.filter(function(s){ return s.classId===cid && normAr(s.name)===normAr(name); })[0];
    if(ex && UI.imp.mode==="add"){ r.skip++; return; }
    var s = (ex && UI.imp.mode==="update") ? ex : {id:uid("sb"), classId:cid};
    if(s===ex) r.upd++; else { DB.subjects.push(s); r.add++; }

function parseDateCell(v){
  var s = toEnDigits(v).trim();
  var m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(s);
  if(m) return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
  m = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec(s);
  if(m) return m[3]+"-"+pad2(m[2])+"-"+pad2(m[1]);
  m = /^(\d{1,2})[-\/](\d{1,2})$/.exec(s);
  if(m){
    var y = (DB.meta.year.match(/\d{4}/)||[new Date().getFullYear()])[0];
    return y+"-"+pad2(m[2])+"-"+pad2(m[1]);
  }
  return null;
}
function pad2(x){ x = String(x); return x.length<2 ? "0"+x : x; }

/* يقبل كائن JSON أو كود جافاسكريبت متلزق من فايربيز */
function parseFbConfig(text){
  var s = String(text||"").trim();
  if(!s) return null;
  /* الكود اللي فايربيز بيديه فيه سطور import فيها أقواس —
     فبندوّر على firebaseConfig نفسها ونعدّ الأقواس عشان نجيب الكائن الصح */
  var start = 0;
  var m = /firebaseConfig\s*=\s*/.exec(s);
  if(m) start = m.index + m[0].length;
  var i = s.indexOf("{", start);
  if(i<0) return null;
  var depth = 0, j = -1;
  for(var k=i;k<s.length;k++){
    if(s[k]==="{") depth++;
    else if(s[k]==="}"){ depth--; if(depth===0){ j=k; break; } }
  }
  if(j<0) return null;
  s = s.slice(i, j+1);
  try{ return JSON.parse(s); }catch(e){}
  try{ return JSON.parse(jsObjToJson(s)); }catch(e2){ return null; }
}
/* تحويل كائن جافاسكريبت لـJSON: بيشيل التعليقات ويقفل المفاتيح بعلامات
   ويمسح الفواصل الزيادة — من غير ما يلخبط النصوص اللي جواها // زي الروابط */
function jsObjToJson(src){
  var out = "", i = 0, n = src.length;
  while(i < n){
    var ch = src[i];
    if(ch === '"' || ch === "'"){
      var q = ch, buf = '"'; i++;
      while(i < n && src[i] !== q){
        if(src[i] === "\\"){ buf += src[i] + (src[i+1]||""); i += 2; continue; }
        buf += (src[i] === '"') ? '\\"' : src[i];
        i++;
      }
      i++; out += buf + '"'; continue;
    }
    if(ch === "/" && src[i+1] === "/"){ while(i < n && src[i] !== "\n") i++; continue; }
    if(ch === "/" && src[i+1] === "*"){ i += 2; while(i < n && !(src[i]==="*" && src[i+1]==="/")) i++; i += 2; continue; }
    out += ch; i++;
  }
  var strs = [];
  out = out.replace(/"(?:\\.|[^"\\])*"/g, function(m){ strs.push(m); return "\u0001"+(strs.length-1)+"\u0001"; });
  out = out.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":');
  out = out.replace(/,(\s*[}\]])/g, "$1");
  out = out.replace(/\u0001(\d+)\u0001/g, function(_, d){ return strs[Number(d)]; });
  return out;
}

function loadScript(src){
  return new Promise(function(res, rej){
    var el = document.createElement("script");
    el.src = src; el.async = false;
    var done = false;
    var timer = setTimeout(function(){
      if(done) return;
      done = true; el.remove();
      rej(new Error("انتهت المهلة"));
    }, 12000);
    el.onload = function(){ if(done) return; done=true; clearTimeout(timer); res(); };
    el.onerror = function(){ if(done) return; done=true; clearTimeout(timer); el.remove(); rej(new Error("فشل التحميل")); };
    document.head.appendChild(el);
  });
}

/* بيجرّب المصادر بالترتيب لحد ما واحد ينجح */
function loadFirebase(){
  if(window.firebase && window.firebase.database) return Promise.resolve();
  var hosts = FB_HOSTS.slice(), tried = [];
  function tryHost(){
    if(!hosts.length){
      var why = inFrame()
        ? "المكتبة مش راضية تتحمّل. غالبًا لأنك فاتح البرنامج جوه معاينة داخل صفحة تانية — نزّل الملف واشتغل عليه من المتصفح مباشرة."
        : "مقدرتش أحمّل مكتبة فايربيز من أي مصدر. اتأكد إن النت شغال، ولو في المدرسة فيه حجب جرّب من شبكة تانية أو من بيانات الموبايل.";
      return Promise.reject(new Error(why));
    }
    var base = hosts.shift();
    tried.push(base);
    return FB_FILES.reduce(function(p, f){
      return p.then(function(){ return loadScript(base + f); });
    }, Promise.resolve()).then(function(){
      if(!(window.firebase && window.firebase.database)) throw new Error("المكتبة اتحمّلت ناقصة");
      SYNC.src = base;
    }).catch(function(){
      return tryHost();
    });
  }
  return tryHost();
}

    return true;
  }).catch(function(e){
    SYNC.on = false;
    syncStatus("err", e.message || "فشل الاتصال");
    if(!silent) toast(e.message || "فشل الاتصال بفايربيز");
    return false;
  });
}
function syncStop(){
  try{ if(SYNC.ref) SYNC.ref.off(); }catch(e){}
  SYNC.on = false; SYNC.ref = null;

}

/* ---------- بصمة للمقارنة ---------- */
function snapshotOf(db){
  var s = {b:{}, g:{}};
  BULK.forEach(function(k){ s.b[k] = JSON.stringify(db[k]===undefined? null : db[k]); });
  GRAIN.forEach(function(k){
    s.g[k] = {};
    var o = db[k] || {};
    for(var x in o) s.g[k][x] = JSON.stringify(o[x]);
  });
  return s;
}
/* فايربيز مش بيقبل . # $ [ ] / في المفاتيح */
function fbKey(k){ return String(k).replace(/[.#$\[\]\/]/g, "~"); }
function unFbKey(k){ return String(k); }

/* ---------- الرفع ---------- */
function syncPush(){
  if(!SYNC.on || SYNC.applying) return;
  clearTimeout(SYNC.pushT);
  SYNC.pushT = setTimeout(doPush, 700);
}
function doPush(){
  if(!SYNC.on || !SYNC.ref) return;
  var now = snapshotOf(DB), up = {}, n = 0;
  BULK.forEach(function(k){
    if(!SYNC.sent || SYNC.sent.b[k] !== now.b[k]){
      up[k] = DB[k]===undefined ? null : DB[k];
      n++;
    }
  });
  GRAIN.forEach(function(k){
    var cur = now.g[k], old = (SYNC.sent && SYNC.sent.g[k]) || {};
    for(var x in cur){
      if(old[x] !== cur[x]){ up[k+"/"+fbKey(x)] = DB[k][x]; n++; }
    }
    for(var y in old){
      if(cur[y]===undefined){ up[k+"/"+fbKey(y)] = null; n++; }
    }
  });
  if(!n) return;
  up["_rev"] = { by: SYNC.dev, at: Date.now() };
  syncStatus("push");
  /* بنسجّل اللي بعتناه فورًا عشان تعديل تاني في نفس اللحظة ما يعيدش رفع الكل،
     ولو الكتابة فشلت بنرجّع البصمة عشان المحاولة الجاية تبعت الناقص */
  var prev = SYNC.sent;
  SYNC.sent = now;
  SYNC.ref.update(up).then(function(){
    syncStatus("ok");
  }).catch(function(e){
    SYNC.sent = prev;
    syncStatus("err", "مقدرش يكتب — راجع قواعد قاعدة البيانات");
  });
}

/* ---------- الاستقبال ---------- */
function onRemote(sn){
  var v = sn.val();
  if(!v) { doPush(); return; }                       /* السحابة فاضية: ارفع اللي عندك */
  if(v._rev && v._rev.by === SYNC.dev) return;       /* صدى تعديلاتنا */
  SYNC.applying = true;
  var changed = false;
  BULK.forEach(function(k){
    if(v[k]===undefined) return;
    var incoming = v[k];
    if(["users","teachers","classes","subjects","students","assign","schedule","behavior","staff","leaves","locations","dutyPlan","events","holidays","wishes"].indexOf(k)>=0){
      incoming = Array.isArray(incoming) ? incoming.filter(Boolean) : [];
    }
    if(JSON.stringify(DB[k]) !== JSON.stringify(incoming)){ DB[k] = incoming; changed = true; }
  });
  GRAIN.forEach(function(k){
    var inc = v[k] || {};
    var cur = DB[k] || {};
    for(var x in inc){
      if(JSON.stringify(cur[x]) !== JSON.stringify(inc[x])){ cur[x] = inc[x]; changed = true; }
    }
    for(var y in cur){
      if(inc[y]===undefined){ delete cur[y]; changed = true; }
    }
    DB[k] = cur;
  });
  SYNC.sent = snapshotOf(DB);
  SYNC.applying = false;
  if(changed){
    saveNow();
    SYNC.lastAt = Date.now();
    if(UI.user && !document.getElementById("ov").classList.contains("on")) render();
    syncStatus("ok");
  }
}

/* ============================================================
   كود الدعوة — ربط جهاز جديد بسطر واحد
   ============================================================ */
function b64e(str){
  try{ return window.btoa(unescape(encodeURIComponent(str))); }
  catch(e){ return null; }
}
function b64d(str){
  try{ return decodeURIComponent(escape(window.atob(str))); }
  catch(e){ return null; }
}
function inviteCode(){
  var c = syncCfgLoad();
  if(!c || !cfgValid(c.cfg) || !c.code) return null;
  var payload = b64e(JSON.stringify({v:1, code:c.code, cfg:c.cfg}));
  return payload ? "SEGEL-" + payload : null;
}
function applyInvite(text){
  var s = String(text||"").trim().replace(/\s+/g,"");
  var i = s.indexOf("SEGEL-");
  if(i>=0) s = s.slice(i+6);
  var json = b64d(s);
  if(!json){ toast("كود الدعوة مش مقروء — انسخه كامل تاني"); return false; }
  var o;
  try{ o = JSON.parse(json); }catch(e){ toast("كود الدعوة تالف"); return false; }
  if(!o || !o.code || !cfgValid(o.cfg)){ toast("كود الدعوة ناقص"); return false; }
  var c = syncCfgLoad() || {};
  c.code = o.code; c.cfg = ensureDbUrl(o.cfg); c.enabled = true; c.dev = c.dev || deviceId();
  if(!syncCfgSave(c)){ toast("المتصفح مانع الحفظ — جرّب متصفح تاني"); return false; }
  return true;
}

            "أخصائي اجتماعي","أخصائي نفسي",
            "أمين مكتبة","أمين معمل","سكرتير","كاتب","عامل","حارس أمن","إداري"];
var LEAVE_TYPES = [
  {id:"casual",  name:"عارضة",        max:7},
  {id:"annual",  name:"اعتيادية",     max:30},
  {id:"sick",    name:"مرضية",        max:0},
  {id:"mission", name:"مأمورية",      max:0},
  {id:"birth",   name:"وضع / رعاية",  max:0},
  {id:"hajj",    name:"حج",           max:0},
  {id:"unpaid",  name:"بدون أجر",     max:0}
];
var STAFF_ATT = {P:"حاضر", A:"غائب", L:"متأخر", V:"إجازة", M:"مأمورية"};

function leaveName(id){ for(var i=0;i<LEAVE_TYPES.length;i++) if(LEAVE_TYPES[i].id===id) return LEAVE_TYPES[i].name; return id; }
function leaveMax(id){ for(var i=0;i<LEAVE_TYPES.length;i++) if(LEAVE_TYPES[i].id===id) return LEAVE_TYPES[i].max; return 0; }

function staffInit(){
  if(!Array.isArray(DB.staff)) DB.staff = [];
  if(!Array.isArray(DB.leaves)) DB.leaves = [];
  if(!DB.staffAtt || typeof DB.staffAtt!=="object") DB.staffAtt = {};
  if(!DB.subs || typeof DB.subs!=="object") DB.subs = {};
}
/* كل العاملين: المعلمون (من جدول المعلمين) + باقي الوظائف */
function staffAll(){
  staffInit();
  var out = DB.teachers.map(function(t){
    var ex = DB.staff.filter(function(x){ return x.teacherId===t.id; })[0] || {};
    return { id:"T"+t.id, kind:"teacher", teacherId:t.id, name:t.name,
             job: ex.job || "معلم", phone: t.phone||ex.phone||"", natId:ex.natId||"",
             hired: ex.hired||"", degree: ex.degree||"", note: ex.note||"" };
  });
  DB.staff.forEach(function(x){
    if(x.teacherId) return;
    out.push({ id:"S"+x.id, kind:"admin", staffId:x.id, name:x.name, job:x.job||"إداري",
               phone:x.phone||"", natId:x.natId||"", hired:x.hired||"", degree:x.degree||"", note:x.note||"" });
  });
  return out.sort(function(a,b){ return sortAr(a.name,b.name); });
}
function staffById(id){ var a = staffAll(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function staffRecord(sid){
  staffInit();
  if(sid.charAt(0)==="T"){
    var tid = sid.slice(1);
    var r = DB.staff.filter(function(x){ return x.teacherId===tid; })[0];
    if(!r){ r = {id:uid("sf"), teacherId:tid}; DB.staff.push(r); }
    return r;
  }
  var xid = sid.slice(1);
  var q = DB.staff.filter(function(x){ return x.id===xid; })[0];
  return q || null;
}

/* ---------- حضور العاملين ---------- */
function staffAttOf(date, sec){ staffInit(); return DB.staffAtt[sattKeyOf(date, sec)] || {}; }
function staffAttStats(sid){
  staffInit();
  var d=0, a=0, l=0, v=0, m=0, suf = "|"+curSector();
  for(var k in DB.staffAtt){
    if(k.indexOf(suf, k.length-suf.length)<0) continue;
    var rec = DB.staffAtt[k];
    if(!rec || !(sid in rec)) continue;
    d++;
    var x = rec[sid];
    if(x==="A") a++; else if(x==="L") l++; else if(x==="V") v++; else if(x==="M") m++;
  }
  return { days:d, abs:a, late:l, leave:v, mission:m, present:d-a-v-m,
           rate: d? Math.round((d-a)/d*1000)/10 : 100 };
}
/* رصيد الإجازات */
function leaveBalance(sid, type){
  staffInit();
  var used = 0;
  DB.leaves.forEach(function(L){ if(L.staffId===sid && L.type===type) used += num(L.days,0); });
  var mx = leaveMax(type);
  return { used:used, max:mx, left: mx? Math.max(0, mx-used) : null };
}
function daysBetween(a,b){
  if(!a||!b) return 0;
  var d1 = new Date(a+"T00:00:00"), d2 = new Date(b+"T00:00:00");
  var n = Math.round((d2-d1)/86400000)+1;
  return n>0 ? n : 0;
}

/* ---------- النصاب والاحتياطي ---------- */
function teacherPeriods(tid){ return DB.schedule.filter(function(s){ return s.teacherId===tid; }); }
function periodsOn(tid, day){ return DB.schedule.filter(function(s){ return s.teacherId===tid && s.day===day; }); }
function freeTeachersAt(day, period, absentIds){
  return DB.teachers.filter(function(t){
    if(absentIds && absentIds.indexOf("T"+t.id)>=0) return false;
    return !teacherBusy(t.id, day, period, null);
  }).sort(function(a,b){ return teacherPeriods(a.id).length - teacherPeriods(b.id).length; });
}
function subKey(date, schedId){ return date+"|"+schedId; }

  });

    '<th>المعلم البديل</th></tr></thead><tbody>';
  if(!gaps.length) h += '<tr><td colspan="6"><div class="empty"><b>الغائبون مالهمش حصص النهارده</b></div></td></tr>';
  gaps.forEach(function(g){

    var free = freeTeachersAt(dw, g.sched.period, absentIds);

      return '<option value="'+t.id+'"'+(cur===t.id?" selected":"")+'>'+esc(t.name)+' (نصاب '+teacherLoad(t.id)+')</option>';
    }).join("");

    h += '<tr><td class="num"><b>'+g.sched.period+'</b></td>'+
      '<td>'+esc(className(g.sched.classId))+'</td><td>'+esc(subjName(g.sched.subjectId))+'</td>'+
      '<td>'+esc(g.staff.name)+'</td>'+
      '<td><span class="tag '+(g.reason==="A"?"bad":"info")+'">'+esc(STAFF_ATT[g.reason]||"")+'</span></td>'+
      '<td><select data-act="subSet" data-date="'+date+'" data-sched="'+g.sched.id+'" '+
        'style="min-width:170px;padding:6px 8px;font-size:12.5px">'+opts+'</select>'+
        (free.length?'':'<div class="tiny" style="color:var(--danger);font-size:11px">مفيش معلم فاضي في الحصة دي</div>')+
        '</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  return h;
}

function impStaff(recs){
  staffInit();
  var r = {add:0, upd:0, skip:0, err:[]};
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    if(!name || name.length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم"); return; }
    var ex = null;
    staffAll().forEach(function(s){ if(!ex && normAr(s.name)===normAr(name)) ex = s; });
    if(ex && UI.imp.mode==="add"){ r.skip++; return; }
    var rec;
    if(ex && UI.imp.mode==="update"){ rec = staffRecord(ex.id); r.upd++; }
    else { rec = {id:uid("sf"), name:name}; DB.staff.push(rec); r.add++; }
    if(!rec.teacherId) rec.name = name;
    if(o.job) rec.job = cleanName(o.job);
    if(o.degree) rec.degree = cleanName(o.degree);
    if(o.natId) rec.natId = toEnDigits(o.natId).replace(/\D/g,"");
    if(o.phone) rec.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");
    if(o.hired){ var d = parseDateCell(o.hired); if(d) rec.hired = d; }
  });
  return r;
}
function impStaffAtt(recs, g, hr, map){
  staffInit();
  var r = {add:0, upd:0, skip:0, err:[]};
  var dcols = [];
  map.forEach(function(k,c){
    if(k!=="__d") return;
    var d = parseDateCell(hr>=0? g[hr][c] : "");
    if(d) dcols.push({c:c, d:d});
    else r.err.push("عمود مش تاريخ — اتتجاهل");
  });
  if(!dcols.length) return {add:0,upd:0,skip:0,err:["ما حددتش أعمدة تواريخ"]};
  var all = staffAll();
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    var s = null, best=0;
    all.forEach(function(x){
      if(normAr(x.name)===normAr(name)) s = x;
      else { var sim = similar(x.name,name); if(sim>best && sim>=0.7){ best=sim; if(!s) s=x; } }
    });
    if(!s){ r.err.push("سطر "+(i+1)+": ما لقيتش «"+name+"»"); return; }
    var any = false;
    (o.__extra||[]).forEach(function(x){
      if(x.k!=="__d") return;
      var col=null; dcols.forEach(function(dc){ if(dc.c===x.c) col=dc; });
      if(!col) return;
      var vv = normAr(x.v), v = null;
      if(/^(ح|حاضر|p)$/.test(vv)) v="P";
      else if(/^(غ|غائب|a)$/.test(vv)) v="A";
      else if(/^(ت|متاخر|l)$/.test(vv)) v="L";
      else if(/^(ج|اجازه|v)$/.test(vv)) v="V";
      else if(/^(م|ماموريه|مأموريه|m)$/.test(vv)) v="M";
      if(!v) return;
      var kx = sattKeyOf(col.d);
      if(!DB.staffAtt[kx]) DB.staffAtt[kx] = {};
      DB.staffAtt[kx][s.id] = v; any = true;
    });
    if(any) r.add++; else r.skip++;
  });
  return r;
}

/* ============================================================
   الدخول بالرقم السري الشخصي
   شاشة واحدة: خانة رقم سري. الرقم نفسه هو الهوية.
   • كل موظف ليه رقم فريد — البرنامج بيمنع التكرار
   • بيمنع الأرقام الضعيفة (متتالية / مكررة / تواريخ ميلاد شائعة)
   • تأخير تصاعدي بعد المحاولات الغلط ضد التخمين
   ============================================================ */

var PIN_LEN = 8;                     /* أقل طول لكلمة السر */
/* حروف إنجليزية وأرقام، من غير الحروف اللي بتتلخبط: O مع 0 و I مع 1 و L */
var PIN_ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ";
var PIN_DIGIT = "23456789";

function normPin(v){
  return toEnDigits(String(v||"")).trim().toUpperCase();
}
function pinOwner(pin, exceptUserId){
  var p = normPin(pin);
  if(!p) return null;
  for(var i=0;i<DB.users.length;i++){
    var u = DB.users[i];
    if(u.id===exceptUserId) continue;
    if(normPin(u.pin)===p) return u;
  }
  return null;
}
var WEAK_PINS = ["PASSWORD","PASSWORD1","12345678","123456789","ABCD1234","ABC12345",
                 "QWERTY12","QWERTY123","11111111","00000000","AAAA1111","1234ABCD",
                 "ADMIN123","SCHOOL12","TEACHER1","12341234","1A2B3C4D"];
function pinWeak(pin){
  var p = normPin(pin);
  if(WEAK_PINS.indexOf(p)>=0) return "كلمة سر شائعة وسهلة التخمين";
  if(/^(.)\1+$/.test(p)) return "كل الحروف متشابهة";
  /* متتالية صاعدة أو نازلة */
  var up = true, down = true;
  for(var i=1;i<p.length;i++){
    var d = p.charCodeAt(i) - p.charCodeAt(i-1);
    if(d !== 1) up = false;
    if(d !== -1) down = false;
  }
  if(up || down) return "حروف أو أرقام متتالية";
  /* نمط مكرر زي AB1AB1AB — وحدة بتتكرر مرتين فأكتر */
  for(var u=2; u<=Math.floor(p.length/2); u++){
    var unit = p.slice(0,u), ok = true;
    for(var q=0;q<p.length;q++) if(p[q] !== unit[q%u]){ ok = false; break; }
    if(ok) return "نمط مكرر";
  }
  return null;
}
/* الفحص الكامل: بيرجع رسالة الخطأ أو null لو صالحة */
function pinCheck(pin, exceptUserId){
  var p = normPin(pin);
  if(!p) return "اكتب كلمة السر";
  if(!/^[A-Z0-9]+$/.test(p)) return "كلمة السر حروف إنجليزية وأرقام بس — من غير مسافات أو رموز";
  if(p.length < PIN_LEN) return "كلمة السر لازم "+PIN_LEN+" خانات على الأقل (المكتوب "+p.length+")";
  if(p.length > 16) return "كلمة السر طويلة أوي — من "+PIN_LEN+" لـ ١٦ خانة";
  if(!/[A-Z]/.test(p)) return "لازم تحتوي على حرف إنجليزي واحد على الأقل";
  if(!/[0-9]/.test(p)) return "لازم تحتوي على رقم واحد على الأقل";
  var w = pinWeak(p);
  if(w) return "كلمة السر دي ماتنفعش: "+w;
  if(pinOwner(p, exceptUserId)) return "كلمة السر دي مستخدمة بالفعل لحساب تاني — اختار غيرها";
  return null;
}
function genPin(){
  for(var tries=0; tries<800; tries++){
    var chars = [];
    /* ٥ حروف و٣ أرقام مخلوطين */
    for(var i=0;i<5;i++) chars.push(PIN_ALPHA[Math.floor(Math.random()*PIN_ALPHA.length)]);
    for(var j=0;j<3;j++) chars.push(PIN_DIGIT[Math.floor(Math.random()*PIN_DIGIT.length)]);
    for(var k=chars.length-1;k>0;k--){
      var r = Math.floor(Math.random()*(k+1));
      var t = chars[k]; chars[k] = chars[r]; chars[r] = t;
    }
    var p = chars.join("");
    if(pinWeak(p)) continue;
    if(pinOwner(p, null)) continue;
    return p;
  }
  return "S" + Date.now().toString(36).toUpperCase().slice(-7);
}
function weakUsers(){
  var seen = {}, dup = {};
  DB.users.forEach(function(u){
    var p = normPin(u.pin);
    if(seen[p]) dup[p] = 1;
    seen[p] = 1;
  });
  return DB.users.filter(function(u){
    var p = normPin(u.pin);
    return !p || p.length < PIN_LEN || !/[A-Z]/.test(p) || !/[0-9]/.test(p) ||
           !/^[A-Z0-9]+$/.test(p) || pinWeak(p) || dup[p];
  });
}

/* ---------- حماية من التخمين ---------- */
var TRY_KEY = "segel_tries_v1";
function tries(){
  try{
    var o = JSON.parse(window.localStorage.getItem(TRY_KEY) || "{}");
    return { n: num(o.n,0), at: num(o.at,0) };
  }catch(e){ return { n:0, at:0 }; }
}
function setTries(n){
  try{ window.localStorage.setItem(TRY_KEY, JSON.stringify({n:n, at:Date.now()})); }catch(e){}
}
/* التأخير بيزيد: 3 محاولات مجانية، بعدها 5ث، 15ث، 60ث، 5د */
function lockLeft(){
  var t = tries();
  if(t.n < 3) return 0;
  var waits = [5, 15, 60, 300];
  var w = waits[Math.min(t.n-3, waits.length-1)] * 1000;
  var left = t.at + w - Date.now();
  return left > 0 ? Math.ceil(left/1000) : 0;
}

function startLockTimer(){
  clearInterval(renderLogin._t);
  renderLogin._t = setInterval(function(){
    var left = lockLeft();
    var el = document.getElementById("lockSec");
    if(!el){ clearInterval(renderLogin._t); return; }
    if(left <= 0){ clearInterval(renderLogin._t); setTries(0); renderLogin(); return; }
    el.textContent = left;
  }, 1000);
}
function doLogin(){
  if(lockLeft() > 0) return;
  if(UI.sector!=="reg" && UI.sector!=="srv"){ toast("اختار القسم الأول"); return; }
  var el = document.getElementById("pin");
  var v = normPin(el ? el.value : "");
  if(!v){ toast("اكتب كلمة السر"); return; }

  var u = null, wrongSector = null;
  for(var i=0;i<DB.users.length;i++){
    if(String(DB.users[i].pin) !== v) continue;
    if(userInSector(DB.users[i], curSector())){ u = DB.users[i]; break; }
    wrongSector = DB.users[i];
  }
  if(!u && wrongSector){
    toast("حسابك مسجّل على فترة "+sectorName(userSectors(wrongSector)[0])+" — اختارها من فوق");
    return;
  }
  if(!u){
    setTries(tries().n + 1);
    if(el){ el.value = ""; }
    renderLogin();
    toast("كلمة السر غير صحيحة");
    return;
  }
  setTries(0);
  UI.user = u;
  var nv = navFor(u);
  UI.tab = (nv[0] && nv[0][0]) || "settings";
  UI.sub = null;
  document.getElementById("login").classList.add("off");
  document.getElementById("app").classList.add("on");
  document.getElementById("hdUser").textContent = u.name + " · " + (ROLES[u.role] ? ROLES[u.role].name : "");
  render();
  setHeaderSector();
}
function logout(){
  UI.user = null; UI.sub = null;
  document.getElementById("app").classList.remove("on");
  document.getElementById("login").classList.remove("off");
  renderLogin();
}

    return x.kind==="post" && x.day===day && x.locationId===locId && (x.sector||"reg")===sec; })[0];
  return p ? p.staffId : "";
}
/* المشرف الفعلي: اللي اتسجّل اليوم، وإلا اللي في الخطة */
function generalToday(date){
  var d = dutyOf(date), dw = dayOfWeek(date);
  return d.general || plannedGeneral(dw);
}
function postToday(date, locId){
  var d = dutyOf(date), dw = dayOfWeek(date);
  return d.posts[locId] || plannedPost(dw, locId);
}

/* ---------- مؤشرات اليوم ---------- */
function dayPulse(date){
  supInit();
  var dw = dayOfWeek(date);
  var rec = staffAttOf(date);

  /* العاملون */
  var all = staffAll(), sAbs = [], sPres = 0;
  all.forEach(function(s){
    var v = rec[s.id];
    if(v==="A" || v==="V" || v==="M") sAbs.push({s:s, v:v});
    else if(v) sPres++;
  });

  /* الطلاب */
  var stTot = 0, stAbs = 0, notRecorded = [];
  myClasses().forEach(function(c){
    var studs = studentsOf(c.id);
    if(!studs.length) return;
    var r = DB.attend[attKey(c.id, date)];
    if(!r || !Object.keys(r).length){ notRecorded.push(c); return; }
    studs.forEach(function(s){
      if(!(s.id in r)) return;
      stTot++;
      if(r[s.id]==="A") stAbs++;
    });
  });

  /* الحصص المكشوفة */
  var gaps = [], covered = 0;
  if(dw>=0 && dw<6){
    sAbs.forEach(function(x){
      if(x.s.kind!=="teacher") return;
      periodsOn(x.s.teacherId, dw).forEach(function(p){
        var sub = DB.subs[subKey(date, p.id)];
        if(sub) covered++;
        gaps.push({staff:x.s, sched:p, reason:x.v, sub:sub||""});
      });
    });
  }

  /* مواقع الإشراف بدون مشرف */
  var noPost = sectorLocations().filter(function(l){ return !postToday(date, l.id); });

  /* الأحداث */
  var evs = DB.events.filter(function(e){ return e.date===date; });

  return {
    day:dw, staff:{all:all.length, present:sPres, absent:sAbs},
    students:{recorded:stTot, absent:stAbs,
              rate: stTot? Math.round((stTot-stAbs)/stTot*1000)/10 : null,
              notRecorded:notRecorded},
    gaps:gaps, covered:covered, uncovered:gaps.length-covered,
    noPost:noPost, events:evs,
    general: generalToday(date)
  };
}

      '<td class="num">'+(rec? rec-abs : "—")+'</td><td class="num">'+(rec? abs : "—")+'</td>'+
      '<td class="num">'+(rec? Math.round((rec-abs)/rec*1000)/10+"%" : '<span class="tag bad">لم يُرصد</span>')+'</td></tr>';
  });
  h += '<tr style="background:#f4f6f3"><td><b>الإجمالي</b></td><td class="num"><b>'+
    myStudents().length+'</b></td>'+
    '<td class="num"><b>'+(tR-tA)+'</b></td><td class="num"><b>'+tA+'</b></td>'+
    '<td class="num"><b>'+(tR? Math.round((tR-tA)/tR*1000)/10+"%":"—")+'</b></td></tr>';
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>ثالثًا: الحصص والاحتياطي</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الحصة</th><th>الفصل</th><th>المادة</th><th>المعلم الغائب</th>'+
    '<th>المعلم البديل</th></tr></thead><tbody>';
  if(!p.gaps.length) h += '<tr><td colspan="5"><div class="empty"><b>مفيش حصص محتاجة تغطية</b></div></td></tr>';
  p.gaps.sort(function(a,b){ return a.sched.period-b.sched.period; }).forEach(function(g){
    h += '<tr><td class="num">'+g.sched.period+'</td><td>'+esc(className(g.sched.classId))+'</td>'+
      '<td>'+esc(subjName(g.sched.subjectId))+'</td><td>'+esc(g.staff.name)+'</td>'+
      '<td>'+(g.sub? esc(teacherName(g.sub)) : '<span class="tag bad">لم تُغطَّ</span>')+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>رابعًا: مواقع الإشراف</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الموقع</th><th>النوع</th><th>المشرف</th></tr></thead><tbody>';
  var _rl = sectorLocations();
  if(!_rl.length) h += '<tr><td colspan="3"><div class="empty"><b>مفيش مواقع مسجّلة</b></div></td></tr>';
  _rl.forEach(function(l){
    var sid = postToday(date, l.id), s = sid? staffById(sid) : null;
    h += '<tr><td><b style="font-weight:600">'+esc(l.name)+'</b></td><td>'+esc(postKindName(l.kind))+'</td>'+
      '<td>'+(s? esc(s.name) : '<span class="tag bad">بدون مشرف</span>')+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>خامسًا: الأحداث والملاحظات</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الوقت</th><th>النوع</th><th>الموقع</th><th>البيان</th><th>الإجراء</th></tr></thead><tbody>';
  if(!p.events.length) h += '<tr><td colspan="5"><div class="empty"><b>مفيش أحداث</b></div></td></tr>';
  p.events.forEach(function(e){
    h += '<tr><td class="num">'+esc(e.time||"—")+'</td><td>'+esc(evType(e.type).name)+'</td>'+
      '<td>'+esc(e.locationId? locName(e.locationId):"—")+'</td>'+
      '<td>'+esc(e.note||"")+'</td><td>'+esc(e.action||"—")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>سادسًا: ملاحظات المشرف العام</h3></div><div class="bd">'+
    '<textarea id="dutyNotes" style="min-height:90px" placeholder="اكتب ملاحظاتك على سير اليوم…">'+esc(d.notes||"")+'</textarea>'+
    '<button class="btn noprint" data-act="saveNotes" data-d="'+date+'" style="margin-top:8px">حفظ الملاحظات</button>'+
    '<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:22px">'+
    '<span>المشرف العام: ................</span><span>وكيل شئون العاملين: ................</span>'+
    '<span>مدير المدرسة: ................</span></div></div></div>';
  return h;
}

/* ============================================================

function viewMyDuty(){
  supInit();
  var tid = myTeacherId();
  if(!tid) return '<div class="card"><div class="bd"><div class="empty"><b>حسابك مش مربوط بملف معلم</b></div></div></div>';
  var sid = "T"+tid;
  var date = supDate(), ds = dayStatus(date);
  var d = myDutyToday();
  var week = myDutyWeek();

  var h = pageHd("الإشراف", ds.ok ? ds.name+" "+fmtDate(date) : ds.name);

  if(!ds.ok){
    h += '<div class="card"><div class="bd"><div class="empty"><div class="big">☾</div>'+
      '<b>'+esc(ds.name)+'</b><p>مفيش إشراف النهاردة.</p></div></div></div>';
  }else if(date===today() && d.any){
    h += '<div class="card" style="border-right:3px solid var(--gold)"><div class="hd">'+
      '<div style="flex:1"><span class="eyebrow">مناوبتك النهاردة</span>'+
      '<h3>'+(d.general? "المشرف العام اليومي" : "مشرف موقع")+'</h3></div></div><div class="bd">';
    if(d.general){
      var p = dayPulse(date);
      h += '<div class="note">إنت مسؤول عن سير اليوم كله: متابعة الطابور، والحصص المكشوفة، '+
        'والمشرفين على المواقع، وتسجيل أي حدث.</div>'+
        '<div class="stats">'+
        stat("غياب العاملين", p.staff.absent.length, "عامل", p.staff.absent.length?"acc-b":"acc")+
        stat("حصص مكشوفة", p.uncovered, "محتاجة بديل", p.uncovered?"acc-b":"acc")+
        stat("مواقع بدون مشرف", p.noPost.length, "موقع", p.noPost.length?"acc-b":"acc")+
        stat("أحداث اليوم", p.events.length, "مسجّل","")+
        '</div>';
      if(p.gaps.length){
        h += '<div class="tbl-wrap" style="margin-top:11px"><table class="tbl"><thead><tr>'+
          '<th>الحصة</th><th>الفصل</th><th>المعلم الغائب</th><th>البديل</th></tr></thead><tbody>';
        p.gaps.sort(function(a,b){ return a.sched.period-b.sched.period; }).forEach(function(g){
          h += '<tr><td class="num">'+g.sched.period+'</td><td>'+esc(className(g.sched.classId))+'</td>'+
            '<td>'+esc(g.staff.name)+'</td>'+
            '<td>'+(g.sub? esc(teacherName(g.sub)) : '<span class="tag bad">لم تُغطَّ</span>')+'</td></tr>';
        });
        h += '</tbody></table></div>';
      }
      if(p.noPost.length) h += '<div class="note bad" style="margin-top:10px"><b>مواقع من غير مشرف:</b> '+
        esc(p.noPost.map(function(l){ return l.name; }).join("، "))+'</div>';
    }
    if(d.posts.length){
      h += '<div class="note '+(d.general?"":"warn")+'" style="margin-top:'+(d.general?"10px":"0")+'">'+
        '<b>موقع إشرافك:</b> '+esc(d.posts.map(function(l){ return l.name+" ("+postKindName(l.kind)+")"; }).join("، "))+'</div>';
    }
    h += '<button class="btn block" data-act="addEvent" data-d="'+date+'" style="margin-top:11px">+ تسجيل حدث أو مخالفة</button>'+
      '</div></div>';

    var mine = DB.events.filter(function(e){ return e.date===date && e.by===UI.user.name; });
    if(mine.length){
      h += '<div class="card"><div class="hd"><h3>اللي سجّلته النهاردة ('+mine.length+')</h3></div><div class="bd flush">';
      mine.forEach(function(e){
        var t = evType(e.type);
        h += '<div class="list-item"><span class="tag '+t.c+'">'+esc(t.name)+'</span>'+
          '<span class="tx"><b style="font-weight:500">'+esc(e.note)+'</b><small>'+
          (e.time?esc(e.time)+' · ':'')+(e.locationId?esc(locName(e.locationId)):'')+'</small></span></div>';
      });
      h += '</div></div>';
    }
  }else if(date===today()){
    h += '<div class="card"><div class="bd"><div class="empty"><div class="big">◔</div>'+
      '<b>مفيش مناوبة عليك النهاردة</b><p>مناوباتك الأسبوعية موضحة تحت.</p></div></div></div>';
  }

  h += '<div class="card"><div class="hd"><h3>جدول إشرافي الأسبوعي</h3>'+
    '<span class="tag '+(week.length?"info":"")+'">'+week.length+' مناوبة</span></div><div class="bd flush">';
  if(!week.length) h += '<div class="empty"><b>مفيش مناوبات مكلّف بيها</b>'+
    '<p>المدير هو اللي بيوزّع الإشراف من شاشة «توزيع الإشراف».</p></div>';
  week.sort(function(a,b){ return a.day-b.day; }).forEach(function(p){
    h += '<div class="list-item"><span class="av">'+esc(DAYS[p.day].slice(0,3))+'</span>'+
      '<span class="tx"><b>'+esc(DAYS[p.day])+'</b><small>'+
      (p.kind==="general" ? 'المشرف العام اليومي — مسؤول عن سير اليوم كله'
                          : 'الموقع: '+esc(locName(p.locationId)))+'</small></span>'+
      '<span class="tag '+(p.kind==="general"?"gold":"info")+'">'+(p.kind==="general"?"مشرف عام":"مشرف موقع")+'</span></div>';
  });
  h += '</div></div>';

  var subsToday = [];
  for(var k in DB.subs){
    var parts = k.split("|");
    if(parts[0]!==date || DB.subs[k]!==tid) continue;
    var sc = null;
    DB.schedule.forEach(function(x){ if(x.id===parts[1]) sc = x; });
    if(sc) subsToday.push(sc);
  }
  if(subsToday.length){
    h += '<div class="card"><div class="hd"><h3>حصص احتياطي مكلّف بيها</h3></div><div class="bd flush">';
    subsToday.sort(function(a,b){ return a.period-b.period; }).forEach(function(sc){
      h += '<div class="list-item"><span class="av">'+sc.period+'</span>'+
        '<span class="tx"><b>'+esc(className(sc.classId))+' — '+esc(subjName(sc.subjectId))+'</b>'+
        '<small>الحصة '+sc.period+' — بديلًا عن '+esc(teacherName(sc.teacherId))+'</small></span></div>';
    });
    h += '</div></div>';
  }
  return h;
}

/* توزيع الحصص: كشف تغطية كل الفصول والمواد (داخل وخارج المجموع) */
function coverageReport(){
  var rows = [];
  DB.classes.forEach(function(c){
    var subs = DB.subjects.filter(function(x){ return x.classId===c.id; });
    subs.forEach(function(su){
      var a = DB.assign.filter(function(x){ return x.classId===c.id && x.subjectId===su.id; })[0];
      var hrs = DB.schedule.filter(function(x){ return x.classId===c.id && x.subjectId===su.id; }).length;
      rows.push({ cls:c, su:su, teacher: a? teacherName(a.teacherId) : null, hrs:hrs });
    });
  });
  return rows;
}

/* ============================================================
   القسمان: النظامي والخدمات — فترتان منفصلتان
   ------------------------------------------------------------
   الخدمات فترة تانية بعد النظامي، وليها:
   • توقيتاتها (الطابور، بداية الحصص، عددها، نهاية اليوم)
   • إشرافها المستقل (مشرف عام ومواقع)
   • طاقمها (ممكن مدير أو وكيل أو مدرسين مختلفين)
   • حضور عاملين منفصل لكل فترة
   ونصاب المعلم بيتحسب على النظامي بس، حتى لو بيدرّس في الاتنين.
   ============================================================ */

var SECTORS = [
  {id:"reg", name:"نظامي", full:"الفترة الأولى — النظامي", av:"ن"},
  {id:"srv", name:"خدمات", full:"الفترة الثانية — الخدمات", av:"خ"}
];
function sectorName(id){ return id==="srv" ? "خدمات" : "نظامي"; }
function sectorFull(id){ return id==="srv" ? "الفترة الثانية — الخدمات" : "الفترة الأولى — النظامي"; }
function curSector(){ return UI.sector==="srv" ? "srv" : "reg"; }
function classSector(c){ return (c && c.sector==="srv") ? "srv" : "reg"; }
function inSector(c){ return classSector(c) === curSector(); }

function myClasses(){ return DB.classes.filter(inSector); }
function myClassIds(){
  var m = {};
  myClasses().forEach(function(c){ m[c.id] = 1; });
  return m;
}
function myStudents(){
  var m = myClassIds();

}
/* طلاب اتسجّلوا/اترحّلوا بس لسه مش متسكّنين على فصل موجود — لازم يظهروا للوكيل.
   طلاب المنازل مستثنون: ليهم تبويب لوحدهم وملهومش فصول أصلًا. */
function unassignedStudents(){
  var sec = curSector();
  return DB.students.filter(function(s){
    if(s.status==="left" || isHomeStudent(s)) return false;
    if(classById(s.classId)) return false;
    return studentSector(s) === sec;
  });
}
/* ---------- طلاب المنازل (انتساب — امتحانات فقط) ---------- */
function isHomeStudent(s){ return !!s && s.edu==="home"; }
/* القسم اللي الطالب بيتبعه: من فصله، وإلا من القسم المحفوظ، وإلا من نوعية التعليم */
function studentSector(s){
  var c = classById(s.classId);
  if(c) return classSector(c);
  if(s.sector==="srv" || s.sector==="reg") return s.sector;
  return eduType(s.edu||"reg").sector;
}
function homeStudents(){
  var sec = curSector();
  return DB.students.filter(function(s){
    return isHomeStudent(s) && s.status!=="left" && studentSector(s)===sec;
  }).sort(function(a,b){ return (num(a.homeLevel,0)-num(b.homeLevel,0)) || sortAr(a.name,b.name); });
}
function mySchedule(){
  var m = myClassIds();
  return DB.schedule.filter(function(s){ return m[s.classId]; });
}

/* ---------- توقيتات كل فترة ---------- */
var SECTOR_DEFAULTS = {
  reg:{ assembly:"07:30", start:"07:45", periods:8, periodMin:45, end:"13:30" },
  srv:{ assembly:"13:45", start:"14:00", periods:6, periodMin:45, end:"18:00" }
};
function secCfg(id){
  id = id==="srv" ? "srv" : "reg";
  if(!DB.sectors || typeof DB.sectors!=="object") DB.sectors = {};
  if(!DB.sectors[id]) DB.sectors[id] = {};
  var c = DB.sectors[id], d = SECTOR_DEFAULTS[id];
  for(var k in d) if(c[k]===undefined || c[k]==="") c[k] = d[k];
  return c;
}
function curCfg(){ return secCfg(curSector()); }
function periodsCount(){ return Math.max(1, Math.min(12, num(curCfg().periods, 8))); }
function toMin(t){
  var p = toEnDigits(String(t||"")).split(":");
  if(p.length<2) return null;
  return num(p[0],0)*60 + num(p[1],0);
}
function fromMin(m){
  m = Math.max(0, Math.round(m)) % (24*60);
  var h = Math.floor(m/60), x = m%60;
  return (h<10?"0":"")+h+":"+(x<10?"0":"")+x;
}
function periodTime(i){
  var c = curCfg(), st = toMin(c.start), len = Math.max(5, num(c.periodMin,45));
  if(st===null) return null;
  var from = st + (i-1)*len;
  return { from: fromMin(from), to: fromMin(from+len) };
}
function sectorTimeLine(id){
  var c = secCfg(id);
  return "الطابور "+c.assembly+" · الحصص من "+c.start+" · "+c.periods+" حصص × "+c.periodMin+" د · النهاية "+c.end;
}

/* ---------- مفاتيح مفصولة لكل فترة ---------- */
function dutyKeyOf(date, sec){ return date + "|" + (sec || curSector()); }
function sattKeyOf(date, sec){ return date + "|" + (sec || curSector()); }
function migrateSectors(){
  var k;
  if(DB.staffAtt) for(k in DB.staffAtt){
    if(k.indexOf("|")<0){ DB.staffAtt[k+"|reg"] = DB.staffAtt[k]; delete DB.staffAtt[k]; }
  }
  if(DB.duty) for(k in DB.duty){
    if(k.indexOf("|")<0){ DB.duty[k+"|reg"] = DB.duty[k]; delete DB.duty[k]; }
  }
  if(Array.isArray(DB.dutyPlan))  DB.dutyPlan.forEach(function(p){ if(!p.sector) p.sector = "reg"; });
  if(Array.isArray(DB.locations)) DB.locations.forEach(function(l){ if(!l.sector) l.sector = "reg"; });
  if(Array.isArray(DB.classes))   DB.classes.forEach(function(c){ if(!c.sector) c.sector = "reg"; });
  if(Array.isArray(DB.users)) DB.users.forEach(function(u){
    if(!Array.isArray(u.sectors) || !u.sectors.length) u.sectors = ["reg"];
  });
}

/* ---------- من يعمل في أي فترة ---------- */
function userSectors(u){
  return (u && Array.isArray(u.sectors) && u.sectors.length) ? u.sectors : ["reg"];
}
function userInSector(u, sec){ return userSectors(u).indexOf(sec) >= 0; }
function teacherInSector(tid, sec){
  sec = sec || curSector();
  var u = userOfTeacher(tid);
  if(u && userInSector(u, sec)) return true;
  return DB.assign.some(function(a){
    return a.teacherId===tid && classSector(classById(a.classId))===sec;
  });
}
function sectorTeachers(){
  var sec = curSector();
  var list = DB.teachers.filter(function(t){ return teacherInSector(t.id, sec); });
  return list.length ? list : DB.teachers;
}

/* ---------- النصاب: على النظامي بس ---------- */
function teacherLoad(tid){
  return DB.schedule.filter(function(s){
    return s.teacherId===tid && classSector(classById(s.classId))==="reg";
  }).length;
}
function teacherPeriods(tid){
  var sec = curSector();
  return DB.schedule.filter(function(s){
    return s.teacherId===tid && classSector(classById(s.classId))===sec;
  });
}
function periodsOn(tid, day){
  return teacherPeriods(tid).filter(function(s){ return s.day===day; });
}
function teacherBusy(teacherId, day, period, ignoreId){
  var sec = curSector();
  for(var i=0;i<DB.schedule.length;i++){
    var s = DB.schedule[i];
    if(s.id===ignoreId) continue;
    if(classSector(classById(s.classId))!==sec) continue;
    if(s.teacherId===teacherId && s.day===day && s.period===period) return s;
  }
  return null;
}
function freeTeachersAt(day, period, absentIds){
  return sectorTeachers().filter(function(t){
    if(absentIds && absentIds.indexOf("T"+t.id)>=0) return false;
    return !teacherBusy(t.id, day, period, null);
  }).sort(function(a,b){ return teacherLoad(a.id) - teacherLoad(b.id); });
}

/* ============================================================

function roleHolders(role){
  var sec = curSector();
  var n = DB.users.filter(function(u){ return u.role===role && userInSector(u, sec); })
    .map(function(u){ return u.name; });
  if(!n.length) n = DB.users.filter(function(u){ return u.role===role; }).map(function(u){ return u.name; });
  return n;
}
function contactFor(role){
  var t = ROLES[role] ? ROLES[role].name : role;
  var n = roleHolders(role);
  return n.length ? t + " (" + n.join("، ") + ")" : t;
}

   الطالب بيدخل من الصفحة الرئيسية من غير رقم سري، يسجّل بياناته

var WISH_TRACKS = [
  { id:"med", name:"الطب وعلوم الحياة",      subjects:["الرياضيات","الفيزياء"] },
  { id:"eng", name:"الهندسة وعلوم الحاسب",   subjects:["الكيمياء","البرمجة"] },
  { id:"bus", name:"الأعمال",                 subjects:["إدارة أعمال","المحاسبة"] },
  { id:"art", name:"الآداب والفنون",          subjects:["اللغة الأجنبية الثانية","علم النفس"] }
];
/* نوعية التعليم — بتحدد الطالب هيظهر في أنهي قسم */
var EDU_TYPES = [
  {id:"reg",  name:"نظامي", sector:"reg", note:"الفترة الأولى — دراسة منتظمة"},
  {id:"srv",  name:"خدمات", sector:"srv", note:"الفترة الثانية — فصول الخدمات"},
  {id:"home", name:"منازل", sector:"reg", note:"انتساب — امتحانات فقط"}
];
function eduType(id){
  for(var i=0;i<EDU_TYPES.length;i++) if(EDU_TYPES[i].id===id) return EDU_TYPES[i];
  return EDU_TYPES[0];
}
function eduName(id){ return eduType(id).name; }
function wishEdu(w){ return (w && w.edu) ? w.edu : "reg"; }
/* الرغبات اللي تخص الفترة الحالية */
function wishesOfSector(){
  wishesInit();
  var sec = curSector();
  return DB.wishes.filter(function(w){ return eduType(wishEdu(w)).sector === sec; });
}
function wishTrack(id){
  for(var i=0;i<WISH_TRACKS.length;i++) if(WISH_TRACKS[i].id===id) return WISH_TRACKS[i];
  return null;
}
function wishTrackName(id){ var t = wishTrack(id); return t ? t.name : "—"; }
function wishSubjects(id){ var t = wishTrack(id); return t ? t.subjects : []; }

/* تنضيف خفيف: مسافات بس — من غير تحويل الأرقام العربية
   عشان اسم الفصل يفضل زي ما الطالب كتبه */
function tidy(v){ return String(v==null?"":v).replace(/\s+/g," ").trim(); }
function wishesInit(){ if(!Array.isArray(DB.wishes)) DB.wishes = []; }
function wishByNat(nat, exceptId){
  wishesInit();
  var n = toEnDigits(String(nat||"")).replace(/\D/g,"");
  if(!n) return null;
  for(var i=0;i<DB.wishes.length;i++){
    if(DB.wishes[i].id===exceptId) continue;
    if(String(DB.wishes[i].natId)===n) return DB.wishes[i];
  }
  return null;
}
/* تحقّق من الرقم القومي المصري: ١٤ رقم، وأول رقم ٢ أو ٣ */
function natIdCheck(v){
  var n = toEnDigits(String(v||"")).replace(/\D/g,"");
  if(!n) return "اكتب الرقم القومي";
  if(n.length !== 14) return "الرقم القومي لازم ١٤ رقم (المكتوب دلوقتي "+n.length+")";
  if(n[0]!=="2" && n[0]!=="3") return "الرقم القومي لازم يبدأ بـ ٢ أو ٣";
  /* بنية الرقم القومي المصري:
     [0] القرن · [1-2] السنة · [3-4] الشهر · [5-6] اليوم · [7-8] المحافظة · [9-12] المسلسل · [13] التحقق */
  var m = Number(n.slice(3,5));
  if(m<1 || m>12) return "شهر الميلاد جوه الرقم القومي مش مظبوط";
  var d = Number(n.slice(5,7));
  if(d<1 || d>31) return "يوم الميلاد جوه الرقم القومي مش مظبوط";
  var gv = Number(n.slice(7,9));
  if(!((gv>=1 && gv<=35) || gv===88)) return "كود المحافظة جوه الرقم القومي مش مظبوط";
  return null;
}
function nameCheck(v){
  var s = cleanName(v);
  if(!s) return "اكتب الاسم";
  if(s.length < 6) return "اكتب الاسم كامل زي ما هو في شهادة الميلاد";
  if(s.split(/\s+/).length < 3) return "الاسم لازم يكون ثلاثي على الأقل زي شهادة الميلاد";
  if(/\d/.test(s)) return "الاسم مفيهوش أرقام";
  return null;
}

  var head = ["م","الاسم رباعي","الرقم القومي"].concat((f.fields||[]).map(function(fd){ return fd.label; })).concat(["تاريخ التسجيل","وقت التسجيل"]);
  var rows = subs.map(function(s,i){
    var base = [i+1, s.name, s.natId];
    (f.fields||[]).forEach(function(fd){ var v=(s.values||{})[fd.id]; base.push(v==null?"":(fd.type==="date"?fmtDate(v):v)); });
    base.push(s.date, s.time||"");
    return base;
  });
  var fname = f.title.replace(/\s+/g,"-")+"-"+today();
  loadXLSX().then(function(X){
    var aoa = [[DB.meta.moderia||""],[DB.meta.edara||""],[DB.meta.school||""],
      ["كشف: "+f.title+" — العام الدراسي "+(DB.meta.year||"")],[],head].concat(rows);
    var ws = X.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:5},{wch:30},{wch:18}].concat((f.fields||[]).map(function(){ return {wch:18}; })).concat([{wch:13},{wch:10}]);
    ws["!merges"] = [0,1,2,3].map(function(r){ return { s:{r:r,c:0}, e:{r:r,c:head.length-1} }; });
    for(var c=0;c<head.length;c++){ var hr=X.utils.encode_cell({r:5,c:c}); if(ws[hr]) ws[hr].s={font:{bold:true},alignment:{horizontal:"center"},fill:{fgColor:{rgb:"EEF1EC"}}}; }
    ws["!ref"] = X.utils.encode_range({s:{r:0,c:0}, e:{r:5+rows.length, c:head.length-1}});
    var wb = X.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
    X.utils.book_append_sheet(wb, ws, "تسجيلات");
    X.writeFile(wb, fname+".xlsx");
    toast("اتنزّل ملف الإكسيل");
  }).catch(function(){
    var csv = "\uFEFF"+[head].concat(rows).map(function(r){ return r.map(function(x){ var v=String(x==null?"":x); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\n");
    downloadBlob(csv, fname+".csv", "text/csv;charset=utf-8");
    toast("اتنزّل CSV");
  });
}

/* ============================================================
   ترحيل الرغبات → طلاب مسجّلين في الصف الثاني الثانوي
   الطالب اللي سجّل في الاستمارة كان في الأول، فبيترحّل للصف الثاني
   وكل بياناته بتتكتب (بما فيها المشتقّة من الرقم القومي).
   ============================================================ */
function grade2Classes(){
  return DB.classes.filter(function(c){ return Number(c.level)===2; })
    .sort(function(a,b){ return sortAr(a.name,b.name); });
}
function classForWishTrack(trackId, sector){
  var g2 = grade2Classes();
  var pool = sector ? g2.filter(function(c){ return classSector(c)===sector; }) : g2;
  if(!pool.length) pool = g2;   /* لو مفيش فصل في نفس القسم، جرّب أي فصل صف ثاني */
  return pool.filter(function(c){ return c.system==="bac" && c.track===trackId; })[0] ||
         pool.filter(function(c){ return c.track===trackId; })[0] || null;
}
function migrateWishToStudent(w, classId){
  wishesInit();
  /* منع التكرار بالرقم القومي */
  var exists = DB.students.filter(function(s){ return s.natId && s.natId===w.natId; })[0];
  if(exists){ w.migrated = exists.id; return {ok:false, dup:true, msg:"الرقم القومي مسجّل بالفعل كطالب"}; }
  var s = {
    id: uid("s"), status:"active", joined: today(),
    name: cleanName(w.name), natId: w.natId, classId: classId||"",
    prevClass: w.prevClass || "", bacSubject: w.subject || "", bacTrack: w.track || "",
    edu: w.edu || "reg", fromWish: w.id
  };
  enrichStudent(s);
  DB.students.push(s);
  w.migrated = s.id;
  return {ok:true, sid:s.id, assigned: !!classId};
}
function wishById(wid){
  wishesInit();
  for(var i=0;i<DB.wishes.length;i++) if(DB.wishes[i].id===wid) return DB.wishes[i];
  return null;
}
function modalMigrate(wid){
  var w = wishById(wid);
  if(!w){ toast("التسجيل مش موجود"); return; }
  var g2 = grade2Classes();
  var info = parseNationalId(w.natId);
  var guard = guardianFromName(w.name);
  var def = classForWishTrack(w.track, eduType(wishEdu(w)).sector);
  var opts = g2.map(function(c){
    var sel = def && c.id===def.id ? " selected":"";
    return '<option value="'+c.id+'"'+sel+'>'+esc(c.name)+' — '+esc(levelName(c.level))+' · '+esc(trackName(c.system,c.track))+'</option>';
  }).join("");
  var derived = '';
  if(info){
    derived += '<div>تاريخ الميلاد: <b>'+esc(fmtDate(info.birth))+'</b></div>'+
      '<div>النوع: <b>'+esc(info.gender)+'</b></div>'+
      '<div>محافظة الميلاد: <b>'+esc(info.govName)+'</b></div>';
  }
  if(guard) derived += '<div>ولي الأمر: <b>'+esc(guard)+'</b></div>';
  openModal(mHead("ترحيل الطالب للصف الثاني")+
    '<div class="mb">'+
    '<div style="background:#fbfcfa;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:13.5px;line-height:2">'+
      '<div><b>الاسم:</b> '+esc(w.name)+'</div>'+
      '<div><b>الرقم القومي:</b> <span style="direction:ltr;display:inline-block">'+esc(w.natId)+'</span></div>'+
      '<div><b>الفصل السابق:</b> '+esc(w.prevClass||"—")+'</div>'+
      '<div><b>المسار:</b> '+esc(wishTrackName(w.track))+' — '+esc(w.subject||"—")+'</div>'+
      derived+
    '</div>'+
    (g2.length
      ? '<label class="f" style="margin-top:12px"><span>الفصل في الصف الثاني</span><select id="mg_cls">'+opts+'</select></label>'+
        '<div class="note" style="margin-top:2px">البيانات المشتقّة من الرقم القومي هتتكتب مع الطالب تلقائيًا.</div>'
      : '<div class="note bad" style="margin-top:12px">مفيش فصول للصف الثاني لسه. أنشئ فصل «صف ثاني» الأول من شاشة الفصول، وبعدها رجّع اعمل الترحيل.</div>')+
    '</div>'+
    (g2.length ? mFoot("ترحيل وتسكين","doWMigrate")
               : '<div class="mf"><button class="btn" data-act="close">تمام</button></div>'));

}

var FIELD_TYPES = [

  {id:"date",     name:"تاريخ"},

  {id:"select",   name:"اختيار من قائمة"}

function fieldTypeName(t){ for(var i=0;i<FIELD_TYPES.length;i++) if(FIELD_TYPES[i].id===t) return FIELD_TYPES[i].name; return t; }
function formsInit(){ if(!Array.isArray(DB.forms)) DB.forms=[]; if(!DB.formSubs||typeof DB.formSubs!=="object") DB.formSubs={}; if(DB.trackOpen===undefined) DB.trackOpen=true; }
function formById(id){ formsInit(); for(var i=0;i<DB.forms.length;i++) if(DB.forms[i].id===id) return DB.forms[i]; return null; }
function formSubsOf(id){ formsInit(); return Array.isArray(DB.formSubs[id]) ? DB.formSubs[id] : []; }
function subByNat(formId, nat, exceptId){
  var n = toEnDigits(String(nat||"")).replace(/\D/g,"");
  var list = formSubsOf(formId);
  for(var i=0;i<list.length;i++){ if(list[i].id===exceptId) continue; if(String(list[i].natId)===n) return list[i]; }
  return null;
}

function wishRows(){

  var f = UI.filters || {};

}
/* ملف إكسيل حقيقي بتنسيق — بيفتح في إكسيل مباشرة */
function wishExcel(){
  var list = wishRows();
  if(!list.length){ toast("مفيش بيانات للتصدير"); return; }
  var head = ["م","الاسم رباعي","الرقم القومي","الفصل السابق","نوعية التعليم","المسار","مادة التخصص","تاريخ التسجيل","وقت التسجيل"];
  var rows = list.map(function(w,i){
    return [i+1, w.name, w.natId, w.prevClass, eduName(wishEdu(w)), wishTrackName(w.track), w.subject, w.date, w.time||""];
  });
  var fname = "رغبات-الطلاب-"+today();

  loadXLSX().then(function(X){
    var aoa = [
      [DB.meta.moderia||""],
      [DB.meta.edara||""],
      [DB.meta.school||""],
      ["كشف رغبات الطلاب — مسارات البكالوريا المصرية — العام الدراسي "+(DB.meta.year||"")],
      [],
      head
    ].concat(rows);
    var ws = X.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:5},{wch:32},{wch:18},{wch:14},{wch:13},{wch:24},{wch:24},{wch:13},{wch:10}];
    ws["!merges"] = [0,1,2,3].map(function(r){
      return { s:{r:r,c:0}, e:{r:r,c:head.length-1} };
    });
    ws["!rows"] = [{hpt:18},{hpt:18},{hpt:22},{hpt:20},{hpt:8},{hpt:22}];
    /* تنسيق: عناوين وسط وغامق */
    for(var r=0;r<6;r++){
      var ref = X.utils.encode_cell({r:r,c:0});
      if(ws[ref]) ws[ref].s = { font:{bold:true, sz: r===2?14:11}, alignment:{horizontal:"center"} };
    }
    for(var c=0;c<head.length;c++){
      var hr = X.utils.encode_cell({r:5,c:c});
      if(ws[hr]) ws[hr].s = {
        font:{bold:true}, alignment:{horizontal:"center", vertical:"center"},
        fill:{fgColor:{rgb:"EEF1EC"}},
        border:{ top:{style:"thin"}, bottom:{style:"thin"}, left:{style:"thin"}, right:{style:"thin"} }
      };
    }
    ws["!ref"] = X.utils.encode_range({s:{r:0,c:0}, e:{r:5+rows.length, c:head.length-1}});
    var wb = X.utils.book_new();
    wb.Workbook = { Views:[{ RTL:true }] };

    X.writeFile(wb, fname+".xlsx");
    toast("اتنزّل ملف الإكسيل");
  }).catch(function(){
    /* من غير إنترنت: CSV بيفتح في إكسيل عادي */
    var csv = "\uFEFF" + [head].concat(rows).map(function(r){
      return r.map(function(x){
        var v = String(x==null?"":x);
        return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
      }).join(",");
    }).join("\n");
    downloadBlob(csv, fname+".csv", "text/csv;charset=utf-8");
    toast("اتنزّل CSV — بيفتح في إكسيل عادي");
  });
}
function downloadBlob(content, filename, type){
  try{
    var blob = new Blob([content], {type:type});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    return true;
  }catch(e){ toast("التنزيل مش متاح على المتصفح ده"); return false; }
}

/* ============================================================
   توليد جداول الحصص — مرتبط بالنصاب القانوني المصري
   ------------------------------------------------------------
   النصاب الأسبوعي للمرحلة الثانوية (قانون الكادر):
     معلم مساعد 18 · معلم 18 · معلم أول 17 · معلم أول (أ) 16
     معلم خبير 16 · كبير معلمين 14
   والمشرف على المادة يُخفَّض له حصتان.
   ============================================================ */

var NISAB_SEC = {
  "معلم مساعد":18, "معلم":18, "معلم أول":17, "معلم أول أ":16,
  "معلم خبير":16, "كبير معلمين":14
};
var NISAB_SUPERVISOR_CUT = 2;

function nisabOf(tid){
  var s = staffById("T"+tid);
  var job = s ? s.job : "معلم";
  var base = NISAB_SEC[job];
  if(base===undefined) base = NISAB_SEC["معلم"];
  var t = teacherById(tid);
  if(t && t.supervisor) base -= NISAB_SUPERVISOR_CUT;
  return Math.max(1, base);
}
function nisabJob(tid){
  var s = staffById("T"+tid);
  var job = (s && NISAB_SEC[s.job]!==undefined) ? s.job : "معلم";
  var t = teacherById(tid);
  return job + (t && t.supervisor ? " · مشرف مادة (−2)" : "");
}
/* حصص المعلم الحالية في الفترة الحالية */
function loadNow(tid){ return teacherPeriods(tid).length; }

/* ---------- حصص المادة الأسبوعية ---------- */
function subjHours(su){ return Math.max(0, num(su.hours, 0)); }
/* توزيع افتراضي مقترح لو الوكيل ما حددش */
function suggestHours(su){
  var n = normAr(su.name);
  if(/عربيه|عربي/.test(n)) return 6;
  if(/اجنبيه الاولي|انجليزي|لغه اجنبيه اولي/.test(n)) return 5;
  if(/رياضيات|فيزياء|كيمياء|احياء/.test(n)) return 4;
  if(/اجنبيه الثانيه|فرنساوي|الماني/.test(n)) return 3;
  if(/تاريخ|جغرافيا|فلسفه|علم نفس|اقتصاد|احصاء|برمجه|محاسبه|اداره/.test(n)) return 3;
  if(/دينيه|وطنيه|رياضيه|انشطه|مكتبه|حاسب/.test(n)) return 2;
  return su.counted ? 3 : 2;
}

/* ============================================================
   المولّد
   ============================================================ */
function genContext(){
  var classes = myClasses().slice().sort(function(a,b){ return a.level-b.level || sortAr(a.name,b.name); });
  var days = schoolDayIdx();
  var P = periodsCount();
  var items = [];      /* كل حصة مطلوبة */
  var problems = [];
  var capacity = classes.length * days.length * P;
  var demand = 0;
  var perTeacher = {};

  classes.forEach(function(c){
    var subs = DB.subjects.filter(function(s){ return s.classId===c.id; });
    if(!subs.length) problems.push({t:"bad", m:"فصل «"+c.name+"» مفيهوش مواد"});
    var classHours = 0;
    subs.forEach(function(su){
      var h = subjHours(su);
      var a = DB.assign.filter(function(x){ return x.classId===c.id && x.subjectId===su.id; })[0];
      if(!h){ problems.push({t:"warn", m:"مادة «"+su.name+"» في «"+c.name+"» مفيش لها حصص أسبوعية"}); return; }
      if(!a){ problems.push({t:"bad", m:"مادة «"+su.name+"» في «"+c.name+"» مفيش لها معلم"}); return; }
      classHours += h;
      demand += h;
      perTeacher[a.teacherId] = (perTeacher[a.teacherId]||0) + h;
      for(var i=0;i<h;i++) items.push({ classId:c.id, subjectId:su.id, teacherId:a.teacherId });
    });
    var slots = days.length * P;
    if(classHours > slots)
      problems.push({t:"bad", m:"«"+c.name+"»: مطلوب "+classHours+" حصة والجدول بيسع "+slots+" بس"});
    else if(classHours && classHours < slots)
      problems.push({t:"warn", m:"«"+c.name+"»: "+(slots-classHours)+" خانة هتفضل فاضية"});
  });

  var over = [];
  for(var tid in perTeacher){
    var n = nisabOf(tid);
    if(perTeacher[tid] > n)
      over.push({tid:tid, need:perTeacher[tid], nisab:n});
  }
  return { classes:classes, days:days, P:P, items:items, problems:problems,
           capacity:capacity, demand:demand, perTeacher:perTeacher, over:over };
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
/* محاولة واحدة لبناء الجدول */
function buildOnce(ctx, respectNisab){
  var byClass = {};
  ctx.items.forEach(function(it){ (byClass[it.classId] = byClass[it.classId] || []).push(it); });
  for(var k in byClass) shuffle(byClass[k]);

  var placed = [];                 /* {classId, day, period, subjectId, teacherId} */
  var tBusy = {};                  /* teacherId|day|period */
  var tCount = {};                 /* عدد حصص المعلم */
  var dayHas = {};                 /* classId|day|subjectId */
  var tDay = {};                   /* teacherId|day → عدد */

  var order = shuffle(ctx.classes.slice());
  for(var p=1; p<=ctx.P; p++){
    for(var di=0; di<ctx.days.length; di++){
      var d = ctx.days[di];
      order.forEach(function(c){
        var pool = byClass[c.id];
        if(!pool || !pool.length) return;
        var pick = -1, fallback = -1;
        for(var i=0;i<pool.length;i++){
          var it = pool[i];
          if(tBusy[it.teacherId+"|"+d+"|"+p]) continue;
          if(respectNisab && (tCount[it.teacherId]||0) >= nisabOf(it.teacherId)) continue;
          if(fallback<0) fallback = i;
          if(dayHas[c.id+"|"+d+"|"+it.subjectId]) continue;      /* مادتين في يوم واحد */
          if((tDay[it.teacherId+"|"+d]||0) >= ctx.P-1) continue; /* توزيع عبء المعلم */
          pick = i; break;
        }
        if(pick<0) pick = fallback;
        if(pick<0) return;
        var ch = pool.splice(pick,1)[0];
        tBusy[ch.teacherId+"|"+d+"|"+p] = 1;
        tCount[ch.teacherId] = (tCount[ch.teacherId]||0)+1;
        tDay[ch.teacherId+"|"+d] = (tDay[ch.teacherId+"|"+d]||0)+1;
        dayHas[c.id+"|"+d+"|"+ch.subjectId] = 1;
        placed.push({ classId:c.id, day:d, period:p, subjectId:ch.subjectId, teacherId:ch.teacherId });
      });
    }
  }
  var left = 0;
  for(var kk in byClass) left += byClass[kk].length;
  return { placed:placed, left:left, tCount:tCount, remaining:byClass };
}
/* أفضل محاولة من عدة محاولات */
function generateSchedule(respectNisab, tries){
  var ctx = genContext();
  if(!ctx.items.length) return { ctx:ctx, best:null };
  var best = null;
  for(var i=0;i<(tries||40);i++){
    var r = buildOnce(ctx, respectNisab);
    if(!best || r.left < best.left) best = r;
    if(best.left===0) break;
  }
  return { ctx:ctx, best:best };
}

/* ---------- شاشة التوليد ---------- */
function viewGenSched(){
  var g = gate("classes","teachers","subjects","assign");
  if(g) return g;
  var ctx = genContext();
  var days = ctx.days.length, P = ctx.P;
  var res = UI.gen || null;

  var h = '<div class="note">البرنامج بيوزّع الحصص على الفصول والأيام لوحده، ويراعي:<br>'+
    '• مايحطش معلم في فصلين في نفس الوقت<br>'+
    '• مايعديش <b>النصاب القانوني</b> لكل معلم حسب درجته الوظيفية<br>'+
    '• مايكررش نفس المادة مرتين في اليوم للفصل الواحد<br>'+
    '• يوزّع عبء المعلم على الأيام ومايسيبش خانات فاضية في نص اليوم</div>';

  h += '<div class="stats" style="margin:11px 0">'+
    stat("الحصص المطلوبة", ctx.demand, "حصة أسبوعيًا","acc")+
    stat("سعة الجدول", ctx.capacity, ctx.classes.length+" فصل × "+days+" يوم × "+P,
         ctx.demand>ctx.capacity?"acc-b":"")+
    stat("الفصول", ctx.classes.length, "في الفترة","")+
    stat("المعلمون", Object.keys(ctx.perTeacher).length, "لهم تكليفات","")+'</div>';

  /* المشاكل */
  var bad = ctx.problems.filter(function(x){ return x.t==="bad"; });
  var warn = ctx.problems.filter(function(x){ return x.t==="warn"; });
  if(ctx.over.length){
    h += '<div class="note bad"><b>معلمون فوق النصاب القانوني:</b><br>'+
      ctx.over.map(function(o){
        return esc(teacherName(o.tid))+" — مطلوب منه "+o.need+" حصة ونصابه "+o.nisab;
      }).join("<br>")+
      '<br><br>التوليد هيوقف عند النصاب وهيسيب الباقي غير موزّع. راجع التكليفات أو حصص المواد.</div>';
  }
  if(bad.length) h += '<div class="note bad"><b>لازم تتصلح قبل التوليد:</b><br>'+
    bad.slice(0,10).map(function(x){ return "• "+esc(x.m); }).join("<br>")+
    (bad.length>10? "<br>… و"+(bad.length-10)+" غيرها" : "")+'</div>';
  if(warn.length) h += '<div class="note warn"><b>تنبيهات:</b><br>'+
    warn.slice(0,8).map(function(x){ return "• "+esc(x.m); }).join("<br>")+
    (warn.length>8? "<br>… و"+(warn.length-8)+" غيرها" : "")+'</div>';

  h += '<div class="card"><div class="hd"><h3>التوليد</h3></div><div class="bd">'+
    '<label class="f"><span>الالتزام بالنصاب القانوني</span><select id="gn_nisab">'+
    '<option value="1">نعم — ماتعديش النصاب (الافتراضي)</option>'+
    '<option value="0">لا — وزّع كل الحصص حتى لو زاد النصاب</option>'+
    '</select></label>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn" data-act="genRun">توليد الجدول</button>'+
    (res? '<button class="btn ghost" data-act="genRun">توليد بترتيب مختلف</button>'+
          '<button class="btn seal" data-act="genApply">اعتماد الجدول ده</button>'+
          '<button class="btn ghost" data-act="genClear">إلغاء</button>' : '')+
    '</div>';
  if(!res) h += '<div class="note" style="margin-top:10px">التوليد بيجرّب ٤٠ ترتيب مختلف وبياخد أحسنهم. '+
    'ولو الناتج مش عاجبك اضغط «توليد بترتيب مختلف» تاني.</div>';
  h += '</div></div>';

  if(res){
    h += '<div class="stats" style="margin-bottom:11px">'+
      stat("اتوزّع", res.placed.length, "حصة","acc")+
      stat("لم يتوزّع", res.left, "حصة", res.left?"acc-b":"acc")+
      stat("نسبة التغطية", ctx.demand? Math.round(res.placed.length/ctx.demand*1000)/10+"%":"—","","acc-g")+
      stat("معلمون فوق النصاب", (function(){
        var n=0; for(var t in res.tCount) if(res.tCount[t]>nisabOf(t)) n++; return n;
      })(), "معلم","")+'</div>';

    if(res.left){
      var un = [];
      for(var cid in res.remaining) res.remaining[cid].forEach(function(it){
        un.push(className(it.classId)+" — "+subjName(it.subjectId)+" ("+teacherName(it.teacherId)+")");
      });
      h += '<div class="note bad"><b>'+res.left+' حصة ما لقتش مكان:</b><br>'+
        un.slice(0,12).map(function(x){ return "• "+esc(x); }).join("<br>")+
        (un.length>12? "<br>… و"+(un.length-12)+" غيرها":"")+
        '<br><br>غالبًا السبب: معلم وصل نصابه، أو تعارض في المواعيد. جرّب توليد تاني أو قلّل حصص المادة.</div>';
    }

    /* معاينة الجدول */
    var byCls = {};
    res.placed.forEach(function(x){ (byCls[x.classId] = byCls[x.classId]||[]).push(x); });
    ctx.classes.forEach(function(c){
      h += '<div class="card"><div class="hd"><h3>'+esc(c.name)+'</h3>'+
        '<span class="tag">'+((byCls[c.id]||[]).length)+' حصة</span></div><div class="bd">'+
        '<div class="tbl-wrap"><table class="sched"><thead><tr><th>اليوم</th>';
      for(var p=1;p<=P;p++) h += '<th>'+p+'</th>';
      h += '</tr></thead><tbody>';
      ctx.days.forEach(function(d){
        h += '<tr><th style="min-width:52px">'+esc(DAYS[d])+'</th>';
        for(var p=1;p<=P;p++){
          var cell = null;
          (byCls[c.id]||[]).forEach(function(x){ if(x.day===d && x.period===p) cell = x; });
          if(cell) h += '<td class="has"><b>'+esc(subjName(cell.subjectId))+'</b><small>'+esc(teacherName(cell.teacherId))+'</small></td>';
          else h += '<td class="free">—</td>';
        }
        h += '</tr>';
      });
      h += '</tbody></table></div></div></div>';
    });
    h += '<div class="note warn">ده معاينة بس — لسه ما اتحفظش. اضغط <b>«اعتماد الجدول ده»</b> عشان يستبدل '+
      'جداول الفترة الحالية، وبعدها تقدر تعدّل أي خانة يدويًا من «جداول الفصول».</div>';
  }
  return h;
}

Object.assign(ACTS, {
  stTab: function(el){ UI.sub = {st: el.dataset.t}; render(); },
  dayPick: function(el){ UI.sub = Object.assign({}, UI.sub, {day: Number(el.dataset.d)}); render(); },
  autoHours: function(){
    var n = 0;
    myClasses().forEach(function(c){
      DB.subjects.filter(function(s){ return s.classId===c.id; }).forEach(function(su){
        if(!subjHours(su)){ su.hours = suggestHours(su); n++; }
      });
    });
    saveNow(); render();
    toast(n? "اتحط توزيع مبدئي لـ "+n+" مادة — راجعه وعدّله" : "كل المواد لها حصص بالفعل");
  },
  togSup: function(el){
    var t = teacherById(el.dataset.id);
    if(!t) return;
    t.supervisor = !t.supervisor;
    saveNow(); render();
    toast(t.supervisor? "اتعيّن مشرف مادة — نصابه قلّ حصتين" : "اتلغى الإشراف");
  },
  genRun: function(){
    var respect = val("gn_nisab") !== "0";
    var r = generateSchedule(respect, 40);
    if(!r.best){ toast("مفيش حصص مطلوبة — اضبط حصص المواد الأول"); return; }
    UI.gen = r.best;
    UI.gen.respect = respect;
    render();
    toast(r.best.left ? "اتوزّع "+r.best.placed.length+" حصة، وفاضل "+r.best.left
                      : "اتوزّعت كل الحصص ✓");
  },
  genClear: function(){ UI.gen = null; render(); },
  genApply: function(){
    if(!UI.gen){ toast("مفيش جدول مولّد"); return; }
    if(!confirm("هيستبدل جداول فترة "+sectorName(curSector())+" كلها بالجدول المولّد. متأكد؟")) return;
    var mine = myClassIds();
    DB.schedule = DB.schedule.filter(function(s){ return !mine[s.classId]; });
    UI.gen.placed.forEach(function(x){
      DB.schedule.push({ id:uid("h"), classId:x.classId, day:x.day, period:x.period,
                         subjectId:x.subjectId, teacherId:x.teacherId });
    });
    var n = UI.gen.placed.length;
    UI.gen = null;
    saveNow();
    UI.sub = {st:"classes"};
    render();
    toast("اتعتمد الجدول — "+n+" حصة");
  }
});
