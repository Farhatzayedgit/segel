function impOptions(sc, sel, colIdx){
  var h = '<option value="">— تجاهل —</option>';
  sc.fields.forEach(function(f){
    h += '<option value="'+f.k+'"'+(sel===f.k?" selected":"")+'>'+esc(f.label)+(f.req?" *":"")+'</option>';
  });
  if(UI.imp.target==="weekly") h += '<option value="__w"'+(sel==="__w"?" selected":"")+'>تقييم أسبوعي</option>';
  if(UI.imp.target==="attendance" || UI.imp.target==="staffAttImp") h += '<option value="__d"'+(sel==="__d"?" selected":"")+'>يوم حضور</option>';
  if(UI.imp.target==="marks"){
    for(var i=1;i<=WEEKLY_COUNT;i++)
      h += '<option value="__w'+i+'"'+(sel==="__w"+i?" selected":"")+'>تقييم أسبوعي '+i+'</option>';
  }
  return h;
}

/* ---------- التنفيذ ---------- */
function impRun(){
  var t = UI.imp.target, g = UI.imp.grid, hr = UI.imp.header, map = UI.imp.map;
  UI.imp.mode = val("impMode") || "add";
  var rows = g.slice(hr+1).filter(function(r){ return r.some(function(c){ return c!==""; }); });
  var recs = rows.map(function(r){
    var o = {__extra:[]};
    map.forEach(function(k, c){
      if(!k) return;
      var v = r[c]||"";
      if(k.indexOf("__")===0){ o.__extra.push({k:k, c:c, v:v}); return; }
      o[k] = o[k]!==undefined && k!=="name" ? o[k] : (o[k]!==undefined ? o[k]+" "+v : v);
    });
    /* دمج أعمدة الاسم المتعددة */
    var nameCols = [];
    map.forEach(function(k,c){ if(k==="name") nameCols.push(r[c]||""); });
    if(nameCols.length) o.name = cleanName(nameCols.join(" "));
    return o;
  });
  var res;
  try{
    switch(t){
      case "exams":      res = impExams(recs); break;
      case "home":       res = impHome(recs); break;
      case "students":   res = impStudents(recs); break;
      case "teachers":   res = impTeachers(recs); break;
      case "classes":    res = impClasses(recs); break;
      case "subjects":   res = impSubjects(recs); break;
      case "marks":      res = impMarks(recs); break;
      case "weekly":     res = impWeekly(recs, g, hr, map); break;
      case "attendance": res = impAttendance(recs, g, hr, map); break;
      case "schedule":   res = impSchedule(recs); break;
      case "assign":     res = impAssign(recs); break;
      case "staffImp":   res = impStaff(recs); break;
      case "staffAttImp":res = impStaffAtt(recs, g, hr, map); break;
      default: res = {add:0, upd:0, skip:0, err:["نوع استيراد غير معروف"]};
    }
  }catch(e){ res = {add:0, upd:0, skip:0, err:["حصل خطأ أثناء القراءة: "+e.message]}; }
  saveNow();
  impResult(res);
}
function impResult(r){
  var h = '<div class="mb">';
  h += '<div class="stats">'+
    stat("اتضاف", r.add, "سطر", r.add?"acc":"")+
    stat("اتحدّث", r.upd, "سطر","")+
    stat("اتخطّى", r.skip, "مكرر أو ناقص", r.skip?"acc-g":"")+
    stat("مرفوض", (r.err||[]).length, "سطر", (r.err||[]).length?"acc-b":"")+'</div>';
  if(r.note) h += '<div class="note" style="margin-top:11px">'+r.note+'</div>';
  if(r.err && r.err.length){
    h += '<div class="note bad" style="margin-top:11px;max-height:180px;overflow:auto"><b>أسطر ما دخلتش:</b><br>'+
      r.err.slice(0,40).map(function(x){ return "• "+esc(x); }).join("<br>")+
      (r.err.length>40? "<br>… و"+(r.err.length-40)+" سطر تاني" : "")+'</div>';
  }
  h += '</div><div class="mf"><button class="btn" data-act="impDone">تمام</button></div>';
  MODAL.innerHTML = mHead("نتيجة الاستيراد") + h;
}

/* البحث عن فصل بالاسم — لازم يراعي القسم، لأن «٢/٤ نظامي» غير «٢/٤ خدمات».
   من غير كده طالب الخدمات بيتحط في فصل نظامي ويظهر في الكشف الغلط. */
function findClassByName(name, sector){
  if(!name) return null;
  var n = normAr(name);
  var pool = DB.classes;
  if(sector==="reg" || sector==="srv"){
    var inSec = DB.classes.filter(function(c){ return classSector(c)===sector; });
    pool = inSec;
  }
  for(var i=0;i<pool.length;i++) if(normAr(pool[i].name)===n) return pool[i];
  for(var j=0;j<pool.length;j++) if(similar(pool[j].name, name)>=0.75) return pool[j];
  return null;
}
function findTeacherByName(name){
  if(!name) return null;
  var n = normAr(name);
  for(var i=0;i<DB.teachers.length;i++) if(normAr(DB.teachers[i].name)===n) return DB.teachers[i];
  var best=null, bs=0;
  DB.teachers.forEach(function(t){ var s=similar(t.name,name); if(s>bs){bs=s;best=t;} });
  return bs>=0.7 ? best : null;
}
function findSubjInClass(cid, name){
  if(!name) return null;
  var n = normAr(name);
  var subs = DB.subjects.filter(function(s){ return s.classId===cid; });
  for(var i=0;i<subs.length;i++) if(normAr(subs[i].name)===n) return subs[i];
  var best=null, bs=0;
  subs.forEach(function(s){ var x=similar(s.name,name); if(x>bs){bs=x;best=s;} });
  return bs>=0.7 ? best : null;
}
function findStudent(rec, classId){
  var pool = classId ? studentsOf(classId) : DB.students;
  if(rec.seat){
    var seat = toEnDigits(rec.seat).trim();
    for(var i=0;i<pool.length;i++) if(String(pool[i].seat||"").trim()===seat && seat!=="") return pool[i];
  }
  if(rec.name){
    var n = normAr(rec.name);
    for(var j=0;j<pool.length;j++) if(normAr(pool[j].name)===n) return pool[j];
    var best=null, bs=0;
    pool.forEach(function(s){ var x=similar(s.name, rec.name); if(x>bs){bs=x;best=s;} });
    if(bs>=0.7) return best;
  }
  return null;
}

/* استيراد جدول الامتحانات */
function impExams(recs){
  var r = {add:0, upd:0, skip:0, err:[]};
  examsInit();
  var term = UI.examTerm || "1";
  recs.forEach(function(o,i){
    var sub = String(o.subject||"").trim();
    if(!sub){ r.err.push("سطر "+(i+1)+": مفيش مادة"); return; }
    var date = parseDateCell(o.date);
    if(!date){ r.err.push("سطر "+(i+1)+": تاريخ غير مفهوم ("+sub+")"); return; }
    var lv = [];
    if(o.levels){
      String(o.levels).split(/[,،/]+/).forEach(function(x){
        var L = parseLevel(x); if(L && lv.indexOf(L)<0) lv.push(L);
      });
    }
    var ex = DB.exams.filter(function(x){
      return String(x.term)===String(term) && normAr(x.subject)===normAr(sub) && x.date===date; })[0];
    if(ex && UI.imp.mode==="add"){ r.skip++; return; }
    if(!ex){ ex = { id:uid("ex"), term:term }; DB.exams.push(ex); r.add++; }
    else r.upd++;
    ex.subject = sub; ex.date = date; ex.levels = lv;
    if(o.from) ex.from = normTime(o.from);
    if(o.to)   ex.to   = normTime(o.to);
    ex.dur = num(o.dur,0);
    if(!ex.dur && ex.from && ex.to){
      var a = toMin(ex.from), b = toMin(ex.to);
      if(a!==null && b!==null && b>a) ex.dur = b-a;
    }
    if(o.notes) ex.notes = String(o.notes).trim();
  });
  return r;
}
/* بيفهم التاريخ من صيغ مختلفة: 2027-01-09 · 9/1/2027 · ٩-١-٢٠٢٧ */
function parseDateCell(v){
  var t = toEnDigits(String(v==null?"":v)).trim();
  if(!t) return "";
  var m = t.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  m = t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if(m) return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  var d = new Date(t);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return "";
}
function normTime(v){
  var t = toEnDigits(String(v==null?"":v)).trim();
  var m = t.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
  if(!m) return "";
  return ("0"+m[1]).slice(-2)+":"+m[2];
}

/* بيفهم نوعية التعليم من أي صياغة في الشيت */
function parseEdu(v){
  var t = normAr(String(v==null?"":v));
  if(!t) return "";
  if(/منازل|انتساب|منتسب|home/.test(t)) return "home";
  if(/خدمات|خدمه|خدمة|فتره ثانيه|فترة ثانية|مسائي|service/.test(t)) return "srv";
  if(/نظام|انتظام|منتظم|عام|صباحي|reg/.test(t)) return "reg";
  return "";
}
/* بيفهم المسار من الاسم */
function parseWishTrack(v){
  var t = normAr(String(v==null?"":v));
  if(!t) return "";
  var wt = wishTracks();
  for(var i=0;i<wt.length;i++) if(normAr(wt[i].name)===t) return wt[i].id;
  if(/طب|حياه|حياة|بيولوج/.test(t)) return "med";
  if(/هندس|حاسب|كمبيوتر|برمج/.test(t)) return "eng";
  if(/اعمال|أعمال|تجار|محاسب|اقتصاد/.test(t)) return "bus";
  if(/اداب|آداب|فنون|لغات|نفس/.test(t)) return "art";
  return "";
}
function impStudents(recs){
  var r = {add:0, upd:0, skip:0, err:[], dup:0, home:0, srv:0, reg:0};
  var defCls = UI.imp.ctx.classId || "";
  var newCls = 0;

  /* فهرس الرقم القومي — المفتاح الوحيد اللي بنمنع بيه التكرار */
  var byNat = {};
  DB.students.forEach(function(s){ if(s.natId) byNat[s.natId] = s; });
  /* فهرس مؤقت للأرقام اللي جوه نفس الملف عشان الملف نفسه ميكررش */
  var seenInFile = {};

  recs.forEach(function(o, i){
    var name = cleanName(o.name||"");
    if(!name || normAr(name).length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم مفهوم"); return; }

    var nat = toEnDigits(String(o.natId==null?"":o.natId)).replace(/\D/g,"");
    if(nat && nat.length!==14){
      r.err.push("سطر "+(i+1)+": الرقم القومي مش ١٤ رقم ("+name+")");
      nat = "";
    }
    /* تكرار جوه نفس الملف */
    if(nat && seenInFile[nat]){ r.dup++; return; }
    if(nat) seenInFile[nat] = 1;

    /* نوعية التعليم بتحدد القسم والتسكين */
    var edu = parseEdu(o.edu) || parseEdu(o.cls) || "";
    var isHome = edu==="home";

    /* الفصل — المنازل ملهمش فصول فمبنعملهمش فصل */
    var cid = "";
    if(!isHome){
      cid = defCls;
      if(o.cls){
        var wantSec = edu==="srv" ? "srv" : (edu==="reg" ? "reg" : curSector());
        var c = findClassByName(o.cls, wantSec);
        if(!c){
          var lvl = parseLevel(o.level) || parseLevel(o.cls) || 1;
          c = {id:uid("c"), name:cleanName(o.cls), level:lvl, system:"gen", track:"none", room:"",
               sector: wantSec};
          if(c.level>1) c.track = parseTrack(o.cls) || "sci";
          DB.classes.push(c); newCls++;
        }
        cid = c.id;
      }
    }

    /* البحث عن الطالب: بالرقم القومي أولًا وأخيرًا.
       من غير رقم قومي بنرجع للاسم بس ننبّه إنه غير موثوق. */
    var exist = nat ? byNat[nat] : null;
    if(!nat){
      DB.students.forEach(function(s){
        if(exist || s.natId) return;   /* اللي عنده رقم قومي بنسيبه للمفتاح */
        if(normAr(s.name)===normAr(name)) exist = s;
      });
    }

    if(exist && UI.imp.mode==="add"){ r.skip++; return; }
    var s = (exist && UI.imp.mode==="update") ? exist : stampSrc({id:uid("s"), status:"active", joined:today()}, "import");
    if(s===exist) r.upd++; else { DB.students.push(s); r.add++; }

    s.name = name;
    if(nat){ s.natId = nat; byNat[nat] = s; }

    /* التوزيع حسب النوعية */
    if(edu){
      s.edu = edu;
      s.sector = eduType(edu).sector;
      if(edu==="home"){ s.classId = ""; r.home++; }
      else r[edu==="srv"?"srv":"reg"]++;
    }else if(!s.edu){
      s.edu = "reg";
      s.sector = curSector();
      r.reg++;
    }
    if(!isHome && cid) assignStudentToClass(s, cid);

    var impLvl = parseLevel(o.level) || parseLevel(o.cls) || 0;
    if(impLvl) setStudentLevel(s, impLvl);
    else if(!studentLevelOf(s)) setStudentLevel(s, 1);

    var trk = parseWishTrack(o.track);
    if(trk) s.bacTrack = trk;
    if(o.subject) s.bacSubject = String(o.subject).trim();
    if(o.seat!==undefined && o.seat!=="") s.seat = toEnDigits(o.seat).trim();
    if(o.guardian) s.guardian = cleanName(o.guardian);
    if(o.phone) s.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");
    if(o.religion){ var rel = normAr(o.religion); s.religion = /مسيح|قبط|c/.test(rel)?"مسيحي":"مسلم"; }
    if(o.notes) s.notes = o.notes;
    enrichStudent(s);   /* استخراج المواليد والنوع والمحافظة وولي الأمر تلقائيًا */
  });

  var notes = [];
  if(newCls) notes.push("اتعمل <b>"+newCls+"</b> فصل جديد من أسماء الفصول اللي في الملف — راجعها من شاشة الفصول.");
  if(r.dup)  notes.push("<b>"+r.dup+"</b> صف اتخطّى لأن رقمه القومي متكرر جوه نفس الملف.");
  var dist = [];
  if(r.reg)  dist.push(r.reg+" نظامي");
  if(r.srv)  dist.push(r.srv+" خدمات");
  if(r.home) dist.push(r.home+" منازل");
  if(dist.length) notes.push("التوزيع حسب النوعية: <b>"+dist.join(" · ")+"</b>.");
  if(notes.length) r.note = notes.join("<br>");
  return r;
}

    else r.err.push("العمود «"+head+"» عنوانه مش تاريخ — اتتجاهل");
  });
  if(!dcols.length) return {add:0,upd:0,skip:0,err:r.err.concat(["مفيش أعمدة تواريخ صالحة"])};
  var days = {};
  recs.forEach(function(o,i){
    var s = findStudent(o, cid);
    if(!s){ r.err.push("سطر "+(i+1)+": ما لقيتش الطالب «"+(o.name||o.seat||"")+"»"); return; }
    var any = false;
    (o.__extra||[]).forEach(function(x){
      if(x.k!=="__d") return;
      var col = null;
      dcols.forEach(function(dc){ if(dc.c===x.c) col = dc; });

      var v = parseAttV(x.v);

  });
  r.note = "اتسجّل حضور <b>"+Object.keys(days).length+"</b> يوم للفصل.";

function parseDateCell(v){
  var s = toEnDigits(v).trim();
  var m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(s);
  if(m) return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]);
  m = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/.exec(s);
  if(m) return m[3]+"-"+pad2(m[2])+"-"+pad2(m[1]);
  m = /^(\d{1,2})[-\/](\d{1,2})$/.exec(s);
  if(m){
    var y = (DB.meta.year.match(/\d{4}/)||[new Date().getFullYear()])[0];
    return y+"-"+pad2(m[2])+"-"+pad2(m[1]);
  }
  return null;
}
function pad2(x){ x = String(x); return x.length<2 ? "0"+x : x; }

function parseFbConfig(text){
  var s = String(text||"").trim();
  if(!s) return null;
  /* الكود اللي فايربيز بيديه فيه سطور import فيها أقواس —
     فبندوّر على firebaseConfig نفسها ونعدّ الأقواس عشان نجيب الكائن الصح */
  var start = 0;
  var m = /firebaseConfig\s*=\s*/.exec(s);
  if(m) start = m.index + m[0].length;
  var i = s.indexOf("{", start);
  if(i<0) return null;
  var depth = 0, j = -1;
  for(var k=i;k<s.length;k++){
    if(s[k]==="{") depth++;
    else if(s[k]==="}"){ depth--; if(depth===0){ j=k; break; } }
  }
  if(j<0) return null;
  s = s.slice(i, j+1);
  try{ return JSON.parse(s); }catch(e){}
  try{ return JSON.parse(jsObjToJson(s)); }catch(e2){ return null; }
}
/* تحويل كائن جافاسكريبت لـJSON: بيشيل التعليقات ويقفل المفاتيح بعلامات
   ويمسح الفواصل الزيادة — من غير ما يلخبط النصوص اللي جواها // زي الروابط */
function jsObjToJson(src){
  var out = "", i = 0, n = src.length;
  while(i < n){
    var ch = src[i];
    if(ch === '"' || ch === "'"){
      var q = ch, buf = '"'; i++;
      while(i < n && src[i] !== q){
        if(src[i] === "\\"){ buf += src[i] + (src[i+1]||""); i += 2; continue; }
        buf += (src[i] === '"') ? '\\"' : src[i];
        i++;
      }
      i++; out += buf + '"'; continue;
    }
    if(ch === "/" && src[i+1] === "/"){ while(i < n && src[i] !== "\n") i++; continue; }
    if(ch === "/" && src[i+1] === "*"){ i += 2; while(i < n && !(src[i]==="*" && src[i+1]==="/")) i++; i += 2; continue; }
    out += ch; i++;
  }
  var strs = [];
  out = out.replace(/"(?:\\.|[^"\\])*"/g, function(m){ strs.push(m); return "\u0001"+(strs.length-1)+"\u0001"; });
  out = out.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":');
  out = out.replace(/,(\s*[}\]])/g, "$1");
  out = out.replace(/\u0001(\d+)\u0001/g, function(_, d){ return strs[Number(d)]; });
  return out;
}

      return Promise.reject(new Error(why));

function snapshotOf(db){
  var s = {b:{}, g:{}};
  BULK.forEach(function(k){ s.b[k] = JSON.stringify(db[k]===undefined? null : db[k]); });
  GRAIN.forEach(function(k){
    s.g[k] = {};
    var o = db[k] || {};
    for(var x in o) s.g[k][x] = JSON.stringify(o[x]);
  });
  return s;
}
/* فايربيز مش بيقبل . # $ [ ] / في المفاتيح */
function fbKey(k){ return String(k).replace(/[.#$\[\]\/]/g, "~"); }

/* ---------- الرفع ---------- */
function syncPush(){
  if(!SYNC.on || SYNC.applying) return;
  clearTimeout(SYNC.pushT);
  SYNC.pushT = setTimeout(doPush, 700);
}
function doPush(){
  if(!SYNC.on || !SYNC.ref) return;
  var now = snapshotOf(DB), up = {}, n = 0;
  BULK.forEach(function(k){
    if(!SYNC.sent || SYNC.sent.b[k] !== now.b[k]){
      up[k] = DB[k]===undefined ? null : DB[k];
      n++;
    }
  });
  GRAIN.forEach(function(k){
    var cur = now.g[k], old = (SYNC.sent && SYNC.sent.g[k]) || {};
    for(var x in cur){
      if(old[x] !== cur[x]){ up[k+"/"+fbKey(x)] = DB[k][x]; n++; }
    }
    for(var y in old){
      if(cur[y]===undefined){ up[k+"/"+fbKey(y)] = null; n++; }
    }
  });
  if(!n) return;
  up["_rev"] = { by: SYNC.dev, at: Date.now() };
  syncStatus("push");
  /* بنسجّل اللي بعتناه فورًا عشان تعديل تاني في نفس اللحظة ما يعيدش رفع الكل،
     ولو الكتابة فشلت بنرجّع البصمة عشان المحاولة الجاية تبعت الناقص */
  var prev = SYNC.sent;
  SYNC.sent = now;
  SYNC.ref.update(up).then(function(){
    syncStatus("ok");
  }).catch(function(e){
    SYNC.sent = prev;
    syncStatus("err", "مقدرش يكتب — راجع قواعد قاعدة البيانات");

}

/* ---------- الاستقبال ---------- */
function onRemote(sn){
  var v = sn.val();
  if(!v) { doPush(); return; }                       /* السحابة فاضية: ارفع اللي عندك */
  if(v._rev && v._rev.by === SYNC.dev) return;       /* صدى تعديلاتنا */
  SYNC.applying = true;
  var changed = false;
  BULK.forEach(function(k){
    if(v[k]===undefined) return;
    var incoming = v[k];
    if(["users","teachers","classes","subjects","students","assign","schedule","behavior","staff","leaves","locations","dutyPlan","events","holidays","wishes"].indexOf(k)>=0){
      incoming = Array.isArray(incoming) ? incoming.filter(Boolean) : [];
    }
    if(JSON.stringify(DB[k]) !== JSON.stringify(incoming)){ DB[k] = incoming; changed = true; }
  });
  GRAIN.forEach(function(k){
    var inc = v[k] || {};
    var cur = DB[k] || {};
    for(var x in inc){
      if(JSON.stringify(cur[x]) !== JSON.stringify(inc[x])){ cur[x] = inc[x]; changed = true; }
    }
    for(var y in cur){
      if(inc[y]===undefined){ delete cur[y]; changed = true; }
    }
    DB[k] = cur;
  });
  SYNC.sent = snapshotOf(DB);
  SYNC.applying = false;
  if(changed){
    saveNow();
    SYNC.lastAt = Date.now();
    if(UI.user && !document.getElementById("ov").classList.contains("on")) render();
    syncStatus("ok");
  }
}

   ============================================================ */
function b64e(str){
  try{ return window.btoa(unescape(encodeURIComponent(str))); }
  catch(e){ return null; }
}
function b64d(str){
  try{ return decodeURIComponent(escape(window.atob(str))); }
  catch(e){ return null; }
}
function inviteCode(){
  var c = syncCfgLoad();
  if(!c || !cfgValid(c.cfg) || !c.code) return null;
  var payload = b64e(JSON.stringify({v:1, code:c.code, cfg:c.cfg}));
  return payload ? "SEGEL-" + payload : null;
}
function applyInvite(text){
  var s = String(text||"").trim().replace(/\s+/g,"");
  var i = s.indexOf("SEGEL-");
  if(i>=0) s = s.slice(i+6);
  var json = b64d(s);
  if(!json){ toast("كود الدعوة مش مقروء — انسخه كامل تاني"); return false; }
  var o;
  try{ o = JSON.parse(json); }catch(e){ toast("كود الدعوة تالف"); return false; }
  if(!o || !o.code || !cfgValid(o.cfg)){ toast("كود الدعوة ناقص"); return false; }
  var c = syncCfgLoad() || {};
  c.code = o.code; c.cfg = ensureDbUrl(o.cfg); c.enabled = true; c.dev = c.dev || deviceId();
  if(!syncCfgSave(c)){ toast("المتصفح مانع الحفظ — جرّب متصفح تاني"); return false; }
  return true;
}

  if(!DB.subs || typeof DB.subs!=="object") DB.subs = {};
}
/* كل العاملين: المعلمون (من جدول المعلمين) + باقي الوظائف */
function staffAll(){
  if(IDX.staff && IDX.staff_n===(DB.teachers.length+DB.staff.length)) return IDX.staff;
  staffInit();
  /* بيانات المعلم هي المصدر الأساسي، وسجل العاملين بيكمّل الناقص بس.
     كده أي بيانات يرفعها وكيل شئون الطلاب تظهر عند المدير على طول. */
  var out = DB.teachers.map(function(t){
    var ex = DB.staff.filter(function(x){ return x.teacherId===t.id; })[0] || {};
    return { id:"T"+t.id, kind:"teacher", teacherId:t.id, name:t.name,
             code:   t.code || "",
             job:    adminRoleOfTeacher(t.id) || t.cadreJob || t.jobNow || ex.job || "معلم",
             noTeach: !!t.noTeach,
             subject:t.subject || "",
             phone:  t.phone || ex.phone || "",
             natId:  t.natId || ex.natId || "",
             hired:  t.hireDate || ex.hired || "",
             degree: t.qual || ex.degree || "",
             qualType: t.qualType || "",
             hourly: !!t.hourly,
             note:   t.dataErr || ex.note || "" };
  });
  DB.staff.forEach(function(x){
    if(x.teacherId) return;
    out.push({ id:"S"+x.id, kind:"admin", staffId:x.id, name:x.name, job:x.job||"إداري",
               phone:x.phone||"", natId:x.natId||"", hired:x.hired||"", degree:x.degree||"", note:x.note||"" });
  });
  out.sort(function(a,b){ return sortAr(a.name,b.name); });
  IDX.staff = out; IDX.staff_n = DB.teachers.length + DB.staff.length; IDX.staffMap = null;
  return out;
}
function staffById(id){
  if(!id) return null;
  var all = staffAll();                 /* بيبني الفهرس ويصفّر الخريطة لو اتغيّر */
  if(!IDX.staffMap){
    var m = {};
    all.forEach(function(x){ m[x.id] = x; });
    IDX.staffMap = m;
  }
  return IDX.staffMap[id] || null;
}
function staffRecord(sid){
  staffInit();
  if(sid.charAt(0)==="T"){
    var tid = sid.slice(1);
    var r = DB.staff.filter(function(x){ return x.teacherId===tid; })[0];
    if(!r){ r = {id:uid("sf"), teacherId:tid}; DB.staff.push(r); }
    return r;
  }
  var xid = sid.slice(1);
  var q = DB.staff.filter(function(x){ return x.id===xid; })[0];
  return q || null;
}

/* ---------- حضور العاملين ---------- */
function staffAttOf(date, sec){ staffInit(); return DB.staffAtt[sattKeyOf(date, sec)] || {}; }
function staffAttStats(sid){
  staffInit();
  var d=0, a=0, l=0, v=0, m=0, suf = "|"+curSector();
  for(var k in DB.staffAtt){
    if(k.indexOf(suf, k.length-suf.length)<0) continue;
    var rec = DB.staffAtt[k];
    if(!rec || !(sid in rec)) continue;
    d++;
    var x = rec[sid];
    if(x==="A") a++; else if(x==="L") l++; else if(x==="V") v++; else if(x==="M") m++;
  }
  return { days:d, abs:a, late:l, leave:v, mission:m, present:d-a-v-m,
           rate: d? Math.round((d-a)/d*1000)/10 : 100 };
}
/* رصيد الإجازات */
function leaveBalance(sid, type){
  staffInit();
  var used = 0;
  DB.leaves.forEach(function(L){ if(L.staffId===sid && L.type===type) used += num(L.days,0); });
  var mx = leaveMax(type);
  return { used:used, max:mx, left: mx? Math.max(0, mx-used) : null };
}
function daysBetween(a,b){
  if(!a||!b) return 0;
  var d1 = new Date(a+"T00:00:00"), d2 = new Date(b+"T00:00:00");
  var n = Math.round((d2-d1)/86400000)+1;
  return n>0 ? n : 0;
}

/* ---------- النصاب والاحتياطي ---------- */
function teacherPeriods(tid){ return DB.schedule.filter(function(s){ return s.teacherId===tid; }); }
function periodsOn(tid, day){ return DB.schedule.filter(function(s){ return s.teacherId===tid && s.day===day; }); }
function freeTeachersAt(day, period, absentIds){
  return teachingStaff().filter(function(t){
    if(absentIds && absentIds.indexOf("T"+t.id)>=0) return false;
    return !teacherBusy(t.id, day, period, null);
  }).sort(function(a,b){ return teacherPeriods(a.id).length - teacherPeriods(b.id).length; });
}
function subKey(date, schedId){ return date+"|"+schedId; }

  if(!gaps.length) h += '<tr><td colspan="6"><div class="empty"><b>الغائبون مالهمش حصص النهارده</b></div></td></tr>';

    var free = freeTeachersAt(dw, g.sched.period, absentIds);

  return h;

function impStaff(recs){
  staffInit();
  var r = {add:0, upd:0, skip:0, err:[]};
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    if(!name || name.length<2){ r.err.push("سطر "+(i+1)+": مفيش اسم"); return; }
    var ex = null;
    staffAll().forEach(function(s){ if(!ex && normAr(s.name)===normAr(name)) ex = s; });
    if(ex && UI.imp.mode==="add"){ r.skip++; return; }
    var rec;
    if(ex && UI.imp.mode==="update"){ rec = staffRecord(ex.id); r.upd++; }
    else { rec = {id:uid("sf"), name:name}; DB.staff.push(rec); r.add++; }
    if(!rec.teacherId) rec.name = name;
    if(o.job) rec.job = cleanName(o.job);
    if(o.degree) rec.degree = cleanName(o.degree);
    if(o.natId) rec.natId = toEnDigits(o.natId).replace(/\D/g,"");
    if(o.phone) rec.phone = toEnDigits(o.phone).replace(/[^\d+]/g,"");
    if(o.hired){ var d = parseDateCell(o.hired); if(d) rec.hired = d; }
  });
  return r;
}
function impStaffAtt(recs, g, hr, map){
  staffInit();
  var r = {add:0, upd:0, skip:0, err:[]};
  var dcols = [];
  map.forEach(function(k,c){
    if(k!=="__d") return;
    var d = parseDateCell(hr>=0? g[hr][c] : "");
    if(d) dcols.push({c:c, d:d});
    else r.err.push("عمود مش تاريخ — اتتجاهل");
  });
  if(!dcols.length) return {add:0,upd:0,skip:0,err:["ما حددتش أعمدة تواريخ"]};
  var all = staffAll();
  recs.forEach(function(o,i){
    var name = cleanName(o.name||"");
    var s = null, best=0;
    all.forEach(function(x){
      if(normAr(x.name)===normAr(name)) s = x;
      else { var sim = similar(x.name,name); if(sim>best && sim>=0.7){ best=sim; if(!s) s=x; } }
    });
    if(!s){ r.err.push("سطر "+(i+1)+": ما لقيتش «"+name+"»"); return; }
    var any = false;
    (o.__extra||[]).forEach(function(x){
      if(x.k!=="__d") return;
      var col=null; dcols.forEach(function(dc){ if(dc.c===x.c) col=dc; });
      if(!col) return;
      var vv = normAr(x.v), v = null;
      if(/^(ح|حاضر|p)$/.test(vv)) v="P";
      else if(/^(غ|غائب|a)$/.test(vv)) v="A";
      else if(/^(ت|متاخر|l)$/.test(vv)) v="L";
      else if(/^(ج|اجازه|v)$/.test(vv)) v="V";
      else if(/^(م|ماموريه|مأموريه|m)$/.test(vv)) v="M";
      if(!v) return;
      var kx = sattKeyOf(col.d);
      if(!DB.staffAtt[kx]) DB.staffAtt[kx] = {};
      DB.staffAtt[kx][s.id] = v; any = true;
    });
    if(any) r.add++; else r.skip++;
  });
  return r;
}

/* ============================================================
   الدخول بالرقم السري الشخصي
   شاشة واحدة: خانة رقم سري. الرقم نفسه هو الهوية.
   • كل موظف ليه رقم فريد — البرنامج بيمنع التكرار
   • بيمنع الأرقام الضعيفة (متتالية / مكررة / تواريخ ميلاد شائعة)
   • تأخير تصاعدي بعد المحاولات الغلط ضد التخمين
   ============================================================ */

var PIN_LEN = 8;                     /* أقل طول لكلمة السر */
/* حروف إنجليزية وأرقام، من غير الحروف اللي بتتلخبط: O مع 0 و I مع 1 و L */
var PIN_ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ";
var PIN_DIGIT = "23456789";

function normPin(v){
  return toEnDigits(String(v||"")).trim().toUpperCase();
}
function pinOwner(pin, exceptUserId){
  var p = normPin(pin);
  if(!p) return null;
  for(var i=0;i<DB.users.length;i++){
    var u = DB.users[i];
    if(u.id===exceptUserId) continue;
    if(normPin(u.pin)===p) return u;
  }
  return null;
}
var WEAK_PINS = ["PASSWORD","PASSWORD1","12345678","123456789","ABCD1234","ABC12345",
                 "QWERTY12","QWERTY123","11111111","00000000","AAAA1111","1234ABCD",
                 "ADMIN123","SCHOOL12","TEACHER1","12341234","1A2B3C4D"];
function pinWeak(pin){
  var p = normPin(pin);
  if(WEAK_PINS.indexOf(p)>=0) return "كلمة سر شائعة وسهلة التخمين";
  if(/^(.)\1+$/.test(p)) return "كل الحروف متشابهة";
  /* متتالية صاعدة أو نازلة */
  var up = true, down = true;
  for(var i=1;i<p.length;i++){
    var d = p.charCodeAt(i) - p.charCodeAt(i-1);
    if(d !== 1) up = false;
    if(d !== -1) down = false;
  }
  if(up || down) return "حروف أو أرقام متتالية";
  /* نمط مكرر زي AB1AB1AB — وحدة بتتكرر مرتين فأكتر */
  for(var u=2; u<=Math.floor(p.length/2); u++){
    var unit = p.slice(0,u), ok = true;
    for(var q=0;q<p.length;q++) if(p[q] !== unit[q%u]){ ok = false; break; }
    if(ok) return "نمط مكرر";
  }
  return null;
}
/* الفحص الكامل: بيرجع رسالة الخطأ أو null لو صالحة */
function pinCheck(pin, exceptUserId){
  var p = normPin(pin);
  if(!p) return "اكتب كلمة السر";
  if(!/^[A-Z0-9]+$/.test(p)) return "كلمة السر حروف إنجليزية وأرقام بس — من غير مسافات أو رموز";
  if(p.length < PIN_LEN) return "كلمة السر لازم "+PIN_LEN+" خانات على الأقل (المكتوب "+p.length+")";
  if(p.length > 16) return "كلمة السر طويلة أوي — من "+PIN_LEN+" لـ ١٦ خانة";
  if(!/[A-Z]/.test(p)) return "لازم تحتوي على حرف إنجليزي واحد على الأقل";
  if(!/[0-9]/.test(p)) return "لازم تحتوي على رقم واحد على الأقل";
  var w = pinWeak(p);
  if(w) return "كلمة السر دي ماتنفعش: "+w;
  if(pinOwner(p, exceptUserId)) return "كلمة السر دي مستخدمة بالفعل لحساب تاني — اختار غيرها";
  return null;
}
function genPin(){
  for(var tries=0; tries<800; tries++){
    var chars = [];
    /* ٥ حروف و٣ أرقام مخلوطين */
    for(var i=0;i<5;i++) chars.push(PIN_ALPHA[Math.floor(Math.random()*PIN_ALPHA.length)]);
    for(var j=0;j<3;j++) chars.push(PIN_DIGIT[Math.floor(Math.random()*PIN_DIGIT.length)]);
    for(var k=chars.length-1;k>0;k--){
      var r = Math.floor(Math.random()*(k+1));
      var t = chars[k]; chars[k] = chars[r]; chars[r] = t;
    }
    var p = chars.join("");
    if(pinWeak(p)) continue;
    if(pinOwner(p, null)) continue;
    return p;
  }
  return "S" + Date.now().toString(36).toUpperCase().slice(-7);
}
function weakUsers(){
  var seen = {}, dup = {};
  DB.users.forEach(function(u){
    var p = normPin(u.pin);
    if(seen[p]) dup[p] = 1;
    seen[p] = 1;
  });
  return DB.users.filter(function(u){
    var p = normPin(u.pin);
    return !p || p.length < PIN_LEN || !/[A-Z]/.test(p) || !/[0-9]/.test(p) ||
           !/^[A-Z0-9]+$/.test(p) || pinWeak(p) || dup[p];
  });
}

/* ---------- حماية من التخمين ---------- */
var TRY_KEY = "segel_tries_v1";
function tries(){
  try{
    var o = JSON.parse(window.localStorage.getItem(TRY_KEY) || "{}");
    return { n: num(o.n,0), at: num(o.at,0) };
  }catch(e){ return { n:0, at:0 }; }
}
function setTries(n){
  try{ window.localStorage.setItem(TRY_KEY, JSON.stringify({n:n, at:Date.now()})); }catch(e){}
}
/* التأخير بيزيد: 3 محاولات مجانية، بعدها 5ث، 15ث، 60ث، 5د */
function lockLeft(){
  var t = tries();
  if(t.n < 3) return 0;
  var waits = [5, 15, 60, 300];
  var w = waits[Math.min(t.n-3, waits.length-1)] * 1000;
  var left = t.at + w - Date.now();
  return left > 0 ? Math.ceil(left/1000) : 0;
}

function startLockTimer(){
  clearInterval(renderLogin._t);

    el.textContent = left;
  }, 1000);
}

  if(UI.sector!=="reg" && UI.sector!=="srv"){ toast("اختار القسم الأول"); return; }
  var el = document.getElementById("pin");
  var v = normPin(el ? el.value : "");

  var u = null, wrongSector = null;
  for(var i=0;i<DB.users.length;i++){
    if(String(DB.users[i].pin) !== v) continue;
    if(userInSector(DB.users[i], curSector())){ u = DB.users[i]; break; }

    if(el){ el.value = ""; }
    renderLogin();
    toast("كلمة السر غير صحيحة");
    return;
  }
  setTries(0);
  UI.user = u;
  UI.tab = firstTabOf(u.role);
  UI.sub = null;
  /* رجوع لآخر مكان كان شغال فيه (نفس المستخدم وخلال ٨ ساعات) */
  var st = loadUIState();
  if(st && st.userId===u.id){
    if(navFor(u).some(function(it){ return it[0]!=="_g" && it[0]===st.tab; })) UI.tab = st.tab;
    if(st.filters && typeof st.filters==="object") UI.filters = st.filters;
    if(st.curv) UI.curv = st.curv;

  autoBackup();
  startSession(u);
  document.getElementById("login").classList.add("off");
  document.getElementById("app").classList.add("on");
  document.getElementById("hdUser").textContent = u.name + " · " + (ROLES[u.role] ? ROLES[u.role].name : "");
  render();
  setHeaderSector();
}

  if(!DB.duty || typeof DB.duty!=="object") DB.duty = {};
  staffInit();
}
function locById(id){ supInit(); for(var i=0;i<DB.locations.length;i++) if(DB.locations[i].id===id) return DB.locations[i]; return null; }
function locName(id){ var l = locById(id); return l? l.name : "—"; }

/* اليوم الشغّال في كل شاشات الإشراف */
function supDate(){ return (UI.sub && UI.sub.d) || today(); }
function sectorLocations(){
  supInit();
  var sec = curSector();
  return DB.locations.filter(function(l){ return (l.sector||"reg")===sec; });
}
function dutyOf(date){
  supInit();
  var k = dutyKeyOf(date);
  if(!DB.duty[k]) DB.duty[k] = { general:"", posts:{}, notes:"", closed:false };
  var d = DB.duty[k];
  if(!d.posts || typeof d.posts!=="object") d.posts = {};
  return d;
}
/* المناوب المخطط له في اليوم ده من الجدول الأسبوعي */
function plannedGeneral(day){
  supInit();
  var sec = curSector();
  var p = DB.dutyPlan.filter(function(x){
    return x.kind==="general" && x.day===day && (x.sector||"reg")===sec; })[0];
  return p ? p.staffId : "";
}
function plannedPost(day, locId){
  supInit();
  var sec = curSector();
  var p = DB.dutyPlan.filter(function(x){
    return x.kind==="post" && x.day===day && x.locationId===locId && (x.sector||"reg")===sec; })[0];
  return p ? p.staffId : "";
}
/* المشرف الفعلي: اللي اتسجّل اليوم، وإلا اللي في الخطة */
function generalToday(date){
  var d = dutyOf(date), dw = dayOfWeek(date);
  return d.general || plannedGeneral(dw);
}
function postToday(date, locId){
  var d = dutyOf(date), dw = dayOfWeek(date);
  return d.posts[locId] || plannedPost(dw, locId);
}

/* ---------- مؤشرات اليوم ---------- */
function dayPulse(date){
  supInit();
  var dw = dayOfWeek(date);
  var rec = staffAttOf(date);

  /* العاملون */
  var all = staffAll(), sAbs = [], sPres = 0;
  all.forEach(function(s){
    var v = rec[s.id];
    if(v==="A" || v==="V" || v==="M") sAbs.push({s:s, v:v});
    else if(v) sPres++;
  });

  /* الطلاب */
  var stTot = 0, stAbs = 0, notRecorded = [];
  myClasses().forEach(function(c){
    var studs = studentsOf(c.id);
    if(!studs.length) return;
    var r = DB.attend[attKey(c.id, date)];
    if(!r || !Object.keys(r).length){ notRecorded.push(c); return; }
    studs.forEach(function(s){
      if(!(s.id in r)) return;
      stTot++;
      if(r[s.id]==="A") stAbs++;
    });
  });

  /* الحصص المكشوفة */
  var gaps = [], covered = 0;
  if(dw>=0 && dw<6){
    sAbs.forEach(function(x){
      if(x.s.kind!=="teacher") return;
      periodsOn(x.s.teacherId, dw).forEach(function(p){
        var sub = DB.subs[subKey(date, p.id)];
        if(sub) covered++;
        gaps.push({staff:x.s, sched:p, reason:x.v, sub:sub||""});
      });
    });
  }

  /* مواقع الإشراف بدون مشرف */
  var noPost = sectorLocations().filter(function(l){ return !postToday(date, l.id); });

  /* الأحداث */
  var evs = DB.events.filter(function(e){ return e.date===date; });

  return {
    day:dw, staff:{all:all.length, present:sPres, absent:sAbs},
    students:{recorded:stTot, absent:stAbs,
              rate: stTot? Math.round((stTot-stAbs)/stTot*1000)/10 : null,
              notRecorded:notRecorded},
    gaps:gaps, covered:covered, uncovered:gaps.length-covered,
    noPost:noPost, events:evs,
    general: generalToday(date)
  };
}

    '<table class="tbl"><thead><tr><th>الحصة</th><th>الفصل</th><th>المادة</th><th>المعلم الغائب</th>'+

      '<td>'+esc(subjName(g.sched.subjectId))+'</td><td>'+esc(g.staff.name)+'</td>'+
      '<td>'+(g.sub? esc(teacherName(g.sub)) : '<span class="tag bad">لم تُغطَّ</span>')+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>رابعًا: مواقع الإشراف</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الموقع</th><th>النوع</th><th>المشرف</th></tr></thead><tbody>';
  var _rl = sectorLocations();
  if(!_rl.length) h += '<tr><td colspan="3"><div class="empty"><b>مفيش مواقع مسجّلة</b></div></td></tr>';
  _rl.forEach(function(l){
    var sid = postToday(date, l.id), s = sid? staffById(sid) : null;
    h += '<tr><td><b style="font-weight:600">'+esc(l.name)+'</b></td><td>'+esc(postKindName(l.kind))+'</td>'+
      '<td>'+(s? esc(s.name) : '<span class="tag bad">بدون مشرف</span>')+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>خامسًا: الأحداث والملاحظات</h3></div><div class="bd flush"><div class="tbl-wrap">'+
    '<table class="tbl"><thead><tr><th>الوقت</th><th>النوع</th><th>الموقع</th><th>البيان</th><th>الإجراء</th></tr></thead><tbody>';
  if(!p.events.length) h += '<tr><td colspan="5"><div class="empty"><b>مفيش أحداث</b></div></td></tr>';
  p.events.forEach(function(e){
    h += '<tr><td class="num">'+esc(e.time||"—")+'</td><td>'+esc(evType(e.type).name)+'</td>'+
      '<td>'+esc(e.locationId? locName(e.locationId):"—")+'</td>'+
      '<td>'+esc(e.note||"")+'</td><td>'+esc(e.action||"—")+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';

  h += '<div class="card"><div class="hd"><h3>سادسًا: ملاحظات المشرف العام</h3></div><div class="bd">'+
    '<textarea id="dutyNotes" style="min-height:90px" placeholder="اكتب ملاحظاتك على سير اليوم…">'+esc(d.notes||"")+'</textarea>'+
    '<button class="btn noprint" data-act="saveNotes" data-d="'+date+'" style="margin-top:8px">حفظ الملاحظات</button>'+
    '<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:22px">'+
    '<span>المشرف العام: ................</span><span>وكيل شئون العاملين: ................</span>'+
    '<span>مدير المدرسة: ................</span></div></div></div>';
  return h;
}

Object.assign(ACTS, {

   الافتراضي من الخريطة الرسمية للعام 2026/2027 (وكلها قابلة للتعديل)

var CAL_DEFAULT = {
  yearStart:"2026-09-12", yearEnd:"2027-06-24",
  t1From:"2026-09-12",   t1To:"2027-01-07",
  ex1From:"2027-01-09",  ex1To:"2027-01-14",
  midFrom:"2027-01-23",  midTo:"2027-02-04",
  t2From:"2027-02-06",   t2To:"2027-05-20",
  ex2From:"2027-05-22",  ex2To:"2027-05-27",
  finFrom:"",            finTo:""            /* امتحانات الشهادة (البكالوريا) */
};
function calCfg(){
  if(!DB.calendar || typeof DB.calendar!=="object") DB.calendar = {};
  var c = DB.calendar;
  for(var k in CAL_DEFAULT) if(c[k]===undefined) c[k] = CAL_DEFAULT[k];
  return c;
}
/* الفترة اللي إحنا فيها دلوقتي */
function currentPhase(d){
  var c = calCfg(); d = d || today();
  function inR(a,b){ return a && b && d>=a && d<=b; }
  if(inR(c.ex1From,c.ex1To)) return { key:"ex1", name:"امتحانات الفصل الأول", tone:"bad" };
  if(inR(c.ex2From,c.ex2To)) return { key:"ex2", name:"امتحانات الفصل الثاني", tone:"bad" };
  if(inR(c.finFrom,c.finTo)) return { key:"fin", name:"امتحانات الشهادة", tone:"bad" };
  if(inR(c.midFrom,c.midTo)) return { key:"mid", name:"إجازة نصف العام", tone:"warn" };
  if(inR(c.t1From,c.t1To))   return { key:"t1",  name:"الفصل الدراسي الأول", tone:"ok" };
  if(inR(c.t2From,c.t2To))   return { key:"t2",  name:"الفصل الدراسي الثاني", tone:"ok" };
  if(c.yearStart && d < c.yearStart) return { key:"pre", name:"قبل بداية العام", tone:"" };
  return { key:"out", name:"خارج العام الدراسي", tone:"" };
}
/* فرق الأيام بين تاريخين */
function daysBetween(a,b){
  if(!a || !b) return 0;
  var d1 = new Date(a), d2 = new Date(b);
  if(isNaN(d1) || isNaN(d2)) return 0;
  return Math.round((d2-d1)/86400000);
}
/* عدد أيام الدراسة الفعلية (بدون الجمعة/السبت والإجازات) */
function schoolDaysIn(from, to){
  if(!from || !to) return 0;
  var n = 0, d = new Date(from), end = new Date(to);
  if(isNaN(d) || isNaN(end)) return 0;
  var guard = 0;
  while(d <= end && guard++ < 500){
    var iso = d.toISOString().slice(0,10);
    if(isSchoolDayIdx(d.getDay()) && !holidayOn(iso)) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}

function saveExam(el){
  var id = el.dataset.id;
  var sub = val("ex_sub").trim();
  if(!sub){ toast("اكتب اسم المادة"); return; }
  var date = val("ex_date");
  if(!date){ toast("حدّد تاريخ الامتحان"); return; }
  examsInit();
  var e = id ? DB.exams.filter(function(x){ return x.id===id; })[0] : null;
  if(!e){ e = { id:uid("ex") }; DB.exams.push(e); }
  e.term = val("ex_term") || "1";
  e.date = date; e.subject = sub;
  e.from = val("ex_from"); e.to = val("ex_to");
  e.dur = num(val("ex_dur"),0);
  if(!e.dur && e.from && e.to){
    var a = toMin(e.from), b = toMin(e.to);
    if(a!==null && b!==null && b>a) e.dur = b-a;
  }
  e.notes = val("ex_notes").trim();
  e.levels = Array.prototype.slice.call(document.querySelectorAll(".exLv"))
    .filter(function(cb){ return cb.checked; })
    .map(function(cb){ return num(cb.dataset.l,0); });
  saveNow(); closeModal(); render(); toast(id?"اتحفظ":"اتضاف الامتحان");
}

/* ============================================================
   القسمان: النظامي والخدمات — فترتان منفصلتان
   ------------------------------------------------------------
   الخدمات فترة تانية بعد النظامي، وليها:
   • توقيتاتها (الطابور، بداية الحصص، عددها، نهاية اليوم)
   • إشرافها المستقل (مشرف عام ومواقع)
   • طاقمها (ممكن مدير أو وكيل أو مدرسين مختلفين)
   • حضور عاملين منفصل لكل فترة
   ونصاب المعلم بيتحسب على النظامي بس، حتى لو بيدرّس في الاتنين.
   ============================================================ */

var SECTORS = [
  {id:"reg", name:"نظامي", full:"الفترة الأولى — النظامي", av:"ن"},
  {id:"srv", name:"خدمات", full:"الفترة الثانية — الخدمات", av:"خ"}
];
function sectorName(id){ return id==="srv" ? "خدمات" : "نظامي"; }
function sectorFull(id){ return id==="srv" ? "الفترة الثانية — الخدمات" : "الفترة الأولى — النظامي"; }
function curSector(){ return UI.sector==="srv" ? "srv" : "reg"; }
function classSector(c){ return (c && c.sector==="srv") ? "srv" : "reg"; }
function inSector(c){ return classSector(c) === curSector(); }

function myClasses(){ return DB.classes.filter(inSector); }
function myClassIds(){
  var m = {};
  myClasses().forEach(function(c){ m[c.id] = 1; });
  return m;
}
function myStudents(){
  var m = myClassIds();

}
/* طلاب اتسجّلوا/اترحّلوا بس لسه مش متسكّنين على فصل موجود — لازم يظهروا للوكيل.
   طلاب المنازل مستثنون: ليهم تبويب لوحدهم وملهومش فصول أصلًا. */
function unassignedStudents(){
  var sec = curSector();
  return DB.students.filter(function(s){
    if(s.status==="left" || isHomeStudent(s)) return false;
    if(classById(s.classId)) return false;
    return studentSector(s) === sec;
  });
}
/* ---------- طلاب المنازل (انتساب — امتحانات فقط) ---------- */
function isHomeStudent(s){ return !!s && s.edu==="home"; }
/* القسم اللي الطالب بيتبعه: من فصله، وإلا من القسم المحفوظ، وإلا من نوعية التعليم */
function studentSector(s){
  var c = classById(s.classId);
  if(c) return classSector(c);
  if(s.sector==="srv" || s.sector==="reg") return s.sector;
  return eduType(s.edu||"reg").sector;
}
function homeStudents(){
  var sec = curSector();
  return DB.students.filter(function(s){
    return isHomeStudent(s) && s.status!=="left" && studentSector(s)===sec;
  }).sort(function(a,b){ return (num(studentLevelOf(a),0)-num(studentLevelOf(b),0)) || sortAr(a.name,b.name); });
}
function mySchedule(){
  var m = myClassIds();
  return DB.schedule.filter(function(s){ return m[s.classId]; });
}

/* ---------- توقيتات كل فترة ---------- */
var SECTOR_DEFAULTS = {
  reg:{ assembly:"07:30", start:"07:45", periods:8, periodMin:45, end:"13:30" },
  srv:{ assembly:"13:45", start:"14:00", periods:6, periodMin:45, end:"18:00" }
};
function secCfg(id){
  id = id==="srv" ? "srv" : "reg";
  if(!DB.sectors || typeof DB.sectors!=="object") DB.sectors = {};
  if(!DB.sectors[id]) DB.sectors[id] = {};
  var c = DB.sectors[id], d = SECTOR_DEFAULTS[id];
  for(var k in d) if(c[k]===undefined || c[k]==="") c[k] = d[k];
  return c;
}
function curCfg(){ return secCfg(curSector()); }
function periodsCount(){ return Math.max(1, Math.min(12, num(curCfg().periods, 8))); }
function toMin(t){
  var p = toEnDigits(String(t||"")).split(":");
  if(p.length<2) return null;
  return num(p[0],0)*60 + num(p[1],0);
}
function fromMin(m){
  m = Math.max(0, Math.round(m)) % (24*60);
  var h = Math.floor(m/60), x = m%60;
  return (h<10?"0":"")+h+":"+(x<10?"0":"")+x;
}
function periodTime(i){
  var c = curCfg(), st = toMin(c.start), len = Math.max(5, num(c.periodMin,45));
  if(st===null) return null;
  var from = st + (i-1)*len;
  return { from: fromMin(from), to: fromMin(from+len) };
}
function sectorTimeLine(id){
  var c = secCfg(id);
  return "الطابور "+c.assembly+" · الحصص من "+c.start+" · "+c.periods+" حصص × "+c.periodMin+" د · النهاية "+c.end;
}

/* ---------- مفاتيح مفصولة لكل فترة ---------- */
function dutyKeyOf(date, sec){ return date + "|" + (sec || curSector()); }
function sattKeyOf(date, sec){ return date + "|" + (sec || curSector()); }
function migrateSectors(){
  var k;
  if(DB.staffAtt) for(k in DB.staffAtt){
    if(k.indexOf("|")<0){ DB.staffAtt[k+"|reg"] = DB.staffAtt[k]; delete DB.staffAtt[k]; }
  }
  if(DB.duty) for(k in DB.duty){
    if(k.indexOf("|")<0){ DB.duty[k+"|reg"] = DB.duty[k]; delete DB.duty[k]; }
  }
  if(Array.isArray(DB.dutyPlan))  DB.dutyPlan.forEach(function(p){ if(!p.sector) p.sector = "reg"; });
  if(Array.isArray(DB.locations)) DB.locations.forEach(function(l){ if(!l.sector) l.sector = "reg"; });
  if(Array.isArray(DB.classes))   DB.classes.forEach(function(c){ if(!c.sector) c.sector = "reg"; });
  if(Array.isArray(DB.users)) DB.users.forEach(function(u){
    if(!Array.isArray(u.sectors) || !u.sectors.length) u.sectors = ["reg"];
  });
}

/* ---------- من يعمل في أي فترة ---------- */
function userSectors(u){
  return (u && Array.isArray(u.sectors) && u.sectors.length) ? u.sectors : ["reg"];
}
function userInSector(u, sec){ return userSectors(u).indexOf(sec) >= 0; }
function teacherInSector(tid, sec){
  sec = sec || curSector();
  var u = userOfTeacher(tid);
  if(u && userInSector(u, sec)) return true;
  return DB.assign.some(function(a){
    return a.teacherId===tid && classSector(classById(a.classId))===sec;
  });
}
function sectorTeachers(){
  var sec = curSector();
  var pool = teachingStaff();
  var list = pool.filter(function(t){ return teacherInSector(t.id, sec); });
  return list.length ? list : pool;
}

/* ---------- النصاب: على النظامي بس ---------- */
function teacherLoad(tid){
  return DB.schedule.filter(function(s){
    return s.teacherId===tid && classSector(classById(s.classId))==="reg";
  }).length;
}
function teacherPeriods(tid){
  var sec = curSector();
  return DB.schedule.filter(function(s){
    return s.teacherId===tid && classSector(classById(s.classId))===sec;
  });
}
function periodsOn(tid, day){
  return teacherPeriods(tid).filter(function(s){ return s.day===day; });
}
function teacherBusy(teacherId, day, period, ignoreId){
  var sec = curSector();
  for(var i=0;i<DB.schedule.length;i++){
    var s = DB.schedule[i];
    if(s.id===ignoreId) continue;
    if(classSector(classById(s.classId))!==sec) continue;
    if(s.teacherId===teacherId && s.day===day && s.period===period) return s;
  }
  return null;
}
function freeTeachersAt(day, period, absentIds){
  return sectorTeachers().filter(function(t){
    if(absentIds && absentIds.indexOf("T"+t.id)>=0) return false;
    return !teacherBusy(t.id, day, period, null);
  }).sort(function(a,b){ return teacherLoad(a.id) - teacherLoad(b.id); });
}

function roleHolders(role){
  var sec = curSector();
  var n = DB.users.filter(function(u){ return u.role===role && userInSector(u, sec); })
    .map(function(u){ return u.name; });
  if(!n.length) n = DB.users.filter(function(u){ return u.role===role; }).map(function(u){ return u.name; });
  return n;
}
function contactFor(role){
  var t = ROLES[role] ? ROLES[role].name : role;
  var n = roleHolders(role);
  return n.length ? t + " (" + n.join("، ") + ")" : t;
}

function viewTimes(){
  var h = pageHd("أوقات اليوم الدراسي", "المدير بيحدد توقيت كل فترة");
  SECTORS.forEach(function(x){
    var c = secCfg(x.id);
    var st = toMin(c.start), last = null;
    if(st!==null) last = fromMin(st + num(c.periods,8)*num(c.periodMin,45));
    h += '<div class="card"><div class="hd">'+
      '<span class="av" style="width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:#fff;font-family:Cairo,sans-serif;font-weight:700">'+esc(x.av)+'</span>'+
      '<div style="flex:1;min-width:130px"><h3>'+esc(x.full)+'</h3>'+
      '<small style="color:var(--muted)">'+esc(sectorTimeLine(x.id))+'</small></div></div><div class="bd">'+
      '<div class="grid3">'+
      '<label class="f"><span>ميعاد الطابور</span><input type="time" id="tm_'+x.id+'_as" value="'+esc(c.assembly)+'"></label>'+
      '<label class="f"><span>بداية الحصة الأولى</span><input type="time" id="tm_'+x.id+'_st" value="'+esc(c.start)+'"></label>'+
      '<label class="f"><span>نهاية اليوم الدراسي</span><input type="time" id="tm_'+x.id+'_en" value="'+esc(c.end)+'"></label>'+
      fldn("عدد الحصص","tm_"+x.id+"_pc", c.periods)+
      fldn("مدة الحصة (دقيقة)","tm_"+x.id+"_pm", c.periodMin)+
      '</div>'+
      (last? '<div class="note">آخر حصة بتنتهي '+esc(last)+' حسب الأرقام دي.'+
        (toMin(last)>toMin(c.end)? ' <b style="color:var(--danger)">ده بعد نهاية اليوم اللي كتبتها.</b>':'')+'</div>':'')+
      '<button class="btn" data-act="saveTimes" data-s="'+x.id+'">حفظ توقيت '+esc(x.name)+'</button>'+
      '</div></div>';

/* مسارات استمارة تحديد المسار — بتتقرا من الهيكل الدراسي مباشرة.
   يعني لما الوكيل يعدّل مواد التخصص في «الهيكل الدراسي»، الاستمارة بتتغيّر معاها. */
function wishTracks(){
  curriculumInit();
  var lvl = num(DB.trackLevel,2);
  return allTracks("bac").map(function(t){
    var subs = curSubjects(curKey(lvl,"bac",t.id))
      .filter(function(x){ return x.elective; })

    return { id:t.id, name:t.name, subjects:subs };
  });
}
/* نوعية التعليم — بتحدد الطالب هيظهر في أنهي قسم */
var EDU_TYPES = [
  {id:"reg",  name:"نظامي", sector:"reg", note:"الفترة الأولى — دراسة منتظمة"},
  {id:"srv",  name:"خدمات", sector:"srv", note:"الفترة الثانية — فصول الخدمات"},
  {id:"home", name:"منازل", sector:"reg", note:"انتساب — امتحانات فقط"}
];
function eduType(id){
  for(var i=0;i<EDU_TYPES.length;i++) if(EDU_TYPES[i].id===id) return EDU_TYPES[i];
  return EDU_TYPES[0];
}
function eduName(id){ return eduType(id).name; }
function wishEdu(w){ return (w && w.edu) ? w.edu : "reg"; }
/* الرغبات اللي تخص الفترة الحالية */
function wishesOfSector(){
  wishesInit();
  var sec = curSector();
  return DB.wishes.filter(function(w){ return eduType(wishEdu(w)).sector === sec; });
}
function wishTrack(id){
  var wt = wishTracks();
  for(var i=0;i<wt.length;i++) if(wt[i].id===id) return wt[i];
  return null;
}
function wishTrackName(id){ var t = wishTrack(id); return t ? t.name : "—"; }
function wishSubjects(id){ var t = wishTrack(id); return t ? t.subjects : []; }

/* تنضيف خفيف: مسافات بس — من غير تحويل الأرقام العربية
   عشان اسم الفصل يفضل زي ما الطالب كتبه */
function tidy(v){ return String(v==null?"":v).replace(/\s+/g," ").trim(); }
function wishesInit(){ if(!Array.isArray(DB.wishes)) DB.wishes = []; }
function wishByNat(nat, exceptId){
  wishesInit();
  var n = toEnDigits(String(nat||"")).replace(/\D/g,"");
  if(!n) return null;
  for(var i=0;i<DB.wishes.length;i++){
    if(DB.wishes[i].id===exceptId) continue;
    if(String(DB.wishes[i].natId)===n) return DB.wishes[i];
  }
  return null;
}
/* تحقّق من الرقم القومي المصري: ١٤ رقم، وأول رقم ٢ أو ٣ */
function natIdCheck(v){
  var n = toEnDigits(String(v||"")).replace(/\D/g,"");
  if(!n) return "اكتب الرقم القومي";
  if(n.length !== 14) return "الرقم القومي لازم ١٤ رقم (المكتوب دلوقتي "+n.length+")";
  if(n[0]!=="2" && n[0]!=="3") return "الرقم القومي لازم يبدأ بـ ٢ أو ٣";
  /* بنية الرقم القومي المصري:
     [0] القرن · [1-2] السنة · [3-4] الشهر · [5-6] اليوم · [7-8] المحافظة · [9-12] المسلسل · [13] التحقق */
  var m = Number(n.slice(3,5));
  if(m<1 || m>12) return "شهر الميلاد جوه الرقم القومي مش مظبوط";
  var d = Number(n.slice(5,7));
  if(d<1 || d>31) return "يوم الميلاد جوه الرقم القومي مش مظبوط";
  var gv = Number(n.slice(7,9));
  if(!((gv>=1 && gv<=35) || gv===88)) return "كود المحافظة جوه الرقم القومي مش مظبوط";
  return null;
}
function nameCheck(v){
  var s = cleanName(v);
  if(!s) return "اكتب الاسم";
  if(s.length < 6) return "اكتب الاسم كامل زي ما هو في شهادة الميلاد";
  if(s.split(/\s+/).length < 3) return "الاسم لازم يكون ثلاثي على الأقل زي شهادة الميلاد";
  if(/\d/.test(s)) return "الاسم مفيهوش أرقام";
  return null;
}

  e = document.getElementById("w_trk");  if(e) o.track = e.value;
  e = document.getElementById("w_sub");  if(e) o.subject = e.value;
  o.extra = o.extra || {};

    o.extra[x.dataset.fid] = x.value;
  });

function saveWish(){
  wishesInit();
  var o = readWishForm();
  var err = nameCheck(o.name);
  if(err){ toast(err); return; }
  err = natIdCheck(o.natId);
  if(err){ toast(err); return; }
  if(!tidy(o.prevClass)){ toast("اكتب فصلك في السنة السابقة"); return; }
  if(!o.edu || !EDU_TYPES.some(function(x){ return x.id===o.edu; })){ toast("اختار نوعية التعليم"); return; }
  if(!o.track){ toast("اختار المسار"); return; }
  if(!o.subject || wishSubjects(o.track).indexOf(o.subject)<0){ toast("اختار مادة التخصص"); return; }

  /* استمارة المسار كمان مقفولة على صفها */
  var gateW = levelGateCheck({id:"track"}, o.natId);
  if(gateW){ toast(gateW); return; }

  /* الحقول الإضافية الإجبارية */
  var miss = trackExtra().filter(function(fd){
    return fd.required && !String((o.extra||{})[fd.id]||"").trim();
  })[0];
  if(miss){ toast("لازم تكتب: "+miss.label); return; }

  var dup = wishByNat(o.natId, null);
  if(dup){
    toast("الرقم القومي ده مسجّل قبل كده باسم "+dup.name);
    return;
  }
  var now = new Date();
  var w = {
    id: uid("w"),
    name: cleanName(o.name),
    natId: o.natId,
    prevClass: tidy(o.prevClass),
    edu: o.edu,
    track: o.track,
    subject: o.subject,
    date: today(),
    time: (now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes(),
    extra: o.extra || {}                 /* إجابات الحقول الإضافية */
  };
  DB.wishes.push(w);
  saveNow();
  UI.wishDone = w;
  UI.wish = null;
  renderLogin();
}

  return a.filter(function(x){ return EDU_IDS.indexOf(x)>=0; });
}
function audienceLabel(f){
  var a = formAudience(f);
  if(a.length===EDU_IDS.length) return "كل النوعيات";
  return a.map(function(x){ return eduName(x); }).join(" · ");
}
/* طلاب الاستمارة: من كل الأقسام — القسم اللي إنت واقف فيه ملهوش دخل */
function formEligibleStudents(f){
  var L = formTargetLevel(f);
  var aud = formAudience(f);
  return DB.students.filter(function(s){
    if(s.status==="left") return false;
    if(L && studentLevelOf(s)!==L) return false;
    return aud.indexOf(s.edu||"reg") >= 0;
  });
}
/* هل الاستمارة ملزمة بالأرقام القومية المسجّلة؟ */
function formStrict(f){
  if(!f) return false;
  if(f.id==="track") return DB.trackStrict!==false;
  return f.strictNat!==false;             /* الافتراضي: ملزمة */
}
function levelGateCheck(f, nat){
  if(!formStrict(f)) return "";           /* مفتوحة لأي رقم قومي */
  var L = formTargetLevel(f);
  var aud = formAudience(f);
  var allEdu = aud.length===EDU_IDS.length;
  if(!L && allEdu) return "";             /* من غير صف ولا تخصيص = مفتوحة للكل */
  if(!nat) return "اكتب الرقم القومي";
  var st = DB.students.filter(function(s){ return s.natId===nat && s.status!=="left"; })[0];
  if(!st){
    return "الرقم القومي ده مش مسجّل في المدرسة. راجع شئون الطلاب.";
  }
  if(L && studentLevelOf(st) !== L){
    return "الاستمارة دي لطلاب "+levelName(L)+" بس، وإنت مسجّل في "+
      (studentLevelOf(st)? levelName(studentLevelOf(st)) : "صف غير محدد")+".";
  }
  if(!allEdu && aud.indexOf(st.edu||"reg") < 0){
    return "الاستمارة دي لطلاب "+aud.map(function(x){ return eduName(x); }).join(" و")+
      " بس، وإنت مسجّل "+eduName(st.edu||"reg")+".";
  }
  return "";
}
function saveCustomForm(fid){
  var f = formById(fid); if(!f){ toast("الاستمارة مش موجودة"); return; }
  var nEl = document.getElementById("cf_name"), natEl = document.getElementById("cf_nat");
  var name = cleanName(nEl?nEl.value:"");
  var nat = toEnDigits(natEl?natEl.value:"").replace(/\D/g,"");
  var err = nameCheck(name); if(err){ toast(err); return; }
  err = natIdCheck(nat); if(err){ toast(err); return; }
  var values = {}, missing = null;
  (f.fields||[]).forEach(function(fd){
    var e = document.getElementById("cff_"+fd.id);
    var vv = e ? String(e.value||"").trim() : "";
    values[fd.id] = vv;
    if(fd.required && !vv && !missing) missing = fd.label;
  });
  if(missing){ toast("اكتب: "+missing); return; }
  formsInit();
  /* الاستمارة مخصصة لصف واحد — الرقم القومي لازم يكون مسجّل في الصف ده */
  var gate = levelGateCheck(f, nat);
  if(gate){ toast(gate); return; }
  if(!Array.isArray(DB.formSubs[fid])) DB.formSubs[fid] = [];
  if(subByNat(fid, nat, null)){ toast("الرقم القومي ده مسجّل قبل كده في الاستمارة دي"); return; }
  var now = new Date();
  DB.formSubs[fid].push({
    id:uid("sub"), name:name, natId:nat, values:values, date:today(),
    time:(now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes()
  });
  saveNow();
  UI.formDone = { formTitle:f.title, name:name, natId:nat };
  UI.stu = false; UI.stuForm = null; UI.stuVals = null;
  renderLogin();
}
/* تصدير تسجيلات استمارة مخصصة لإكسيل */
function formExcel(fid){
  var f = formById(fid); if(!f){ toast("الاستمارة مش موجودة"); return; }
  var subs = formSubsOf(fid);
  if(!subs.length){ toast("مفيش تسجيلات للتصدير"); return; }
  var head = ["م","الاسم رباعي","الرقم القومي"].concat((f.fields||[]).map(function(fd){ return fd.label; })).concat(["تاريخ التسجيل","وقت التسجيل"]);
  var rows = subs.map(function(s,i){
    var base = [i+1, s.name, s.natId];
    (f.fields||[]).forEach(function(fd){ var v=(s.values||{})[fd.id]; base.push(v==null?"":(fd.type==="date"?fmtDate(v):v)); });
    base.push(s.date, s.time||"");
    return base;
  });
  var fname = f.title.replace(/\s+/g,"-")+"-"+today();
  loadXLSX().then(function(X){
    var aoa = [[DB.meta.moderia||""],[DB.meta.edara||""],[DB.meta.school||""],
      ["كشف: "+f.title+" — العام الدراسي "+(DB.meta.year||"")],[],head].concat(rows);
    var ws = X.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:5},{wch:30},{wch:18}].concat((f.fields||[]).map(function(){ return {wch:18}; })).concat([{wch:13},{wch:10}]);
    ws["!merges"] = [0,1,2,3].map(function(r){ return { s:{r:r,c:0}, e:{r:r,c:head.length-1} }; });
    for(var c=0;c<head.length;c++){ var hr=X.utils.encode_cell({r:5,c:c}); if(ws[hr]) ws[hr].s={font:{bold:true},alignment:{horizontal:"center"},fill:{fgColor:{rgb:"EEF1EC"}}}; }
    ws["!ref"] = X.utils.encode_range({s:{r:0,c:0}, e:{r:5+rows.length, c:head.length-1}});
    var wb = X.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
    X.utils.book_append_sheet(wb, ws, "تسجيلات");
    X.writeFile(wb, fname+".xlsx");
    toast("اتنزّل ملف الإكسيل");
  }).catch(function(){
    var csv = "\uFEFF"+[head].concat(rows).map(function(r){ return r.map(function(x){ var v=String(x==null?"":x); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","); }).join("\n");
    downloadBlob(csv, fname+".csv", "text/csv;charset=utf-8");
    toast("اتنزّل CSV");
  });
}

/* ============================================================
   ترحيل الرغبات → طلاب مسجّلين في الصف الثاني الثانوي
   الطالب اللي سجّل في الاستمارة كان في الأول، فبيترحّل للصف الثاني
   وكل بياناته بتتكتب (بما فيها المشتقّة من الرقم القومي).
   ============================================================ */
function grade2Classes(){
  return DB.classes.filter(function(c){ return Number(c.level)===2; })
    .sort(function(a,b){ return sortAr(a.name,b.name); });
}
function classForWishTrack(trackId, sector){
  var g2 = grade2Classes();
  var pool = sector ? g2.filter(function(c){ return classSector(c)===sector; }) : g2;
  if(!pool.length) pool = g2;   /* لو مفيش فصل في نفس القسم، جرّب أي فصل صف ثاني */
  return pool.filter(function(c){ return c.system==="bac" && c.track===trackId; })[0] ||
         pool.filter(function(c){ return c.track===trackId; })[0] || null;
}
function migrateWishToStudent(w, classId){
  wishesInit();
  /* منع التكرار بالرقم القومي */
  var exists = DB.students.filter(function(s){ return s.natId && s.natId===w.natId; })[0];
  if(exists){ w.migrated = exists.id; return {ok:false, dup:true, msg:"الرقم القومي مسجّل بالفعل كطالب"}; }
  var s = {
    id: uid("s"), status:"active", joined: today(),
    name: cleanName(w.name), natId: w.natId, classId: "",
    prevClass: w.prevClass || "", bacSubject: w.subject || "", bacTrack: w.track || "",
    edu: w.edu || "reg", sector: eduType(wishEdu(w)).sector, fromWish: w.id
  };
  /* الصف بييجي من صف الاستمارة نفسها — الطالب بيبقى معروف صفه حتى لو مش متسكّن */
  setStudentLevel(s, num(DB.trackLevel,2));
  if(classId) assignStudentToClass(s, classId);
  enrichStudent(s);
  DB.students.push(s);
  w.migrated = s.id;
  return {ok:true, sid:s.id, assigned: !!s.classId};
}
function wishById(wid){
  wishesInit();
  for(var i=0;i<DB.wishes.length;i++) if(DB.wishes[i].id===wid) return DB.wishes[i];
  return null;
}

var FIELD_TYPES = [
  {id:"text",     name:"نص قصير"},

  {id:"date",     name:"تاريخ"},

];
function fieldTypeName(t){ for(var i=0;i<FIELD_TYPES.length;i++) if(FIELD_TYPES[i].id===t) return FIELD_TYPES[i].name; return t; }
function formsInit(){ if(!Array.isArray(DB.forms)) DB.forms=[]; if(!DB.formSubs||typeof DB.formSubs!=="object") DB.formSubs={}; if(DB.trackOpen===undefined) DB.trackOpen=true; }
function formById(id){ formsInit(); for(var i=0;i<DB.forms.length;i++) if(DB.forms[i].id===id) return DB.forms[i]; return null; }
function formSubsOf(id){ formsInit(); return Array.isArray(DB.formSubs[id]) ? DB.formSubs[id] : []; }
function subByNat(formId, nat, exceptId){
  var n = toEnDigits(String(nat||"")).replace(/\D/g,"");
  var list = formSubsOf(formId);
  for(var i=0;i<list.length;i++){ if(list[i].id===exceptId) continue; if(String(list[i].natId)===n) return list[i]; }
  return null;
}

function formsResetOnce(){
  if(DB.formsReset) return false;
  DB.formsReset = 1;
  if(Array.isArray(DB.forms) && DB.forms.length){
    DB.forms.forEach(function(f){ if(f && f.id) delete DB.formSubs[f.id]; });
    DB.forms = [];
    return true;
  }
  return false;
}
function formsCatalog(){
  formsInit();
  var out = [{
    id:"track", title:"استمارة تحديد المسار", desc:"الطالب يختار مساره ومادة تخصصه",
    level:num(DB.trackLevel,2), open: DB.trackOpen!==false,
    strictNat: DB.trackStrict!==false, edus: formAudience({id:"track"}), builtin:true, fields:0
  }];
  (DB.forms||[]).forEach(function(f){
    if(!f || !f.id) return;                       /* سجل تالف — بنتخطاه بدل ما يلخبط */
    out.push({
      id:f.id, title:f.title || "(استمارة بدون عنوان)", desc:f.desc || "",
      level:num(f.level,0), open: f.status!=="closed",
      strictNat: f.strictNat!==false, edus: formAudience(f), builtin:false,
      fields:(f.fields||[]).length
    });
  });
  return out;
}

function viewFormsIndex(){
  var can = canManageForms();

      '<p>كل الاستمارات مقفولة. افتح واحدة من القائمة تحت عشان تظهر له.</p></div>';
  }else{
    h += '<div class="note" style="margin:9px 12px">دي القائمة اللي بتظهر في صفحة الدخول تحت زر '+
      '<b>«الدخول كطالب»</b> — نفس المصدر بالظبط، فمستحيل تختلف.</div>';
    open.forEach(function(f){
      h += '<div class="list-item">'+
        '<span class="av" style="background:var(--gold)">★</span>'+
        '<span class="tx"><b>'+esc(f.title)+'</b><small>'+
        esc(f.desc||"")+(f.level? (f.desc?" · ":"")+"لطلاب "+esc(levelName(f.level)) : " · كل الصفوف")+
        '</small></span>'+
        '<button class="btn ghost sm" data-act="formOpenSubs" data-id="'+esc(f.id)+'">فتح ›</button></div>';
    });

      '</div><div class="bd flush">';
    if(!list.length){
      h += '<div class="empty"><b>مفيش استمارات للصف ده</b>'+
        '<p>اعمل استمارة تطلب فيها أي بيانات من طلاب '+esc(l.name)+'.</p></div>';

/* ============================================================
   الترحيل الموحّد: من أي استمارة → طلاب الصف المستهدف
   الطالب بيترحّل بصفه على طول حتى لو مفيش فصول لسه.

function formTargetLevel(f){

function formLevelLabel(f){

/* صفوف موحّدة من أي استمارة: {name, natId, level, phone, extra} */
/* أعمدة الحقول الإضافية في كشف تسجيلات المسار */
function trackExtraCols(){ return trackExtra().map(function(fd){ return fd.label; }); }
function formRows(f){
  if(!f) return [];
  if(f.id==="track"){
    wishesInit();
    return (DB.wishes||[]).map(function(w){
      return { key:w.id, name:w.name, natId:w.natId, level:num(DB.trackLevel,2),
               edu:wishEdu(w), sector:eduType(wishEdu(w)).sector,
               bacTrack:w.track, bacSubject:w.subject, prevClass:w.prevClass,
               tag:eduName(wishEdu(w))+" · "+wishTrackName(w.track), src:w };
    });
  }
  var defL = formTargetLevel(f);
  return formSubsOf(f.id).map(function(sub){
    var vals = sub.values||sub.vals||{};
    var lvl = 0, phone = "", edu = "", guardian = "", trk = "", subj = "", prev = "", rel = "";
    var extra = {};                       /* الحقول اللي مالهاش مكان في بيانات الطالب */
    (f.fields||[]).forEach(function(fd){
      var v = vals[fd.id];
      if(v==null || String(v).trim()==="") return;
      var lb = normAr(fd.label||"");
      /* الحقول اللي ليها مكان معروف في ملف الطالب */
      if(!lvl && /^صف|الصف|مستوي|سنه دراسيه|مرحله/.test(lb)){ lvl = parseLevel(v)||0; if(lvl) return; }
      if(!edu && /نوعيه التعليم|نوعية التعليم|نظام الدراسه|نظام الدراسة/.test(lb)){
        edu = parseEdu(v); if(edu) return;
      }
      if(!phone && /هاتف|تليفون|موبايل/.test(lb)){ phone = toEnDigits(String(v)).replace(/[^\d+]/g,""); return; }
      if(!guardian && /ولي الامر|ولي الأمر/.test(lb) && !/هاتف|تليفون|موبايل|رقم/.test(lb)){ guardian = cleanName(v); return; }
      if(!trk && /^المسار$|^مسار$/.test(lb)){ trk = parseWishTrack(v); if(trk) return; }
      if(!subj && /ماده التخصص|مادة التخصص/.test(lb)){ subj = String(v).trim(); return; }
      if(!prev && /الفصل السابق|فصل سابق/.test(lb)){ prev = String(v).trim(); return; }
      if(!rel && /الديانه|الديانة/.test(lb)){ rel = /مسيح|قبط/.test(normAr(String(v)))?"مسيحي":"مسلم"; return; }
      /* أي حاجة تانية = بيان إضافي بعنوانه زي ما هو */
      extra[fd.label] = String(v);
    });
    return { key:sub.natId, name:sub.name, natId:sub.natId,
             level: defL || lvl || 0, phone:phone, edu:edu, guardian:guardian,
             bacTrack:trk, bacSubject:subj, prevClass:prev, religion:rel,
             extra:extra, tag:fmtDate(sub.date), src:sub };
  });
}
/* ============================================================
   الأعمدة الإضافية: أي بيان في الاستمارة مالوش مكان في ملف الطالب
   بيتعمل له عمود جديد بنفس عنوانه، وبيتحط تحته إجابات الطلاب.
   ============================================================ */
function ensureExtraField(label){
  xfInit();
  var list = xfList("student");
  var found = list.filter(function(x){ return normAr(x.label)===normAr(label); })[0];
  if(found) return found;
  var fd = { id:uid("xf"), label:String(label), type:"text", options:[] };
  list.push(fd);
  return fd;
}
/* بيرحّل صف واحد لطالب. mode: "reg" عادي أو "home" منازل */
/* القسم المستنتج من نوعية التعليم — فاضي لو النوعية مش محددة */
function eduSector(edu){
  if(edu==="srv") return "srv";
  if(edu==="reg") return "reg";
  return "";
}
/* ============================================================
   مصدر القيد ووقته — عشان نعرف مين البيان القديم ومين الجديد
   ============================================================ */
function stampSrc(o, src){
  if(!o) return o;
  if(!o.addedAt) o.addedAt = Date.now();
  if(!o.src) o.src = src || "manual";
  return o;
}
var SRC_NAMES = {
  manual: "إضافة يدوية",
  quick:  "إضافة سريعة",
  import: "استيراد ملف",
  form:   "ترحيل من استمارة"
};
function srcName(s){
  if(!s) return "—";
  var v = s.src || (s.fromForm ? ("form:"+s.fromForm) : (s.fromWish ? "form:track" : ""));
  if(!v) return "غير معروف";
  if(v.indexOf("form:")===0){
    var fid = v.slice(5);
    if(fid==="track") return "ترحيل من استمارة تحديد المسار";
    var f = formById(fid);
    return "ترحيل من استمارة" + (f ? " «"+f.title+"»" : "");
  }
  return SRC_NAMES[v] || v;
}
/* ترتيب السجلات: الأقدم أولًا. الوقت المسجّل، وإلا تاريخ القيد، وإلا ترتيب الإدخال */
function addedOrder(s){
  if(s.addedAt) return s.addedAt;
  if(s.joined){
    var d = new Date(s.joined+"T00:00:00");
    if(!isNaN(d)) return d.getTime();
  }
  var i = DB.students.indexOf(s);
  return i>=0 ? i : 0;
}
/* هل الصف ده اترحّل قبل كده؟ الرقم القومي أولًا، والعلامة المحفوظة احتياط.
   كده الاسم اللي اترحّل مرة عمره ما هيظهر تاني في «الجديد فقط». */
/* ============================================================
   لما سجل طالب يتدمج أو يتحذف، أي رابط بيشاور عليه لازم يتحوّل
   للسجل الباقي — عشان الاستمارات ما ترجعش تقول «جديد».
   ============================================================ */
function remapStudentRefs(fromId, toId){
  if(!fromId || fromId===toId) return 0;
  var n = 0;
  wishesInit();
  (DB.wishes||[]).forEach(function(w){
    if(w.migratedTo===fromId){ w.migratedTo = toId || ""; if(!toId) w.migrated = false; n++; }
  });
  formsInit();
  for(var k in DB.formSubs){
    (DB.formSubs[k]||[]).forEach(function(sb){
      if(sb.migratedTo===fromId){ sb.migratedTo = toId || ""; if(!toId) sb.migrated = false; n++; }
    });
  }
  msgInit();
  DB.msgs.forEach(function(m){ if(m.sid===fromId && toId) m.sid = toId; });
  DB.behavior.forEach(function(b){ if(b.studentId===fromId && toId) b.studentId = toId; });
  return n;
}
/* بيلاقي الطالب اللي الصف ده اترحّل ليه — بكل الطرق الممكنة */
function migratedStudentOf(r){
  /* ١) الرابط المحفوظ وقت الترحيل */
  if(r.src && r.src.migratedTo){
    var st = studentById(r.src.migratedTo);
    if(st) return st;
  }
  /* ٢) الرقم القومي */
  var nat = toEnDigits(String(r.natId||"")).replace(/\D/g,"");
  if(nat){
    var byNat = DB.students.filter(function(s){ return s.natId===nat; })[0];
    if(byNat){
      if(r.src && typeof r.src==="object") r.src.migratedTo = byNat.id;   /* نصلّح الرابط */
      return byNat;
    }
  }
  /* ٣) الاسم — لو الرقم اتغيّر في دمج، الاسم بيفضل دليل */
  if(r.src && r.src.migrated && r.name){
    var byName = DB.students.filter(function(s){
      return s.status!=="left" && (normAr(s.name)===normAr(r.name) || nameContains(s.name, r.name));
    })[0];
    if(byName){
      if(typeof r.src==="object") r.src.migratedTo = byName.id;
      return byName;
    }
  }
  return null;
}
function rowMigrated(r){ return !!migratedStudentOf(r); }
function migrateRowToStudent(r, opt){
  opt = opt || {};
  var nat = toEnDigits(String(r.natId||"")).replace(/\D/g,"");
  var name = cleanName(r.name||"");
  if(!name) return {ok:false, reason:"بدون اسم"};
  if(!nat || nat.length!==14 || !parseNationalId(nat)) return {ok:false, reason:"رقم قومي غير صحيح"};

  /* نوعية الطالب هي اللي بتحدد قسمه — مش القسم اللي الوكيل واقف فيه */
  var edu = r.edu || "reg";
  var isHome = (edu === "home");
  var sec = isHome ? (r.sector || "reg") : (eduSector(edu) || r.sector || curSector());
  var lvl = num(opt.level,0) || num(r.level,0);

  /* أي بيان في الاستمارة مالوش عمود — بنعمل له عمود */
  function applyExtra(st){
    if(!r.extra) return 0;
    var n = 0;
    for(var label in r.extra){
      var v = r.extra[label];
      if(v===undefined || v===null || String(v).trim()==="") continue;
      var fd = ensureExtraField(label);
      if(String(xfGet(st, fd.id)) !== String(v)){ xfSet(st, fd.id, v); n++; }
    }
    return n;
  }

  var exists = nat ? DB.students.filter(function(s){ return s.natId===nat; })[0] : null;

  /* ---------- الرقم القومي موجود: تحديث بس، من غير تكرار ---------- */
  if(exists){
    var ch = 0;
    function put(k, v){
      if(v===undefined || v===null || v==="") return;   /* الفاضي مبيمسحش المليان */
      if(String(exists[k]||"") === String(v)) return;
      exists[k] = v; ch++;
    }
    /* الرقم القومي والاسم الأساسي مبيتغيّروش */
    if(lvl && studentLevelOf(exists)!==lvl){ setStudentLevel(exists, lvl); ch++; }
    put("bacTrack",   r.bacTrack);
    put("bacSubject", r.bacSubject);
    put("prevClass",  r.prevClass);
    put("phone",      r.phone);
    put("guardian",   r.guardian);
    put("religion",   r.religion);
    if(r.edu && exists.edu !== r.edu){
      exists.edu = r.edu;
      exists.sector = isHome ? (exists.sector||"reg") : sec;
      if(isHome) exists.classId = "";
      ch++;
    }
    ch += applyExtra(exists);
    /* تسكين تلقائي لو لسه من غير فصل */
    if(opt.autoPlace && !isHomeStudent(exists) && !classById(exists.classId)){
      var c0 = autoClassFor(exists);
      if(c0){ assignStudentToClass(exists, c0.id); ch++; }
    }
    enrichStudent(exists);
    if(r.src && typeof r.src==="object"){ r.src.migrated = true; r.src.migratedTo = exists.id; }
    return {ok:false, upd:true, changed:ch, sid:exists.id, s:exists};
  }

  /* ---------- رقم جديد: طالب جديد بكل بياناته ---------- */
  var s = {
    id: uid("s"), status:"active", joined: today(),
    name: name, natId: nat, classId: "",
    edu: edu, sector: sec,
    phone: r.phone || "", guardian: r.guardian || "", religion: r.religion || "",
    prevClass: r.prevClass || "", bacTrack: r.bacTrack || "", bacSubject: r.bacSubject || "",
    fromForm: opt.formId || ""
  };
  setStudentLevel(s, lvl);
  stampSrc(s, opt.formId ? ("form:"+opt.formId) : "form");
  applyExtra(s);
  enrichStudent(s);
  DB.students.push(s);
  if(r.src && typeof r.src==="object"){ r.src.migrated = true; r.src.migratedTo = s.id; }
  return {ok:true, sid:s.id, s:s};
}
function migrateFormRows(f, rows, opt){
  opt = opt || {};
  var res = { add:0, upd:0, same:0, bad:0, placed:0 };
  rows.forEach(function(r){
    var out = migrateRowToStudent(r, {
      level: opt.level || formTargetLevel(f) || r.level,
      formId: f?f.id:"",
      autoPlace: opt.autoPlace!==false,       /* التسكين التلقائي هو الأصل */
      updateExisting: true
    });
    if(out.ok){
      res.add++;
      if(opt.autoPlace!==false && !isHomeStudent(out.s)){
        var c = autoClassFor(out.s);
        if(c){ assignStudentToClass(out.s, c.id); res.placed++; }
      }
    }
    else if(out.upd){ if(out.changed) res.upd++; else res.same++; }
    else res.bad++;
  });
  return res;
}
/* بيدوّر على فصل مناسب: نفس الصف + نفس القسم + المسار لو متاح */
function autoClassFor(s){
  var L = studentLevelOf(s);
  if(!L) return null;
  var sec = studentSector(s);
  var pool = DB.classes.filter(function(c){
    return Number(c.level)===L && classSector(c)===sec;
  });
  if(!pool.length) return null;
  if(s.bacTrack){
    var m = pool.filter(function(c){ return c.track===s.bacTrack; })[0];
    if(m) return m;
    return null;               /* له مسار ومفيش فصل مطابق — سيبه بدل ما نحطه غلط */
  }
  /* من غير مسار (زي الصف الأول أو النظام العام): نسكّنه لو فيه فصل واحد بس */
  if(pool.length===1) return pool[0];
  /* أو أقل فصل عددًا لو كلهم من غير مسار — توزيع متوازن */
  var generic = pool.filter(function(c){ return !c.track || c.track==="none"; });
  if(generic.length){
    return generic.sort(function(a,b){ return studentsOf(a.id).length - studentsOf(b.id).length; })[0];
  }
  return null;
}

/* which: true=الكل، false=مفيش، "new"=الجديد بس، "old"=الموجود بس */
function mgPick(which){
  Array.prototype.slice.call(document.querySelectorAll("#mglist .mgrow")).forEach(function(row){
    if(row.style.display==="none") return;          /* بس اللي ظاهر في البحث */
    var cb = row.querySelector(".mgck"); if(!cb) return;
    var isNew = row.getAttribute("data-new")==="1";
    if(which==="new")      cb.checked = isNew;
    else if(which==="old") cb.checked = !isNew;
    else                   cb.checked = !!which;
  });
  updateMgCount();
}
function updateMgCount(){
  var el = document.getElementById("mgcount"); if(!el) return;
  var n = document.querySelectorAll("#mglist .mgck:checked").length;
  el.textContent = n+" محدّد للترحيل";
}
function doFormMigrate(el){
  var fid = el && el.dataset ? el.dataset.id : "";
  var f = (fid==="track") ? {id:"track", title:"استمارة المسار"} : formById(fid);
  var rows = UI.migRows || [];
  var picked = Array.prototype.slice.call(document.querySelectorAll("#mglist .mgck:checked"))
    .map(function(cb){ return rows[num(cb.dataset.i,-1)]; }).filter(Boolean);
  if(!picked.length){ toast("مختارتش أي حد"); return; }
  var lvl = num(val("mg_lvl"), 2);
  var before = xfList("student").length;
  markUndo("ترحيل من استمارة");
  /* نوعية كل طالب هي اللي تحدد قسمه، والتسكين تلقائي للنظامي والخدمات */
  var r = migrateFormRows(f, picked, { level:lvl });
  var newCols = xfList("student").length - before;
  UI.migRows = null;
  saveNow(); closeModal(); render();
  var parts = [];
  if(r.add)  parts.push("اتضاف "+r.add+" جديد");
  if(r.upd)  parts.push("اتحدّث "+r.upd);
  if(r.same) parts.push(r.same+" من غير تغيير");
  if(r.placed) parts.push("اتسكّن "+r.placed+" على فصول");
  if(newCols) parts.push("اتعمل "+newCols+" عمود جديد");
  if(r.bad)  parts.push(r.bad+" بيانات ناقصة");
  toastUndo(parts.length ? parts.join(" · ") : "مفيش تغيير");
}

function wishRows(){
  wishesInit();
  var f = UI.filters || {};
  var list = wishesOfSector().sort(function(a,b){ return sortAr(a.name,b.name); });
  if(f.wTrack) list = list.filter(function(w){ return w.track===f.wTrack; });
  if(f.wEdu)   list = list.filter(function(w){ return wishEdu(w)===f.wEdu; });
  return list;
}
/* ملف إكسيل حقيقي بتنسيق — بيفتح في إكسيل مباشرة */
function wishExcel(){
  var list = wishRows();
  if(!list.length){ toast("مفيش بيانات للتصدير"); return; }
  var head = ["م","الاسم رباعي","الرقم القومي","الفصل السابق","نوعية التعليم","المسار","مادة التخصص","تاريخ التسجيل","وقت التسجيل"];
  var rows = list.map(function(w,i){
    return [i+1, w.name, w.natId, w.prevClass, eduName(wishEdu(w)), wishTrackName(w.track), w.subject, w.date, w.time||""];
  });
  var fname = "رغبات-الطلاب-"+today();

  loadXLSX().then(function(X){
    var aoa = [
      [DB.meta.moderia||""],
      [DB.meta.edara||""],
      [DB.meta.school||""],
      ["كشف رغبات الطلاب — مسارات البكالوريا المصرية — العام الدراسي "+(DB.meta.year||"")],
      [],
      head
    ].concat(rows);
    var ws = X.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:5},{wch:32},{wch:18},{wch:14},{wch:13},{wch:24},{wch:24},{wch:13},{wch:10}];
    ws["!merges"] = [0,1,2,3].map(function(r){
      return { s:{r:r,c:0}, e:{r:r,c:head.length-1} };
    });
    ws["!rows"] = [{hpt:18},{hpt:18},{hpt:22},{hpt:20},{hpt:8},{hpt:22}];
    /* تنسيق: عناوين وسط وغامق */
    for(var r=0;r<6;r++){
      var ref = X.utils.encode_cell({r:r,c:0});
      if(ws[ref]) ws[ref].s = { font:{bold:true, sz: r===2?14:11}, alignment:{horizontal:"center"} };
    }
    for(var c=0;c<head.length;c++){
      var hr = X.utils.encode_cell({r:5,c:c});
      if(ws[hr]) ws[hr].s = {
        font:{bold:true}, alignment:{horizontal:"center", vertical:"center"},
        fill:{fgColor:{rgb:"EEF1EC"}},
        border:{ top:{style:"thin"}, bottom:{style:"thin"}, left:{style:"thin"}, right:{style:"thin"} }
      };
    }
    ws["!ref"] = X.utils.encode_range({s:{r:0,c:0}, e:{r:5+rows.length, c:head.length-1}});
    var wb = X.utils.book_new();
    wb.Workbook = { Views:[{ RTL:true }] };
    X.utils.book_append_sheet(wb, ws, "رغبات الطلاب");
    X.writeFile(wb, fname+".xlsx");
    toast("اتنزّل ملف الإكسيل");
  }).catch(function(){
    /* من غير إنترنت: CSV بيفتح في إكسيل عادي */
    var csv = "\uFEFF" + [head].concat(rows).map(function(r){
      return r.map(function(x){
        var v = String(x==null?"":x);
        return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
      }).join(",");
    }).join("\n");
    downloadBlob(csv, fname+".csv", "text/csv;charset=utf-8");
    toast("اتنزّل CSV — بيفتح في إكسيل عادي");
  });
}
function downloadBlob(content, filename, type){
  try{
    var blob = new Blob([content], {type:type});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    return true;
  }catch(e){ toast("التنزيل مش متاح على المتصفح ده"); return false; }
}
